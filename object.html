<script type="importmap">

    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",

<style>
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%;background:#040406;color:#f2f2f2;font-family:'Inter',system-ui,sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased;}
  #app{position:fixed;inset:0;}
  .lo-canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab;}
  .lo-canvas:active{cursor:grabbing;}

  .lo-hud{position:fixed;inset:0;pointer-events:none;font-family:'Inter',system-ui,sans-serif;}
  .lo-hud > *{pointer-events:auto}
  .lo-tl,.lo-tr,.lo-bl,.lo-br{position:absolute;color:#cfcfd4;font-size:11px;letter-spacing:.02em;}
  .lo-tl{top:18px;left:22px}
  .lo-tr{top:18px;right:22px;text-align:right;display:flex;gap:14px;align-items:center;flex-direction:row-reverse}
  .lo-bl{bottom:22px;left:22px;color:#8a8a8a}
  .lo-br{bottom:22px;right:22px;text-align:right;color:#bdbdbd;max-width:40vw}
  .lo-brand{font-family:'Space Grotesk',system-ui,sans-serif;font-weight:700;font-size:13px;letter-spacing:.02em;color:#f2f2f2;margin-bottom:4px}
  .lo-meta{color:#7a7a7a;font-size:10px;letter-spacing:.04em;font-family:'JetBrains Mono',ui-monospace,monospace}
  .lo-nav{margin-top:10px;display:flex;gap:14px;flex-wrap:wrap}
  .lo-nav a{color:#9a9aa3;text-decoration:none;font-size:11px;border-bottom:1px solid transparent;padding-bottom:2px;transition:color .15s,border-color .15s}
  .lo-nav a:hover{color:#fff;border-color:#fff}
  .lo-mark{font-family:'Space Grotesk',system-ui,sans-serif;font-size:11px;color:#9a9aa3;letter-spacing:.06em}
  .lo-list-btn{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.10);color:#dcdce0;font:500 11px/1 'Inter',system-ui,sans-serif;padding:8px 12px;border-radius:6px;cursor:pointer;letter-spacing:.04em;transition:background .15s,border-color .15s,color .15s}
  .lo-list-btn:hover{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.20);color:#fff}
  .lo-hint{color:#6a6a72;font-size:11px;letter-spacing:.05em}

  .lo-hover{font-family:'Space Grotesk',system-ui,sans-serif;font-weight:600;font-size:14px;color:#e8e8ee;letter-spacing:.02em;min-height:18px;text-transform:lowercase}
  .lo-hover-meta{color:#7a7a7a;font-size:10px;letter-spacing:.06em;font-family:'JetBrains Mono',ui-monospace,monospace;text-transform:uppercase;margin-top:3px}

  /* Bottom-center frequency strip */
  .lo-spectrum{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);display:flex;gap:8px;align-items:center;color:#9a9aa3;font:500 10px/1 'JetBrains Mono',ui-monospace,monospace;letter-spacing:.18em;text-transform:uppercase;pointer-events:none}
  .lo-spec-bars{display:flex;gap:2px;align-items:flex-end;height:18px;width:160px}
  .lo-spec-bars i{display:block;width:3px;background:#ff3a8c;box-shadow:0 0 6px #ff3a8c;height:2px;transition:height 80ms linear;flex:1}
  .lo-now{font-family:'Space Grotesk',system-ui,sans-serif;font-weight:600;font-size:11px;color:#dcdce0;letter-spacing:.04em;text-transform:lowercase;max-width:280px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  .lo-jump{position:fixed;inset:0;background:rgba(2,2,4,.78);backdrop-filter:blur(14px);display:flex;align-items:flex-start;justify-content:center;padding:80px 24px 24px;opacity:0;pointer-events:none;transition:opacity .2s ease;z-index:20}
  .lo-jump.on{opacity:1;pointer-events:auto}
  .lo-jump-inner{width:min(640px, 96vw);max-height:80vh;display:flex;flex-direction:column;background:#0a0a0c;border:1px solid #242428;border-radius:10px;overflow:hidden}
  .lo-jump-head{display:flex;align-items:center;border-bottom:1px solid #1a1a1e;padding:8px 8px 8px 14px;gap:8px}
  .lo-jump-search{flex:1;background:transparent;border:none;color:#fff;font:500 14px/1 'Inter',system-ui,sans-serif;padding:10px 0;outline:none}
  .lo-jump-search::placeholder{color:#5c5c66}
  .lo-jump-close{background:transparent;border:none;color:#9a9aa3;font-size:22px;line-height:1;cursor:pointer;padding:6px 10px;border-radius:6px}
  .lo-jump-close:hover{color:#fff;background:rgba(255,255,255,.05)}
  .lo-jump-list{overflow-y:auto;padding:6px 0}
  .lo-jump-item{display:flex;align-items:center;gap:12px;width:100%;background:transparent;border:none;color:#dcdce0;text-align:left;padding:10px 16px;cursor:pointer;font:500 13px/1 'Inter',system-ui,sans-serif}
  .lo-jump-item:hover{background:rgba(255,255,255,.05);color:#fff}
  .lo-jump-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;box-shadow:0 0 8px currentColor}
  .lo-jump-title{flex:1;letter-spacing:.01em}
  .lo-jump-meta{color:#6a6a72;font-size:10px;letter-spacing:.06em;text-transform:uppercase;font-family:'JetBrains Mono',ui-monospace,monospace}
  .lo-jump-empty{color:#6a6a72;text-align:center;padding:30px;font-size:12px}

  @media (max-width:640px){
    .lo-spectrum .lo-spec-bars{width:120px}
    .lo-now{max-width:160px}
  }
</style>
</head>
<body>
  <div id="app"></div>
  <audio id="player" preload="metadata" crossorigin="anonymous"></audio>

<script type="module">
import './js/object.js';

const audio = document.getElementById('player');
let cfg = null;
let tracks = [];
let audioBase = '';

const slugify = (s) => (s || '').toLowerCase().replace(/[^\w\s-]/g, '').trim().replace(/\s+/g, '-');

async function loadConfig(){
  const res = await fetch('/config.json', { cache: 'no-store' });
  const data = await res.json();
  cfg = data;
  audioBase = (data.audioBase || '').replace(/\/?$/, '/');
  const featuredSet = new Set((data.featured || []).map(slugify));
  const newSet = new Set((data.newReleases || []).map(i => typeof i === 'number' ? slugify((data.tracks[i] || {}).title || '') : slugify(i)));
  tracks = (data.tracks || []).map((t) => ({
    ...t,
    isFeatured: featuredSet.has(slugify(t.title)),
    isNew: newSet.has(slugify(t.title)),
  }));
}

function loadTrack(i){
  const t = tracks[i];
  if (!t || !t.file) return;
  const url = audioBase + t.file;
  if (audio.src !== url) audio.src = url;
}

function playIndex(i){
  loadTrack(i);
  const p = audio.play();
  if (p && p.catch) p.catch(err => console.warn('[object] play blocked', err));
}

async function boot(){
  await loadConfig();
  const app = document.getElementById('app');
  const tryInit = () => {
    if (!window.LiquidObject) { setTimeout(tryInit, 30); return; }
    window.LiquidObject.init(app, {
      tracks,
      audio,
      slugify,
      onPlay: playIndex,
      buildNumber: 'b161',
    });
  };
  tryInit();
}

boot().catch(err => {
  console.error('[object] boot failed', err);
  document.body.innerHTML = '<div style="padding:40px;color:#f2f2f2;font-family:Inter,system-ui,sans-serif"><h1>could not load</h1><pre style="color:#9a9aa3">'+ (err && err.stack || err) +'</pre></div>';
});
</script>
</body>
</html>
