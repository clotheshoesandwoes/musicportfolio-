<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>can’t mute me.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=block" rel="stylesheet">
<style>
:root{
  --plate:#0B0E14;
  --bone:#EDE9E1;
  --ink:#E1261D;
  --m: clamp(16px, 3.2vw, 44px);
  --fieldmin: 19vh;
  --fieldh: var(--fieldmin);
  --gap: clamp(14px, 2.4vh, 34px);
  --meta: 13px;
  --metah: 30px;
}
@media (min-width:900px){ :root{ --meta:14px; } }

*{ margin:0; padding:0; box-sizing:border-box; }
html,body{
  height:100%; background:var(--plate); overflow:hidden;
  -webkit-text-size-adjust:100%;
  font-family:'Archivo',system-ui,sans-serif;
  font-variant-numeric: tabular-nums lining-nums;
}
body{ overscroll-behavior:none; touch-action:none; }
button{ font:inherit; color:inherit; background:none; border:0; cursor:pointer; -webkit-tap-highlight-color:transparent; }

/* ---------- the sheet: everything that inverts ---------- */
#sheet{ position:fixed; inset:0; isolation:isolate; overflow:hidden; }
#ground{ position:absolute; inset:0; background:var(--plate); }
/* The scene. Sits inside #sheet, so #inv's difference blend inverts it along
   with everything else — glowing nodal ink on the dark plate, dark ink on
   paper, with no second codepath. */
#bg{
  position:absolute; inset:0; width:100%; height:100%;
  opacity:.66; pointer-events:none;
  transition:opacity 420ms ease;
}
html.idx #bg{ opacity:.18; }
@media (prefers-reduced-motion: reduce){ #bg{ opacity:.42; } }

#field{ position:absolute; left:0; right:0; top:calc(var(--m) + var(--metah)); height:var(--fieldh); }
#plate{ display:block; width:100%; height:100%; }

#topmeta{
  /* right inset leaves room for the palette control now sitting in this row */
  position:absolute; left:var(--m); right:calc(var(--m) + 86px); top:var(--m); height:var(--metah);
  display:flex; align-items:flex-start; justify-content:space-between;
  color:var(--bone); font-size:var(--meta); line-height:1;
  font-variation-settings:'wght' 500,'wdth' 96; letter-spacing:.01em;
}
#topmeta .cnt{ opacity:.55 }

#typewrap{
  position:absolute; left:var(--m); right:var(--m);
  top:calc(var(--m) + var(--metah) + var(--fieldmin) + var(--gap));
  bottom:calc(var(--m) + 34px);
  display:flex; align-items:flex-end;
  color:var(--bone);
  clip-path:inset(0 -100vw 0 -100vw);
  transition:clip-path 110ms cubic-bezier(.85,0,1,1);
}
#typewrap.shut{ clip-path:inset(48% -100vw 48% -100vw); transition-duration:95ms; }
#lines{ width:100%; }
#sub{
  display:block; color:var(--bone); opacity:.55;
  font-size:clamp(13px,1.6vw,21px); line-height:1.2; letter-spacing:.012em;
  font-variation-settings:'wght' 600,'wdth' 92;
  margin-bottom:.75em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.ln{ display:block; white-space:pre; line-height:.80; }
.ln > span{ display:inline-block; transform-origin:left bottom; will-change:font-variation-settings,transform; }

#foot{
  position:absolute; right:var(--m); bottom:var(--m); height:20px;
  display:flex; align-items:center; gap:clamp(14px,2.6vw,34px);
  color:var(--bone); font-size:var(--meta); line-height:1;
  font-variation-settings:'wght' 500,'wdth' 96; letter-spacing:.015em; white-space:nowrap;
}
#foot .dim{ opacity:.55 }

#inv{
  position:fixed; inset:0; background:#fff; mix-blend-mode:difference; pointer-events:none;
  transform:translateY(-101%); will-change:transform;
  transition:transform 440ms cubic-bezier(.7,0,.14,1);
}
html.paper #inv{ transform:translateY(0); }
#bar{
  position:fixed; left:0; right:0; top:0; height:34vh; background:#fff;
  mix-blend-mode:difference; pointer-events:none; transform:translateY(-140%); will-change:transform;
}
#bar.go{ animation:pass 300ms cubic-bezier(.3,0,.15,1) 1 both; }
@keyframes pass{ from{ transform:translateY(-115%) } to{ transform:translateY(325%) } }

/* ---------- accent layer: never inverts ---------- */
#accent{ position:fixed; inset:0; pointer-events:none; z-index:5; }
#head{
  position:absolute; top:0; bottom:0; width:1px; background:var(--ink);
  opacity:0; transform:translateX(-1px);
}
#head::after{
  content:''; position:absolute; left:-1px; width:3px;
  top:calc(var(--m) + var(--metah)); height:var(--fieldh); background:var(--ink);
}
html.playing #head{ opacity:1 }
#transport{
  position:absolute; left:var(--m); bottom:var(--m); height:20px;
  display:flex; align-items:center; gap:11px; pointer-events:auto;
  color:var(--ink); font-size:var(--meta); line-height:1;
  font-variation-settings:'wght' 600,'wdth' 96; letter-spacing:.02em;
}
#transport::before{ content:''; position:absolute; left:-12px; right:-12px; top:-15px; bottom:-15px; }
/* palette cycler — sits opposite the transport, same weight of voice */
/* top-right, NOT bottom-right — #foot already owns that corner and the two
   were overprinting each other ("SIGNAL" landing on top of the duration). */
#palname{
  position:absolute; right:var(--m); top:var(--m); height:var(--metah);
  display:flex; align-items:flex-start; justify-content:flex-end;
  min-width:74px; text-align:right; pointer-events:auto;
  color:var(--ink); font-size:var(--meta); line-height:1;
  font-variation-settings:'wght' 600,'wdth' 96; letter-spacing:.02em;
  opacity:.55; transition:opacity 160ms;
}
#palname::before{ content:''; position:absolute; left:-14px; right:-14px; top:-15px; bottom:-15px; }
#palname.flash{ opacity:1; }
/* scrub: the head thickens and the whole sheet knows it's being dragged */
html.scrub #head{ opacity:1 }
html.scrub #head::after{ width:5px; left:-2px; }
html.scrub #typewrap{ opacity:.35; }
#typewrap{ transition:opacity 140ms; }
#transport svg{ display:block; overflow:visible }
#transport .t{ min-width:5.4em; text-align:left; }

/* ---------- index ---------- */
#index{
  position:fixed; inset:0; z-index:9; background:var(--plate); color:var(--bone);
  clip-path:inset(0 0 100% 0); transition:clip-path 180ms cubic-bezier(.3,0,.1,1);
  pointer-events:none; overflow:hidden;
}
html.paper #index{ background:#F4F1EB; color:#12161E; }
html.idx #index{ clip-path:inset(0 0 0 0); pointer-events:auto; }
#idxscroll{
  position:absolute; inset:0; overflow-y:auto; -webkit-overflow-scrolling:touch;
  touch-action:pan-y; padding:calc(var(--m) + 36px) var(--m) calc(var(--m) + 60px);
}
.grp{ margin-bottom:clamp(24px,3.4vh,44px); }
.yr{
  display:flex; align-items:baseline; gap:.85em;
  font-size:clamp(15px,1.5vw,19px); line-height:1; letter-spacing:.02em;
  font-variation-settings:'wght' 800,'wdth' 78;
  padding-bottom:8px; margin-bottom:6px; border-bottom:1px solid currentColor;
}
.yr i{ font-style:normal; font-size:11px; font-variation-settings:'wght' 500,'wdth' 88; opacity:.5; }
.rows{ display:grid; grid-template-columns:repeat(auto-fill,minmax(400px,1fr)); column-gap:clamp(20px,3vw,54px); }
.row{
  display:flex; align-items:baseline; gap:.7em; width:100%; text-align:left;
  padding:4px 0; line-height:1.12; opacity:.82;
}
.row .n{ font-size:11px; font-variation-settings:'wght' 500,'wdth' 88; opacity:.5; width:2.1em; flex:none; }
.row .t{ font-size:clamp(15px,1.4vw,20px); flex:1 1 auto; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
/* bpm and duration were colliding into one unreadable number ("157 0:36").
   Two fixed columns, a real gap, and a unit on the bpm so it can't be
   mistaken for a time. Tabular figures keep the columns from wobbling. */
.row .bpm, .row .d{
  font-size:11px; font-variation-settings:'wght' 500,'wdth' 88; opacity:.5;
  flex:none; font-variant-numeric:tabular-nums;
}
.row .bpm{ width:4.6em; text-align:right; margin-left:.5em; }
.row .bpm i{ font-style:normal; font-size:8.5px; opacity:.62; margin-left:.28em; letter-spacing:.04em; }
.row .d{ width:3.4em; text-align:right; margin-left:1.5em; }
.row.on{ color:var(--ink); opacity:1; }
#idxclose{
  position:absolute; top:var(--m); right:var(--m); z-index:2; color:inherit;
  font-size:var(--meta); font-variation-settings:'wght' 600,'wdth' 96; letter-spacing:.02em;
  padding:10px; margin:-10px;
}
#idxtitle{
  position:absolute; top:var(--m); left:var(--m); z-index:2;
  font-size:var(--meta); font-variation-settings:'wght' 600,'wdth' 96; letter-spacing:.02em; opacity:.55;
}
#meas{ position:absolute; left:-9999px; top:0; white-space:pre; font-size:100px; letter-spacing:0; visibility:hidden; }
</style>
</head>
<body>

<div id="sheet">
  <div id="ground"></div>
  <canvas id="bg"></canvas>
  <div id="field"><canvas id="plate"></canvas></div>
  <div id="topmeta">
    <button id="pos" style="letter-spacing:inherit;font-variation-settings:inherit">01<span class="cnt">/72</span></button>
    <button id="yrbtn" style="letter-spacing:inherit;font-variation-settings:inherit;border-bottom:1px solid currentColor;padding-bottom:3px">2026</button>
  </div>
  <div id="typewrap"><div id="lines"></div></div>
  <div id="foot">
    <span id="f-date" class="dim"></span>
    <span id="f-bpm"></span>
    <span id="f-dur" class="dim"></span>
  </div>
  <div id="inv"></div>
  <div id="bar"></div>
</div>

<div id="accent">
  <div id="head"></div>
  <button id="transport" aria-label="play / pause">
    <svg id="glyph" width="13" height="15" viewBox="0 0 13 15" aria-hidden="true"><path id="gp" fill="currentColor" d="M0 0 L13 7.5 L0 15 Z"/></svg>
    <span class="t" id="clock">0:00</span>
  </button>
  <button id="palname" aria-label="cycle palette">SIGNAL</button>
</div>

<div id="index">
  <div id="idxtitle">KANI</div>
  <button id="idxclose">CLOSE</button>
  <div id="idxscroll"></div>
</div>

<div id="meas"></div>

<script>
(function(){
'use strict';

var W_MIN = 360, W_MAX = 900, D_MIN = 98, D_MAX = 106, FIT_E = 0.5;
var D_HI = 120;   // the band the block itself may be set in; the narrow end
function dLo(){ return clamp(66 + (window.innerWidth - 390)*0.043, 66, 88); }
var K = 0.6;          // how much of the pressure-driven width growth survives tracking
var LEAD = 0.80;

var clamp = function(v,a,b){ return v<a?a:(v>b?b:v); };
var lerp = function(a,b,t){ return a+(b-a)*t; };

/* ---------------- inks ----------------
   Each palette is an ordered ramp. Tracks are rank-assigned along it by
   low-end bias, so the bassiest track takes ink 0 and the brightest takes
   the last — the ramp always reads in order, and every ink gets used.
   Cycle with C, or tap the palette name bottom-right. Choice persists. */
var PALETTES = [
  { name:'SIGNAL', inks:[
    {h:356,s:86,l:54},{h:344,s:85,l:54},{h:334,s:84,l:54},{h:318,s:80,l:53},
    {h:306,s:76,l:52},{h:290,s:74,l:56},{h:276,s:72,l:58},{h:258,s:78,l:60},
    {h:238,s:84,l:60},{h:216,s:84,l:52},{h:202,s:82,l:46},{h:194,s:80,l:41} ] },

  { name:'RISO', inks:[
    {h:339,s:92,l:58},{h:14,s:92,l:56},{h:32,s:94,l:52},{h:48,s:92,l:50},
    {h:68,s:62,l:46},{h:142,s:62,l:42},{h:174,s:70,l:40},{h:196,s:82,l:46},
    {h:222,s:78,l:54},{h:266,s:62,l:56},{h:296,s:60,l:52},{h:318,s:74,l:54} ] },

  { name:'EMBER', inks:[
    {h:6,s:74,l:40},{h:12,s:80,l:46},{h:18,s:86,l:50},{h:24,s:90,l:52},
    {h:30,s:92,l:54},{h:36,s:90,l:54},{h:42,s:88,l:54},{h:48,s:86,l:54},
    {h:54,s:80,l:52},{h:40,s:60,l:46},{h:26,s:56,l:40},{h:14,s:52,l:34} ] },

  { name:'ICE', inks:[
    {h:168,s:70,l:46},{h:180,s:74,l:46},{h:190,s:80,l:48},{h:198,s:84,l:50},
    {h:206,s:86,l:54},{h:214,s:84,l:58},{h:222,s:80,l:60},{h:232,s:76,l:62},
    {h:244,s:70,l:64},{h:256,s:64,l:64},{h:268,s:58,l:62},{h:280,s:54,l:60} ] },

  { name:'ACID', inks:[
    {h:64,s:96,l:50},{h:74,s:92,l:48},{h:84,s:88,l:46},{h:94,s:84,l:44},
    {h:104,s:82,l:44},{h:118,s:80,l:44},{h:134,s:78,l:44},{h:150,s:76,l:44},
    {h:164,s:78,l:44},{h:56,s:98,l:52},{h:46,s:98,l:52},{h:38,s:96,l:52} ] },

  { name:'SPECTRUM', inks:[
    {h:0,s:84,l:54},{h:30,s:88,l:52},{h:52,s:88,l:50},{h:78,s:74,l:46},
    {h:104,s:70,l:44},{h:140,s:68,l:44},{h:168,s:72,l:44},{h:194,s:80,l:46},
    {h:216,s:84,l:54},{h:248,s:76,l:60},{h:284,s:68,l:58},{h:320,s:80,l:56} ] },

  { name:'OXIDE', inks:[
    {h:16,s:44,l:44},{h:26,s:48,l:46},{h:36,s:44,l:46},{h:44,s:36,l:46},
    {h:60,s:24,l:44},{h:96,s:22,l:40},{h:150,s:24,l:36},{h:186,s:30,l:36},
    {h:206,s:34,l:42},{h:220,s:30,l:46},{h:246,s:24,l:48},{h:300,s:18,l:46} ] },

  { name:'BONE', inks:[
    {h:38,s:16,l:88},{h:38,s:14,l:82},{h:38,s:12,l:76},{h:38,s:10,l:70},
    {h:38,s:9,l:64},{h:38,s:8,l:58},{h:210,s:8,l:60},{h:210,s:10,l:66},
    {h:210,s:12,l:72},{h:210,s:14,l:78},{h:210,s:16,l:84},{h:210,s:18,l:90} ] }
];

var pal = 0;
try {
  var sp = localStorage.getItem('kani.pal');
  if (sp !== null){
    var n = parseInt(sp, 10);
    if (n >= 0 && n < PALETTES.length) pal = n;
  }
} catch(e){}

var SITE_TITLE = 'can’t mute me.';
var dead = {};                 // files that 404 — skipped rather than silently failing
var AUDIO_BASE = '/audio-mp3/';
var TRACKS = [], cur = 0, playing = false, idxOpen = false;
var audio = null, actx = null, analy = null, freq = null, srcNode = null, wired = false, switching = false;
var env = 0, envSlow = 0, slam = 0, hist = [];
var bSlow = 0, bSpread = 8, bInit = false;
var ctx2d = null, cv = null, cw = 0, ch = 0;
var lineEls = [], lineCfg = [], typeReady = false;
var idxRows = [];

function b64(s){
  var bin = atob(s), n = bin.length, a = new Uint8Array(n);
  for (var i=0;i<n;i++) a[i] = bin.charCodeAt(i);
  return a;
}
function mmss(s){
  s = Math.max(0, Math.floor(s||0));
  return Math.floor(s/60) + ':' + ('0' + (s%60)).slice(-2);
}
function tidy(t){
  return t.replace(/'/g, '’');
}

var inkOrder = [];

// stable per-track hash — same song is always the same colour, across reloads
function hash32(s){
  var h = 2166136261;
  for (var i = 0; i < s.length; i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return ((h >>> 0) % 100000) / 100000;
}
// shortest-path hue interpolation, so a ramp never travels the long way round
function mixInk(a, b, t){
  var dh = ((b.h - a.h + 540) % 360) - 180;
  return { h: (a.h + dh * t + 360) % 360, s: a.s + (b.s - a.s) * t, l: a.l + (b.l - a.l) * t };
}
// Every track gets its OWN ink, not one of twelve. The palette's inks are
// anchors on a continuous ramp; each track lands at its own point along it by
// low-end rank, plus a small deterministic jitter so neighbours never collide.
// Scrolling the catalogue therefore changes colour on every song.
function assignInks(){
  var inks = PALETTES[pal].inks, n = inks.length, N = inkOrder.length;
  inkOrder.forEach(function(t, i){
    var p = N > 1 ? i / (N - 1) : 0;
    var f = p * (n - 1);
    var k = Math.min(n - 2, Math.floor(f));
    var c = mixInk(inks[k], inks[k + 1], f - k);
    var j = hash32(t.file);
    var h = (c.h + (j - 0.5) * 22 + 360) % 360;
    var s = clamp(c.s + (j - 0.5) * 10, 8, 98);
    var l = clamp(c.l + (hash32(t.file + '·') - 0.5) * 9, 26, 92);
    t.ink = 'hsl(' + h.toFixed(1) + ' ' + s.toFixed(1) + '% ' + l.toFixed(1) + '%)';
    // the scene needs the same ink as linear-ish rgb, plus a stable rotation
    t.inkRGB = hsl2rgb(h, s, Math.min(72, l + 12));
    t.seed = j;
    // Per-track ground colour. #inv is white with mix-blend-mode:difference, so
    // the light state is the exact inverse of whatever the plate is — tint the
    // plate and BOTH states get colour, guaranteed to complement each other.
    // Kept very dark and only moderately saturated so the inverse lands on a
    // pleasant pastel rather than a garish one.
    var ph = (h + 150 + hash32(t.file + 'p') * 120) % 360;
    var ps = 22 + hash32(t.file + 's') * 26;         // 22..48
    var pl = 5.5 + hash32(t.file + 'l') * 4.0;       // 5.5..9.5
    t.plate = 'hsl(' + ph.toFixed(1) + ' ' + ps.toFixed(1) + '% ' + pl.toFixed(1) + '%)';
    t.bone  = 'hsl(' + ((ph + 24) % 360).toFixed(1) + ' ' + (10 + ps * 0.18).toFixed(1) + '% 92.5%)';
    // six scene families, dealt round-robin down the same rank the ink follows,
    // so neighbouring songs in the catalogue rarely repeat a pattern
    t.mode = i % 12;
  });
  bgSet = -1;
}
function cyclePalette(dir){
  pal = (pal + (dir || 1) + PALETTES.length) % PALETTES.length;
  try { localStorage.setItem('kani.pal', String(pal)); } catch(e){}
  assignInks();
  var t = TRACKS[cur];
  if (t) document.documentElement.style.setProperty('--ink', t.ink);
  idxRows.forEach(function(r, i){
    if (TRACKS[i]) r.style.color = '';
  });
  var el = document.getElementById('palname');
  if (el){
    el.textContent = PALETTES[pal].name;
    el.classList.remove('flash');
    void el.offsetWidth;
    el.classList.add('flash');
  }
}

/* ---------------- data ---------------- */

Promise.all([
  fetch('/data/marks.json').then(function(r){ return r.json(); }),
  fetch('/config.json').then(function(r){ return r.json(); })
]).then(function(res){
  var marks = res[0], cfg = res[1];

  // audio-mp3/ is gitignored and never deployed — production serves from R2.
  // Localhost keeps the local folder so dev works without touching the bucket.
  var host = location.hostname;
  var isLocal = host === 'localhost' || host === '127.0.0.1' || host === '::1'
             || /^192\.168\./.test(host) || /^10\./.test(host) || host === '';
  AUDIO_BASE = isLocal ? '/audio-mp3/' : (cfg.audioBase || '/audio-mp3/');
  if (cfg.tagline) { SITE_TITLE = cfg.tagline; document.title = SITE_TITLE; }

  cfg.tracks.forEach(function(c){
    var m = marks.tracks[c.file];
    if (!m) return;
    var bal = m.balance;
    TRACKS.push({
      file: c.file,
      title: tidy(m.title || c.title || ''),
      date: m.date || c.date || '',
      dur: m.duration, bpm: m.bpm, rms: m.rmsDb,
      ratio: (bal[0]+bal[1])/(bal[4]+bal[5]),
      raw: m, bands: null
    });
  });

  inkOrder = TRACKS.slice().sort(function(a,b){ return b.ratio - a.ratio; });
  assignInks();

  // rest-state axes: loudness -> weight, low-end bias -> width
  var rmsLo = -20.4, rmsHi = -4.2, rLo = 1.22, rHi = 1.80;
  TRACKS.forEach(function(t){
    var lo = clamp((t.rms - rmsLo)/(rmsHi - rmsLo), 0, 1);
    var wd = clamp((t.ratio - rLo)/(rHi - rLo), 0, 1);
    t.bias = 0.10 + lo*0.30;
    t.idxW = Math.round(lerp(280, 820, lo));
    t.idxD = Math.round(lerp(70, 118, wd));
  });

  buildIndex();
  boot();
}).catch(function(e){
  document.getElementById('lines').textContent = 'data unavailable';
  console.error(e);
});

function bandsOf(t){
  if (!t.bands){
    t.bands = t.raw.bands.map(b64);
    t.pk = b64(t.raw.peaks);
    // stretch each band across its own working range, so a track's structure
    // reads instead of six near-saturated bars
    t.nb = t.bands.map(function(a){
      var s = Array.prototype.slice.call(a).sort(function(x,y){ return x-y; });
      var lo = s[Math.floor(s.length*0.20)], hi = s[Math.floor(s.length*0.99)];
      var out = new Float32Array(a.length), i;
      if (hi - lo < 45){ for (i=0;i<a.length;i++) out[i] = a[i]/255; }
      else { for (i=0;i<a.length;i++) out[i] = clamp((a[i]-lo)/(hi-lo), 0, 1); }
      return out;
    });
  }
  return t.bands;
}

/* ---------------- typesetting ---------------- */

var meas = document.getElementById('meas');
function measReady(){
  meas.style.fontFamily = "'Archivo',system-ui,sans-serif";
}
// the only reliable signal that Archivo is actually rendering: two different
// fallbacks must measure identically.
function fontLive(){
  var v = meas.style.fontVariationSettings;
  meas.style.fontVariationSettings = 'normal';
  meas.textContent = 'PRESSURE 0123 MWij';
  meas.style.fontFamily = "'Archivo',monospace";
  var a = meas.getBoundingClientRect().width;
  meas.style.fontFamily = "'Archivo',serif";
  var b = meas.getBoundingClientRect().width;
  meas.style.fontFamily = "'Archivo',system-ui,sans-serif";
  meas.style.fontVariationSettings = v;
  return a > 0 && Math.abs(a - b) < 0.5;
}
var dOff = 0;   // per-title width-axis offset: the block is set wide or narrow so it fills the measure
function axes(e, off){
  var d = clamp(lerp(D_MIN,D_MAX,e) + (off === undefined ? dOff : off), 62, 125);
  return "'wght' " + Math.round(lerp(W_MIN,W_MAX,e)) + ", 'wdth' " + d.toFixed(2);
}
function w100(s, e, off){
  meas.style.fontVariationSettings = axes(e, off);
  meas.textContent = s;
  return meas.getBoundingClientRect().width;
}
function sampW(s, e){
  return e <= 0.5 ? lerp(s[0], s[1], e*2) : lerp(s[1], s[2], (e-0.5)*2);
}

function tokens(title){
  var parts = title.split(/\s+/).filter(Boolean), out = [];
  for (var i=0;i<parts.length;i++){
    if (parts[i] === '/' && out.length) out[out.length-1] += ' /';
    else out.push(parts[i]);
  }
  return out;
}

function splits(words, n){
  var out = [];
  (function walk(start, left, acc){
    if (left === 1){ out.push(acc.concat([words.slice(start).join(' ')])); return; }
    for (var i=start+1; i<=words.length-(left-1); i++)
      walk(i, left-1, acc.concat([words.slice(start,i).join(' ')]));
  })(0, n, []);
  return out;
}

function typeset(t){
  var wrap = document.getElementById('typewrap');
  var box = wrap.getBoundingClientRect();
  var M = box.width, AH = box.height;
  if (M < 80 || AH < 80) return;

  var main = t.title, sub = '';
  var mm = t.title.match(/^(.+?)\s*\((.+)\)\s*$/);
  if (mm){ main = mm[1]; sub = mm[2]; }

  var holder = document.getElementById('lines');
  holder.innerHTML = '';
  var avail = AH;
  if (sub){
    var sEl = document.createElement('span');
    sEl.id = 'sub';
    sEl.textContent = '(' + sub.toUpperCase() + ')';
    holder.appendChild(sEl);
    var sr = sEl.getBoundingClientRect();
    avail -= sr.height + parseFloat(getComputedStyle(sEl).marginBottom || 0);
  }

  dOff = 0;
  var words = tokens(main.toUpperCase());
  var maxL = Math.min(words.length, 5);
  var fitCache = {};
  var fitW = function(s){
    if (fitCache[s] === undefined) fitCache[s] = w100(s, FIT_E, 0);
    return fitCache[s];
  };

  // One size for the whole block. For each possible number of lines, the width
  // axis is opened or closed until the longest line reaches the measure at the
  // same size the height allows — so the block fills the page both ways. The
  // break that yields the largest type wins.
  var Dfit = lerp(D_MIN, D_MAX, FIT_E);
  var loOff = dLo() - Dfit, hiOff = D_HI - Dfit;
  var best = null;

  for (var L = 1; L <= maxL; L++){
    var cands = splits(words, L), pick = null;
    for (var c = 0; c < cands.length; c++){
      var w = cands[c].map(fitW), mx = 0, sum = 0, wi = 0;
      for (var i=0;i<w.length;i++){ if (w[i] > mx){ mx = w[i]; wi = i; } sum += w[i]; }
      if (mx <= 0) continue;
      var rag = 1 - (sum/w.length)/mx;
      if (!pick || mx < pick.mx*0.995 || (mx < pick.mx*1.005 && rag < pick.rag))
        pick = { lines:cands[c], mx:mx, rag:rag, wide:cands[c][wi] };
    }
    if (!pick) continue;

    var Sh = avail/(L*LEAD);
    var need = M*100/Sh;
    var off = clamp(Dfit*(need/pick.mx - 1), loOff, hiOff), got = pick.mx;
    if (Math.abs(off) > 0.05){
      got = w100(pick.wide, FIT_E, off);
      var slope = (got - pick.mx)/off;
      if (Math.abs(slope) > 0.01){
        off = clamp(off + (need - got)/slope, loOff, hiOff);
        got = w100(pick.wide, FIT_E, off);
      }
    }
    var S = Math.min(Sh, M*100/got);
    // a short rag is worse than short measure: weight the size by how much of
    // the measure the longest line can actually reach.
    var fill = clamp((got*S/100 + 0.055*S*(pick.wide.length-1))/M, 0, 1);
    var tall = clamp(L*S*LEAD/avail, 0, 1);
    var score = S * Math.pow(fill, 1.5) * (1 + 0.10*tall);
    if (!best || score > best.score) best = { S:S, off:off, lines:pick.lines, score:score };
  }
  if (!best) best = { S:48, off:0, lines:[main.toUpperCase()] };
  dOff = best.off;

  lineCfg = best.lines.map(function(txt, i){
    var samples = [w100(txt, 0), w100(txt, 0.5), w100(txt, 1)];
    var wfit = sampW(samples, FIT_E);
    var gaps = Math.max(1, txt.length - 1);
    var base = clamp((M - wfit*best.S/100)/gaps, 0, best.S*0.055);
    return { text:txt, size:best.S, samples:samples, wfit:wfit, gaps:gaps, base:base };
  });

  lineEls = lineCfg.map(function(c){
    var d = document.createElement('div');
    d.className = 'ln';
    d.style.fontSize = c.size.toFixed(2) + 'px';
    var s = document.createElement('span');
    s.textContent = c.text;
    d.appendChild(s); holder.appendChild(d);
    return s;
  });
  typeReady = true;
  applyPressure(t.bias, true);
}

function applyPressure(e, force){
  if (!typeReady) return;
  for (var i=0;i<lineEls.length;i++){
    var v = force ? e : (hist.length ? hist[Math.max(0, hist.length-1 - i*2)] : e);
    var c = lineCfg[i];
    // the letters swell, and the tracking closes on them: most of the extra
    // advance width is absorbed, the rest bleeds into the margin.
    var we = sampW(c.samples, v) * c.size / 100;
    var wf = c.wfit * c.size / 100;
    var ls = c.base + (1-K)*(wf - we)/c.gaps;
    var el = lineEls[i];
    el.style.fontVariationSettings = axes(v);
    el.style.letterSpacing = ls.toFixed(2) + 'px';
    el.style.marginRight = (-ls).toFixed(2) + 'px';
    el.style.transform = 'scaleY(' + (1 - 0.04*v).toFixed(4) + ')';
  }
}

/* ---------------- plate field ---------------- */

function fieldMin(){ return clamp(window.innerHeight*0.19, 104, 210); }

// the mark takes whatever height the title does not: the page is always full,
// and the ratio of plate to type is set by the title itself.
function seatField(){
  var root = document.documentElement;
  root.style.setProperty('--fieldmin', fieldMin().toFixed(1) + 'px');
  var fEl = document.getElementById('field');
  var wrap = document.getElementById('typewrap').getBoundingClientRect();
  var block = document.getElementById('lines').getBoundingClientRect();
  var top = fEl.getBoundingClientRect().top;
  var gap = wrap.top - top - fieldMin();
  var fh = clamp(wrap.bottom - block.height - gap - top, fieldMin(), window.innerHeight*0.56);
  root.style.setProperty('--fieldh', fh.toFixed(1) + 'px');
}

function sizeCanvas(){
  cv = cv || document.getElementById('plate');
  ctx2d = ctx2d || cv.getContext('2d');
  var r = cv.parentNode.getBoundingClientRect();
  var dpr = Math.min(2, window.devicePixelRatio || 1);
  cw = Math.max(1, Math.round(r.width)); ch = Math.max(1, Math.round(r.height));
  cv.width = Math.round(cw*dpr); cv.height = Math.round(ch*dpr);
  ctx2d.setTransform(dpr,0,0,dpr,0,0);
}

function drawField(progress){
  var t = TRACKS[cur];
  if (!ctx2d || !t) return;
  bandsOf(t);
  ctx2d.clearRect(0,0,cw,ch);
  var nb = t.nb, n = nb[0].length, strat = ch/6, px = progress*cw, colw = cw/n;

  // Six ridgelines, stroked not filled. The old version filled each band solid,
  // which at 256 stepped columns collapsed into a black slab — and now it would
  // also blot out the scene behind. Thin smoothed contours read as engraving,
  // keep all six bands legible, and let the field show through.
  ctx2d.lineJoin = 'round';
  ctx2d.lineCap = 'round';

  // 256 samples squeezed into a phone's width is ~1.5px per point, which draws
  // as hair, not a line. Resample to roughly one point per 5 CSS px and smooth
  // it, so the ridges read as contours instead of noise.
  var target = Math.max(24, Math.min(n, Math.round(cw / (5 * (window.devicePixelRatio || 1)))));
  var sm = t.smooth;
  if (!sm || t.smoothN !== target){
    sm = t.smooth = [];
    t.smoothN = target;
    for (var b2=0;b2<6;b2++){
      var srcA = nb[b2], down = new Float32Array(target), q;
      for (q=0;q<target;q++){                        // area-average, not point-sample
        var a0 = Math.floor(q*n/target), a1 = Math.max(a0+1, Math.floor((q+1)*n/target));
        var acc = 0, cnt = 0;
        for (var z=a0; z<a1 && z<n; z++){ acc += srcA[z]; cnt++; }
        down[q] = cnt ? acc/cnt : 0;
      }
      var pass = down;                               // two light blur passes
      for (var k2=0;k2<2;k2++){
        var next = new Float32Array(target);
        for (q=0;q<target;q++){
          var pm = pass[Math.max(0,q-1)], pc = pass[q], pp = pass[Math.min(target-1,q+1)];
          next[q] = pm*0.25 + pc*0.5 + pp*0.25;
        }
        pass = next;
      }
      sm.push(pass);
    }
  }

  for (var b=0;b<6;b++){
    var base = ch - strat*b - strat*0.10;   // bass at the foot, treble at the head
    var mt = strat*0.92;                    // barely overlap — no more tangling
    var arr = sm[b], m2 = arr.length, cw2 = cw/(m2-1);
    var pts = [];
    for (var i=0;i<m2;i++){
      pts.push([i*cw2, base - Math.pow(arr[i], 1.35)*mt]);
    }

    var trace = function(){
      ctx2d.beginPath();
      ctx2d.moveTo(pts[0][0], pts[0][1]);
      for (var i=0;i<pts.length-1;i++){
        var mx = (pts[i][0]+pts[i+1][0])*0.5, my = (pts[i][1]+pts[i+1][1])*0.5;
        ctx2d.quadraticCurveTo(pts[i][0], pts[i][1], mx, my);
      }
      ctx2d.lineTo(pts[pts.length-1][0], pts[pts.length-1][1]);
    };

    // a whisper of tone under the ridge so the stack still reads as strata
    trace();
    ctx2d.lineTo(cw, base); ctx2d.lineTo(0, base); ctx2d.closePath();
    ctx2d.fillStyle = 'rgba(237,233,225,0.07)';
    ctx2d.fill();

    if (!playing){
      trace();
      ctx2d.strokeStyle = 'rgba(237,233,225,0.62)';
      ctx2d.lineWidth = 1;
      ctx2d.stroke();
    } else {
      // behind the playhead: inked. ahead of it: still faint.
      ctx2d.save();
      ctx2d.beginPath(); ctx2d.rect(0,0,px,ch); ctx2d.clip();
      trace();
      ctx2d.strokeStyle = 'rgba(237,233,225,0.96)';
      ctx2d.lineWidth = 1.5;
      ctx2d.stroke();
      ctx2d.restore();

      ctx2d.save();
      ctx2d.beginPath(); ctx2d.rect(px,0,cw-px,ch); ctx2d.clip();
      trace();
      ctx2d.strokeStyle = 'rgba(237,233,225,0.40)';
      ctx2d.lineWidth = 1;
      ctx2d.stroke();
      ctx2d.restore();
    }
  }
}

/* ---------------- audio ---------------- */

function ensureAudio(){
  if (audio) return;
  audio = new Audio();
  audio.crossOrigin = 'anonymous';
  audio.preload = 'auto';
  audio.addEventListener('ended', function(){ go(1, true); });
  audio.addEventListener('playing', function(){ switching = false; setPlaying(true); });
  // swapping src fires pause; that must not flip the page back to plate
  audio.addEventListener('pause', function(){ if (!switching) setPlaying(false); });
  // A track whose file is missing used to swallow every click in silence —
  // press play, nothing happens, forever. Mark it dead and move to the next
  // one that works, so play always does something on the first press.
  audio.addEventListener('error', function(){
    var t = TRACKS[cur];
    if (!t) return;
    var want = AUDIO_BASE + encodeURIComponent(t.file);
    if (audio.getAttribute('src') !== want) return;   // stale error from a swap
    dead[t.file] = true;
    var n = TRACKS.length, k, idx;
    for (k = 1; k <= n; k++){
      idx = (cur + k) % n;
      if (!dead[TRACKS[idx].file]){
        cur = idx;
        stamp();
        setTimeout(function(){ play(); }, 90);
        return;
      }
    }
    setPlaying(false);
  });
}

// Load the current track's source WITHOUT starting playback, so the timeline
// can be scrubbed on a track that has never been played. ensureAudio() alone
// makes a src-less element — seeking that silently does nothing.
function ensureLoaded(){
  ensureAudio();
  var want = AUDIO_BASE + encodeURIComponent(TRACKS[cur].file);
  if (audio.getAttribute('src') !== want){
    switching = true;
    setTimeout(function(){ switching = false; }, 900);
    audio.setAttribute('src', want);
    audio.load();
  }
}

// currentTime is only writable once metadata has landed; before that, park the
// request and apply it on loadedmetadata.
var pendingSeek = -1;
function seekSafe(sec){
  if (!audio) return;
  if (audio.readyState >= 1){
    try { audio.currentTime = sec; } catch(e){}
    return;
  }
  pendingSeek = sec;
  audio.addEventListener('loadedmetadata', function h(){
    audio.removeEventListener('loadedmetadata', h);
    if (pendingSeek >= 0){
      try { audio.currentTime = pendingSeek; } catch(e){}
      pendingSeek = -1;
    }
  });
}

/* ---------------- the scene ----------------
   One shader, 72 outcomes. Six plane waves interfere on a domain-warped
   field — the same physics that draws Chladni figures when you bow a metal
   plate, which is the literal version of what this page already calls its
   two states. Every parameter is taken from the track: the six band levels
   set each wave's amplitude and wavelength, bpm sets drift speed, crest sets
   how hard the nodal lines snap, onset rate sets turbulence, and a hash of
   the filename rotates the whole figure. Nothing is hand-authored, so all 72
   differ and each is always itself. Live bass ripples out from the centre
   while it plays; when silent it breathes on the baked values instead. */
var BGV = 'attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}';

ngth(q - 0.5) - 0.5));\n    cov = 1.0 - smoothstep(ww - aa, ww + aa, d);\n  }\n  return pres * cov;\n}\n\nfloat scene_TRUCHET(vec2 uv, float t, float lvl, float sd, float bpmN, float crestN, float onsetN, vec3 b0, vec3 b1){\n  float sq = clamp(sd, 0.0, 1.0);\n  float lv = clamp(lvl, 0.0, 1.0);\n  float seed = 3.0 + sq * 47.0;\n  float k = floor(sq * 3.99);\n\n  float ga = k * 0.261799;\n  float cg = cos(ga);\n  float sg = sin(ga);\n  vec2 p = vec2(cg * uv.x - sg * uv.y, sg * uv.x + cg * uv.y);\n\n  vec2 dir = vec2(0.94, -0.34 + 0.68 * sq);\n  dir *= inversesqrt(max(dot(dir, dir), 0.0001));\n  p += dir * (t * (0.006 + 0.013 * sq));\n\n  float S = 4.6 + k * 0.75;\n  vec2 g = p * S;\n  vec2 id = floor(g);\n  vec2 f = g - id - 0.5;\n\n  float beat = t * (0.40 + 1.35 * clamp(bpmN, 0.0, 1.0));\n\n  float lo = (b0.x + b0.y + b0.z) * 0.3333;\n  float hi = (b1.x + b1.y + b1.z) * 0.3333;\n  float r = min(length(uv), 2.0);\n  float en = mix(lo, hi, clamp(r * 1.7, 0.0, 1.0));\n\n  float w = clamp(0.064 + 0.032 * lv + 0.018 * (clamp(b0.x, 0.0, 1.3) - 0.45), 0.050, 0.100);\n  float aa = 0.0024 * S;\n  float punch = min(0.85, (0.15 + 0.75 * lv) * (0.50 + 0.60 * clamp(crestN, 0.0, 1.0)));\n  float drop = 0.07 + 0.11 * clamp(onsetN, 0.0, 1.0);\n\n  // where the plate resolves into finer tiles: a slow sweep, pushed by the bands\n  float wave = 0.5 + 0.5 * sin(t * 0.11 + r * 3.4 - sq * 6.28);\n  float subT = clamp(0.04 + 0.22 * wave * (0.5 + 0.5 * sq) + 0.18 * (en - 0.55), 0.0, 0.42);\n  float hs = truchet_h11(id + vec2(3.7, -2.9), seed + 21.0);\n  float m = smoothstep(subT - 0.03, subT + 0.03, hs);\n\n  vec2 g2 = g * 2.0;\n  vec2 id2 = floor(g2);\n  vec2 f2 = g2 - id2 - 0.5;\n\n  float cov;\n  if (m > 0.99) {\n    cov = truchet_cell(f, id, beat, w, aa, seed, punch, drop);\n  } else if (m < 0.01) {\n    cov = truchet_cell(f2, id2, beat, w * 0.62, aa * 2.0, seed + 13.0, punch, drop);\n  } else {\n    // retiling cell: the old resolution clears before the new one lands\n    float cf = truchet_cell(f2, id2, beat, w * 0.62, aa * 2.0, seed + 13.0, punch, drop);\n    float cc = truchet_cell(f, id, beat, w, aa, seed, punch, drop);\n    cov = max(cf * (1.0 - smoothstep(0.0, 0.62, m)), cc * smoothstep(0.38, 1.0, m));\n  }\n\n  float dc = length(abs(f) - 0.5);\n  float reg = (1.0 - smoothstep(0.030, 0.030 + aa * 2.0, dc)) * 0.22;\n\n  return clamp(max(cov, reg), 0.0, 1.0);\n}\nfloat halftone_h11(float n){\n  return fract(sin(n*91.7 + 3.13)*43758.5453);\n}\n\nfloat halftone_h21(vec2 p){\n  return fract(sin(dot(p, vec2(127.1, 311.7)))*43758.5453);\n}\n\nvec2 halftone_spin(vec2 p, float a){\n  float c = cos(a);\n  float s = sin(a);\n  return vec2(c*p.x - s*p.y, s*p.x + c*p.y);\n}\n\n// the continuous plate the screen samples: four drifting masses\nfloat halftone_plate(vec2 p, float t, float sd, float drift, float rad){\n  float v = 0.0;\n  for (int i = 0; i < 4; i++){\n    float fi = float(i);\n    float a = fract(sd*7.31 + fi*0.6180339);\n    float b = fract(sd*3.77 + fi*0.3819660 + 0.37);\n    float sp = drift*(0.55 + a*0.90);\n    float ph = b*6.2831853;\n    vec2 c = vec2(cos(sp*t + ph)*(0.30 + a*0.55),\n                  sin(sp*t*0.79 + ph*1.7)*(0.13 + b*0.26));\n    float rr = rad*(0.62 + b*0.70);\n    float r2 = rr*rr;\n    vec2 d = p - c;\n    v += r2/(dot(d, d) + r2 + 0.0001);\n  }\n  return v;\n}\n\nfloat scene_HALFTONE(vec2 uv, float t, float lvl, float sd, float bpmN, float crestN, float onsetN, vec3 b0, vec3 b1){\n  vec3 lo = clamp(b0 - 0.2, 0.0, 1.0);\n  vec3 hi = clamp(b1 - 0.2, 0.0, 1.0);\n\n  // screen angle, one of the three printers' angles, creeping very slowly\n  float ang = radians(15.0 + floor(sd*2.99)*30.0) + t*0.0075;\n  vec2 sp = halftone_spin(uv, ang);\n\n  // screen ruling, breathing a hair so the grid is never dead\n  float cs = mix(0.028, 0.044, halftone_h11(sd*13.0 + 1.7));\n  cs *= 1.0 + 0.035*sin(t*0.21);\n\n  vec2 g = sp/cs;\n  float shift = step(0.5, fract(sd*5.0))*0.5*mod(floor(g.y), 2.0);\n  g.x += shift;\n  vec2 cid = fl loat d2 = mix(length(f2), max(f2.x, f2.y)*1.05, sqn);\n  float wr = (0.28 + 0.05*hi.z)*(1.0 - 0.10*sqn)*smoothstep(0.66, 1.0, v)*(1.0 - 0.15*lvl);\n  ink -= (1.0 - smoothstep(wr, wr + 0.07, d2))*smoothstep(0.02, 0.06, wr);\n\n  return clamp(ink, 0.0, 1.0);\n}\n/* ---- SMOKE : ink bleeding into wet paper. domain-warped fbm advection ---- */\n\nmat2 smoke_rot(float a){\n  float c = cos(a), s = sin(a);\n  return mat2(c, -s, s, c);\n}\n\nfloat smoke_h21(vec2 p){\n  return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453);\n}\n\n/* two decorrelated channels off one sine \u2014 a displacement field for the price of one noise */\nvec2 smoke_h22(vec2 p){\n  float n = sin(dot(p, vec2(127.1, 311.7))) * 43758.5453;\n  return fract(vec2(n, n * 0.61803399));\n}\n\nfloat smoke_vn(vec2 p){\n  vec2 i = floor(p);\n  vec2 f = p - i;\n  vec2 u = f * f * (3.0 - 2.0 * f);\n  float a = smoke_h21(i);\n  float b = smoke_h21(i + vec2(1.0, 0.0));\n  float c = smoke_h21(i + vec2(0.0, 1.0));\n  float d = smoke_h21(i + vec2(1.0, 1.0));\n  return mix(mix(a, b, u.x), mix(c, d, u.x), u.y);\n}\n\nvec2 smoke_vn2(vec2 p){\n  vec2 i = floor(p);\n  vec2 f = p - i;\n  vec2 u = f * f * (3.0 - 2.0 * f);\n  vec2 a = smoke_h22(i);\n  vec2 b = smoke_h22(i + vec2(1.0, 0.0));\n  vec2 c = smoke_h22(i + vec2(0.0, 1.0));\n  vec2 d = smoke_h22(i + vec2(1.0, 1.0));\n  return mix(mix(a, b, u.x), mix(c, d, u.x), u.y);\n}\n\n/* one pass, three products: x = soft mass, y = broad ridge (mottling inside the\n   ink), z = fine ridge (the filaments). the upper octaves are stretched slightly\n   so the finest detail runs along one axis, the way ink follows the grain */\nvec3 smoke_plume(vec2 p){\n  float n0 = smoke_vn(p);\n  float n1 = smoke_vn(p * vec2(2.07, 2.31) + vec2(17.3, -9.1));\n  float n2 = smoke_vn(p * vec2(4.55, 3.05) + vec2(-5.7, 23.9));\n  float r0 = 1.0 - abs(n0 + n0 - 1.0);\n  float r1 = 1.0 - abs(n1 + n1 - 1.0);\n  float r2 = 1.0 - abs(n2 + n2 - 1.0);\n  return vec3(n0 * 0.50 + n1 * 0.31 + n2 * 0.19,\n              r0 * 0.26 + r1 * 0.34 + r2 * 0.40,\n              r1 * 0.36 + r2 * 0.64);\n}\n\n/* a released puff spreading and dispersing. envelope is 0 at both ends so it never pops */\nfloat smoke_puff(float r, float k, float reach){\n  float R = 0.09 + k * reach;\n  float e = k * (1.0 - k) * 4.0;\n  float x = r / R;\n  return e * exp(-x * x * 1.6);\n}\n\nfloat scene_SMOKE(vec2 uv, float t, float lvl, float sd, float bpmN, float crestN, float onsetN, vec3 b0, vec3 b1){\n  float bass = clamp(b0.x * 0.55 + b0.y * 0.45, 0.0, 1.4);\n  float mids = clamp(b0.z * 0.50 + b1.x * 0.50, 0.0, 1.4);\n  float treb = clamp(b1.y * 0.45 + b1.z * 0.55, 0.0, 1.4);\n  float L  = clamp(lvl, 0.0, 1.0);\n  float sa = sd * 6.2831853;\n  float rr = length(uv);\n\n  /* advection. the drift is the integral of a unit heading that rotates slowly,\n     which stays bounded for every t \u2014 the field flows forever and the noise\n     lattice never runs out of precision */\n  float wA = 0.026 + bpmN * 0.016;\n  float aA = t * wA + sa;\n  vec2  dA = vec2(sin(aA), -cos(aA)) * ((0.11 + bpmN * 0.06) / wA);\n  float wB = 0.083 + bpmN * 0.055;\n  float aB = t * wB - sa * 1.7 + 2.4;\n  vec2  dB = vec2(sin(aB), -cos(aB)) * ((0.33 + bpmN * 0.22) / wB);\n\n  /* warp 1 \u2014 the slow billow. bass swells it */\n  vec2 p0 = smoke_rot(sa) * uv * (1.85 + sd * 0.60) + dA;\n  vec2 g0 = smoke_vn2(p0);\n  vec2 W1 = (g0 - 0.5) * (0.95 + bass * 0.85 + L * 0.45);\n\n  /* warp 2 \u2014 curl in the detail. treble tightens it */\n  vec2 p1 = smoke_rot(2.2 - sa * 1.4) * uv * (4.30 + treb * 1.40) + W1 * 0.75 + dB;\n  vec2 g1 = smoke_vn2(p1);\n  vec2 W2 = (g1 - 0.5) * (0.55 + treb * 0.40 + mids * 0.20 + onsetN * 0.30);\n\n  /* the ink itself, read through both warps */\n  vec2 p2 = smoke_rot(4.4 + sa * 0.8) * uv * (5.10 - bass * 0.80 + treb * 1.30 + sd * 1.10)\n          + W1 * 1.15 + W2 * 0.95 + dA * 0.90 + dB * 0.45;\n  vec3 F = smoke_plume(p2);\n  float mass = F.x;\n\n  /* the ink has a source, so it thins with distance from it \u2014 that is what keeps\n     the frame edges open instead of packing the whole page with fog */\n  vec2  src = vec2(cos(sa * 1.3), sin(sa * 2.1)) * 0.22;\n  float rs  = length(uv - src);\n\n  /* two fronts: a wide bleed into the fibre and a tighter body of ink inside it,\n     with the wet edge that collects where the bleed stopped */\n  float thr  = 0.385 - L * 0.050 - bass * 0.020 - crestN * 0.015\n             + (0.075 + (1.0 - L) * 0.070) * smoothstep(0.18, 1.05, rs);\n  float halo = smoothstep(thr - 0.06, thr + 0.26, mass);\n  float core = smoothstep(thr + 0.10, thr + 0.34, mass);\n  float rim  = halo * (1.0 - core);\n\n  float mott = clamp(0.80 + (F.y - 0.5) * (0.55 + treb * 0.35), 0.0, 1.12);\n  float wisp = smoothstep(0.50 + treb * 0.05, 0.93, F.z) * (halo * 0.86 + 0.14) * (0.15 + treb * 0.09);\n  float veil = smoothstep(0.45, 0.98, g0.x * 0.62 + g0.y * 0.38) * (0.060 + bass * 0.050);\n\n  /* injection \u2014 new ink released at the source, blooming then dispersing. it only\n     lights where there is already structure, so it never resolves into a disc */\n  float ph  = t * (0.13 + bpmN * 0.19) + sd;\n  float reach = 0.50 + crestN * 0.40;\n  float bl  = smoke_puff(rs, fract(ph), reach) + smoke_puff(rs, fract(ph + 0.5), reach);\n  float inj = L * L * 0.22 * bl * (0.15 + smoothstep(0.32, 0.76, mass));\n\n  float ink = clamp(halo * 0.18 + core * 0.55 * mott + rim * 0.14 + wisp + veil, 0.0, 1.0);\n  ink = 1.0 - (1.0 - ink) * (1.0 - clamp(inj, 0.0, 0.8));\n  ink *= 0.66 + 0.34 * (1.0 - smoothstep(0.12, 1.30, rr));\n  return clamp(ink, 0.0, 1.0);\n}\nvec2 cell_hash2(vec2 p){\n  vec3 k = fract(vec3(p.xyx) * vec3(0.1031, 0.1030, 0.0973));\n  k += dot(k, k.yzx + 33.33);\n  return fract((k.xx + k.yz) * k.zy);\n}\n\nvec2 cell_rot(vec2 p, float a){\n  float c = cos(a);\n  float s = sin(a);\n  return vec2(c * p.x - s * p.y, s * p.x + c * p.y);\n}\n\nvec3 cell_voro(vec2 p, float jit, float orb, float ph){\n  vec2 ip = floor(p);\n  vec2 fp = p - ip;\n  float f1 = 10.0;\n  float f2 = 10.0;\n  float id = 0.0;\n  for (int j = 0; j < 3; j++){\n    for (int i = 0; i < 3; i++){\n      vec2 g = vec2(float(i) - 1.0, float(j) - 1.0);\n      vec2 h = cell_hash2(ip + g);\n      vec2 osc = (abs(fract(h.yx + ph * (0.6 + h)) - 0.5) - 0.25) * 4.0;\n      vec2 d = g + 0.5 + (h - 0.5) * jit + osc * orb - fp;\n      float e = dot(d, d);\n      float w = step(e, f1);\n      f2 = min(f2, max(f1, e));\n      f1 = min(f1, e);\n      id = mix(id, fract(h.x + 1.37 * h.y), w);\n    }\n  }\n  return vec3(sqrt(f1), sqrt(f2), id);\n}\n\nfloat scene_CELL(vec2 uv, float t, float lvl, float sd, float bpmN, float crestN, float onsetN, vec3 b0, vec3 b1){\n  float lo  = clamp(b0.x, 0.0, 1.3);\n  float mid = clamp(b0.y, 0.0, 1.3);\n  float bod = clamp(b0.z, 0.0, 1.3);\n  float h1  = clamp(b1.x, 0.0, 1.3);\n  float h2  = clamp(b1.y, 0.0, 1.3);\n  float h3  = clamp(b1.z, 0.0, 1.3);\n\n  vec2 imp = 0.30 * vec2(sin(t * 0.113 + sd * 6.283), cos(t * 0.091 + sd * 4.117));\n  vec2 q = uv - imp;\n  float dens = exp(-2.4 * dot(q, q));\n\n  float cs = 7.0 + 3.0 * sd + 1.4 * bpmN;\n  vec2 p = cell_rot(uv, 0.35 + sd * 2.6 + 0.021 * t);\n  p.y *= 0.60 + 0.55 * sd;\n  p *= cs * (1.0 + 0.35 * dens * (0.40 + 0.60 * lo));\n  p += vec2(0.11, -0.07) * t * (0.4 + 0.9 * bpmN);\n  p += 0.35 * sin(p.yx * 0.33 + vec2(0.19 * t, -0.15 * t) + sd * 11.0);\n\n  float jit = 0.52 + 0.08 * sd;\n  float orb = 0.10 + 0.05 * clamp(mid - 0.2, 0.0, 1.0) + 0.04 * lvl;\n  float ph  = t * (0.34 + 0.55 * bpmN + 0.45 * onsetN);\n\n  vec3 v = cell_voro(p, jit, orb, ph);\n  float f1 = v.x;\n  float gap = v.y - v.x;\n  float id = v.z;\n\n  float fire = fract(t * (0.21 + 0.70 * bpmN) + id * 3.17);\n\n  float ew = mix(0.095, 0.038, crestN) * (0.85 + 0.30 * lo) + 0.028 * lvl * (1.0 - fire);\n  ew = clamp(ew, 0.020, 0.130);\n  float edge = (1.0 - smoothstep(0.0, ew, gap)) * clamp(0.76 + 0.16 * lvl + 0.18 * dens, 0.0, 0.95);\n\n  float bevel = (1.0 - smoothstep(0.0, 0.020, abs(gap - (0.11 + 0.05 * sd)))) * '  else { cov=scene_HYPER(uv,t,uLevel,uSeed,uBpm,uCrest,uOnset,b0,b1); }',
'  float grain=(h21(gl_FragCoord.xy+floor(t*24.))-.5)*.045;',
'  float edge=smoothstep(1.25,.25,length(uv));',
'  float amt=clamp(cov*edge+grain,0.,1.);',
'  gl_FragColor=vec4(uInk*amt,amt);',
'}'].join('\n').replace('//__SCENES__', BG_SCENES);

var bgGL=null,bgProg=null,bgU={},bgCv=null,bgT0=0,bgFail=false;
function hsl2rgb(h,s,l){
  h/=360; s/=100; l/=100;
  var f=function(n){ var k=(n+h*12)%12; var a=s*Math.min(l,1-l);
    return l-a*Math.max(-1,Math.min(Math.min(k-3,9-k),1)); };
  return [f(0),f(8),f(4)];
}
function initBG(){
  bgCv=document.getElementById('bg');
  try{ bgGL=bgCv.getContext('webgl',{alpha:true,antialias:false,depth:false,premultipliedAlpha:true}); }catch(e){}
  if(!bgGL){ bgFail=true; bgCv.style.display='none'; return; }
  var g=bgGL;
  var mk=function(ty,src){ var s=g.createShader(ty); g.shaderSource(s,src); g.compileShader(s);
    if(!g.getShaderParameter(s,g.COMPILE_STATUS)){ console.warn('[bg]',g.getShaderInfoLog(s)); return null; } return s; };
  var vs=mk(g.VERTEX_SHADER,BGV), fs=mk(g.FRAGMENT_SHADER,BGF);
  if(!vs||!fs){ bgFail=true; bgCv.style.display='none'; return; }
  bgProg=g.createProgram(); g.attachShader(bgProg,vs); g.attachShader(bgProg,fs); g.linkProgram(bgProg);
  if(!g.getProgramParameter(bgProg,g.LINK_STATUS)){ bgFail=true; bgCv.style.display='none'; return; }
  g.useProgram(bgProg);
  var buf=g.createBuffer(); g.bindBuffer(g.ARRAY_BUFFER,buf);
  g.bufferData(g.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),g.STATIC_DRAW);
  var loc=g.getAttribLocation(bgProg,'p'); g.enableVertexAttribArray(loc);
  g.vertexAttribPointer(loc,2,g.FLOAT,false,0,0);
  ['uRes','uTime','uLevel','uSeed','uBpm','uCrest','uOnset','uInk','uMode'].forEach(function(n){ bgU[n]=g.getUniformLocation(bgProg,n); });
  bgU.uB=g.getUniformLocation(bgProg,'uB[0]');
  g.enable(g.BLEND); g.blendFunc(g.ONE,g.ONE_MINUS_SRC_ALPHA);
  bgT0=performance.now();
  sizeBG();
}
function sizeBG(){
  if(!bgGL||!bgCv) return;
  var d=Math.min(window.devicePixelRatio||1,1.35);
  var w=Math.max(1,Math.round(bgCv.clientWidth*d)), h=Math.max(1,Math.round(bgCv.clientHeight*d));
  if(bgCv.width!==w||bgCv.height!==h){ bgCv.width=w; bgCv.height=h; }
  bgGL.viewport(0,0,w,h);
}
var bgB=new Float32Array(6), bgSet=-1;
function bgTrack(t){
  if(!t||!t.raw) return;
  var bal=t.raw.balance, lo=1e9, hi=-1e9, i;
  for(i=0;i<6;i++){ if(bal[i]<lo)lo=bal[i]; if(bal[i]>hi)hi=bal[i]; }
  var r=Math.max(1,hi-lo);
  for(i=0;i<6;i++) bgB[i]=0.22+((bal[i]-lo)/r)*0.95;
  bgSet=cur;
}
function drawBG(level){
  if(bgFail||!bgGL||!bgProg) return;
  var t=TRACKS[cur]; if(!t) return;
  if(bgSet!==cur) bgTrack(t);
  var g=bgGL;
  sizeBG();
  g.useProgram(bgProg);
  g.uniform2f(bgU.uRes,bgCv.width,bgCv.height);
  g.uniform1f(bgU.uTime,(performance.now()-bgT0)/1000);
  g.uniform1f(bgU.uLevel,level);
  g.uniform1f(bgU.uSeed,t.seed||0);
  g.uniform1f(bgU.uBpm,clamp((t.bpm-60)/107,0,1));
  g.uniform1f(bgU.uCrest,clamp((t.raw.crest-7.2)/12.1,0,1));
  g.uniform1f(bgU.uOnset,clamp((t.raw.onsetRate-1)/3.6,0,1));
  g.uniform1f(bgU.uMode,t.mode||0);
  var c=t.inkRGB||[1,1,1];
  g.uniform3f(bgU.uInk,c[0],c[1],c[2]);
  g.uniform1fv(bgU.uB,bgB);
  g.drawArrays(g.TRIANGLES,0,3);
}

function wireAnalyser(){
  if (wired) return;
  wired = true;
  try {
    var AC = window.AudioContext || window.webkitAudioContext;
    actx = new AC();
    srcNode = actx.createMediaElementSource(audio);
    analy = actx.createAnalyser();
    analy.fftSize = 2048; analy.smoothingTimeConstant = 0.55;
    srcNode.connect(analy); analy.connect(actx.destination);
    freq = new Uint8Array(analy.frequencyBinCount);
  } catch(e){ analy = null; }
}

// Level relative to the track's own moving average, so the type answers the
// beat rather than pinning at the top of a loud, limited mix.
function liveBass(){
  if (!analy || !freq) return -1;
  analy.getByteFrequencyData(freq);
  var binHz = actx.sampleRate / analy.fftSize;
  var lo = Math.max(1, Math.round(38/binHz)), hi = Math.max(lo+1, Math.round(250/binHz));
  var s = 0, c = 0;
  for (var i=lo;i<=hi;i++){ s += freq[i]*freq[i]; c++; }
  var avg = Math.sqrt(s/c);
  if (avg < 1) return 0;
  if (!bInit){ bSlow = avg; bSpread = 8; bInit = true; }
  bSlow += (avg - bSlow) * 0.012;
  var dev = avg - bSlow;
  bSpread += (Math.abs(dev) - bSpread) * 0.02;
  return clamp(0.42 + dev/(bSpread*3 + 5), 0, 1);
}

function bakedBass(){
  var t = TRACKS[cur];
  if (!audio || !t.dur) return 0;
  bandsOf(t);
  var u = clamp(audio.currentTime / t.dur, 0, 0.9999);
  var bi = u*(t.nb[0].length-1), i0 = Math.floor(bi), f = bi-i0;
  var bass = lerp(t.nb[0][i0], t.nb[0][Math.min(i0+1,255)], f);
  var pi = u*(t.pk.length-1), p0 = Math.floor(pi);
  var pk = lerp(t.pk[p0], t.pk[Math.min(p0+1,t.pk.length-1)], pi-p0)/255;
  return clamp(bass*0.80 + pk*0.34 - 0.10, 0, 1);
}

/* ---------------- state ---------------- */

function setPlaying(v){
  if (playing === v) return;
  playing = v;
  // paper (light) is the RESTING state; the plate goes dark when it plays
  document.documentElement.classList.toggle('paper', !v);
  document.documentElement.classList.toggle('playing', v);
  var gp = document.getElementById('gp');
  gp.setAttribute('d', v ? 'M0 0 H4.4 V15 H0 Z M8.6 0 H13 V15 H8.6 Z' : 'M0 0 L13 7.5 L0 15 Z');
  var t = TRACKS[cur];
  drawField(audio && t && t.dur ? clamp(audio.currentTime/t.dur, 0, 1) : 0);
}

function toggle(){
  ensureAudio();
  var want = AUDIO_BASE + encodeURIComponent(TRACKS[cur].file);
  if (audio.getAttribute('src') !== want){ play(); return; }
  // A scrub can load the src before the first play, so this branch is now
  // reachable on a cold start — wire the analyser here too or the type never
  // answers the bass.
  if (audio.paused) {
    wireAnalyser();
    if (actx && actx.state === 'suspended') actx.resume();
    audio.play();
    slam = 1;
  }
  else audio.pause();
}

function play(){
  ensureAudio();
  wireAnalyser();
  if (actx && actx.state === 'suspended') actx.resume();
  var t = TRACKS[cur];
  var want = AUDIO_BASE + encodeURIComponent(t.file);
  if (audio.getAttribute('src') !== want){
    switching = true;
    setTimeout(function(){ switching = false; }, 900);
    audio.setAttribute('src', want); audio.load();
  }
  bInit = false;
  var pr = audio.play();
  if (pr && pr.catch) pr.catch(function(){});
  slam = 1;
}

function stamp(){
  var bar = document.getElementById('bar');
  bar.classList.remove('go'); void bar.offsetWidth; bar.classList.add('go');
  var wrap = document.getElementById('typewrap');
  wrap.classList.add('shut');
  setTimeout(function(){
    render();
    wrap.classList.remove('shut');
    slam = 1;
    for (var i=0;i<hist.length;i++) hist[i] = 1;
  }, 100);
}

var lock = 0;
function go(step, autoplay){
  var now = performance.now();
  if (now - lock < 260) return;
  lock = now;
  cur = (cur + step + TRACKS.length) % TRACKS.length;
  stamp();
  if (autoplay || playing) setTimeout(play, 110);
}

function jump(i){
  if (i === cur){ closeIndex(); play(); return; }
  cur = i; closeIndex(); stamp(); setTimeout(play, 110);
}

function render(){
  var t = TRACKS[cur];
  document.documentElement.style.setProperty('--ink', t.ink);
  if (t.plate) document.documentElement.style.setProperty('--plate', t.plate);
  if (t.bone)  document.documentElement.style.setProperty('--bone', t.bone);
  // the tab carries the record, not the prototype's codename
  document.title = (t.title ? t.title + ' — ' : '') + SITE_TITLE;
  document.getElementById('pos').innerHTML =
    ('0'+(cur+1)).slice(-2) + '<span class="cnt">/' + ('0'+TRACKS.length).slice(-2) + '</span>';
  document.getElementById('yrbtn').textContent = t.date ? t.date.slice(0,4) : '——';
  document.getElementById('f-date').textContent = t.date || '';
  document.getElementById('f-bpm').textContent = t.bpm + ' BPM';
  document.getElementById('f-dur').textContent = mmss(t.dur);
  document.documentElement.style.setProperty('--fieldmin', fieldMin().toFixed(1) + 'px');
  typeset(t);
  seatField();
  sizeCanvas();
  drawField(playing && audio && t.dur ? clamp(audio.currentTime/t.dur,0,1) : 0);
  idxRows.forEach(function(r,i){ r.classList.toggle('on', i === cur); });
}

/* ---------------- index overlay ---------------- */

function buildIndex(){
  var host = document.getElementById('idxscroll');
  var groups = {}, order = [];
  TRACKS.forEach(function(t,i){
    var y = t.date ? t.date.slice(0,4) : 'UNDATED';
    if (!groups[y]){ groups[y] = []; order.push(y); }
    groups[y].push(i);
  });
  order.sort(function(a,b){
    if (a === 'UNDATED') return 1;
    if (b === 'UNDATED') return -1;
    return b.localeCompare(a);
  });
  order.forEach(function(y){
    var g = document.createElement('div'); g.className = 'grp'; g.dataset.year = y;
    var h = document.createElement('div'); h.className = 'yr';
    h.innerHTML = '<span></span><i></i>';
    h.firstChild.textContent = y;
    h.lastChild.textContent = ('0'+groups[y].length).slice(-2);
    g.appendChild(h);
    var rows = document.createElement('div'); rows.className = 'rows';
    g.appendChild(rows);
    groups[y].forEach(function(i){
      var t = TRACKS[i];
      var b = document.createElement('button');
      b.className = 'row';
      b.innerHTML = '<span class="n"></span><span class="t"></span><span class="bpm"></span><span class="d"></span>';
      b.querySelector('.n').textContent = ('0'+(i+1)).slice(-2);
      var tt = b.querySelector('.t');
      tt.textContent = t.title.toUpperCase();
      tt.style.fontVariationSettings = "'wght' " + t.idxW + ", 'wdth' " + t.idxD;
      b.querySelector('.bpm').innerHTML = t.bpm + '<i>bpm</i>';
      b.querySelector('.d').textContent = mmss(t.dur);
      b.addEventListener('click', function(){ jump(i); });
      rows.appendChild(b);
      idxRows[i] = b;
    });
    host.appendChild(g);
  });
}

function openIndex(){
  idxOpen = true;
  document.documentElement.classList.add('idx');
  var t = TRACKS[cur], y = t.date ? t.date.slice(0,4) : 'UNDATED';
  var g = document.querySelector('.grp[data-year="' + y + '"]');
  var sc = document.getElementById('idxscroll');
  if (g) sc.scrollTop = Math.max(0, g.offsetTop - sc.offsetTop - 40);
}
function closeIndex(){ idxOpen = false; document.documentElement.classList.remove('idx'); }

/* ---------------- loop ---------------- */

var lastW = 0, lastH = 0, lastFm = '';
function relayout(){
  var t = TRACKS[cur];
  if (!t) return;
  var fm = fieldMin().toFixed(1) + 'px';
  if (fm !== lastFm){ lastFm = fm; document.documentElement.style.setProperty('--fieldmin', fm); }
  var el = document.getElementById('typewrap');
  if (Math.abs(el.clientWidth - lastW) < 2 && Math.abs(el.clientHeight - lastH) < 2) return;
  lastW = el.clientWidth; lastH = el.clientHeight;
  typeset(t);
  seatField();
  sizeCanvas();
  drawField(playing && audio && t.dur ? clamp(audio.currentTime/t.dur,0,1) : 0);
}

var tick = 0, fontOK = false;
function frame(){
  if ((tick++ % 12) === 0){
    if (!fontOK && TRACKS.length && fontLive()){ fontOK = true; lastW = lastH = 0; }
    relayout();
  }
  var t = TRACKS[cur];
  var live = playing && audio && !audio.paused;
  var raw = 0;
  if (live){
    var lv = liveBass();
    raw = lv >= 0 ? lv : bakedBass();
  }
  env += (raw - env) * (raw > env ? 0.45 : 0.09);
  envSlow += (raw - envSlow) * (raw > envSlow ? 0.12 : 0.055);
  var p = Math.pow(clamp(env*0.68 + envSlow*0.32, 0, 1), 0.9);
  var bias = t ? t.bias : 0.2;
  var e = live ? clamp(bias*0.5 + p*0.94, 0, 1) : bias;
  slam *= 0.90;
  if (slam > 0.002) e = clamp(e + slam*(1 - e), 0, 1);

  hist.push(e); if (hist.length > 24) hist.shift();
  applyPressure(e, false);
  drawBG(clamp(live ? e : e * 0.45, 0, 1));

  if (audio && t && t.dur){
    var pr = clamp(audio.currentTime / t.dur, 0, 1);
    document.getElementById('head').style.transform = 'translateX(' + (pr*window.innerWidth) + 'px)';
    document.getElementById('clock').textContent = playing ? mmss(audio.currentTime) + ' / ' + mmss(t.dur) : mmss(t.dur);
    if (playing) drawField(pr);
  }
  requestAnimationFrame(frame);
}

/* ---------------- input ---------------- */

function boot(){
  measReady();
  sizeCanvas();
  document.getElementById('palname').textContent = PALETTES[pal].name;
  document.documentElement.classList.add('paper');   // rests on paper, darkens to play
  initBG();

  // the mark needs no webfont, so it goes up first; the type waits until
  // Archivo is genuinely rendering, or gives up and uses the fallback metrics.
  document.documentElement.style.setProperty('--fieldmin', fieldMin().toFixed(1) + 'px');
  sizeCanvas(); drawField(0);

  var again = function(){ lastW = lastH = 0; render(); };
  var t0 = Date.now();
  (function poll(){
    if (fontLive() || Date.now() - t0 > 4000){ fontOK = fontLive(); again(); }
    else setTimeout(poll, 50);
  })();
  if (document.fonts){
    if (document.fonts.load) document.fonts.load("400 100px Archivo").then(again, again);
    if (document.fonts.addEventListener) document.fonts.addEventListener('loadingdone', again);
  }

  var rt;
  window.addEventListener('resize', function(){ clearTimeout(rt); rt = setTimeout(relayout, 110); });
  if (window.ResizeObserver){
    new ResizeObserver(function(){ clearTimeout(rt); rt = setTimeout(relayout, 60); })
      .observe(document.getElementById('typewrap'));
  }

  var acc = 0, wlock = 0;
  window.addEventListener('wheel', function(ev){
    if (idxOpen) return;
    ev.preventDefault();
    var now = performance.now();
    if (now - wlock < 300){ return; }
    acc += ev.deltaY;
    if (Math.abs(acc) > 48){ wlock = now; go(acc > 0 ? 1 : -1); acc = 0; }
  }, { passive:false });

  // Axis-locked drag: vertical past 44px changes track (unchanged), horizontal
  // scrubs the song. The head already spans the viewport as 0..100% of the
  // track, so dragging across the sheet IS the timeline — no extra chrome.
  var ty = 0, tx = 0, tt = 0, axis = 0, scrubbed = false, swallowClick = false;
  var SLOP = 10;

  // Duration comes from marks.json, so the scrub maths is correct even before
  // the file has loaded a single byte.
  function paintSeek(u, t){
    document.getElementById('head').style.transform = 'translateX(' + (u*window.innerWidth) + 'px)';
    document.getElementById('clock').textContent = mmss(u*t.dur) + ' / ' + mmss(t.dur);
    drawField(u);
  }
  function seekToClientX(x){
    var t = TRACKS[cur];
    if (!t || !t.dur) return;
    ensureLoaded();
    var u = clamp(x / window.innerWidth, 0, 0.9995);
    seekSafe(u * t.dur);
    paintSeek(u, t);
  }
  function nudge(sec){
    var t = TRACKS[cur];
    if (!t || !t.dur) return;
    ensureLoaded();
    var at = (audio && audio.readyState >= 1) ? audio.currentTime
           : (pendingSeek >= 0 ? pendingSeek : 0);
    var to = clamp(at + sec, 0, t.dur - 0.05);
    seekSafe(to);
    paintSeek(clamp(to / t.dur, 0, 1), t);
  }
  function endScrub(){
    if (!axis) return;
    if (axis === 1){
      document.documentElement.classList.remove('scrub');
      // a scrub on a paused track leaves it paused, at the new position
    }
    axis = 0;
  }

  window.addEventListener('touchstart', function(ev){
    if (idxOpen) return;
    ty = ev.touches[0].clientY; tx = ev.touches[0].clientX;
    tt = performance.now(); axis = 0; scrubbed = false;
  }, { passive:true });

  window.addEventListener('touchmove', function(ev){
    if (idxOpen) return;
    var dx = ev.touches[0].clientX - tx, dy = ev.touches[0].clientY - ty;
    if (!axis){
      if (Math.abs(dx) > SLOP && Math.abs(dx) > Math.abs(dy)){
        axis = 1;
        ensureAudio();
        document.documentElement.classList.add('scrub');
      } else if (Math.abs(dy) > SLOP){
        axis = 2;
      }
    }
    if (axis === 1){
      scrubbed = true;
      if (ev.cancelable) ev.preventDefault();
      seekToClientX(ev.touches[0].clientX);
    }
  }, { passive:false });

  window.addEventListener('touchend', function(ev){
    if (idxOpen) return;
    var ct = ev.changedTouches[0];
    var dy = ct.clientY - ty, dx = ct.clientX - tx;
    if (axis === 1){ endScrub(); swallowClick = true; return; }
    endScrub();
    if (Math.abs(dy) > 44 && performance.now() - tt < 700){
      go(dy < 0 ? 1 : -1); swallowClick = true; return;
    }
    // A real tap: act HERE, inside the touch gesture. We used to wait for the
    // synthetic click, but touchmove calls preventDefault() for scrubbing and
    // `touch-action:none` is set, which can cancel that click outright — so on
    // a phone the first taps did nothing and audio never got its unlock
    // gesture. Buttons are excluded; they have their own handlers.
    if (Math.abs(dx) < 10 && Math.abs(dy) < 10 && performance.now() - tt < 600){
      var onBtn = ev.target && ev.target.closest && ev.target.closest('button');
      if (!onBtn){ toggle(); swallowClick = true; }
    }
  }, { passive:true });

  // desktop: press and drag across the sheet to scrub
  var mdown = false, mx = 0;
  document.getElementById('sheet').addEventListener('pointerdown', function(ev){
    if (idxOpen || ev.pointerType === 'touch') return;
    mdown = true; mx = ev.clientX; scrubbed = false;
  });
  window.addEventListener('pointermove', function(ev){
    if (!mdown || idxOpen || ev.pointerType === 'touch') return;
    if (!scrubbed && Math.abs(ev.clientX - mx) < SLOP) return;
    if (!scrubbed){ scrubbed = true; ensureAudio(); document.documentElement.classList.add('scrub'); }
    seekToClientX(ev.clientX);
  });
  window.addEventListener('pointerup', function(ev){
    if (ev.pointerType === 'touch') return;
    mdown = false;
    if (scrubbed) document.documentElement.classList.remove('scrub');
  });

  window.addEventListener('keydown', function(ev){
    var k = ev.key;
    if (k === 'Escape'){ closeIndex(); return; }
    if (idxOpen && k !== 'i') return;
    if (k === ' '){ ev.preventDefault(); toggle(); }
    else if (k === 'ArrowDown' || k === 'j'){ ev.preventDefault(); go(1); }
    else if (k === 'ArrowUp' || k === 'k'){ ev.preventDefault(); go(-1); }
    else if (k === 'ArrowLeft'){ ev.preventDefault(); nudge(ev.shiftKey ? -30 : -5); }
    else if (k === 'ArrowRight'){ ev.preventDefault(); nudge(ev.shiftKey ? 30 : 5); }
    else if (k === 'c' || k === 'C'){ cyclePalette(ev.shiftKey ? -1 : 1); }
    else if (k === 'i'){ idxOpen ? closeIndex() : openIndex(); }
  });

  document.getElementById('transport').addEventListener('click', function(ev){ ev.stopPropagation(); toggle(); });
  document.getElementById('pos').addEventListener('click', function(ev){ ev.stopPropagation(); openIndex(); });
  document.getElementById('yrbtn').addEventListener('click', function(ev){ ev.stopPropagation(); openIndex(); });
  document.getElementById('idxclose').addEventListener('click', closeIndex);
  document.getElementById('palname').addEventListener('click', function(ev){ ev.stopPropagation(); cyclePalette(1); });
  // a drag that scrubbed must not also count as the click that toggles play
  document.getElementById('sheet').addEventListener('click', function(){
    if (idxOpen) return;
    if (swallowClick){ swallowClick = false; return; }   // touchend already handled it
    if (scrubbed){ scrubbed = false; return; }
    toggle();
  });

  requestAnimationFrame(frame);

  // entrance: the plate takes its first impression
  setTimeout(function(){
    var bar = document.getElementById('bar');
    bar.classList.add('go');
    slam = 1;
  }, 260);
}

})();
</script>
</body>
