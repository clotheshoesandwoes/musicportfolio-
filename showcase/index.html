);\n  float ww = w0*(1.0 + 0.85*step(0.80, lw.y));\n  float wn = w0*(1.0 + 0.85*step(0.80, ln.y));\n  float ws = w0*(1.0 + 0.85*step(0.80, ls.y));\n\n  /* two legs meet over a 45-degree chamfer; three or more meet on a via */\n  float deg  = pe + pn + pw + ps;\n  float chOn = step(1.5, deg)*step(deg, 2.5);\n  float c    = 0.30*chOn;\n  float wh   = max(max(we*pe, wn*pn), max(ww*pw, ws*ps));\n\n  float aa  = 0.024;\n  float cov = 0.0;\n  float dh  = 9.0;\n  float dv  = 9.0;\n  float d;\n\n  d = circuit_seg(f, vec2(0.5, 0.0), vec2(c, 0.0));\n  cov = max(cov, pe*(1.0 - smoothstep(we - aa, we + aa, d)));\n  dh  = min(dh, d - we + (1.0 - pe)*9.0);\n\n  d = circuit_seg(f, vec2(-0.5, 0.0), vec2(-c, 0.0));\n  cov = max(cov, pw*(1.0 - smoothstep(ww - aa, ww + aa, d)));\n  dh  = min(dh, d - ww + (1.0 - pw)*9.0);\n\n  d = circuit_seg(f, vec2(0.0, 0.5), vec2(0.0, c));\n  cov = max(cov, pn*(1.0 - smoothstep(wn - aa, wn + aa, d)));\n  dv  = min(dv, d - wn + (1.0 - pn)*9.0);\n\n  d = circuit_seg(f, vec2(0.0, -0.5), vec2(0.0, -c));\n  cov = max(cov, ps*(1.0 - smoothstep(ws - aa, ws + aa, d)));\n  dv  = min(dv, d - ws + (1.0 - ps)*9.0);\n\n  float dm = min(dh, dv);\n\n  vec2 dA = vec2(0.0);\n  vec2 dB = vec2(0.0);\n  float k = 0.0;\n  if (pe > 0.5){ dA = vec2( 1.0,  0.0); k = 1.0; }\n  if (pn > 0.5){ if (k < 0.5) dA = vec2( 0.0,  1.0); else dB = vec2( 0.0,  1.0); k += 1.0; }\n  if (pw > 0.5){ if (k < 0.5) dA = vec2(-1.0,  0.0); else dB = vec2(-1.0,  0.0); k += 1.0; }\n  if (ps > 0.5){ if (k < 0.5) dA = vec2( 0.0, -1.0); else dB = vec2( 0.0, -1.0); k += 1.0; }\n\n  d = circuit_seg(f, dA*c, dB*c) - wh;\n  cov = max(cov, chOn*(1.0 - smoothstep(-aa, aa, d)));\n  dm  = min(dm, d + (1.0 - chOn)*9.0);\n\n  vec3  hc   = circuit_h33(vec2(id.x + 0.31, id.y + 0.77), sk + 3.9);\n  float hcw  = fract(hc.x*7.31 + hc.y*3.17);\n  float lone = step(deg, 0.5);\n  float padOn = step(2.5, deg)                                 /* junction */\n              + step(deg, 1.5)*(1.0 - lone)*step(0.34, hcw)    /* some ends land on a pad */\n              + lone*step(0.62, hc.x);                         /* stitching vias in the bare field */\n  float rp = mix(max(w0*1.90, wh*1.75) + 0.015, 0.098, lone);\n\n  d = circuit_oct(f, rp);\n  cov = max(cov, padOn*(1.0 - smoothstep(-aa, aa, d)));\n  dm  = min(dm, d + (1.0 - padOn)*9.0);\n\n  /* drilled vias */\n  float rh = rp*(0.34 + 0.12*hc.z);\n  cov *= 1.0 - padOn*step(0.40, hc.y)*(1.0 - smoothstep(rh - aa, rh + aa, length(f)));\n\n  /* bare cells keep a drill mark, so the plate never goes blank */\n  float fid = lone*(1.0 - step(0.62, hc.x))*(1.0 - smoothstep(0.030, 0.052, length(f)));\n  cov = max(cov, fid*(0.26 + 0.30*treb));\n\n  /* the signal. phase runs along the trace's own axis and is offset per row and\n     per column, so a packet stays whole down the length of a run while no two\n     runs are ever in step. every pixel takes the phase of the leg it sits on,\n     so the handover happens at the corner, under the chamfer or the via */\n  float sgx  = mix(-1.0, 1.0, step(0.5, sb.z));\n  float sgy  = mix(-1.0, 1.0, step(0.5, sa.z));\n  float K    = 0.26 + 0.10*sb.y;\n  float rate = 0.55 + 1.25*bpm;\n  float rph  = circuit_h11(vec2(id.y, 4.10), sk + 31.0);\n  float cph  = circuit_h11(vec2(id.x, 8.30), sk + 47.0);\n  float dec  = 4.2 + 4.0*treb + 2.0*crs;\n\n  float sH = fract(t*rate - p.x*K*sgx - rph);\n  float sV = fract(t*rate - p.y*K*sgy - cph);\n  float pH = smoothstep(0.0, 0.030, sH)*exp(-sH*dec);\n  float pV = smoothstep(0.0, 0.030, sV)*exp(-sV*dec);\n  float pls = mix(pH, pV, smoothstep(-0.05, 0.05, dh - dv));\n  float pamp = pls*(0.46 + 0.54*L);\n\n  float base = 0.68 + 0.09*mid;\n  float ink  = cov*(base + (1.0 - base)*pamp);\n\n  /* ink bleed at the edge of the copper, a little wetter under a signal */\n  float bleed = exp(-max(dm, 0.0)*24.0)*(0.05 + 0.28*pamp);\n  ink = 1.0 - (1.0 - ink)*(1.0 - clamp(bleed, 0.0, 1.0));\n\n  return clamp(ink, 0.0, 1.0);\n}\n/* ---- FLOCK : a murmuration. small marks sit on a lattice in the flock's own\n   frame, and that frame is carried by a closed-form flow field -- so the body\n   wheels, packs into knots where the flow compresses, and thins where it\n   opens out. no simulation, but the density behaves like one. ---- */\n\nvec3 flock_h33(vec2 p, float s){\n  vec3 q = fract(vec3(p.x, p.y, p.x*0.53 + p.y*0.29 + s)*vec3(0.1031, 0.1030, 0.0973));\n  q += dot(q, q.yxz + 33.33);\n  return fract((q.xxy + q.yxx)*q.zyx);\n}\n\nfloat flock_h11(float n){\n  return fract(sin(n*91.7 + 13.1)*43758.5453);\n}\n\n/* heading of the whole body: a slow lean, plus a startle that snaps and decays */\nfloat flock_wheel(float t, float sq, float hand, float bpm, float kick){\n  float jr = 0.17 + 0.24*bpm;\n  float jt = t*jr + sq*3.7;\n  float jc = floor(jt);\n  float jp = jt - jc;\n  float jd = flock_h11(mod(jc, 89.0)*1.37 + sq*11.0)*2.0 - 1.0;\n  return t*(0.055 + 0.085*bpm)*hand\n       + 0.40*sin(t*0.037 + sq*6.2831853)\n       + kick*jd*smoothstep(0.0, 0.16, jp)*exp(-4.2*jp);\n}\n\n/* one bird: distance to a segment of half-length hl lying along +x */\nfloat flock_mark(vec2 e, float hl){\n  e.x -= clamp(e.x, -hl, hl);\n  return sqrt(dot(e, e) + 1.0e-9);\n}\n\nfloat scene_FLOCK(vec2 uv, float t, float lvl, float sd, float bpmN, float crestN, float onsetN, vec3 b0, vec3 b1){\n  float lv   = clamp(lvl, 0.0, 1.0);\n  float sq   = clamp(sd, 0.0, 1.0);\n  float bpm  = clamp(bpmN, 0.0, 1.0);\n  float crs  = clamp(crestN, 0.0, 1.0);\n  float ons  = clamp(onsetN, 0.0, 1.0);\n  float bass = clamp(b0.x*0.60 + b0.y*0.40 - 0.20, 0.0, 1.0);\n  float mdb  = clamp(b0.z*0.50 + b1.x*0.50 - 0.20, 0.0, 1.0);\n  float treb = clamp(b1.y*0.45 + b1.z*0.55 - 0.20, 0.0, 1.0);\n  float sa   = sq*6.2831853;\n  float hand = mix(-1.0, 1.0, step(0.5, fract(sq*7.31)));\n\n  /* the body turns; the turn rate is what banks every mark at once */\n  float kick = 0.10 + 0.26*lv*(0.30 + 0.70*crs);\n  float wh0 = flock_wheel(t, sq, hand, bpm, kick);\n  float whR = clamp((flock_wheel(t + 0.07, sq, hand, bpm, kick) - wh0)*14.2857, -1.7, 1.7);\n\n  /* travel: the integral of a slowly turning unit heading, bounded for all t */\n  float dw = 0.043;\n  float da = t*dw + sa;\n  float sp0 = 0.085 + 0.055*bpm;\n  vec2 drift  = vec2(sin(da), -cos(da))*(sp0/dw);\n  vec2 driftV = vec2(cos(da), sin(da))*sp0;\n\n  float cw = cos(wh0), sw = sin(wh0);\n  vec2 P0 = vec2(cw*uv.x - sw*uv.y, sw*uv.x + cw*uv.y);\n  vec2 p  = P0 + drift;\n\n  /* three travelling shear waves. each shear direction sits a little off\n     perpendicular to its own wave vector, and that offset breathes -- it is the\n     only reason the field ever compresses, and compression is what packs a knot */\n  float a1 = sa*1.7 + 0.60;\n  float a2 = sa*2.9 + 2.35;\n  float a3 = sa*4.3 + 4.10;\n  vec2 k1 = vec2(cos(a1), sin(a1))*(2.55 + 0.95*sq);\n  vec2 k2 = vec2(cos(a2), sin(a2))*(3.70 + 1.60*sq);\n  vec2 k3 = vec2(cos(a3), sin(a3))*(9.50 + 3.00*sq);\n\n  float tw = 0.34*sin(t*0.061 + sa) + 0.16*ons;\n  vec2 u1 = vec2(cos(a1 + 1.5708 + tw),      sin(a1 + 1.5708 + tw));\n  vec2 u2 = vec2(cos(a2 + 1.5708 - tw*0.80), sin(a2 + 1.5708 - tw*0.80));\n  vec2 u3 = vec2(cos(a3 + 1.5708 + tw*1.40), sin(a3 + 1.5708 + tw*1.40));\n\n  float A1 = (0.118 + 0.026*sq)*(1.0 + 0.30*bass);\n  float A2 = (0.052 + 0.012*sq)*(1.0 + 0.35*mdb);\n  float A3 = (0.017 + 0.005*sq)*(1.0 + 0.55*treb + 0.40*ons);\n  float w1 =  0.90*hand;\n  float w2 = -1.35*hand;\n  float w3 =  2.10*hand;\n\n  float t1 = dot(p, k1) + t*w1 + sa*2.0;\n  float t2 = dot(p, k2) + t*w2 + sa*5.0;\n  float c1 = cos(t1), s1 = sin(t1);\n  float c2 = cos(t2), s2 = sin(t2);\n  vec2 D12 = u1*(A1*s1) + u2*(A2*s2);\n  vec2 V12 = u1*(A1*w1*c1) + u2*(A2*w2*c2);\n\n  /* the fine wave rides on the coarse pair, so the detail curls with the body */\n  float t3 = dot(p + D12*1.30, k3) + t*w3 + sa*9.0;\n  float r3 = dot(V12*1.30, k3) + w3;\n  float c3 = cos(t3), s3 = sin(t3);\n  vec2 Dd = D12 + u3*(A3*s3);\n  vec2 Vv = V12 + u3*(A3*c3*r3);\n\n  /* local area change of the same field: >1 packed, <1 opened out */\n  float q1 = A1*c1, q2 = A2*c2, q3 = A3*c3;\n  float m00 = q1*u1.x*k1.x + q2*u2.x*k2.x + q3*u3.x*k3.x;\n  float m01 = q1*u1.x*k1.y + q2*u2.x*k2.y + q3*u3.x*k3.y;\n  float m10 = q1*u1.y*k1.x + q2*u2.y*k2.x + q3*u3.y*k3.x;\n  float m11 = q1*u1.y*k1.y + q2*u2.y*k2.y + q3*u3.y*k3.y;\n  float det = clamp((1.0 - m00)*(1.0 - m11) - m01*m10, 0.34, 2.10);\n\n  /* screen velocity of a bird held at a fixed place in the flock's frame */\n  vec2 vel = Vv - driftV - (whR*0.50)*vec2(-P0.y, P0.x);\n  float vq = dot(vel, vel);\n  vec2 nv = mix(vec2(1.0, 0.0), vel*inversesqrt(max(vq, 1.0e-12)), step(1.0e-7, vq));\n  vec2 pv = vec2(-nv.y, nv.x);\n  float spd = clamp(sqrt(vq)*3.0, 0.0, 1.4);\n\n  float S  = 22.0 + 12.0*sq;\n  float sc = S*sqrt(det);\n  vec2 q  = p - Dd;\n  vec2 g  = q*S;\n  vec2 gid = floor(g);\n  vec2 gf  = g - gid;\n\n  /* where the body goes thin. read off a harder-warped copy of the same field so\n     the holes drift through the flock instead of travelling with it */\n  vec2 pd = p + Dd*2.40;\n  float ka = sa*3.3 + 1.10;\n  float kb = sa*1.9 + 3.90;\n  float wa = sin(dot(pd, vec2(cos(ka), sin(ka))*2.05) + t*0.55);\n  float wb = sin(dot(pd, vec2(cos(kb), sin(kb))*3.10) - t*0.41);\n  float wisp = wa*0.60 + wb*0.40 + wa*wb*0.35;\n  float thr = clamp(0.18 + 0.36*wisp - 0.85*(det - 1.0) - 0.12*lv, 0.02, 0.86);\n\n  float aa = 0.0013*sc + 0.003;\n\n  float ink = 0.0;\n  for (int j = 0; j < 3; j++){\n    for (int i = 0; i < 3; i++){\n      vec2 o = vec2(float(i) - 1.0, float(j) - 1.0);\n      vec3 h = flock_h33(gid + o, 5.0 + sq*29.0);\n      float hs = fract(h.x*17.31 + h.z*5.77);\n      float hb = fract(h.y*23.19 + h.x*3.13);\n      float hd = fract(h.z*11.71 + h.y*7.37);\n\n      vec2 e = gf - (o + vec2(0.10) + h.xy*0.80);\n\n      /* every bird holds the body's heading, off by a few degrees of its own.\n         a startle throws that spread wide open */\n      vec2 dir = nv + pv*((hd - 0.5)*(0.42 + 0.75*ons + 0.55*lv));\n      dir *= inversesqrt(dot(dir, dir));\n      vec2 el = vec2(dot(e, dir), e.y*dir.x - e.x*dir.y);\n\n      /* marks hold their size on the page, not in the flock's frame -- so a\n         compressed patch means more birds, not bigger ones */\n      float sz  = 0.55 + 0.85*hb;\n      float rad = min(0.0065*sc*sz, 0.22);\n      float hl  = min(0.0120*sc*sz*(0.68 + 0.50*spd)*(1.22 - 0.22*det), 0.62);\n      float m = (1.0 - smoothstep(rad - aa, rad + aa, flock_mark(el, hl)))*step(thr, hs);\n      ink = max(ink, m*(0.50 + 0.50*hb));\n    }\n  }\n\n  return clamp(ink, 0.0, 1.0);\n}\n/* ---- FRACTURE : a plate breaking. runs leave an impact in straight angular\n   segments, fork as they go, and the tips advance, hold, then snap shut ---- */\n\nvec3 fracture_h3(vec3 v){\n  vec3 q = fract(v * vec3(0.1031, 0.1030, 0.0973));\n  q += dot(q, q.yzx + 33.33);\n  return fract((q.xxy + q.yzz) * q.zyx);\n}\n\nvec2 fracture_rot(vec2 p, float a){\n  float c = cos(a);\n  float s = sin(a);\n  return vec2(c * p.x - s * p.y, s * p.x + c * p.y);\n}\n\n/* the run from (0,0) to (0,h): distance to it, and how far along it we are */\nvec2 fracture_run(vec2 p, float h){\n  float u = clamp(p.y / max(h, 1.0e-4), 0.0, 1.0);\n  vec2 d = p - vec2(0.0, u * h);\n  return vec2(length(d), u);\n}\n\nfloat fracture_chord(vec2 p, vec2 a, vec2 b){\n  vec2 pa = p - a;\n  vec2 ba = b - a;\n  float u = clamp(dot(pa, ba) / max(dot(ba, ba), 1.0e-6), 0.0, 1.0);\n  return length(pa - ba * u);\n}\n\nfloat scene_FRACTURE(vec2 uv, float t, float lvl, float sd, float bpmN, float crestN, float onsetN, vec3 b0, vec3 b1){\n  float L    = clamp(lvl, 0.0, 1.0);\n  float sq   = clamp(sd, 0.0, 1.0);\n  float bpm  = clamp(bpmN, 0.0, 1.0);\n  float crs  = clamp(crestN, 0.0, 1.0);\n  float ons  = clamp(onsetN, 0.0, 1.0);\n  float bass = clamp(b0.x * 0.60 + b0.y * 0.40 - 0.22, 0.0, 1.0);\n  float mid  = clamp(b0.z * 0.50 + b1.x * 0.50 - 0.22, 0.0, 1.0);\n  float treb = clamp(b1.y * 0.45 + b1.z * 0.55 - 0.22, 0.0, 1.0);\n\n  float jag p(0.5, ks.x));\n        ink = max(ink, (1.0 - smoothstep(chw * 0.72, chw * 0.72 + aa, fracture_chord(pw, C2, mix(C2, D2, gr2))))\n                       * step(0.004, gr2) * rg2 * 0.66);\n      }\n    }\n  }\n\n  return clamp(ink, 0.0, 1.0);\n}\nfloat caustic_h11(float n){\n  return fract(sin(n * 12.9898 + 4.1414) * 43758.5453);\n}\n\nvoid caustic_wave(inout vec3 hess, vec2 pw, vec2 dir, float kw, float ph, float bnd, float amp){\n  float s = sin(dot(dir, pw) * kw + ph + bnd) * amp;\n  hess.x += s * dir.x * dir.x;\n  hess.y += s * dir.y * dir.y;\n  hess.z += s * dir.x * dir.y;\n}\n\nfloat scene_CAUSTIC(vec2 uv, float t, float lvl, float sd, float bpmN, float crestN, float onsetN, vec3 b0, vec3 b1){\n  float lv   = clamp(lvl, 0.0, 1.0);\n  float bass = clamp((b0.x + b0.y + b0.z) * 0.333 - 0.2, 0.0, 1.0);\n  float air  = clamp((b1.x + b1.y + b1.z) * 0.333 - 0.2, 0.0, 1.0);\n  float tw   = mod(max(t, 0.0), 4096.0);\n  float spd  = 0.45 + 0.95 * clamp(bpmN, 0.0, 1.0);\n  float swl  = 0.5 + 0.5 * sin(tw * 0.13 + sd * 6.28318);\n\n  float sclv = 29.0 + 9.0 * (sd - 0.5);\n  vec2  pw   = uv * sclv + vec2(sin(tw * 0.071 + sd * 4.1), cos(tw * 0.063 + sd * 7.7)) * 1.8;\n\n  float wLow = 0.50 + 0.16 * bass + 0.06 * swl;\n  float wHi  = 0.13 + 0.16 * air;\n\n  vec3 hess = vec3(0.0);\n  for (int i = 0; i < 6; i++){\n    float fi  = float(i);\n    float hif = step(3.5, fi);\n    float h0  = caustic_h11(fi * 3.7 + sd * 17.0);\n    float h1  = fract(h0 * 7.13);\n    float h2  = fract(h0 * 31.79);\n    float ang = 6.28318 * (fi * 0.1837 + sd * 0.71 + 0.17 * h2);\n    vec2  dir = vec2(cos(ang), sin(ang));\n    float kw  = mix(0.80 + 0.55 * h1, 2.35 + 0.55 * h2, hif);\n    float sgn = mix(-1.0, 1.0, step(0.5, h0));\n    float om  = spd * mix(0.72 + 0.55 * h1, 1.9, hif) * sgn;\n    float ph  = om * tw + 6.28318 * h2;\n    float bnd = 1.2 * sin(dot(vec2(-dir.y, dir.x), pw) * (0.17 * kw) + tw * (0.21 + 0.07 * fi) * sgn);\n    caustic_wave(hess, pw, dir, kw, ph, bnd, mix(wLow, wHi, hif));\ function initBG(){
  bgCv=document.getElementById('bg');
  try{ bgGL=bgCv.getContext('webgl',{alpha:true,antialias:false,depth:false,premultipliedAlpha:true}); }catch(e){}
  if(!bgGL){ bgFail=true; bgCv.style.display='none'; return; }
  var g=bgGL;
  var mk=function(ty,src){ var s=g.createShader(ty); g.shaderSource(s,src); g.compileShader(s);
    if(!g.getShaderParameter(s,g.COMPILE_STATUS)){ console.warn('[bg]',g.getShaderInfoLog(s)); return null; } return s; };
  var vs=mk(g.VERTEX_SHADER,BGV), fs=mk(g.FRAGMENT_SHADER,BGF);
  if(!vs||!fs){ bgFail=true; bgCv.style.display='none'; return; }
  bgProg=g.createProgram(); g.attachShader(bgProg,vs); g.attachShader(bgProg,fs); g.linkProgram(bgProg);
  if(!g.getProgramParameter(bgProg,g.LINK_STATUS)){ bgFail=true; bgCv.style.display='none'; return; }
  g.useProgram(bgProg);
  var buf=g.createBuffer(); g.bindBuffer(g.ARRAY_BUFFER,buf);
  g.bufferData(g.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),g.STATIC_DRAW);
  var loc=g.getAttribLocation(bgProg,'p'); g.enableVertexAttribArray(loc);
  g.vertexAttribPointer(loc,2,g.FLOAT,false,0,0);
  ['uRes','uTime','uLevel','uSeed','uBpm','uCrest','uOnset','uInk','uMode'].forEach(function(n){ bgU[n]=g.getUniformLocation(bgProg,n); });
  bgU.uB=g.getUniformLocation(bgProg,'uB[0]');
  g.enable(g.BLEND); g.blendFunc(g.ONE,g.ONE_MINUS_SRC_ALPHA);
  bgT0=performance.now();
  sizeBG();
}
function sizeBG(){
  if(!bgGL||!bgCv) return;
  var d=Math.min(window.devicePixelRatio||1,1.35);
  var w=Math.max(1,Math.round(bgCv.clientWidth*d)), h=Math.max(1,Math.round(bgCv.clientHeight*d));
  if(bgCv.width!==w||bgCv.height!==h){ bgCv.width=w; bgCv.height=h; }
  bgGL.viewport(0,0,w,h);
}
var bgB=new Float32Array(6), bgSet=-1;
function bgTrack(t){
  if(!t||!t.raw) return;
  var bal=t.raw.balance, lo=1e9, hi=-1e9, i;
  for(i=0;i<6;i++){ if(bal[i]<lo)lo=bal[i]; if(bal[i]>hi)hi=bal[i]; }
  var r=Math.max(1,hi-lo);
  for(i=0;i<6;i++) bgB[i]=0.22+((bal[i]-lo)/r)*0.95;
  bgSet=cur;
}
function drawBG(level){
  if(bgFail||!bgGL||!bgProg) return;
  var t=TRACKS[cur]; if(!t) return;
  if(bgSet!==cur) bgTrack(t);
  var g=bgGL;
  sizeBG();
  g.useProgram(bgProg);
  g.uniform2f(bgU.uRes,bgCv.width,bgCv.height);
  g.uniform1f(bgU.uTime,(performance.now()-bgT0)/1000);
  g.uniform1f(bgU.uLevel,level);
  g.uniform1f(bgU.uSeed,t.seed||0);
  g.uniform1f(bgU.uBpm,clamp((t.bpm-60)/107,0,1));
  g.uniform1f(bgU.uCrest,clamp((t.raw.crest-7.2)/12.1,0,1));
  g.uniform1f(bgU.uOnset,clamp((t.raw.onsetRate-1)/3.6,0,1));
  g.uniform1f(bgU.uMode, SCENE_FORCE >= 0 ? SCENE_FORCE : (t.mode||0));
  var c=t.inkRGB||[1,1,1];
  g.uniform3f(bgU.uInk,c[0],c[1],c[2]);
  g.uniform1fv(bgU.uB,bgB);
  g.drawArrays(g.TRIANGLES,0,3);
}

function wireAnalyser(){
  if (wired) return;
  wired = true;
  try {
    var AC = window.AudioContext || window.webkitAudioContext;
    actx = new AC();
    srcNode = actx.createMediaElementSource(audio);
    analy = actx.createAnalyser();
    analy.fftSize = 2048; analy.smoothingTimeConstant = 0.55;
    srcNode.connect(analy); analy.connect(actx.destination);
    freq = new Uint8Array(analy.frequencyBinCount);
  } catch(e){ analy = null; }
}

// Level relative to the track's own moving average, so the type answers the
// beat rather than pinning at the top of a loud, limited mix.
// Live level per band, each tracked against its own slow average so every
// line moves on its own terms — the bass line answers kicks, the top line
// answers hats — instead of all six riding one overall loudness.
var lbEdge=[40,100,250,600,1500,4000,10000];
var lbSlow=[0,0,0,0,0,0], lbSpread=[8,8,8,8,8,8], lbInit=false;
var lbOut=[0,0,0,0,0,0];
function liveBands(){
  if (!analy || !freq) return null;
  analy.getByteFrequencyData(freq);
  var binHz = actx.sampleRate / analy.fftSize, b, i;
  for (b=0;b<6;b++){
    var lo=Math.max(1,Math.round(lbEdge[b]/binHz));
    var hi=Math.max(lo+1,Math.round(lbEdge[b+1]/binHz));
    hi=Math.min(hi,freq.length-1);
    var sum=0,c=0;
    for(i=lo;i<=hi;i++){ sum+=freq[i]*freq[i]; c++; }
    var avg=Math.sqrt(sum/Math.max(1,c));
    if(!lbInit){ lbSlow[b]=avg; lbSpread[b]=8; }
    lbSlow[b]+=(avg-lbSlow[b])*0.02;
    var dev=avg-lbSlow[b];
    lbSpread[b]+=(Math.abs(dev)-lbSpread[b])*0.03;
    var v=clamp(0.5+dev/(lbSpread[b]*2.6+4),0,1);
    lbOut[b]+=(v-lbOut[b])*0.35;          // smooth so it breathes, not jitters
  }
  lbInit=true;
  return lbOut;
}

function liveBass(){
  if (!analy || !freq) return -1;
  analy.getByteFrequencyData(freq);
  var binHz = actx.sampleRate / analy.fftSize;
  var lo = Math.max(1, Math.round(38/binHz)), hi = Math.max(lo+1, Math.round(250/binHz));
  var s = 0, c = 0;
  for (var i=lo;i<=hi;i++){ s += freq[i]*freq[i]; c++; }
  var avg = Math.sqrt(s/c);
  if (avg < 1) return 0;
  if (!bInit){ bSlow = avg; bSpread = 8; bInit = true; }
  bSlow += (avg - bSlow) * 0.012;
  var dev = avg - bSlow;
  bSpread += (Math.abs(dev) - bSpread) * 0.02;
  return clamp(0.42 + dev/(bSpread*3 + 5), 0, 1);
}

function bakedBass(){
  var t = TRACKS[cur];
  if (!audio || !t.dur) return 0;
  bandsOf(t);
  var u = clamp(audio.currentTime / t.dur, 0, 0.9999);
  var bi = u*(t.nb[0].length-1), i0 = Math.floor(bi), f = bi-i0;
  var bass = lerp(t.nb[0][i0], t.nb[0][Math.min(i0+1,255)], f);
  var pi = u*(t.pk.length-1), p0 = Math.floor(pi);
  var pk = lerp(t.pk[p0], t.pk[Math.min(p0+1,t.pk.length-1)], pi-p0)/255;
  return clamp(bass*0.80 + pk*0.34 - 0.10, 0, 1);
}

/* ---------------- state ---------------- */

function setPlaying(v){
  if (playing === v) return;
  playing = v;
  // paper (light) is the RESTING state; the plate goes dark when it plays
  document.documentElement.classList.toggle('paper', !v);
  document.documentElement.classList.toggle('playing', v);
  var gp = document.getElementById('gp');
  gp.setAttribute('d', v ? 'M0 0 H4.4 V15 H0 Z M8.6 0 H13 V15 H8.6 Z' : 'M0 0 L13 7.5 L0 15 Z');
  var t = TRACKS[cur];
  drawField(audio && t && t.dur ? clamp(audio.currentTime/t.dur, 0, 1) : 0);
}

function toggle(){
  ensureAudio();
  var want = srcFor(TRACKS[cur]);
  if (audio.getAttribute('src') !== want){ play(); return; }
  // A scrub can load the src before the first play, so this branch is now
  // reachable on a cold start — wire the analyser here too or the type never
  // answers the bass.
  if (audio.paused) {
    wireAnalyser();
    if (actx && actx.state === 'suspended') actx.resume();
    audio.play();
    slam = 1;
  }
  else audio.pause();
}

function play(){
  ensureAudio();
  wireAnalyser();
  if (actx && actx.state === 'suspended') actx.resume();
  var t = TRACKS[cur];
  var want = srcFor(t);
  if (audio.getAttribute('src') !== want){
    switching = true;
    setTimeout(function(){ switching = false; }, 900);
    audio.setAttribute('src', want); audio.load();
  }
  bInit = false;
  var pr = audio.play();
  if (pr && pr.catch) pr.catch(function(){});
  slam = 1;
}

function stamp(){
  var bar = document.getElementById('bar');
  bar.classList.remove('go'); void bar.offsetWidth; bar.classList.add('go');
  var wrap = document.getElementById('typewrap');
  wrap.classList.add('shut');
  setTimeout(function(){
    render();
    wrap.classList.remove('shut');
    slam = 1;
    for (var i=0;i<hist.length;i++) hist[i] = 1;
  }, 100);
}

var lock = 0;
function go(step, autoplay){
  var now = performance.now();
  if (now - lock < 260) return;
  lock = now;
  cur = (cur + step + TRACKS.length) % TRACKS.length;
  stamp();
  if (autoplay || playing) setTimeout(play, 110);
}

function jump(i){
  if (i === cur){ closeIndex(); play(); return; }
  cur = i; closeIndex(); stamp(); setTimeout(play, 110);
}

function render(){
  var t = TRACKS[cur];
  document.documentElement.style.setProperty('--ink', t.ink);
  if (t.plate) document.documentElement.style.setProperty('--plate', t.plate);
  if (t.bone)  document.documentElement.style.setProperty('--bone', t.bone);
  // the tab carries the record, not the prototype's codename
  document.title = (t.title ? t.title + ' — ' : '') + SITE_TITLE;
  markUrl();
  document.getElementById('pos').innerHTML =
    ('0'+(cur+1)).slice(-2) + '<span class="cnt">/' + ('0'+TRACKS.length).slice(-2) + '</span>';
  document.getElementById('yrbtn').textContent = t.date ? t.date.slice(0,4) : '——';
  document.getElementById('f-date').textContent = t.date || '';
  document.getElementById('f-bpm').textContent = t.bpm + ' BPM';
  document.getElementById('f-dur').textContent = mmss(t.dur);
  document.documentElement.style.setProperty('--fieldmin', fieldMin().toFixed(1) + 'px');
  typeset(t);
  seatField();
  sizeCanvas();
  drawField(playing && audio && t.dur ? clamp(audio.currentTime/t.dur,0,1) : 0);
  idxRows.forEach(function(r,i){ r.classList.toggle('on', i === cur); });
  prepare();
}

// Point the element at the current track without playing, so any R2 miss
// resolves to the local copy before the user ever taps. Never touches a
// stream that is already running.
function prepare(){
  if (playing || switching) return;
  var t = TRACKS[cur];
  if (!t) return;
  ensureAudio();
  var want = srcFor(t);
  if (audio.getAttribute('src') !== want){
    audio.setAttribute('src', want);
    audio.load();
  }
}

/* ---------------- index overlay ---------------- */

function buildIndex(){
  var host = document.getElementById('idxscroll');
  var groups = {}, order = [];
  TRACKS.forEach(function(t,i){
    var y = t.date ? t.date.slice(0,4) : 'UNDATED';
    if (!groups[y]){ groups[y] = []; order.push(y); }
    groups[y].push(i);
  });
  order.sort(function(a,b){
    if (a === 'UNDATED') return 1;
    if (b === 'UNDATED') return -1;
    return b.localeCompare(a);
  });
  order.forEach(function(y){
    var g = document.createElement('div'); g.className = 'grp'; g.dataset.year = y;
    var h = document.createElement('div'); h.className = 'yr';
    h.innerHTML = '<span></span><i></i>';
    h.firstChild.textContent = y;
    h.lastChild.textContent = ('0'+groups[y].length).slice(-2);
    g.appendChild(h);
    var rows = document.createElement('div'); rows.className = 'rows';
    g.appendChild(rows);
    groups[y].forEach(function(i){
      var t = TRACKS[i];
      var b = document.createElement('button');
      b.className = 'row';
      b.innerHTML = '<span class="n"></span><span class="t"></span><span class="bpm"></span><span class="d"></span>';
      b.querySelector('.n').textContent = ('0'+(i+1)).slice(-2);
      var tt = b.querySelector('.t');
      tt.textContent = t.title.toUpperCase();
      tt.style.fontVariationSettings = "'wght' " + t.idxW + ", 'wdth' " + t.idxD;
      b.querySelector('.bpm').innerHTML = t.bpm + '<i>bpm</i>';
      b.querySelector('.d').textContent = mmss(t.dur);
      b.addEventListener('click', function(){ jump(i); });
      rows.appendChild(b);
      idxRows[i] = b;
    });
    host.appendChild(g);
  });
}

function openIndex(){
  idxOpen = true;
  document.documentElement.classList.add('idx');
  var t = TRACKS[cur], y = t.date ? t.date.slice(0,4) : 'UNDATED';
  var g = document.querySelector('.grp[data-year="' + y + '"]');
  var sc = document.getElementById('idxscroll');
  if (g) sc.scrollTop = Math.max(0, g.offsetTop - sc.offsetTop - 40);
}
function closeIndex(){ idxOpen = false; document.documentElement.classList.remove('idx'); }

/* ---------------- loop ---------------- */

var lastW = 0, lastH = 0, lastFm = '';
function relayout(){
  var t = TRACKS[cur];
  if (!t) return;
  var fm = fieldMin().toFixed(1) + 'px';
  if (fm !== lastFm){ lastFm = fm; document.documentElement.style.setProperty('--fieldmin', fm); }
  var el = document.getElementById('typewrap');
  if (Math.abs(el.clientWidth - lastW) < 2 && Math.abs(el.clientHeight - lastH) < 2) return;
  lastW = el.clientWidth; lastH = el.clientHeight;
  typeset(t);
  seatField();
  sizeCanvas();
  drawField(playing && audio && t.dur ? clamp(audio.currentTime/t.dur,0,1) : 0);
}

var tick = 0, fontOK = false;
function frame(){
  if ((tick++ % 12) === 0){
    if (!fontOK && TRACKS.length && fontLive()){ fontOK = true; lastW = lastH = 0; }
    relayout();
  }
  var t = TRACKS[cur];
  var live = playing && audio && !audio.paused;
  var raw = 0;
  if (live){
    var lv = liveBass();
    raw = lv >= 0 ? lv : bakedBass();
  }
  env += (raw - env) * (raw > env ? 0.45 : 0.09);
  envSlow += (raw - envSlow) * (raw > envSlow ? 0.12 : 0.055);
  var p = Math.pow(clamp(env*0.68 + envSlow*0.32, 0, 1), 0.9);
  var bias = t ? t.bias : 0.2;
  var e = live ? clamp(bias*0.5 + p*0.94, 0, 1) : bias;
  slam *= 0.90;
  if (slam > 0.002) e = clamp(e + slam*(1 - e), 0, 1);

  hist.push(e); if (hist.length > 24) hist.shift();
  applyPressure(e, false);
  drawBG(clamp(live ? e : e * 0.45, 0, 1));

  if (audio && t && t.dur){
    var pr = clamp(audio.currentTime / t.dur, 0, 1);
    document.getElementById('head').style.transform = 'translateX(' + (pr*window.innerWidth) + 'px)';
    document.getElementById('clock').textContent = playing ? mmss(audio.currentTime) + ' / ' + mmss(t.dur) : mmss(t.dur);
    if (playing) drawField(pr);
  }
  requestAnimationFrame(frame);
}

/* ---------------- input ---------------- */

function boot(){
  measReady();
  sizeCanvas();
  document.getElementById('palname').textContent = PALETTES[pal].name;
  document.documentElement.classList.add('paper');   // rests on paper, darkens to play
  initBG();

  // the mark needs no webfont, so it goes up first; the type waits until
  // Archivo is genuinely rendering, or gives up and uses the fallback metrics.
  document.documentElement.style.setProperty('--fieldmin', fieldMin().toFixed(1) + 'px');
  sizeCanvas(); drawField(0);

  var again = function(){ lastW = lastH = 0; render(); };
  var t0 = Date.now();
  (function poll(){
    if (fontLive() || Date.now() - t0 > 4000){ fontOK = fontLive(); again(); }
    else setTimeout(poll, 50);
  })();
  if (document.fonts){
    if (document.fonts.load) document.fonts.load("400 100px Archivo").then(again, again);
    if (document.fonts.addEventListener) document.fonts.addEventListener('loadingdone', again);
  }

  var rt;
  window.addEventListener('resize', function(){ clearTimeout(rt); rt = setTimeout(relayout, 110); });
  if (window.ResizeObserver){
    new ResizeObserver(function(){ clearTimeout(rt); rt = setTimeout(relayout, 60); })
      .observe(document.getElementById('typewrap'));
  }

  var acc = 0, wlock = 0;
  window.addEventListener('wheel', function(ev){
    if (idxOpen) return;
    ev.preventDefault();
    var now = performance.now();
    if (now - wlock < 300){ return; }
    acc += ev.deltaY;
    if (Math.abs(acc) > 48){ wlock = now; go(acc > 0 ? 1 : -1); acc = 0; }
  }, { passive:false });

  // Axis-locked drag: vertical past 44px changes track (unchanged), horizontal
  // scrubs the song. The head already spans the viewport as 0..100% of the
  // track, so dragging across the sheet IS the timeline — no extra chrome.
  var ty = 0, tx = 0, tt = 0, axis = 0, scrubbed = false, swallowUntil = 0;
  var SLOP = 10;

  // Duration comes from marks.json, so the scrub maths is correct even before
  // the file has loaded a single byte.
  function paintSeek(u, t){
    document.getElementById('head').style.transform = 'translateX(' + (u*window.innerWidth) + 'px)';
    document.getElementById('clock').textContent = mmss(u*t.dur) + ' / ' + mmss(t.dur);
    drawField(u);
  }
  function seekToClientX(x){
    var t = TRACKS[cur];
    if (!t || !t.dur) return;
    ensureLoaded();
    var u = clamp(x / window.innerWidth, 0, 0.9995);
    seekSafe(u * t.dur);
    paintSeek(u, t);
  }
  function nudge(sec){
    var t = TRACKS[cur];
    if (!t || !t.dur) return;
    ensureLoaded();
    var at = (audio && audio.readyState >= 1) ? audio.currentTime
           : (pendingSeek >= 0 ? pendingSeek : 0);
    var to = clamp(at + sec, 0, t.dur - 0.05);
    seekSafe(to);
    paintSeek(clamp(to / t.dur, 0, 1), t);
  }
  function endScrub(){
    if (!axis) return;
    if (axis === 1){
      document.documentElement.classList.remove('scrub');
      // a scrub on a paused track leaves it paused, at the new position
    }
    axis = 0;
  }

  window.addEventListener('touchstart', function(ev){
    if (idxOpen) return;
    ty = ev.touches[0].clientY; tx = ev.touches[0].clientX;
    tt = performance.now(); axis = 0; scrubbed = false;
  }, { passive:true });

  window.addEventListener('touchmove', function(ev){
    if (idxOpen) return;
    var dx = ev.touches[0].clientX - tx, dy = ev.touches[0].clientY - ty;
    if (!axis){
      if (Math.abs(dx) > SLOP && Math.abs(dx) > Math.abs(dy)){
        axis = 1;
        ensureAudio();
        document.documentElement.classList.add('scrub');
      } else if (Math.abs(dy) > SLOP){
        axis = 2;
      }
    }
    if (axis === 1){
      scrubbed = true;
      if (ev.cancelable) ev.preventDefault();
      seekToClientX(ev.touches[0].clientX);
    }
  }, { passive:false });

  window.addEventListener('touchend', function(ev){
    if (idxOpen) return;
    var ct = ev.changedTouches[0];
    var dy = ct.clientY - ty, dx = ct.clientX - tx;
    if (axis === 1){ endScrub(); swallowUntil = performance.now() + 700; return; }
    endScrub();
    if (Math.abs(dy) > 44 && performance.now() - tt < 700){
      go(dy < 0 ? 1 : -1); swallowUntil = performance.now() + 700; return;
    }
    // A real tap: act HERE, inside the touch gesture. We used to wait for the
    // synthetic click, but touchmove calls preventDefault() for scrubbing and
    // `touch-action:none` is set, which can cancel that click outright — so on
    // a phone the first taps did nothing and audio never got its unlock
    // gesture. Buttons are excluded; they have their own handlers.
    if (Math.abs(dx) < 10 && Math.abs(dy) < 10 && performance.now() - tt < 600){
      var onBtn = ev.target && ev.target.closest && ev.target.closest('button');
      if (!onBtn){ toggle(); swallowUntil = performance.now() + 700; }
    }
  }, { passive:true });

  // desktop: press and drag across the sheet to scrub
  var mdown = false, mx = 0;
  document.getElementById('sheet').addEventListener('pointerdown', function(ev){
    if (idxOpen || ev.pointerType === 'touch') return;
    mdown = true; mx = ev.clientX; scrubbed = false;
  });
  window.addEventListener('pointermove', function(ev){
    if (!mdown || idxOpen || ev.pointerType === 'touch') return;
    if (!scrubbed && Math.abs(ev.clientX - mx) < SLOP) return;
    if (!scrubbed){ scrubbed = true; ensureAudio(); document.documentElement.classList.add('scrub'); }
    seekToClientX(ev.clientX);
  });
  window.addEventListener('pointerup', function(ev){
    if (ev.pointerType === 'touch') return;
    mdown = false;
    if (scrubbed) document.documentElement.classList.remove('scrub');
  });

  window.addEventListener('keydown', function(ev){
    var k = ev.key;
    if (k === 'Escape'){ closeIndex(); return; }
    if (idxOpen && k !== 'i') return;
    if (k === ' '){ ev.preventDefault(); toggle(); }
    else if (k === 'ArrowDown' || k === 'j'){ ev.preventDefault(); go(1); }
    else if (k === 'ArrowUp' || k === 'k'){ ev.preventDefault(); go(-1); }
    else if (k === 'ArrowLeft'){ ev.preventDefault(); nudge(ev.shiftKey ? -30 : -5); }
    else if (k === 'ArrowRight'){ ev.preventDefault(); nudge(ev.shiftKey ? 30 : 5); }
    else if (k === 'c' || k === 'C'){ cyclePalette(ev.shiftKey ? -1 : 1); }
    else if (k === 'i'){ idxOpen ? closeIndex() : openIndex(); }
  });

  document.getElementById('transport').addEventListener('click', function(ev){ ev.stopPropagation(); toggle(); });
  document.getElementById('pos').addEventListener('click', function(ev){ ev.stopPropagation(); openIndex(); });
  document.getElementById('yrbtn').addEventListener('click', function(ev){ ev.stopPropagation(); openIndex(); });
  document.getElementById('idxclose').addEventListener('click', closeIndex);
  document.getElementById('palname').addEventListener('click', function(ev){ ev.stopPropagation(); cyclePalette(1); });
  // a drag that scrubbed must not also count as the click that toggles play
  document.getElementById('sheet').addEventListener('click', function(){
    if (idxOpen) return;
    if (performance.now() < swallowUntil) return;   // touchend already handled it
    if (scrubbed){ scrubbed = false; return; }
    toggle();
  });

  requestAnimationFrame(frame);

  // entrance: the plate takes its first impression
  setTimeout(function(){
    var bar = document.getElementById('bar');
    bar.classList.add('go');
    slam = 1;
  }, 260);
}

})();
</script>
