<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>can’t mute me.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=block" rel="stylesheet">
<style>
:root{
  --plate:#0B0E14;
  --bone:#EDE9E1;
  --ink:#E1261D;
  --m: clamp(16px, 3.2vw, 44px);
  --fieldmin: 19vh;
  --fieldh: var(--fieldmin);
  --gap: clamp(14px, 2.4vh, 34px);
  --meta: 13px;
  --metah: 30px;
}
@media (min-width:900px){ :root{ --meta:14px; } }

*{ margin:0; padding:0; box-sizing:border-box; }
html,body{
  height:100%; background:var(--plate); overflow:hidden;
  -webkit-text-size-adjust:100%;
  font-family:'Archivo',system-ui,sans-serif;
  font-variant-numeric: tabular-nums lining-nums;
}
body{ overscroll-behavior:none; touch-action:none; }
button{ font:inherit; color:inherit; background:none; border:0; cursor:pointer; -webkit-tap-highlight-color:transparent; }

/* ---------- the sheet: everything that inverts ---------- */
#sheet{ position:fixed; inset:0; isolation:isolate; overflow:hidden; }
#ground{ position:absolute; inset:0; background:var(--plate); }
/* The scene. Sits inside #sheet, so #inv's difference blend inverts it along
   with everything else — glowing nodal ink on the dark plate, dark ink on
   paper, with no second codepath. */
#bg{
  position:absolute; inset:0; width:100%; height:100%;
  opacity:.66; pointer-events:none;
  transition:opacity 420ms ease;
}
html.idx #bg{ opacity:.18; }
@media (prefers-reduced-motion: reduce){ #bg{ opacity:.42; } }

#field{ position:absolute; left:0; right:0; top:calc(var(--m) + var(--metah)); height:var(--fieldh); }
#plate{ display:block; width:100%; height:100%; }

#topmeta{
  /* right inset leaves room for the palette control now sitting in this row */
  position:absolute; left:var(--m); right:calc(var(--m) + 86px); top:var(--m); height:var(--metah);
  display:flex; align-items:flex-start; justify-content:space-between;
  color:var(--bone); font-size:var(--meta); line-height:1;
  font-variation-settings:'wght' 500,'wdth' 96; letter-spacing:.01em;
}
#topmeta .cnt{ opacity:.55 }

#typewrap{
  position:absolute; left:var(--m); right:var(--m);
  top:calc(var(--m) + var(--metah) + var(--fieldmin) + var(--gap));
  bottom:calc(var(--m) + 34px);
  display:flex; align-items:flex-end;
  color:var(--bone);
  clip-path:inset(0 -100vw 0 -100vw);
  transition:clip-path 110ms cubic-bezier(.85,0,1,1);
}
#typewrap.shut{ clip-path:inset(48% -100vw 48% -100vw); transition-duration:95ms; }
#lines{ width:100%; }
#sub{
  display:block; color:var(--bone); opacity:.55;
  font-size:clamp(13px,1.6vw,21px); line-height:1.2; letter-spacing:.012em;
  font-variation-settings:'wght' 600,'wdth' 92;
  margin-bottom:.75em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.ln{ display:block; white-space:pre; line-height:.80; }
.ln > span{ display:inline-block; transform-origin:left bottom; will-change:font-variation-settings,transform; }

#foot{
  position:absolute; right:var(--m); bottom:var(--m); height:20px;
  display:flex; align-items:center; gap:clamp(14px,2.6vw,34px);
  color:var(--bone); font-size:var(--meta); line-height:1;
  font-variation-settings:'wght' 500,'wdth' 96; letter-spacing:.015em; white-space:nowrap;
}
#foot .dim{ opacity:.55 }

#inv{
  position:fixed; inset:0; background:#fff; mix-blend-mode:difference; pointer-events:none;
  transform:translateY(-101%); will-change:transform;
  transition:transform 440ms cubic-bezier(.7,0,.14,1);
}
html.paper #inv{ transform:translateY(0); }
#bar{
  position:fixed; left:0; right:0; top:0; height:34vh; background:#fff;
  mix-blend-mode:difference; pointer-events:none; transform:translateY(-140%); will-change:transform;
}
#bar.go{ animation:pass 300ms cubic-bezier(.3,0,.15,1) 1 both; }
@keyframes pass{ from{ transform:translateY(-115%) } to{ transform:translateY(325%) } }

/* ---------- accent layer: never inverts ---------- */
#accent{ position:fixed; inset:0; pointer-events:none; z-index:5; }
#head{
  position:absolute; top:0; bottom:0; width:1px; background:var(--ink);
  opacity:0; transform:translateX(-1px);
}
#head::after{
  content:''; position:absolute; left:-1px; width:3px;
  top:calc(var(--m) + var(--metah)); height:var(--fieldh); background:var(--ink);
}
html.playing #head{ opacity:1 }
#transport{
  position:absolute; left:var(--m); bottom:var(--m); height:20px;
  display:flex; align-items:center; gap:11px; pointer-events:auto;
  color:var(--ink); font-size:var(--meta); line-height:1;
  font-variation-settings:'wght' 600,'wdth' 96; letter-spacing:.02em;
}
#transport::before{ content:''; position:absolute; left:-12px; right:-12px; top:-15px; bottom:-15px; }
/* palette cycler — sits opposite the transport, same weight of voice */
/* top-right, NOT bottom-right — #foot already owns that corner and the two
   were overprinting each other ("SIGNAL" landing on top of the duration). */
#palname{
  position:absolute; right:var(--m); top:var(--m); height:var(--metah);
  display:flex; align-items:flex-start; justify-content:flex-end;
  min-width:74px; text-align:right; pointer-events:auto;
  color:var(--ink); font-size:var(--meta); line-height:1;
  font-variation-settings:'wght' 600,'wdth' 96; letter-spacing:.02em;
  opacity:.55; transition:opacity 160ms;
}
#palname::before{ content:''; position:absolute; left:-14px; right:-14px; top:-15px; bottom:-15px; }
#palname.flash{ opacity:1; }
/* scrub: the head thickens and the whole sheet knows it's being dragged */
html.scrub #head{ opacity:1 }
html.scrub #head::after{ width:5px; left:-2px; }
html.scrub #typewrap{ opacity:.35; }
#typewrap{ transition:opacity 140ms; }
#transport svg{ display:block; overflow:visible }
#transport .t{ min-width:5.4em; text-align:left; }

/* ---------- index ---------- */
#index{
  position:fixed; inset:0; z-index:9; background:var(--plate); color:var(--bone);
  clip-path:inset(0 0 100% 0); transition:clip-path 180ms cubic-bezier(.3,0,.1,1);
  pointer-events:none; overflow:hidden;
}
html.paper #index{ background:#F4F1EB; color:#12161E; }
html.idx #index{ clip-path:inset(0 0 0 0); pointer-events:auto; }
#idxscroll{
  position:absolute; inset:0; overflow-y:auto; -webkit-overflow-scrolling:touch;
  touch-action:pan-y; padding:calc(var(--m) + 36px) var(--m) calc(var(--m) + 60px);
}
.grp{ margin-bottom:clamp(24px,3.4vh,44px); }
.yr{
  display:flex; align-items:baseline; gap:.85em;
  font-size:clamp(15px,1.5vw,19px); line-height:1; letter-spacing:.02em;
  font-variation-settings:'wght' 800,'wdth' 78;
  padding-bottom:8px; margin-bottom:6px; border-bottom:1px solid currentColor;
}
.yr i{ font-style:normal; font-size:11px; font-variation-settings:'wght' 500,'wdth' 88; opacity:.5; }
.rows{ display:grid; grid-template-columns:repeat(auto-fill,minmax(400px,1fr)); column-gap:clamp(20px,3vw,54px); }
.row{
  display:flex; align-items:baseline; gap:.7em; width:100%; text-align:left;
  padding:4px 0; line-height:1.12; opacity:.82;
}
.row .n{ font-size:11px; font-variation-settings:'wght' 500,'wdth' 88; opacity:.5; width:2.1em; flex:none; }
.row .t{ font-size:clamp(15px,1.4vw,20px); flex:1 1 auto; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
/* bpm and duration were colliding into one unreadable number ("157 0:36").
   Two fixed columns, a real gap, and a unit on the bpm so it can't be
   mistaken for a time. Tabular figures keep the columns from wobbling. */
.row .bpm, .row .d{
  font-size:11px; font-variation-settings:'wght' 500,'wdth' 88; opacity:.5;
  flex:none; font-variant-numeric:tabular-nums;
}
.row .bpm{ width:4.6em; text-align:right; margin-left:.5em; }
.row .bpm i{ font-style:normal; font-size:8.5px; opacity:.62; margin-left:.28em; letter-spacing:.04em; }
.row .d{ width:3.4em; text-align:right; margin-left:1.5em; }
.row.on{ color:var(--ink); opacity:1; }
#idxclose{
  position:absolute; top:var(--m); right:var(--m); z-index:2; color:inherit;
  font-size:var(--meta); font-variation-settings:'wght' 600,'wdth' 96; letter-spacing:.02em;
  padding:10px; margin:-10px;
}
#idxtitle{
  position:absolute; top:var(--m); left:var(--m); z-index:2;
  font-size:var(--meta); font-variation-settings:'wght' 600,'wdth' 96; letter-spacing:.02em; opacity:.55;
}
#meas{ position:absolute; left:-9999px; top:0; white-space:pre; font-size:100px; letter-spacing:0; visibility:hidden; }
</style>
</head>
<body>

<div id="sheet">
  <div id="ground"></div>
  <canvas id="bg"></canvas>
  <div id="field"><canvas id="plate"></canvas></div>
  <div id="topmeta">
    <button id="pos" style="letter-spacing:inherit;font-variation-settings:inherit">01<span class="cnt">/72</span></button>
    <button id="yrbtn" style="letter-spacing:inherit;font-variation-settings:inherit;border-bottom:1px solid currentColor;padding-bottom:3px">2026</button>
  </div>
  <div id="typewrap"><div id="lines"></div></div>
  <div id="foot">
    <span id="f-date" class="dim"></span>
    <span id="f-bpm"></span>
    <span id="f-dur" class="dim"></span>
  </div>
  <div id="inv"></div>
  <div id="bar"></div>
</div>

<div id="accent">
  <div id="head"></div>
  <button id="transport" aria-label="play / pause">
    <svg id="glyph" width="13" height="15" viewBox="0 0 13 15" aria-hidden="true"><path id="gp" fill="currentColor" d="M0 0 L13 7.5 L0 15 Z"/></svg>
    <span class="t" id="clock">0:00</span>
  </button>
  <button id="palname" aria-label="cycle palette">SIGNAL</button>
</div>

<div id="index">
  <div id="idxtitle">KANI</div>
  <button id="idxclose">CLOSE</button>
  <div id="idxscroll"></div>
</div>

<div id="meas"></div>

<script>
(function(){
'use strict';

var W_MIN = 360, W_MAX = 900, D_MIN = 98, D_MAX = 106, FIT_E = 0.5;
var D_HI = 120;   // the band the block itself may be set in; the narrow end
function dLo(){ return clamp(66 + (window.innerWidth - 390)*0.043, 66, 88); }
var K = 0.6;          // how much of the pressure-driven width growth survives tracking
var LEAD = 0.80;

var clamp = function(v,a,b){ return v<a?a:(v>b?b:v); };
var lerp = function(a,b,t){ return a+(b-a)*t; };

/* ---------------- inks ----------------
   Each palette is an ordered ramp. Tracks are rank-assigned along it by
   low-end bias, so the bassiest track takes ink 0 and the brightest takes
   the last — the ramp always reads in order, and every ink gets used.
   Cycle with C, or tap the palette name bottom-right. Choice persists. */
var PALETTES = [
  { name:'SIGNAL', inks:[
    {h:356,s:86,l:54},{h:344,s:85,l:54},{h:334,s:84,l:54},{h:318,s:80,l:53},
    {h:306,s:76,l:52},{h:290,s:74,l:56},{h:276,s:72,l:58},{h:258,s:78,l:60},
    {h:238,s:84,l:60},{h:216,s:84,l:52},{h:202,s:82,l:46},{h:194,s:80,l:41} ] },

  { name:'RISO', inks:[
    {h:339,s:92,l:58},{h:14,s:92,l:56},{h:32,s:94,l:52},{h:48,s:92,l:50},
    {h:68,s:62,l:46},{h:142,s:62,l:42},{h:174,s:70,l:40},{h:196,s:82,l:46},
    {h:222,s:78,l:54},{h:266,s:62,l:56},{h:296,s:60,l:52},{h:318,s:74,l:54} ] },

  { name:'EMBER', inks:[
    {h:6,s:74,l:40},{h:12,s:80,l:46},{h:18,s:86,l:50},{h:24,s:90,l:52},
    {h:30,s:92,l:54},{h:36,s:90,l:54},{h:42,s:88,l:54},{h:48,s:86,l:54},
    {h:54,s:80,l:52},{h:40,s:60,l:46},{h:26,s:56,l:40},{h:14,s:52,l:34} ] },

  { name:'ICE', inks:[
    {h:168,s:70,l:46},{h:180,s:74,l:46},{h:190,s:80,l:48},{h:198,s:84,l:50},
    {h:206,s:86,l:54},{h:214,s:84,l:58},{h:222,s:80,l:60},{h:232,s:76,l:62},
    {h:244,s:70,l:64},{h:256,s:64,l:64},{h:268,s:58,l:62},{h:280,s:54,l:60} ] },

  { name:'ACID', inks:[
    {h:64,s:96,l:50},{h:74,s:92,l:48},{h:84,s:88,l:46},{h:94,s:84,l:44},
    {h:104,s:82,l:44},{h:118,s:80,l:44},{h:134,s:78,l:44},{h:150,s:76,l:44},
    {h:164,s:78,l:44},{h:56,s:98,l:52},{h:46,s:98,l:52},{h:38,s:96,l:52} ] },

  { name:'SPECTRUM', inks:[
    {h:0,s:84,l:54},{h:30,s:88,l:52},{h:52,s:88,l:50},{h:78,s:74,l:46},
    {h:104,s:70,l:44},{h:140,s:68,l:44},{h:168,s:72,l:44},{h:194,s:80,l:46},
    {h:216,s:84,l:54},{h:248,s:76,l:60},{h:284,s:68,l:58},{h:320,s:80,l:56} ] },

  { name:'OXIDE', inks:[
    {h:16,s:44,l:44},{h:26,s:48,l:46},{h:36,s:44,l:46},{h:44,s:36,l:46},
    {h:60,s:24,l:44},{h:96,s:22,l:40},{h:150,s:24,l:36},{h:186,s:30,l:36},
    {h:206,s:34,l:42},{h:220,s:30,l:46},{h:246,s:24,l:48},{h:300,s:18,l:46} ] },

  { name:'BONE', inks:[
    {h:38,s:16,l:88},{h:38,s:14,l:82},{h:38,s:12,l:76},{h:38,s:10,l:70},
    {h:38,s:9,l:64},{h:38,s:8,l:58},{h:210,s:8,l:60},{h:210,s:10,l:66},
    {h:210,s:12,l:72},{h:210,s:14,l:78},{h:210,s:16,l:84},{h:210,s:18,l:90} ] }
];

var pal = 0;
try {
  var sp = localStorage.getItem('kani.pal');
  if (sp !== null){
    var n = parseInt(sp, 10);
    if (n >= 0 && n < PALETTES.length) pal = n;
  }
} catch(e){}

var SITE_TITLE = 'can’t mute me.';
var triedLocal = {};           // R2 miss -> retried once against the site's own copy
var AUDIO_BASE = '/audio-mp3/';
var TRACKS = [], cur = 0, playing = false, idxOpen = false;
var audio = null, actx = null, analy = null, freq = null, srcNode = null, wired = false, switching = false;
var env = 0, envSlow = 0, slam = 0, hist = [];
var bSlow = 0, bSpread = 8, bInit = false;
var ctx2d = null, cv = null, cw = 0, ch = 0;
var lineEls = [], lineCfg = [], typeReady = false;
var idxRows = [];

function b64(s){
  var bin = atob(s), n = bin.length, a = new Uint8Array(n);
  for (var i=0;i<n;i++) a[i] = bin.charCodeAt(i);
  return a;
}
function mmss(s){
  s = Math.max(0, Math.floor(s||0));
  return Math.floor(s/60) + ':' + ('0' + (s%60)).slice(-2);
}
function tidy(t){
  return t.replace(/'/g, '’');
}

// Same slug rule as the main site, so /t/<slug> and #<slug> always agree.
function slugify(s){
  return String(s || '').toLowerCase().replace(/[^\w\s-]/g, '').trim().replace(/\s+/g, '-');
}
function trackBySlug(slug){
  if (!slug) return -1;
  slug = slug.toLowerCase();
  for (var i = 0; i < TRACKS.length; i++){
    if (slugify(TRACKS[i].title) === slug) return i;
  }
  var n = parseInt(slug, 10);                       // #12 works too
  if (!isNaN(n) && n >= 1 && n <= TRACKS.length) return n - 1;
  return -1;
}
// replaceState, not pushState — swiping 72 tracks must not bury the back button.
function markUrl(){
  var t = TRACKS[cur];
  if (!t) return;
  var h = '#' + slugify(t.title);
  if (location.hash !== h){
    try { history.replaceState(null, '', location.pathname + location.search + h); } catch(e){}
  }
}

var inkOrder = [];
// ?scene=N pins every track to one background family — for previewing them.
var SCENE_FORCE = (function(){
  var m = /[?&]scene=(\d+)/.exec(location.search);
  return m ? Math.min(17, parseInt(m[1], 10)) : -1;
})();
//  0 plate  1 ripple  2 screen  3 spoke  4 strata  5 vortex   <- one family
//  6 truchet 7 halftone 8 smoke 9 cell 10 depth 11 hyper      <- distinct
// 12 type 13 weave 14 circuit 15 flock 16 fracture 17 caustic <- distinct
var MODE_POOL = [6, 12, 10, 13, 7, 14, 11, 15, 8, 16, 0, 17, 9, 5];
// 14 slots, 12 distinct techniques, 2 sine-family (0,5) -> squiggles ~1 in 7

// stable per-track hash — same song is always the same colour, across reloads
function hash32(s){
  var h = 2166136261;
  for (var i = 0; i < s.length; i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return ((h >>> 0) % 100000) / 100000;
}
// shortest-path hue interpolation, so a ramp never travels the long way round
function mixInk(a, b, t){
  var dh = ((b.h - a.h + 540) % 360) - 180;
  return { h: (a.h + dh * t + 360) % 360, s: a.s + (b.s - a.s) * t, l: a.l + (b.l - a.l) * t };
}
// Every track gets its OWN ink, not one of twelve. The palette's inks are
// anchors on a continuous ramp; each track lands at its own point along it by
// low-end rank, plus a small deterministic jitter so neighbours never collide.
// Scrolling the catalogue therefore changes colour on every song.
function assignInks(){
  var inks = PALETTES[pal].inks, n = inks.length, N = inkOrder.length;
  inkOrder.forEach(function(t, i){
    var p = N > 1 ? i / (N - 1) : 0;
    var f = p * (n - 1);
    var k = Math.min(n - 2, Math.floor(f));
    var c = mixInk(inks[k], inks[k + 1], f - k);
    var j = hash32(t.file);
    var h = (c.h + (j - 0.5) * 22 + 360) % 360;
    var s = clamp(c.s + (j - 0.5) * 10, 8, 98);
    var l = clamp(c.l + (hash32(t.file + '·') - 0.5) * 9, 26, 92);
    t.ink = 'hsl(' + h.toFixed(1) + ' ' + s.toFixed(1) + '% ' + l.toFixed(1) + '%)';
    // the scene needs the same ink as linear-ish rgb, plus a stable rotation
    t.inkRGB = hsl2rgb(h, s, Math.min(72, l + 12));
    t.seed = j;
    // Per-track ground colour. #inv is white with mix-blend-mode:difference, so
    // the light state is the exact inverse of whatever the plate is — tint the
    // plate and BOTH states get colour, guaranteed to complement each other.
    // Kept very dark and only moderately saturated so the inverse lands on a
    // pleasant pastel rather than a garish one.
    var ph = (h + 150 + hash32(t.file + 'p') * 120) % 360;
    var ps = 22 + hash32(t.file + 's') * 26;         // 22..48
    var pl = 5.5 + hash32(t.file + 'l') * 4.0;       // 5.5..9.5
    t.plate = 'hsl(' + ph.toFixed(1) + ' ' + ps.toFixed(1) + '% ' + pl.toFixed(1) + '%)';
    t.bone  = 'hsl(' + ((ph + 24) % 360).toFixed(1) + ' ' + (10 + ps * 0.18).toFixed(1) + '% 92.5%)';
    // Scene families, dealt round-robin down the same rank the ink follows.
    // Modes 0-5 are all one technique (summed sine waves -> contour bands) and
    // only differ in wave geometry, so giving them 6 of 12 slots meant every
    // other song looked like the same squiggles. Keep the two best of that
    // family and let the genuinely distinct techniques carry the rest.
    t.mode = MODE_POOL[i % MODE_POOL.length];
  });
  bgSet = -1;
}
function cyclePalette(dir){
  pal = (pal + (dir || 1) + PALETTES.length) % PALETTES.length;
  try { localStorage.setItem('kani.pal', String(pal)); } catch(e){}
  assignInks();
  var t = TRACKS[cur];
  if (t) document.documentElement.style.setProperty('--ink', t.ink);
  idxRows.forEach(function(r, i){
    if (TRACKS[i]) r.style.color = '';
  });
  var el = document.getElementById('palname');
  if (el){
    el.textContent = PALETTES[pal].name;
    el.classList.remove('flash');
    void el.offsetWidth;
    el.classList.add('flash');
  }
}

/* ---------------- data ---------------- */

Promise.all([
  fetch('/data/marks.json').then(function(r){ return r.json(); }),
  fetch('/config.json').then(function(r){ return r.json(); })
]).then(function(res){
  var marks = res[0], cfg = res[1];

  // audio-mp3/ is gitignored and never deployed — production serves from R2.
  // Localhost keeps the local folder so dev works without touching the bucket.
  var host = location.hostname;
  var isLocal = host === 'localhost' || host === '127.0.0.1' || host === '::1'
             || /^192\.168\./.test(host) || /^10\./.test(host) || host === '';
  AUDIO_BASE = isLocal ? '/audio-mp3/' : (cfg.audioBase || '/audio-mp3/');
  if (cfg.tagline) { SITE_TITLE = cfg.tagline; document.title = SITE_TITLE; }

  cfg.tracks.forEach(function(c){
    var m = marks.tracks[c.file];
    if (!m) return;
    var bal = m.balance;
    TRACKS.push({
      file: c.file,
      title: tidy(m.title || c.title || ''),
      date: m.date || c.date || '',
      dur: m.duration, bpm: m.bpm, rms: m.rmsDb,
      ratio: (bal[0]+bal[1])/(bal[4]+bal[5]),
      raw: m, bands: null
    });
  });

  inkOrder = TRACKS.slice().sort(function(a,b){ return b.ratio - a.ratio; });
  assignInks();

  // rest-state axes: loudness -> weight, low-end bias -> width
  var rmsLo = -20.4, rmsHi = -4.2, rLo = 1.22, rHi = 1.80;
  TRACKS.forEach(function(t){
    var lo = clamp((t.rms - rmsLo)/(rmsHi - rmsLo), 0, 1);
    var wd = clamp((t.ratio - rLo)/(rHi - rLo), 0, 1);
    t.bias = 0.10 + lo*0.30;
    t.idxW = Math.round(lerp(280, 820, lo));
    t.idxD = Math.round(lerp(70, 118, wd));
  });

  // a shared link lands on its song. no autoplay — browsers block it without a
  // gesture, so it sits ready and the first tap starts it.
  var want = trackBySlug(decodeURIComponent((location.hash || '').replace(/^#/, '')));
  if (want >= 0) cur = want;

  buildIndex();
  boot();
  markUrl();

  // someone edits the hash, or uses back/forward
  window.addEventListener('hashchange', function(){
    var i = trackBySlug(decodeURIComponent((location.hash || '').replace(/^#/, '')));
    if (i >= 0 && i !== cur) jump(i);
  });
}).catch(function(e){
  document.getElementById('lines').textContent = 'data unavailable';
  console.error(e);
});

function bandsOf(t){
  if (!t.bands){
    t.bands = t.raw.bands.map(b64);
    t.pk = b64(t.raw.peaks);
    // stretch each band across its own working range, so a track's structure
    // reads instead of six near-saturated bars
    t.nb = t.bands.map(function(a){
      var s = Array.prototype.slice.call(a).sort(function(x,y){ return x-y; });
      var lo = s[Math.floor(s.length*0.20)], hi = s[Math.floor(s.length*0.99)];
      var out = new Float32Array(a.length), i;
      if (hi - lo < 45){ for (i=0;i<a.length;i++) out[i] = a[i]/255; }
      else { for (i=0;i<a.length;i++) out[i] = clamp((a[i]-lo)/(hi-lo), 0, 1); }
      return out;
    });
  }
  return t.bands;
}

/* ---------------- typesetting ---------------- */

var meas = document.getElementById('meas');
function measReady(){
  meas.style.fontFamily = "'Archivo',system-ui,sans-serif";
}
// the only reliable signal that Archivo is actually rendering: two different
// fallbacks must measure identically.
function fontLive(){
  var v = meas.style.fontVariationSettings;
  meas.style.fontVariationSettings = 'normal';
  meas.textContent = 'PRESSURE 0123 MWij';
  meas.style.fontFamily = "'Archivo',monospace";
  var a = meas.getBoundingClientRect().width;
  meas.style.fontFamily = "'Archivo',serif";
  var b = meas.getBoundingClientRect().width;
  meas.style.fontFamily = "'Archivo',system-ui,sans-serif";
  meas.style.fontVariationSettings = v;
  return a > 0 && Math.abs(a - b) < 0.5;
}
var dOff = 0;   // per-title width-axis offset: the block is set wide or narrow so it fills the measure
function axes(e, off){
  var d = clamp(lerp(D_MIN,D_MAX,e) + (off === undefined ? dOff : off), 62, 125);
  return "'wght' " + Math.round(lerp(W_MIN,W_MAX,e)) + ", 'wdth' " + d.toFixed(2);
}
function w100(s, e, off){
  meas.style.fontVariationSettings = axes(e, off);
  meas.textContent = s;
  return meas.getBoundingClientRect().width;
}
function sampW(s, e){
  return e <= 0.5 ? lerp(s[0], s[1], e*2) : lerp(s[1], s[2], (e-0.5)*2);
}

function tokens(title){
  var parts = title.split(/\s+/).filter(Boolean), out = [];
  for (var i=0;i<parts.length;i++){
    if (parts[i] === '/' && out.length) out[out.length-1] += ' /';
    else out.push(parts[i]);
  }
  return out;
}

function splits(words, n){
  var out = [];
  (function walk(start, left, acc){
    if (left === 1){ out.push(acc.concat([words.slice(start).join(' ')])); return; }
    for (var i=start+1; i<=words.length-(left-1); i++)
      walk(i, left-1, acc.concat([words.slice(start,i).join(' ')]));
  })(0, n, []);
  return out;
}

function typeset(t){
  var wrap = document.getElementById('typewrap');
  var box = wrap.getBoundingClientRect();
  var M = box.width, AH = box.height;
  if (M < 80 || AH < 80) return;

  var main = t.title, sub = '';
  var mm = t.title.match(/^(.+?)\s*\((.+)\)\s*$/);
  if (mm){ main = mm[1]; sub = mm[2]; }

  var holder = document.getElementById('lines');
  holder.innerHTML = '';
  var avail = AH;
  if (sub){
    var sEl = document.createElement('span');
    sEl.id = 'sub';
    sEl.textContent = '(' + sub.toUpperCase() + ')';
    holder.appendChild(sEl);
    var sr = sEl.getBoundingClientRect();
    avail -= sr.height + parseFloat(getComputedStyle(sEl).marginBottom || 0);
  }

  dOff = 0;
  var words = tokens(main.toUpperCase());
  var maxL = Math.min(words.length, 5);
  var fitCache = {};
  var fitW = function(s){
    if (fitCache[s] === undefined) fitCache[s] = w100(s, FIT_E, 0);
    return fitCache[s];
  };

  // One size for the whole block. For each possible number of lines, the width
  // axis is opened or closed until the longest line reaches the measure at the
  // same size the height allows — so the block fills the page both ways. The
  // break that yields the largest type wins.
  var Dfit = lerp(D_MIN, D_MAX, FIT_E);
  var loOff = dLo() - Dfit, hiOff = D_HI - Dfit;
  var best = null;

  for (var L = 1; L <= maxL; L++){
    var cands = splits(words, L), pick = null;
    for (var c = 0; c < cands.length; c++){
      var w = cands[c].map(fitW), mx = 0, sum = 0, wi = 0;
      for (var i=0;i<w.length;i++){ if (w[i] > mx){ mx = w[i]; wi = i; } sum += w[i]; }
      if (mx <= 0) continue;
      var rag = 1 - (sum/w.length)/mx;
      if (!pick || mx < pick.mx*0.995 || (mx < pick.mx*1.005 && rag < pick.rag))
        pick = { lines:cands[c], mx:mx, rag:rag, wide:cands[c][wi] };
    }
    if (!pick) continue;

    var Sh = avail/(L*LEAD);
    var need = M*100/Sh;
    var off = clamp(Dfit*(need/pick.mx - 1), loOff, hiOff), got = pick.mx;
    if (Math.abs(off) > 0.05){
      got = w100(pick.wide, FIT_E, off);
      var slope = (got - pick.mx)/off;
      if (Math.abs(slope) > 0.01){
        off = clamp(off + (need - got)/slope, loOff, hiOff);
        got = w100(pick.wide, FIT_E, off);
      }
    }
    var S = Math.min(Sh, M*100/got);
    // a short rag is worse than short measure: weight the size by how much of
    // the measure the longest line can actually reach.
    var fill = clamp((got*S/100 + 0.055*S*(pick.wide.length-1))/M, 0, 1);
    var tall = clamp(L*S*LEAD/avail, 0, 1);
    var score = S * Math.pow(fill, 1.5) * (1 + 0.10*tall);
    if (!best || score > best.score) best = { S:S, off:off, lines:pick.lines, score:score };
  }
  if (!best) best = { S:48, off:0, lines:[main.toUpperCase()] };
  dOff = best.off;

  lineCfg = best.lines.map(function(txt, i){
    var samples = [w100(txt, 0), w100(txt, 0.5), w100(txt, 1)];
    var wfit = sampW(samples, FIT_E);
    var gaps = Math.max(1, txt.length - 1);
    var base = clamp((M - wfit*best.S/100)/gaps, 0, best.S*0.055);
    return { text:txt, size:best.S, samples:samples, wfit:wfit, gaps:gaps, base:base };
  });

  lineEls = lineCfg.map(function(c){
    var d = document.createElement('div');
    d.className = 'ln';
    d.style.fontSize = c.size.toFixed(2) + 'px';
    var s = document.createElement('span');
    s.textContent = c.text;
    d.appendChild(s); holder.appendChild(d);
    return s;
  });
  typeReady = true;
  applyPressure(t.bias, true);
}

function applyPressure(e, force){
  if (!typeReady) return;
  for (var i=0;i<lineEls.length;i++){
    var v = force ? e : (hist.length ? hist[Math.max(0, hist.length-1 - i*2)] : e);
    var c = lineCfg[i];
    // the letters swell, and the tracking closes on them: most of the extra
    // advance width is absorbed, the rest bleeds into the margin.
    var we = sampW(c.samples, v) * c.size / 100;
    var wf = c.wfit * c.size / 100;
    var ls = c.base + (1-K)*(wf - we)/c.gaps;
    var el = lineEls[i];
    el.style.fontVariationSettings = axes(v);
    el.style.letterSpacing = ls.toFixed(2) + 'px';
    el.style.marginRight = (-ls).toFixed(2) + 'px';
    el.style.transform = 'scaleY(' + (1 - 0.04*v).toFixed(4) + ')';
  }
}

/* ---------------- plate field ---------------- */

function fieldMin(){ return clamp(window.innerHeight*0.19, 104, 210); }

// the mark takes whatever height the title does not: the page is always full,
// and the ratio of plate to type is set by the title itself.
function seatField(){
  var root = document.documentElement;
  root.style.setProperty('--fieldmin', fieldMin().toFixed(1) + 'px');
  var fEl = document.getElementById('field');
  var wrap = document.getElementById('typewrap').getBoundingClientRect();
  var block = document.getElementById('lines').getBoundingClientRect();
  var top = fEl.getBoundingClientRect().top;
  var gap = wrap.top - top - fieldMin();
  var fh = clamp(wrap.bottom - block.height - gap - top, fieldMin(), window.innerHeight*0.56);
  root.style.setProperty('--fieldh', fh.toFixed(1) + 'px');
}

function sizeCanvas(){
  cv = cv || document.getElementById('plate');
  ctx2d = ctx2d || cv.getContext('2d');
  var r = cv.parentNode.getBoundingClientRect();
  var dpr = Math.min(2, window.devicePixelRatio || 1);
  cw = Math.max(1, Math.round(r.width)); ch = Math.max(1, Math.round(r.height));
  cv.width = Math.round(cw*dpr); cv.height = Math.round(ch*dpr);
  ctx2d.setTransform(dpr,0,0,dpr,0,0);
}

function drawField(progress){
  var t = TRACKS[cur];
  if (!ctx2d || !t) return;
  bandsOf(t);
  ctx2d.clearRect(0,0,cw,ch);
  var nb = t.nb, n = nb[0].length, strat = ch/6, px = progress*cw, colw = cw/n;

  // Six ridgelines, stroked not filled. The old version filled each band solid,
  // which at 256 stepped columns collapsed into a black slab — and now it would
  // also blot out the scene behind. Thin smoothed contours read as engraving,
  // keep all six bands legible, and let the field show through.
  ctx2d.lineJoin = 'round';
  ctx2d.lineCap = 'round';

  // 256 samples squeezed into a phone's width is ~1.5px per point, which draws
  // as hair, not a line. Resample to roughly one point per 5 CSS px and smooth
  // it, so the ridges read as contours instead of noise.
  var target = Math.max(24, Math.min(n, Math.round(cw / (5 * (window.devicePixelRatio || 1)))));
  var sm = t.smooth;
  if (!sm || t.smoothN !== target){
    sm = t.smooth = [];
    t.smoothN = target;
    for (var b2=0;b2<6;b2++){
      var srcA = nb[b2], down = new Float32Array(target), q;
      for (q=0;q<target;q++){                        // area-average, not point-sample
        var a0 = Math.floor(q*n/target), a1 = Math.max(a0+1, Math.floor((q+1)*n/target));
        var acc = 0, cnt = 0;
        for (var z=a0; z<a1 && z<n; z++){ acc += srcA[z]; cnt++; }
        down[q] = cnt ? acc/cnt : 0;
      }
      var pass = down;                               // two light blur passes
      for (var k2=0;k2<1;k2++){
        var next = new Float32Array(target);
        for (q=0;q<target;q++){
          var pm = pass[Math.max(0,q-1)], pc = pass[q], pp = pass[Math.min(target-1,q+1)];
          next[q] = pm*0.25 + pc*0.5 + pp*0.25;
        }
        pass = next;
      }
      sm.push(pass);
    }
  }

  // Live level per band while playing, so the trace answers the music instead
  // of sitting there as six fixed hairlines.
  var lb = playing ? liveBands() : null;

  for (var b=0;b<6;b++){
    var lv = lb ? lb[b] : 0;
    var base = ch - strat*b - strat*0.10;   // bass at the foot, treble at the head
    // amplitude rides its own band's live level; the whole line also lifts a
    // little on a hit, which is what reads as movement at a glance
    var mt = strat*(1.02 + lv*0.62);
    var lift = lv*strat*0.20;
    var arr = sm[b], m2 = arr.length, cw2 = cw/(m2-1);
    var pts = [];
    for (var i=0;i<m2;i++){
      pts.push([i*cw2, base - lift - Math.pow(arr[i], 1.22)*mt]);
    }

    var trace = function(){
      ctx2d.beginPath();
      ctx2d.moveTo(pts[0][0], pts[0][1]);
      for (var i=0;i<pts.length-1;i++){
        var mx = (pts[i][0]+pts[i+1][0])*0.5, my = (pts[i][1]+pts[i+1][1])*0.5;
        ctx2d.quadraticCurveTo(pts[i][0], pts[i][1], mx, my);
      }
      ctx2d.lineTo(pts[pts.length-1][0], pts[pts.length-1][1]);
    };

    // a whisper of tone under the ridge so the stack still reads as strata
    trace();
    ctx2d.lineTo(cw, base); ctx2d.lineTo(0, base); ctx2d.closePath();
    ctx2d.fillStyle = 'rgba(237,233,225,0.05)';
    ctx2d.fill();

    if (!playing){
      trace();
      ctx2d.strokeStyle = 'rgba(237,233,225,0.78)';
      ctx2d.lineWidth = 1.25;
      ctx2d.stroke();
    } else {
      // behind the playhead: inked. ahead of it: still faint.
      ctx2d.save();
      ctx2d.beginPath(); ctx2d.rect(0,0,px,ch); ctx2d.clip();
      trace();
      ctx2d.strokeStyle = 'rgba(237,233,225,1)';
      ctx2d.lineWidth = 1.8;
      ctx2d.stroke();
      ctx2d.restore();

      ctx2d.save();
      ctx2d.beginPath(); ctx2d.rect(px,0,cw-px,ch); ctx2d.clip();
      trace();
      ctx2d.strokeStyle = 'rgba(237,233,225,0.46)';
      ctx2d.lineWidth = 1.1;
      ctx2d.stroke();
      ctx2d.restore();
    }
  }
}

/* ---------------- audio ---------------- */

function ensureAudio(){
  if (audio) return;
  audio = new Audio();
  audio.crossOrigin = 'anonymous';
  audio.preload = 'metadata';
  audio.addEventListener('ended', function(){ go(1, true); });
  audio.addEventListener('playing', function(){ switching = false; setPlaying(true); });
  // swapping src fires pause; that must not flip the page back to plate
  audio.addEventListener('pause', function(){ if (!switching) setPlaying(false); });
  // A track whose file is missing used to swallow every click in silence —
  // press play, nothing happens, forever. Mark it dead and move to the next
  // one that works, so play always does something on the first press.
  audio.addEventListener('error', function(){
    var t = TRACKS[cur];
    if (!t) return;
    var want  = srcFor(t);
    var local = '/audio-mp3/' + encodeURIComponent(t.file);
    var src   = audio.getAttribute('src');
    if (src !== want && src !== local) return;        // stale error from a swap
    // R2 miss -> try the copy shipped with the site before giving up. Same
    // fallback the main page has used since b144.
    if (src === want && AUDIO_BASE !== '/audio-mp3/' && !triedLocal[t.file]){
      triedLocal[t.file] = true;
      switching = true;
      setTimeout(function(){ switching = false; }, 900);
      audio.setAttribute('src', local);
      audio.load();
      var pr = audio.play();
      if (pr && pr.catch) pr.catch(function(){});
      return;
    }
    setPlaying(false);
  });
}

function srcFor(t){
  return (triedLocal[t.file] ? '/audio-mp3/' : AUDIO_BASE) + encodeURIComponent(t.file);
}

// Load the current track's source WITHOUT starting playback, so the timeline
// can be scrubbed on a track that has never been played. ensureAudio() alone
// makes a src-less element — seeking that silently does nothing.
function ensureLoaded(){
  ensureAudio();
  var want = srcFor(TRACKS[cur]);
  if (audio.getAttribute('src') !== want){
    switching = true;
    setTimeout(function(){ switching = false; }, 900);
    audio.setAttribute('src', want);
    audio.load();
  }
}

// currentTime is only writable once metadata has landed; before that, park the
// request and apply it on loadedmetadata.
var pendingSeek = -1;
function seekSafe(sec){
  if (!audio) return;
  if (audio.readyState >= 1){
    try { audio.currentTime = sec; } catch(e){}
    return;
  }
  pendingSeek = sec;
  audio.addEventListener('loadedmetadata', function h(){
    audio.removeEventListener('loadedmetadata', h);
    if (pendingSeek >= 0){
      try { audio.currentTime = pendingSeek; } catch(e){}
      pendingSeek = -1;
    }
  });
}

/* ---------------- the scene ----------------
   One shader, 72 outcomes. Six plane waves interfere on a domain-warped
   field — the same physics that draws Chladni figures when you bow a metal
   plate, which is the literal version of what this page already calls its
   two states. Every parameter is taken from the track: the six band levels
   set each wave's amplitude and wavelength, bpm sets drift speed, crest sets
   how hard the nodal lines snap, onset rate sets turbulence, and a hash of
   the filename rotates the whole figure. Nothing is hand-authored, so all 72
   differ and each is always itself. Live bass ripples out from the centre
   while it plays; when silent it breathes on the baked values instead. */
var BGV = 'attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}';
var BG_SCENES = "vec3 truchet_h33(vec2 p, float s){\n  vec3 q = fract(vec3(p.x, p.y, p.x * 0.31 + p.y * 0.77 + s) * vec3(0.1031, 0.1030, 0.0973));\n  q += dot(q, q.yxz + 33.33);\n  return fract((q.xxy + q.yxx) * q.zyx);\n}\n\nfloat truchet_h11(vec2 p, float s){\n  vec3 q = fract(vec3(p.x, p.y, s) * vec3(0.1031, 0.1030, 0.0973));\n  q += dot(q, q.yzx + 19.19);\n  return fract((q.x + q.y) * q.z);\n}\n\n// one tile: local coords f in [-0.5,0.5], picks a motif and a rotation from its own clock\nfloat truchet_cell(vec2 f, vec2 id, float beat, float w, float aa, float seed, float punch, float drop){\n  vec3 h = truchet_h33(id, seed);\n\n  float per = 2.0 + floor(h.x * 6.0);               // this tile turns every 2..7 beats\n  float u = (beat + floor(h.y * 8.0) * 0.25) / per; // staggered onto sixteenths\n  float c = floor(u);\n  float fr = u - c;\n  float sp = smoothstep(0.0, 0.42 / per, fr);       // the quarter-turn itself\n\n  vec2 pid = id + vec2(41.0, 23.0);\n  float pn = truchet_h11(pid, seed + mod(c, 64.0) * 2.13);\n  float pp = truchet_h11(pid, seed + mod(c - 1.0, 64.0) * 2.13);\n  float pres = mix(step(drop, pp), step(drop, pn), sp);\n\n  float fl = max(0.0, 1.0 - fr * per * 2.2);\n  float ww = min(w * (1.0 + punch * fl * fl), 0.125);\n\n  float cov;\n  if (h.z < 0.15) {\n    // junction: four legs, half of them drilled through by a pad\n    float isPad = step(0.5, h.y);\n    float hole = isPad * 0.115;\n    float rr = length(f);\n    float hm = smoothstep(hole - aa, hole + aa, rr);\n    float legs = (1.0 - smoothstep(ww - aa, ww + aa, min(abs(f.x), abs(f.y)))) * hm;\n    float pad = (1.0 - smoothstep(0.255 - aa, 0.255 + aa, rr)) * hm * isPad;\n    cov = max(legs, pad);\n  } else {\n    // two quarter arcs, spun a quarter turn per event -> the maze rewires\n    float a = 1.5707963 * (mod(c, 4.0) + sp);\n    float ca = cos(a);\n    float sa = sin(a);\n    vec2 q = vec2(ca * f.x - sa * f.y, sa * f.x + ca * f.y);\n    float d = min(abs(length(q + 0.5) - 0.5), abs(length(q - 0.5) - 0.5));\n    cov = 1.0 - smoothstep(ww - aa, ww + aa, d);\n  }\n  return pres * cov;\n}\n\nfloat scene_TRUCHET(vec2 uv, float t, float lvl, float sd, float bpmN, float crestN, float onsetN, vec3 b0, vec3 b1){\n  float sq = clamp(sd, 0.0, 1.0);\n  float lv = clamp(lvl, 0.0, 1.0);\n  float seed = 3.0 + sq * 47.0;\n  float k = floor(sq * 3.99);\n\n  float ga = k * 0.261799;\n  float cg = cos(ga);\n  float sg = sin(ga);\n  vec2 p = vec2(cg * uv.x - sg * uv.y, sg * uv.x + cg * uv.y);\n\n  vec2 dir = vec2(0.94, -0.34 + 0.68 * sq);\n  dir *= inversesqrt(max(dot(dir, dir), 0.0001));\n  p += dir * (t * (0.006 + 0.013 * sq));\n\n  float S = 4.6 + k * 0.75;\n  vec2 g = p * S;\n  vec2 id = floor(g);\n  vec2 f = g - id - 0.5;\n\n  float beat = t * (0.40 + 1.35 * clamp(bpmN, 0.0, 1.0));\n\n  float lo = (b0.x + b0.y + b0.z) * 0.3333;\n  float hi = (b1.x + b1.y + b1.z) * 0.3333;\n  float r = min(length(uv), 2.0);\n  float en = mix(lo, hi, clamp(r * 1.7, 0.0, 1.0));\n\n  float w = clamp(0.064 + 0.032 * lv + 0.018 * (clamp(b0.x, 0.0, 1.3) - 0.45), 0.050, 0.100);\n  float aa = 0.0024 * S;\n  float punch = min(0.85, (0.15 + 0.75 * lv) * (0.50 + 0.60 * clamp(crestN, 0.0, 1.0)));\n  float drop = 0.07 + 0.11 * clamp(onsetN, 0.0, 1.0);\n\n  // where the plate resolves into finer tiles: a slow sweep, pushed by the bands\n  float wave = 0.5 + 0.5 * sin(t * 0.11 + r * 3.4 - sq * 6.28);\n  float subT = clamp(0.04 + 0.22 * wave * (0.5 + 0.5 * sq) + 0.18 * (en - 0.55), 0.0, 0.42);\n  float hs = truchet_h11(id + vec2(3.7, -2.9), seed + 21.0);\n  float m = smoothstep(subT - 0.03, subT + 0.03, hs);\n\n  vec2 g2 = g * 2.0;\n  vec2 id2 = floor(g2);\n  vec2 f2 = g2 - id2 - 0.5;\n\n  float cov;\n  if (m > 0.99) {\n    cov = truchet_cell(f, id, beat, w, aa, seed, punch, drop);\n  } else if (m < 0.01) {\n    cov = truchet_cell(f2, id2, beat, w * 0.62, aa * 2.0, seed + 13.0, punch, drop);\n  } else {\n    // retiling cell: the old resolution clears before the new one lands\n    float cf = truchet_cell(f2, id2, beat, w * 0.62, aa * 2.0, seed + 13.0, punch, drop);\n    float cc = truchet_cell(f, id, beat, w, aa, seed, punch, drop);\n    cov = max(cf * (1.0 - smoothstep(0.0, 0.62, m)), cc * smoothstep(0.38, 1.0, m));\n  }\n\n  float dc = length(abs(f) - 0.5);\n  float reg = (1.0 - smoothstep(0.030, 0.030 + aa * 2.0, dc)) * 0.22;\n\n  return clamp(max(cov, reg), 0.0, 1.0);\n}\nfloat halftone_h11(float n){\n  return fract(sin(n*91.7 + 3.13)*43758.5453);\n}\n\nfloat halftone_h21(vec2 p){\n  return fract(sin(dot(p, vec2(127.1, 311.7)))*43758.5453);\n}\n\nvec2 halftone_spin(vec2 p, float a){\n  float c = cos(a);\n  float s = sin(a);\n  return vec2(c*p.x - s*p.y, s*p.x + c*p.y);\n}\n\n// the continuous plate the screen samples: four drifting masses\nfloat halftone_plate(vec2 p, float t, float sd, float drift, float rad){\n  float v = 0.0;\n  for (int i = 0; i < 4; i++){\n    float fi = float(i);\n    float a = fract(sd*7.31 + fi*0.6180339);\n    float b = fract(sd*3.77 + fi*0.3819660 + 0.37);\n    float sp = drift*(0.55 + a*0.90);\n    float ph = b*6.2831853;\n    vec2 c = vec2(cos(sp*t + ph)*(0.30 + a*0.55),\n                  sin(sp*t*0.79 + ph*1.7)*(0.13 + b*0.26));\n    float rr = rad*(0.62 + b*0.70);\n    float r2 = rr*rr;\n    vec2 d = p - c;\n    v += r2/(dot(d, d) + r2 + 0.0001);\n  }\n  return v;\n}\n\nfloat scene_HALFTONE(vec2 uv, float t, float lvl, float sd, float bpmN, float crestN, float onsetN, vec3 b0, vec3 b1){\n  vec3 lo = clamp(b0 - 0.2, 0.0, 1.0);\n  vec3 hi = clamp(b1 - 0.2, 0.0, 1.0);\n\n  // screen angle, one of the three printers' angles, creeping very slowly\n  float ang = radians(15.0 + floor(sd*2.99)*30.0) + t*0.0075;\n  vec2 sp = halftone_spin(uv, ang);\n\n  // screen ruling, breathing a hair so the grid is never dead\n  float cs = mix(0.028, 0.044, halftone_h11(sd*13.0 + 1.7));\n  cs *= 1.0 + 0.035*sin(t*0.21);\n\n  vec2 g = sp/cs;\n  float shift = step(0.5, fract(sd*5.0))*0.5*mod(floor(g.y), 2.0);\n  g.x += shift;\n  vec2 cid = floor(g);\n  vec2 f = g - cid - 0.5;\n\n  // one plate sample per cell, taken at the cell centre -> quantised marks, not tone\n  vec2 cpos = halftone_spin(vec2((cid.x + 0.5 - shift)*cs, (cid.y + 0.5)*cs), -ang);\n\n  float drift = 0.16 + bpmN*0.42;\n  float rad = 0.20 + 0.05*lo.y + 0.035*lvl;\n  float v = halftone_plate(cpos, t, sd, drift, rad);\n  v = v/(1.0 + v);\n\n  // squeegee: a denser band pulled across the plate\n  float swp = fract(t*0.055 + sd);\n  float sw = clamp((cpos.x*0.55 + cpos.y*0.85 - (swp*2.2 - 1.1))*2.4, -6.0, 6.0);\n  v += (0.08 + 0.08*lvl)*exp(-sw*sw);\n\n  v += 0.07*lo.z*sin(cpos.x*6.7 + t*0.6)*sin(cpos.y*5.1 - t*0.47);\n\n  v = clamp(v*1.60 - (0.36 + 0.09*lvl), 0.0, 1.0);\n  v = mix(v, smoothstep(0.22, 0.62, v), 0.30 + 0.55*crestN);\n  v = 0.22 + 0.78*v;\n\n  float rr = length(vec2(uv.x*0.52, uv.y));\n  v *= 1.0 - 0.65*smoothstep(0.32, 0.86, rr);\n  v = clamp(v + lvl*(0.03 + 0.05*lo.x), 0.0, 1.0);\n\n  float ch = halftone_h21(cid + vec2(sd*37.0, sd*11.0));\n  v *= 0.90 + 0.20*ch;\n\n  // a flip band runs along a screen row and turns its cells edge-on\n  float rowH = halftone_h11(cid.y*0.137 + sd*9.0 + 4.2);\n  float rate = 0.05 + 0.22*onsetN + 0.10*lvl;\n  float wph = fract(t*rate*(0.5 + rowH) + rowH);\n  float wd = clamp((cid.x - (wph*2.0 - 1.0)*120.0)*0.34, -6.0, 6.0);\n  float flip = exp(-wd*wd)*(0.35 + 0.65*onsetN);\n\n  // mark shape: round -> dash in the highlights (hi.y), round -> square (hi.x)\n  vec2 q = abs(f);\n  float dash = 0.55*hi.y*(1.0 - smoothstep(0.35, 0.78, v));\n  q.x /= 1.0 + 1.3*dash;\n  q.y *= (1.0 + 1.1*dash)*(1.0 + 5.0*flip);\n\n  float sqn = clamp(hi.x*1.15, 0.0, 1.0);\n  float dm = mix(length(q), max(q.x, q.y)*1.05, sqn);\n\n  float r = (0.60 + 0.09*lvl)*v*(1.0 - 0.14*sqn);\n  float e = 0.05 + 0.04*flip;\n  float ink = (1.0 - smoothstep(r - e, r + e, dm))*smoothstep(0.0, 0.05, r);\n\n  // the screen plugs in the shadows: paper survives as shrinking dots on the dual lattice\n  vec2 f2 = abs(fract(g + 0.5) - 0.5);\n  float d2 = mix(length(f2), max(f2.x, f2.y)*1.05, sqn);\n  float wr = (0.28 + 0.05*hi.z)*(1.0 - 0.10*sqn)*smoothstep(0.66, 1.0, v)*(1.0 - 0.15*lvl);\n  ink -= (1.0 - smoothstep(wr, wr + 0.07, d2))*smoothstep(0.02, 0.06, wr);\n\n  return clamp(ink, 0.0, 1.0);\n}\n/* ---- SMOKE : ink bleeding into wet paper. domain-warped fbm advection ---- */\n\nmat2 smoke_rot(float a){\n  float c = cos(a), s = sin(a);\n  return mat2(c, -s, s, c);\n}\n\nfloat smoke_h21(vec2 p){\n  return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453);\n}\n\n/* two decorrelated channels off one sine \u2014 a displacement field for the price of one noise */\nvec2 smoke_h22(vec2 p){\n  float n = sin(dot(p, vec2(127.1, 311.7))) * 43758.5453;\n  return fract(vec2(n, n * 0.61803399));\n}\n\nfloat smoke_vn(vec2 p){\n  vec2 i = floor(p);\n  vec2 f = p - i;\n  vec2 u = f * f * (3.0 - 2.0 * f);\n  float a = smoke_h21(i);\n  float b = smoke_h21(i + vec2(1.0, 0.0));\n  float c = smoke_h21(i + vec2(0.0, 1.0));\n  float d = smoke_h21(i + vec2(1.0, 1.0));\n  return mix(mix(a, b, u.x), mix(c, d, u.x), u.y);\n}\n\nvec2 smoke_vn2(vec2 p){\n  vec2 i = floor(p);\n  vec2 f = p - i;\n  vec2 u = f * f * (3.0 - 2.0 * f);\n  vec2 a = smoke_h22(i);\n  vec2 b = smoke_h22(i + vec2(1.0, 0.0));\n  vec2 c = smoke_h22(i + vec2(0.0, 1.0));\n  vec2 d = smoke_h22(i + vec2(1.0, 1.0));\n  return mix(mix(a, b, u.x), mix(c, d, u.x), u.y);\n}\n\n/* one pass, three products: x = soft mass, y = broad ridge (mottling inside the\n   ink), z = fine ridge (the filaments). the upper octaves are stretched slightly\n   so the finest detail runs along one axis, the way ink follows the grain */\nvec3 smoke_plume(vec2 p){\n  float n0 = smoke_vn(p);\n  float n1 = smoke_vn(p * vec2(2.07, 2.31) + vec2(17.3, -9.1));\n  float n2 = smoke_vn(p * vec2(4.55, 3.05) + vec2(-5.7, 23.9));\n  float r0 = 1.0 - abs(n0 + n0 - 1.0);\n  float r1 = 1.0 - abs(n1 + n1 - 1.0);\n  float r2 = 1.0 - abs(n2 + n2 - 1.0);\n  return vec3(n0 * 0.50 + n1 * 0.31 + n2 * 0.19,\n              r0 * 0.26 + r1 * 0.34 + r2 * 0.40,\n              r1 * 0.36 + r2 * 0.64);\n}\n\n/* a released puff spreading and dispersing. envelope is 0 at both ends so it never pops */\nfloat smoke_puff(float r, float k, float reach){\n  float R = 0.09 + k * reach;\n  float e = k * (1.0 - k) * 4.0;\n  float x = r / R;\n  return e * exp(-x * x * 1.6);\n}\n\nfloat scene_SMOKE(vec2 uv, float t, float lvl, float sd, float bpmN, float crestN, float onsetN, vec3 b0, vec3 b1){\n  float bass = clamp(b0.x * 0.55 + b0.y * 0.45, 0.0, 1.4);\n  float mids = clamp(b0.z * 0.50 + b1.x * 0.50, 0.0, 1.4);\n  float treb = clamp(b1.y * 0.45 + b1.z * 0.55, 0.0, 1.4);\n  float L  = clamp(lvl, 0.0, 1.0);\n  float sa = sd * 6.2831853;\n  float rr = length(uv);\n\n  /* advection. the drift is the integral of a unit heading that rotates slowly,\n     which stays bounded for every t \u2014 the field flows forever and the noise\n     lattice never runs out of precision */\n  float wA = 0.026 + bpmN * 0.016;\n  float aA = t * wA + sa;\n  vec2  dA = vec2(sin(aA), -cos(aA)) * ((0.11 + bpmN * 0.06) / wA);\n  float wB = 0.083 + bpmN * 0.055;\n  float aB = t * wB - sa * 1.7 + 2.4;\n  vec2  dB = vec2(sin(aB), -cos(aB)) * ((0.33 + bpmN * 0.22) / wB);\n\n  /* warp 1 \u2014 the slow billow. bass swells it */\n  vec2 p0 = smoke_rot(sa) * uv * (1.85 + sd * 0.60) + dA;\n  vec2 g0 = smoke_vn2(p0);\n  vec2 W1 = (g0 - 0.5) * (0.95 + bass * 0.85 + L * 0.45);\n\n  /* warp 2 \u2014 curl in the detail. treble tightens it */\n  vec2 p1 = smoke_rot(2.2 - sa * 1.4) * uv * (4.30 + treb * 1.40) + W1 * 0.75 + dB;\n  vec2 g1 = smoke_vn2(p1);\n  vec2 W2 = (g1 - 0.5) * (0.55 + treb * 0.40 + mids * 0.20 + onsetN * 0.30);\n\n  /* the ink itself, read through both warps */\n  vec2 p2 = smoke_rot(4.4 + sa * 0.8) * uv * (5.10 - bass * 0.80 + treb * 1.30 + sd * 1.10)\n          + W1 * 1.15 + W2 * 0.95 + dA * 0.90 + dB * 0.45;\n  vec3 F = smoke_plume(p2);\n  float mass = F.x;\n\n  /* the ink has a source, so it thins with distance from it \u2014 that is what keeps\n     the frame edges open instead of packing the whole page with fog */\n  vec2  src = vec2(cos(sa * 1.3), sin(sa * 2.1)) * 0.22;\n  float rs  = length(uv - src);\n\n  /* two fronts: a wide bleed into the fibre and a tighter body of ink inside it,\n     with the wet edge that collects where the bleed stopped */\n  float thr  = 0.385 - L * 0.050 - bass * 0.020 - crestN * 0.015\n             + (0.075 + (1.0 - L) * 0.070) * smoothstep(0.18, 1.05, rs);\n  float halo = smoothstep(thr - 0.06, thr + 0.26, mass);\n  float core = smoothstep(thr + 0.10, thr + 0.34, mass);\n  float rim  = halo * (1.0 - core);\n\n  float mott = clamp(0.80 + (F.y - 0.5) * (0.55 + treb * 0.35), 0.0, 1.12);\n  float wisp = smoothstep(0.50 + treb * 0.05, 0.93, F.z) * (halo * 0.86 + 0.14) * (0.15 + treb * 0.09);\n  float veil = smoothstep(0.45, 0.98, g0.x * 0.62 + g0.y * 0.38) * (0.060 + bass * 0.050);\n\n  /* injection \u2014 new ink released at the source, blooming then dispersing. it only\n     lights where there is already structure, so it never resolves into a disc */\n  float ph  = t * (0.13 + bpmN * 0.19) + sd;\n  float reach = 0.50 + crestN * 0.40;\n  float bl  = smoke_puff(rs, fract(ph), reach) + smoke_puff(rs, fract(ph + 0.5), reach);\n  float inj = L * L * 0.22 * bl * (0.15 + smoothstep(0.32, 0.76, mass));\n\n  float ink = clamp(halo * 0.18 + core * 0.55 * mott + rim * 0.14 + wisp + veil, 0.0, 1.0);\n  ink = 1.0 - (1.0 - ink) * (1.0 - clamp(inj, 0.0, 0.8));\n  ink *= 0.66 + 0.34 * (1.0 - smoothstep(0.12, 1.30, rr));\n  return clamp(ink, 0.0, 1.0);\n}\nvec2 cell_hash2(vec2 p){\n  vec3 k = fract(vec3(p.xyx) * vec3(0.1031, 0.1030, 0.0973));\n  k += dot(k, k.yzx + 33.33);\n  return fract((k.xx + k.yz) * k.zy);\n}\n\nvec2 cell_rot(vec2 p, float a){\n  float c = cos(a);\n  float s = sin(a);\n  return vec2(c * p.x - s * p.y, s * p.x + c * p.y);\n}\n\nvec3 cell_voro(vec2 p, float jit, float orb, float ph){\n  vec2 ip = floor(p);\n  vec2 fp = p - ip;\n  float f1 = 10.0;\n  float f2 = 10.0;\n  float id = 0.0;\n  for (int j = 0; j < 3; j++){\n    for (int i = 0; i < 3; i++){\n      vec2 g = vec2(float(i) - 1.0, float(j) - 1.0);\n      vec2 h = cell_hash2(ip + g);\n      vec2 osc = (abs(fract(h.yx + ph * (0.6 + h)) - 0.5) - 0.25) * 4.0;\n      vec2 d = g + 0.5 + (h - 0.5) * jit + osc * orb - fp;\n      float e = dot(d, d);\n      float w = step(e, f1);\n      f2 = min(f2, max(f1, e));\n      f1 = min(f1, e);\n      id = mix(id, fract(h.x + 1.37 * h.y), w);\n    }\n  }\n  return vec3(sqrt(f1), sqrt(f2), id);\n}\n\nfloat scene_CELL(vec2 uv, float t, float lvl, float sd, float bpmN, float crestN, float onsetN, vec3 b0, vec3 b1){\n  float lo  = clamp(b0.x, 0.0, 1.3);\n  float mid = clamp(b0.y, 0.0, 1.3);\n  float bod = clamp(b0.z, 0.0, 1.3);\n  float h1  = clamp(b1.x, 0.0, 1.3);\n  float h2  = clamp(b1.y, 0.0, 1.3);\n  float h3  = clamp(b1.z, 0.0, 1.3);\n\n  vec2 imp = 0.30 * vec2(sin(t * 0.113 + sd * 6.283), cos(t * 0.091 + sd * 4.117));\n  vec2 q = uv - imp;\n  float dens = exp(-2.4 * dot(q, q));\n\n  float cs = 7.0 + 3.0 * sd + 1.4 * bpmN;\n  vec2 p = cell_rot(uv, 0.35 + sd * 2.6 + 0.021 * t);\n  p.y *= 0.60 + 0.55 * sd;\n  p *= cs * (1.0 + 0.35 * dens * (0.40 + 0.60 * lo));\n  p += vec2(0.11, -0.07) * t * (0.4 + 0.9 * bpmN);\n  p += 0.35 * sin(p.yx * 0.33 + vec2(0.19 * t, -0.15 * t) + sd * 11.0);\n\n  float jit = 0.52 + 0.08 * sd;\n  float orb = 0.10 + 0.05 * clamp(mid - 0.2, 0.0, 1.0) + 0.04 * lvl;\n  float ph  = t * (0.34 + 0.55 * bpmN + 0.45 * onsetN);\n\n  vec3 v = cell_voro(p, jit, orb, ph);\n  float f1 = v.x;\n  float gap = v.y - v.x;\n  float id = v.z;\n\n  float fire = fract(t * (0.21 + 0.70 * bpmN) + id * 3.17);\n\n  float ew = mix(0.095, 0.038, crestN) * (0.85 + 0.30 * lo) + 0.028 * lvl * (1.0 - fire);\n  ew = clamp(ew, 0.020, 0.130);\n  float edge = (1.0 - smoothstep(0.0, ew, gap)) * clamp(0.76 + 0.16 * lvl + 0.18 * dens, 0.0, 0.95);\n\n  float bevel = (1.0 - smoothstep(0.0, 0.020, abs(gap - (0.11 + 0.05 * sd)))) * (0.08 + 0.18 * h3);\n\n  float tv = fract(id * 5.37 + sd * 2.13);\n  float has = smoothstep(0.20, 0.32, tv);\n  vec2 hp = cell_rot(uv, fract(id * 3.71) * 3.14159 + 0.4 * sd) * (cs * (4.6 + 2.2 * h1))\n          + vec2(id * 17.3, id * 9.1);\n  vec2 hq = fract(hp) - 0.5;\n  float hd = sqrt(dot(hq, hq) + 0.000001);\n  float rad = clamp((0.16 + 0.24 * fract(id * 11.7 + sd)) * (0.78 + 0.35 * h2) + 0.05 * lvl * (1.0 - fire), 0.0, 0.40);\n  float tint = (1.0 - smoothstep(rad - 0.06, rad + 0.06, hd)) * has\n             * smoothstep(0.0, 0.045, gap) * (0.52 + 0.26 * bod);\n\n  float seed = (1.0 - smoothstep(0.020, 0.052, f1)) * (0.40 + 0.55 * lvl);\n\n  float sg = smoothstep(0.52, 0.60, fract(id * 7.13 + 0.31));\n  float rr = f1 - fire * 0.85;\n  float shock = exp(-520.0 * rr * rr) * (1.0 - fire) * sg * (0.25 + 0.75 * lvl) * (0.45 + 0.55 * onsetN);\n  float flash = sg * max(0.0, 1.0 - 3.0 * fire) * lvl * 0.20 * smoothstep(0.0, 0.045, gap);\n\n  float ink = edge;\n  ink += bevel * (1.0 - ink);\n  ink += tint * (1.0 - ink);\n  ink += flash * (1.0 - ink);\n  ink += seed * 0.85 * (1.0 - ink);\n  ink += shock * 0.80 * (1.0 - ink);\n  return clamp(ink, 0.0, 1.0);\n}\n/* ---- DEPTH : a lattice block, sphere-traced. real solid, real normals ---- */\n\nvec2 depth_spin(vec2 p, float a){\n  float c = cos(a);\n  float s = sin(a);\n  return vec2(c*p.x - s*p.y, s*p.x + c*p.y);\n}\n\nfloat depth_h11(float n){\n  return fract(sin(n*127.1 + 31.7)*43758.5453);\n}\n\nvec3 depth_orient(vec3 v, vec3 a){\n  v.xy = depth_spin(v.xy, a.z);\n  v.xz = depth_spin(v.xz, a.x);\n  v.yz = depth_spin(v.yz, a.y);\n  return v;\n}\n\n/* the solid: a rounded slab with a gyroid labyrinth cut clean through it.\n   e = half extents. cf.x twist, cf.y lattice pitch, cf.z wall, cf.w chatter */\nfloat depth_map(vec3 p, vec3 e, vec4 cf, float ph){\n  p.xz = depth_spin(p.xz, cf.x*p.y);\n\n  vec3 q = abs(p) - e;\n  float box = length(max(q, 0.0)) + min(max(q.x, max(q.y, q.z)), 0.0) - 0.16;\n\n  vec3 g = p*cf.y + vec3(0.0, ph, ph*0.6);\n  float w = dot(sin(g), cos(g.yzx));\n  float lat = (abs(w) - cf.z)/(2.4*cf.y);\n\n  float d = max(box, lat);\n  d -= cf.w*sin(p.x*8.3 + p.z*5.1 + ph*2.4)*sin(p.y*9.7 - p.x*4.2 - ph*1.7);\n  return d;\n}\n\nfloat scene_DEPTH(vec2 uv, float t, float lvl, float sd, float bpmN, float crestN, float onsetN, vec3 b0, vec3 b1){\n  float L    = clamp(lvl, 0.0, 1.0);\n  float bpm  = clamp(bpmN, 0.0, 1.0);\n  float crs  = clamp(crestN, 0.0, 1.0);\n  float ons  = clamp(onsetN, 0.0, 1.0);\n  float bass = clamp(b0.x*0.60 + b0.y*0.40 - 0.20, 0.0, 1.0);\n  float mid  = clamp(b0.z*0.50 + b1.x*0.50 - 0.20, 0.0, 1.0);\n  float treb = clamp(b1.y*0.45 + b1.z*0.55 - 0.20, 0.0, 1.0);\n  float sq   = clamp(sd, 0.0, 1.0);\n\n  float s0 = depth_h11(sq*7.31 + 0.31);\n  float s1 = depth_h11(sq*3.77 + 1.73);\n  float s2 = depth_h11(sq*11.13 + 4.41);\n\n  /* proportions: a slab for some tracks, a near-cube for others */\n  float swell = 1.0 + 0.11*bass + 0.06*L;\n  vec3 e = vec3(0.86 + 0.30*s0, 0.46 + 0.60*s1, 0.86 + 0.26*s2)*swell;\n\n  vec4 cf;\n  cf.x = (0.16 + 0.34*s2)*(1.0 + 0.50*mid)*(0.70 + 0.30*sin(t*0.13 + sq*6.2831853));\n  cf.y = 3.6 + 2.6*s0 + 0.7*bpm;\n  cf.z = 0.40 + 0.18*s1 + 0.22*bass + 0.10*L;\n  cf.w = 0.004 + 0.011*treb;\n  float ph = t*(0.16 + 0.30*bpm + 0.18*ons);\n\n  /* the rig turned into the block's frame - axis and rate both come off the seed */\n  vec3 ang = vec3(t*(0.052 + 0.050*bpm) + sq*6.2831853,\n                  0.26 + 0.52*sin(t*(0.029 + 0.021*s1) + s0*6.2831853),\n                  1.10*s1 + sq*2.6);\n\n  vec3 ro  = depth_orient(vec3(0.0, 0.0, -2.80), ang);\n  vec3 rd  = depth_orient(normalize(vec3(uv*0.80, 1.0)), ang);\n  vec3 lig = depth_orient(normalize(vec3(-0.55, 0.76, -0.42)), ang);\n  vec3 fil = depth_orient(normalize(vec3( 0.64, -0.32, -0.70)), ang);\n\n  /* bounding sphere - everything outside it is paper, for free */\n  float R  = length(e) + 0.16 + cf.w + 0.04;\n  float bb = dot(ro, rd);\n  float cc = dot(ro, ro) - R*R;\n  float hh = bb*bb - cc;\n  if (hh <= 0.0) return 0.0;\n  float sr = sqrt(hh);\n  float tn = max(-bb - sr, 0.0);\n  float tf = -bb + sr;\n\n  float tt = tn;\n  float dd = 1.0;\n  for (int i = 0; i < 18; i++){\n    dd = depth_map(ro + rd*tt, e, cf, ph);\n    if (dd < 0.0016) break;\n    tt += dd*0.68;\n    if (tt > tf) break;\n  }\n\n  float hit = (1.0 - smoothstep(0.0018, 0.0140, dd))*step(tt, tf);\n  if (hit <= 0.0) return 0.0;\n\n  vec3 p = ro + rd*tt;\n  float hE = 0.0035;\n  vec2 kk = vec2(1.0, -1.0);\n  vec3 n = kk.xyy*depth_map(p + kk.xyy*hE, e, cf, ph)\n         + kk.yyx*depth_map(p + kk.yyx*hE, e, cf, ph)\n         + kk.yxy*depth_map(p + kk.yxy*hE, e, cf, ph)\n         + kk.xxx*depth_map(p + kk.xxx*hE, e, cf, ph);\n  vec3 N = n*inversesqrt(max(dot(n, n), 1.0e-9));\n\n  float key = 0.5 + 0.5*dot(N, lig);\n  key = key*key;\n  float fkey = max(dot(N, fil), 0.0);\n  float amb = 0.17 + 0.08*(0.5 + 0.5*N.y);\n  float fac = clamp(1.0 + dot(N, rd), 0.0, 1.0);\n  float rim = smoothstep(0.30 + 0.16*L, 0.95, fac*fac*fac)*(0.30 + 0.34*L + 0.16*crs);\n\n  /* depth only starts costing tone once the ray is inside the form */\n  float fog = exp(-max(tt - tn, 0.0)*(0.40 + 0.20*(1.0 - L)));\n\n  /* tone separations, the way a press would pull it */\n  float lev = 4.0 + floor(crs*2.99);\n  float body = clamp(amb + 0.54*key + 0.22*fkey, 0.0, 0.78);\n  body = mix(body, floor(body*lev + 0.5)/lev, 0.82);\n\n  return clamp((body + rim)*fog*hit, 0.0, 0.95);\n}\n/* ---- HYPER : perspective starfield. layered planes of stars, each projected\n   p/z, streaming out of a drifting vanishing point as the camera rolls. ---- */\n\nvec3 hyper_h33(vec2 p, float s){\n  vec3 q = fract(vec3(p.x, p.y, p.x * 0.71 + p.y * 0.43 + s) * vec3(0.1031, 0.1030, 0.0973));\n  q += dot(q, q.yxz + 33.33);\n  return fract((q.xxy + q.yxx) * q.zyx);\n}\n\nfloat scene_HYPER(vec2 uv, float t, float lvl, float sd, float bpmN, float crestN, float onsetN, vec3 b0, vec3 b1){\n  float L   = clamp(lvl, 0.0, 1.0);\n  float sq  = clamp(sd, 0.0, 1.0);\n  float bpm = clamp(bpmN, 0.0, 1.0);\n  float cst = clamp(crestN, 0.0, 1.0);\n  float ons = clamp(onsetN, 0.0, 1.0);\n  float lo  = clamp(b0.x * 0.62 + b0.y * 0.38 - 0.22, 0.0, 1.0);\n  float md  = clamp(b0.z * 0.50 + b1.x * 0.50 - 0.22, 0.0, 1.0);\n  float hi  = clamp(b1.y * 0.45 + b1.z * 0.55 - 0.22, 0.0, 1.0);\n\n  /* the camera. roll sense and rate come off the seed, and the heading wanders -- on\n     some tracks the point we are flying at sits on the page, on others it is off\n     past the edge and the field only fans across */\n  float rdir = mix(-1.0, 1.0, step(0.5, fract(sq * 7.31)));\n  float roll = t * (0.017 + 0.040 * sq) * rdir + sq * 6.2831853;\n  float rc = cos(roll);\n  float rn = sin(roll);\n  vec2 vpt = vec2(sin(t * 0.021 + sq * 5.1), cos(t * 0.017 + sq * 3.7))\n           * (0.08 + 0.62 * fract(sq * 3.11));\n  vec2 pc = uv - vpt;\n  vec2 p  = vec2(rc * pc.x - rn * pc.y, rn * pc.x + rc * pc.y);\n\n  /* depth. t is only ever multiplied by the seed, which is frozen per track, so a\n     live value drifting can never make the field jump. tempo widens the depth\n     range instead -- same phase, more ground covered, which reads as faster. */\n  float rate  = 0.048 + 0.044 * sq;\n  float ZF    = 0.50 + 0.22 * bpm;\n  float ZN    = 0.055;\n  float surge = 1.0 - 0.26 * L * (0.40 + 0.60 * lo);   /* bass shoves the camera forward */\n  float GF    = 14.0 + 7.0 * sq;                       /* field density */\n  float keepT = 0.05 + 0.10 * sq;\n  float tchar = 0.60 + 0.85 * fract(sq * 5.27);        /* dotty track vs streaky track */\n  float TL    = min((0.42 + 0.50 * L * (0.4 + 0.6 * cst) + 0.08 * bpm) * tchar, 0.62);\n  float spkOn = step(0.34, fract(sq * 11.71));\n  float spkT  = 1.0 / (0.00060 + 0.00050 * hi);\n  float spkL  = 12.0 - 2.5 * hi;\n  float tkD   = 0.12 + 0.16 * ons;\n\n  float ink = 0.0;\n\n  for (int i = 0; i < 14; i++){\n    float fi = float(i);\n\n    float k  = fract(t * rate + fi * 0.0714286 + sq * 0.317);\n    float z  = max(mix(ZF, ZN, k) * surge, 0.02);\n    float zs = max(z * GF, 0.10);\n    float iz = 1.0 / zs;\n    float u  = clamp(z / max(ZF, 0.05), 0.0, 1.0);\n\n    /* this layer's slab of the star plane, with its own offset and its own tilt so\n       fourteen lattices never line up into a moire */\n    vec3 lay = hyper_h33(vec2(fi, fi * 0.37 + 1.9), 11.0 + sq * 29.0);\n    vec2 off = lay.xy * 22.0;\n    float la = lay.z * 6.2831853;\n    float lc = cos(la);\n    float ls = sin(la);\n\n    vec2 pr = vec2(lc * p.x - ls * p.y, ls * p.x + lc * p.y);\n    vec2 g  = pr * zs + off;\n    vec2 id = floor(g);\n    vec2 f  = g - id - 0.5;\n\n    vec3 h   = hyper_h33(id, 5.0 + sq * 17.0 + fi * 1.13);\n    float hs = fract(h.y * 17.31 + h.z * 9.73 + h.x * 3.11);\n    float hb = fract(h.z * 23.17 + h.y * 5.71);\n    float keep = step(keepT, h.x);\n\n    vec2 jit = (h.yz - 0.5) * 0.20;\n    vec2 e   = f - jit;\n\n    /* the star's own place in the plane gives its travel direction -- taken from the\n       star, not the pixel, so the streak stays straight across the whole cell */\n    vec2 rv  = id + vec2(0.5, 0.5) + jit - off;\n    float rq = dot(rv, rv);\n    float rl = sqrt(max(rq, 1.0e-12));\n    vec2 rd  = mix(vec2(1.0, 0.0), rv / rl, step(1.0e-10, rq));\n    vec2 td  = vec2(-rd.y, rd.x);\n    float srad = rl * iz;\n\n    float a = dot(e, rd);\n    float b = dot(e, td);\n\n    /* a star is a point source: it does not swell as you close on it, it brightens\n       and draws out. so the mark is sized on the page, in three steps, and only\n       creeps up as the layer nears. hierarchy is carried by brightness. */\n    float cls  = step(0.74, hs) + step(0.952, hs);\n    float grow = 1.0 / (0.22 + 0.78 * u);\n    float szs  = min((0.0034 + 0.0023 * cls + 0.0013 * cls * cls + 0.0010 * hi) * grow, 0.019);\n    float sz   = clamp(szs * zs, 0.0035, 0.22);\n    float bri  = 0.28 + 0.72 * h.x * h.x;\n\n    /* one crisp mark: the star smeared along the arc it crossed while the shutter\n       was open. a capsule, so a still star is a disc and a fast one is a rule. */\n    float tl  = TL * smoothstep(0.05, 0.45, srad) * (0.30 + 1.90 * hb * hb)\n              * min(0.15 + 0.55 * L + 1.15 * (1.0 - u), 1.55);\n    tl = min(tl, 0.42);\n\n    float hh = clamp(-a / max(tl, 1.0e-4), 0.0, 1.0);\n    float ad = a + tl * hh;\n    float dm = sqrt(ad * ad + b * b + 1.0e-9);\n    float rr = sz * (1.0 - 0.26 * hh);\n    float mark = (1.0 - smoothstep(rr * 0.78, rr * 1.22, dm)) * (1.0 - 0.28 * hh);\n\n    /* scattered light on the plate: a whisper of tone around every star, drawn out\n       the same way. it dies well inside the cell, so the lattice never shows. */\n    float veil = exp(-(ad * ad * 0.65 + b * b) * 13.0);\n\n    /* diffraction spikes on the brightest stars -- one exp gives both arms. taken in\n       the rolled frame, not the layer's, so every cross in the field is parallel */\n    vec2 es = vec2(lc * e.x + ls * e.y, lc * e.y - ls * e.x);\n    float mn = min(abs(es.x), abs(es.y));\n    float mx = max(abs(es.x), abs(es.y));\n    float spike = spkOn * step(1.5, cls) * step(0.40, hb)\n                * exp(-(mn * mn * spkT + mx * spkL));\n\n    float fade = smoothstep(0.0, 0.18, k) * (1.0 - smoothstep(0.78, 1.0, k));\n    float win  = 1.0 - smoothstep(0.34, 0.50, max(abs(f.x), abs(f.y)));\n    float tk   = 1.0 - tkD * (0.5 + 0.5 * sin(t * (1.1 + 2.2 * hb) + hb * 37.0));\n\n    ink += ((mark * (0.92 + 0.08 * md) + spike * (0.30 + 0.40 * hi)) * bri\n           + veil * (0.024 + 0.018 * lo)) * keep * fade * win * tk;\n  }\n\n  /* the light of everything too far to resolve, gathered at the point of travel */\n  float haze = (0.028 + 0.040 * L) * exp(-dot(pc, pc) * 2.6);\n\n  return clamp(1.0 - exp(-(ink * 1.38 + haze)), 0.0, 1.0);\n}\n/* ---- TYPE : a field of glyphs. a split-flap board setting itself, forever ---- */\n\nvec3 type_h33(vec2 p, float s){\n  vec3 q = fract(vec3(p.x, p.y, p.x*0.61 + p.y*0.29 + s)*vec3(0.1031, 0.1030, 0.0973));\n  q += dot(q, q.yxz + 33.33);\n  return fract((q.xxy + q.yxx)*q.zyx);\n}\n\nfloat type_h11(float n){\n  return fract(sin(n*127.1 + 17.31)*43758.5453);\n}\n\nfloat type_box(vec2 p, vec2 b){\n  vec2 d = abs(p) - b;\n  return min(max(d.x, d.y), 0.0) + length(max(d, 0.0));\n}\n\nfloat type_rbox(vec2 p, vec2 b, float r){\n  vec2 d = abs(p) - b + r;\n  return min(max(d.x, d.y), 0.0) + length(max(d, 0.0)) - r;\n}\n\nfloat type_seg(vec2 p, vec2 a, vec2 b, float w){\n  vec2 pa = p - a;\n  vec2 ba = b - a;\n  float h = clamp(dot(pa, ba)/max(dot(ba, ba), 1.0e-6), 0.0, 1.0);\n  return length(pa - ba*h) - w;\n}\n\n/* the flap clock. x = which character is showing, y = how edge-on the flap is.\n   the character only changes at the midpoint, where the flap is invisible */\nvec2 type_flip(float u, float fw){\n  float c = floor(u);\n  float k = clamp((u - c)/max(fw, 0.02), 0.0, 1.0);\n  return vec2(c - 1.0 + step(0.5, k), abs(cos(k*3.14159265)));\n}\n\n/* one character. q is isotropic with the cell height as 1 and the origin at the\n   cell centre. a stem, a bar, a counter, a diagonal, a dot - which of the five\n   turn up, and where they sit, is the whole alphabet */\nfloat type_mark(vec2 q, vec3 h, float w, float cur, float aa){\n  float e = fract(h.x*23.17 + h.z*5.71);\n  float g = fract(h.y*17.31 + h.x*3.11);\n  float k = fract(h.z*11.73 + h.y*7.13);\n  float m = fract(h.x*7.31 + h.y*3.79 + h.z*13.11);\n  float n = fract(h.z*3.37 + h.x*19.70);\n\n  float CH = 0.31;\n  float GW = 0.19;\n\n  /* stem: left, centre or right; cap height or x-height; sometimes a pair */\n  float sx  = (floor(e*3.0) - 1.0)*(GW - w);\n  float shr = step(0.80, g);\n  float sh  = mix(CH, CH*0.60, shr);\n  float sy  = mix(0.0, -CH*0.40, shr);\n  float dbl = step(0.64, g)*step(0.02, abs(sx));\n  float xx  = mix(q.x - sx, abs(q.x) - abs(sx), dbl);\n  float dS  = type_box(vec2(xx, q.y - sy), vec2(w, sh)) + step(0.82, k)*9.0;\n\n  /* bar: cap, waist or foot; sometimes cap and foot together. a character that\n     already carries a bowl gets a short bar, so the counter stays open */\n  float hasC = 1.0 - step(0.60, n);\n  float by  = (floor(g*3.0) - 1.0)*(CH - w);\n  float bwd = mix(GW*0.58, GW, step(0.45, m))*(1.0 - 0.46*hasC);\n  float pr  = step(0.58, k)*(1.0 - hasC);\n  float yy  = mix(q.y - by, abs(q.y) - (CH - w), pr);\n  float dB  = type_box(vec2(q.x, yy), vec2(bwd, w)) + step(0.74, e)*9.0;\n\n  /* counter: a bowl, whole or cut down the middle */\n  float cy  = (step(0.5, m) - 0.5)*CH*0.44;\n  vec2  ce  = vec2(GW*0.62 + w*0.34, CH*0.50 + w*0.26);\n  float rd  = min(ce.x, ce.y)*mix(0.28, 0.97, cur);\n  float sg  = mix(-1.0, 1.0, step(0.5, fract(m*7.13)));\n  float cut = mix(-9.0, sg*q.x, step(0.44, e));\n  float dC  = max(abs(type_rbox(q - vec2(0.0, cy), ce, rd)) - w, cut) + step(0.60, n)*9.0;\n\n  /* a diagonal, and a dot on the baseline or at the waist */\n  float fx  = mix(GW - w, w - GW, step(0.5, fract(n*13.70)));\n  float dD  = type_seg(q, vec2(fx, w - CH), vec2(-fx, CH - w), w) + step(0.26, m)*9.0;\n  float dy  = mix(w - CH, 0.0, step(0.5, fract(n*5.31)));\n  float dP  = type_box(q - vec2(GW*0.52, dy), vec2(w*1.20)) + step(0.24, k)*9.0;\n\n  float d = min(min(dS, dB), min(dC, min(dD, dP)));\n  return 1.0 - smoothstep(-aa, aa, d);\n}\n\nfloat scene_TYPE(vec2 uv, float t, float lvl, float sd, float bpmN, float crestN, float onsetN, vec3 b0, vec3 b1){\n  float L   = clamp(lvl, 0.0, 1.0);\n  float sq  = clamp(sd, 0.0, 1.0);\n  float bpm = clamp(bpmN, 0.0, 1.0);\n  float crs = clamp(crestN, 0.0, 1.0);\n  float ons = clamp(onsetN, 0.0, 1.0);\n  float lo  = clamp(b0.x*0.60 + b0.y*0.40 - 0.22, 0.0, 1.0);\n  float md  = clamp(b0.z*0.50 + b1.x*0.50 - 0.22, 0.0, 1.0);\n  float hi  = clamp(b1.y*0.45 + b1.z*0.55 - 0.22, 0.0, 1.0);\n\n  float s0 = type_h11(sq*7.31 + 0.13);\n  float s1 = type_h11(sq*3.77 + 2.41);\n  float s2 = type_h11(sq*11.90 + 5.07);\n  float seed = 4.0 + sq*53.0;\n\n  /* the setting: how many lines, how condensed the face, how round, how italic */\n  float rows = 9.0 + floor(s0*6.0);\n  float ch   = 1.14/rows;\n  float ar   = 0.60 + 0.18*s1;\n  float cw   = ch*ar;\n  float cur  = s2;\n  float ital = (s1 - 0.5)*0.22;\n\n  float w  = clamp(0.060 + 0.028*L + 0.016*lo, 0.046, 0.078);\n  float aa = 0.0016*rows;\n\n  /* every line sits on its own carriage and slides at its own rate. the travel is\n     bounded, so the lattice coordinate never drifts out of float precision */\n  float row = floor(uv.y/ch);\n  float r0  = type_h11(row*1.37 + seed);\n  float r1  = type_h11(row*2.71 + seed + 3.30);\n  float amp = 1.0 + 4.0*r0;\n  float ws  = 0.045 + 0.100*r1 + 0.050*bpm + 0.040*L;\n  float dft = amp*sin(t*ws + r1*6.2831853);\n\n  float gx = uv.x/cw + dft;\n  vec2  id = vec2(floor(gx), row);\n  vec2  f  = vec2(gx - id.x - 0.5, uv.y/ch - row - 0.5);\n\n  /* a wave of flips runs across the board, and between waves each cell turns on\n     its own clock. the wave's cycle count rides along in u, so the wrap at the\n     end of a pass never jolts the whole field back a frame */\n  float wr  = 0.05 + 0.16*ons + 0.04*bpm;\n  float wt  = t*wr + sq;\n  float cyc = floor(wt);\n  float wp  = (wt - cyc)*130.0 - 65.0;\n  float cx  = id.x + 0.5 - dft + row*(0.6 + 1.4*s2);\n\n  vec3  h0 = type_h33(id, seed);\n  float pass = 1.0 - smoothstep(-1.4, 1.4, cx - wp);\n  float u  = t*(0.16 + 0.55*ons + 0.22*L)*(0.35 + 1.70*h0.x) + h0.y*17.0 + cyc + pass;\n  vec2  fl = type_flip(u, mix(0.26, 0.13, crs));\n\n  vec3  hg = type_h33(id + vec2(mod(fl.x, 64.0)*3.1 + 11.0, 7.0), seed + 1.7);\n  float blank = clamp(0.13 + 0.14*type_h11(row*3.10 + seed + 5.0) - 0.12*hi, 0.03, 0.38);\n  float live  = step(blank, hg.z);\n\n  float sz  = max(fl.y, 0.07);\n  float maa = aa*clamp(1.0/sz, 1.0, 2.2);\n  vec2  q0  = vec2(f.x*ar, f.y/sz);\n  vec2  qq  = vec2(q0.x + ital*q0.y, q0.y);\n  float mk  = type_mark(qq, hg, w, cur, maa);\n\n  /* a handful of characters are set reversed out of a solid - the board's way of\n     marking one out. it turns over on the same flap clock as everything else */\n  float rev = step(0.955, hg.x);\n  float blk = 1.0 - smoothstep(-maa, maa, type_box(q0, vec2(ar*0.38, 0.385)));\n  float cov = mix(mk, blk*(1.0 - mk), rev)*live*(0.86 + 0.26*h0.z);\n\n  /* a few slots on the board are set three lines tall. they hold their place -\n     the small lines clear out around them and the big character keeps turning */\n  vec2  gB  = vec2(uv.x/(cw*3.0) + 0.37*sq, uv.y/(ch*3.0));\n  vec2  idB = floor(gB);\n  vec2  fB  = gB - idB - 0.5;\n  vec3  hB  = type_h33(idB + vec2(37.0, -19.0), seed + 8.3);\n  float slot = step(0.88, hB.z);\n\n  cov *= 1.0 - slot*(1.0 - smoothstep(0.30, 0.44, max(abs(fB.x), abs(fB.y))));\n\n  float big = 0.0;\n  if (slot > 0.5){\n    float uB  = t*(0.05 + 0.13*ons + 0.05*L)*(0.40 + 1.20*hB.x) + hB.y*13.0;\n    vec2  flB = type_flip(uB, 0.22);\n    vec3  hgB = type_h33(idB + vec2(mod(flB.x, 64.0)*2.3 + 5.0, 3.0), seed + 4.1);\n    float szB = max(flB.y, 0.07);\n    vec2  qB  = vec2(fB.x*ar, fB.y/szB)*1.02;\n    qB.x += ital*qB.y;\n    big = type_mark(qB, hgB, w*(0.58 + 0.16*md), cur, aa*0.55*clamp(1.0/szB, 1.0, 2.2));\n  }\n\n  return clamp(max(cov, big), 0.0, 1.0);\n}\n/* ---- WEAVE : interlaced cloth. two sets of ribbons, real over-under ---- */\n\nfloat weave_h11(float n){\n  return fract(sin(n * 127.13 + 3.71) * 43758.5453);\n}\n\n/* pick one of three band levels by thread index, no array indexing */\nfloat weave_band3(vec3 b, float i){\n  float m = mod(i, 3.0);\n  return mix(mix(b.x, b.y, step(0.5, m)), b.z, step(1.5, m));\n}\n\nvec2 weave_turn(vec2 p, float a){\n  float c = cos(a);\n  float s = sin(a);\n  return vec2(c * p.x - s * p.y, s * p.x + c * p.y);\n}\n\n/* cross-section of a round thread. u is -1..1 across its width, lit from the\n   near side, so tone rolls off to the far edge and both edges keep an outline */\nfloat weave_round(float u){\n  return 0.105 + 0.42 * smoothstep(-1.05, 0.95, u) + 0.16 * smoothstep(0.66, 1.0, abs(u));\n}\n\n/* the twist of the yarn: a hard band pattern that rides along the thread, so\n   sliding a ribbon along its own axis is actually visible */\nfloat weave_twist(float along, float u, float ph){\n  float q = abs(fract(along * 3.1 + u * 0.85 + ph) - 0.5) * 2.0;\n  return 0.87 + 0.26 * smoothstep(0.22, 0.78, q);\n}\n\n/* what survives of the under thread beside the over thread: a hairline of\n   daylight against its edge, then a shaded lip that recovers to full tone */\nfloat weave_under(float d, float side){\n  float cut = smoothstep(0.0, 0.050, d);\n  float lip = (1.0 - smoothstep(0.0, 0.30, d)) * (0.26 + 0.40 * side);\n  return cut * (1.0 - lip);\n}\n\nfloat scene_WEAVE(vec2 uv, float t, float lvl, float sd, float bpmN, float crestN, float onsetN, vec3 b0, vec3 b1){\n  float L  = clamp(lvl, 0.0, 1.0);\n  float sv = clamp(sd, 0.0, 1.0);\n  float cr = clamp(crestN, 0.0, 1.0);\n  float on = clamp(onsetN, 0.0, 1.0);\n  float bp = clamp(bpmN, 0.0, 1.0);\n\n  float hs = weave_h11(sv * 23.0 + 7.0);\n  float ho = weave_h11(sv * 13.0 + 2.4);\n\n  /* square to the page for most tracks, on the bias for a few */\n  vec2 p = weave_turn(uv, mix(0.0, 0.785398, step(0.76, ho)) + (sv - 0.5) * 0.05);\n\n  float rows = 6.0 + floor(sv * 6.99);          /* 6..12 picks across the short axis */\n  float cell = 1.14 / rows;\n  vec2  g    = p / cell;\n\n  /* seed sets how much heavier the warp is than the weft */\n  float ratio = 0.86 + 0.30 * weave_h11(sv * 37.0 + 5.0);\n  /* level pulls the cloth tight; underneath, it breathes */\n  float duty  = 0.50 + 0.21 * L + 0.035 * sin(t * 0.41) + 0.02 * cr;\n  float hw0W  = 0.5 * duty * ratio;\n  float hw0F  = 0.5 * duty / ratio;\n\n  float ix = floor(g.x + 0.5);\n  float iy = floor(g.y + 0.5);\n\n  /* ---- warp: threads standing on the integer columns ---- */\n  float ax = weave_h11(ix * 1.71 + 11.3);\n  float bx = weave_h11(ix * 3.37 + 41.9);\n  float dW = 1.0 - 2.0 * step(0.5, mod(ix, 2.0));\n  float alW = g.y + (0.13 + 0.80 * bp) * (0.55 + 0.90 * ax) * dW * t;\n  float swW = 0.035 * (0.6 + 0.8 * on) * sin(t * (0.33 + 0.50 * bx) + ax * 6.2831853);\n  float hwW = hw0W * (0.80 + 0.36 * ax + 0.45 * cr * (ax - 0.5))\n                   * (0.82 + 0.28 * weave_band3(b0, ix))\n                   * (1.0 + 0.10 * sin(alW * 1.9 + bx * 6.2831853));\n  hwW = clamp(hwW, 0.09, 0.43);\n  float fx = g.x - ix - swW;\n  float uW = clamp(fx / max(hwW, 0.001), -1.0, 1.0);\n  float cW = 1.0 - smoothstep(hwW - 0.030, hwW, abs(fx));\n  float kW = weave_round(uW) * weave_twist(alW, uW, ax * 5.0);\n\n  /* ---- weft: threads lying on the integer rows ---- */\n  float ay = weave_h11(iy * 2.13 + 27.7);\n  float by = weave_h11(iy * 4.11 + 63.1);\n  float dF = 1.0 - 2.0 * step(0.5, mod(iy + 1.0, 2.0));\n  float alF = g.x + (0.13 + 0.80 * bp) * (0.55 + 0.90 * ay) * dF * t;\n  float swF = 0.035 * (0.6 + 0.8 * on) * sin(t * (0.29 + 0.50 * by) + ay * 6.2831853);\n  /* the shuttle: one heavier pick working its way across the cloth */\n  float sh = mod(t * (0.20 + 0.45 * bp) + sv * 11.0, rows * 2.4) - rows * 1.2 - iy;\n  float hwF = hw0F * (0.80 + 0.36 * ay + 0.45 * cr * (ay - 0.5))\n                   * (0.82 + 0.28 * weave_band3(b1, iy))\n                   * (1.0 + 0.10 * sin(alF * 1.9 + by * 6.2831853))\n                   * (1.0 + 0.30 * exp(-sh * sh * 0.55) * (0.35 + 0.65 * L));\n  hwF = clamp(hwF, 0.09, 0.43);\n  float fy = g.y - iy - swF;\n  float uF = clamp(fy / max(hwF, 0.001), -1.0, 1.0);\n  float cF = 1.0 - smoothstep(hwF - 0.030, hwF, abs(fy));\n  float kF = weave_round(-uF) * weave_twist(alF, uF, ay * 5.0);\n\n  /* ---- the binding: which one crosses over, per intersection ----\n     plain 1/1, basket 2/2, or a 2/1 twill with its diagonal rib */\n  float pl = step(mod(ix + iy, 2.0), 0.5);\n  float bk = step(mod(floor(ix * 0.5) + floor(iy * 0.5), 2.0), 0.5);\n  float tl = step(mod(ix - iy, 3.0), 1.5);\n  float over = mix(mix(pl, bk, step(0.36, hs)), tl, step(0.64, hs));\n\n  float sepF = weave_under(max(abs(fx) - hwW, 0.0), step(0.0, fx));\n  float sepW = weave_under(max(abs(fy) - hwF, 0.0), step(fy, 0.0));\n\n  float warpTop = kW * cW + kF * cF * (1.0 - cW) * sepF;\n  float weftTop = kF * cF + kW * cW * (1.0 - cF) * sepW;\n  float ink = mix(weftTop, warpTop, over);\n\n  /* the ground the cloth is laid on, seen through the open gaps */\n  ink += 0.035 * (1.0 - max(cW, cF));\n\n  return clamp(ink, 0.0, 1.0);\n}\n/* ---- CIRCUIT : a routed board. manhattan copper, 45-degree corners, vias,\n   and signals running the length of the traces ---- */\n\nfloat circuit_h11(vec2 p, float s){\n  vec3 q = fract(vec3(p.x, p.y, p.x*0.31 + p.y*0.71 + s)*vec3(0.1031, 0.1030, 0.0973));\n  q += dot(q, q.yzx + 33.33);\n  return fract((q.x + q.y)*q.z);\n}\n\nvec3 circuit_h33(vec2 p, float s){\n  vec3 q = fract(vec3(p.x, p.y, p.x*0.47 + p.y*0.23 + s)*vec3(0.1031, 0.1030, 0.0973));\n  q += dot(q, q.yxz + 33.33);\n  return fract((q.xxy + q.yxx)*q.zyx);\n}\n\nfloat circuit_seg(vec2 p, vec2 a, vec2 b){\n  vec2 pa = p - a;\n  vec2 ba = b - a;\n  float h = clamp(dot(pa, ba)/max(dot(ba, ba), 0.0001), 0.0, 1.0);\n  return length(pa - ba*h);\n}\n\nfloat circuit_oct(vec2 p, float r){\n  vec2 q = abs(p);\n  return max(max(q.x, q.y), (q.x + q.y)*0.7071068) - r;\n}\n\n/* one link of the routing graph, keyed on the edge it crosses so the two cells\n   that share it agree on presence and width. the key is blocked along the run,\n   which is what makes copper arrive in runs of 2-4 cells instead of a maze */\nvec3 circuit_hl(vec2 id, float sk, float rl, float off){\n  return circuit_h33(vec2(floor((id.x + 0.5 + off)/rl), id.y + 0.5), sk);\n}\nvec3 circuit_vl(vec2 id, float sk, float rl, float off){\n  return circuit_h33(vec2(id.x + 137.0, floor((id.y + 0.5 + off)/rl)), sk + 7.31);\n}\n\nfloat scene_CIRCUIT(vec2 uv, float t, float lvl, float sd, float bpmN, float crestN, float onsetN, vec3 b0, vec3 b1){\n  float L    = clamp(lvl, 0.0, 1.0);\n  float sq   = clamp(sd, 0.0, 1.0);\n  float bpm  = clamp(bpmN, 0.0, 1.0);\n  float crs  = clamp(crestN, 0.0, 1.0);\n  float ons  = clamp(onsetN, 0.0, 1.0);\n  float bass = clamp(b0.x*0.60 + b0.y*0.40 - 0.20, 0.0, 1.0);\n  float mid  = clamp(b0.z*0.50 + b1.x*0.50 - 0.20, 0.0, 1.0);\n  float treb = clamp(b1.y*0.45 + b1.z*0.55 - 0.20, 0.0, 1.0);\n\n  float sk = 1.0 + sq*53.0;\n  vec3 sa = circuit_h33(vec2(sq*37.0,  5.30), 2.0);\n  vec3 sb = circuit_h33(vec2(sq*17.0, 41.70), 9.0);\n\n  /* the plate: pitch, which way the routing runs, and the creep under the type */\n  float S = 9.6 + floor(sa.x*3.0)*1.8;\n  vec2 p = uv*S;\n  if (sa.y > 0.5) p = p.yx;\n  vec2 vel = vec2(0.050 + 0.030*sb.z, 0.030 + 0.020*sa.z);\n  if (sb.x > 0.5) vel.x = -vel.x;\n  if (sb.y > 0.5) vel.y = -vel.y;\n  p += vel*t;\n\n  vec2 id = floor(p);\n  vec2 f  = p - id - 0.5;\n\n  /* row and column character: some rows are trunks, some are nearly bare */\n  vec3 rw = circuit_h33(vec2(id.y, 71.3), sk);\n  vec3 cw = circuit_h33(vec2(id.x, 17.9), sk + 23.0);\n\n  float rlH  = 2.0 + floor(rw.z*3.0);\n  float rlV  = 2.0 + floor(cw.z*3.0);\n  float offH = rw.y*rlH;\n  float offV = cw.y*rlV;\n\n  /* neighbouring rows share part of their character, so trunks arrive three or\n     four abreast -- a bus rather than one lone wire */\n  float rb = circuit_h11(vec2(floor(id.y/3.0), 5.90), sk + 13.0);\n  float cb = circuit_h11(vec2(floor(id.x/3.0), 2.70), sk + 29.0);\n  float densH = 0.18 + 0.68*mix(rw.x, rb, 0.55) + 0.16*ons;\n  float densV = 0.14 + 0.58*mix(cw.x, cb, 0.55) + 0.14*ons;\n\n  vec3 le = circuit_hl(id,                  sk, rlH, offH);\n  vec3 lw = circuit_hl(id - vec2(1.0, 0.0), sk, rlH, offH);\n  vec3 ln = circuit_vl(id,                  sk, rlV, offV);\n  vec3 ls = circuit_vl(id - vec2(0.0, 1.0), sk, rlV, offV);\n\n  float fd = 0.035;\n  float pe = smoothstep(le.x - fd, le.x + fd, densH);\n  float pw = smoothstep(lw.x - fd, lw.x + fd, densH);\n  float pn = smoothstep(ln.x - fd, ln.x + fd, densV);\n  float ps = smoothstep(ls.x - fd, ls.x + fd, densV);\n\n  float w0 = 0.082 + 0.020*L + 0.022*bass;\n  float we = w0*(1.0 + 0.85*step(0.80, le.y)
