<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#0a0908">
<title>Kani — Dead Wax</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --page:#0e0d0b;
  --bone:#e9e2d2;
  --ash:#6f6959;
  --alu:#c6ccc4;
  --rule:rgba(233,226,210,.13);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:var(--page);color:var(--bone);
  -webkit-font-smoothing:antialiased;overscroll-behavior:none;
  -webkit-user-select:none;user-select:none}
body{font-family:"DM Mono",ui-monospace,monospace;font-weight:300}

#stage{position:fixed;inset:0;touch-action:none;cursor:grab;display:block}
#stage.drag{cursor:grabbing}

.chrome{position:fixed;inset:0;pointer-events:none;
  padding:max(15px,env(safe-area-inset-top)) max(18px,env(safe-area-inset-right)) max(15px,env(safe-area-inset-bottom)) max(18px,env(safe-area-inset-left));
  display:grid;grid-template-rows:auto 1fr auto;grid-template-columns:1fr auto;column-gap:20px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;pointer-events:auto;
  -webkit-tap-highlight-color:transparent}

.mark{grid-row:1;grid-column:1;align-self:start}
.mark h1{font-family:"Instrument Serif",serif;font-weight:400;
  font-size:clamp(25px,2.4vw,36px);line-height:.84;letter-spacing:-.014em}
.mark .sub{margin-top:7px;font-size:10.5px;letter-spacing:.055em;color:var(--ash)}
.mark .sub b{font-weight:400;color:#9c9583}

.transport{grid-row:1;grid-column:2;align-self:start;display:flex;align-items:center;gap:12px}
.tbtn{width:33px;height:33px;border:1px solid var(--rule);border-radius:50%;
  display:grid;place-items:center;transition:border-color .18s,background .18s;flex:0 0 auto}
.tbtn:active{background:rgba(233,226,210,.10)}
.tbtn svg{display:block;fill:var(--bone)}
.tbtn[disabled]{opacity:.26;cursor:default}
.tbtn.on{border-color:rgba(233,226,210,.45)}
.clock{font-size:11.5px;letter-spacing:.05em;color:#9c9583;font-variant-numeric:tabular-nums;
  min-width:84px;text-align:right}
.clock i{font-style:normal;color:var(--ash)}

.foot{grid-row:3;grid-column:1/-1;display:flex;align-items:flex-end;
  justify-content:space-between;gap:26px}
.now{max-width:min(60vw,700px)}
.idx{font-size:11px;letter-spacing:.09em;color:var(--ash);margin-bottom:9px;
  font-variant-numeric:tabular-nums}
.title{font-family:"Instrument Serif",serif;font-weight:400;
  font-size:clamp(32px,5.2vw,66px);line-height:.86;letter-spacing:-.022em;text-wrap:balance}

.specs{display:grid;grid-template-columns:auto auto;gap:3px 18px;
  font-size:11.5px;letter-spacing:.045em;font-variant-numeric:tabular-nums;
  text-align:right;white-space:nowrap;padding-bottom:3px}
.specs dt{color:var(--ash)}
.specs dd{color:#cfc8b7}

#index{position:fixed;inset:0;background:rgba(9,8,7,.978);z-index:5;
  display:none;flex-direction:column;
  padding:max(15px,env(safe-area-inset-top)) 18px max(18px,env(safe-area-inset-bottom))}
#index.open{display:flex}
.ixhead{display:flex;justify-content:space-between;align-items:baseline;
  padding-bottom:12px;border-bottom:1px solid var(--rule);flex:0 0 auto}
.ixhead span{font-size:11px;letter-spacing:.09em;color:var(--ash)}
.ixhead button{font-size:11px;letter-spacing:.09em;color:#9c9583}
.ixgrid{flex:1 1 auto;overflow-y:auto;touch-action:pan-y;-webkit-overflow-scrolling:touch;
  columns:3;column-gap:34px;padding-top:12px}
.ixrow{display:flex;gap:11px;align-items:baseline;width:100%;text-align:left;
  padding:7px 0;break-inside:avoid;border-bottom:1px solid rgba(233,226,210,.055)}
.ixrow .n{font-size:10.5px;color:var(--ash);flex:0 0 24px;font-variant-numeric:tabular-nums}
.ixrow .t{font-family:"Instrument Serif",serif;font-size:19px;line-height:1.05;
  letter-spacing:-.012em;flex:1 1 auto}
.ixrow .d{font-size:10px;color:var(--ash);flex:0 0 auto;font-variant-numeric:tabular-nums}
.ixrow.cur .t{color:#fff}
.ixrow.cur .n{color:var(--alu)}
.ixrow:active{background:rgba(233,226,210,.06)}

.hint{grid-row:2;grid-column:1/-1;align-self:end;justify-self:center;
  font-size:10px;letter-spacing:.11em;color:rgba(111,105,89,.9);
  transition:opacity .6s .2s}
.hint.gone{opacity:0}

@media (max-width:820px){
  .ixgrid{columns:1}
  .foot{flex-direction:column;align-items:flex-start;gap:11px}
  .specs{grid-template-columns:auto 1fr;text-align:left;gap:2px 14px;width:100%}
  .specs dd{text-align:right}
  .now{max-width:100%}
  .title{font-size:clamp(29px,8vw,44px)}
  .clock{min-width:0;font-size:11px}
  .transport{gap:9px}
  .hint{display:none}
}
@media (max-height:540px){ .mark .sub{display:none} }
</style>
</head>
<body>

<canvas id="stage"></canvas>

<div class="chrome">
  <div class="mark">
    <h1>Kani</h1>
    <div class="sub"><b id="mCount">72</b> LACQUERS &nbsp; CUT <span id="mYears"></span></div>
  </div>

  <div class="transport">
    <span class="clock"><span id="tNow">0:00</span> <i>/</i> <span id="tLen">0:00</span></span>
    <button class="tbtn" id="bPlay" aria-label="Play or pause">
      <svg id="icPlay" width="11" height="12" viewBox="0 0 11 12"><path d="M0 0l11 6-11 6z"/></svg>
      <svg id="icPause" width="10" height="12" viewBox="0 0 10 12" style="display:none"><path d="M0 0h3.2v12H0zM6.8 0H10v12H6.8z"/></svg>
    </button>
    <button class="tbtn" id="bStop" aria-label="Stop and lift the arm" disabled>
      <svg width="9" height="9" viewBox="0 0 9 9"><rect width="9" height="9"/></svg>
    </button>
    <button class="tbtn" id="bIndex" aria-label="Index">
      <svg width="13" height="11" viewBox="0 0 13 11"><rect width="13" height="1.4"/><rect y="4.8" width="13" height="1.4"/><rect y="9.6" width="13" height="1.4"/></svg>
    </button>
  </div>

  <div class="hint" id="hint">DRAG THE CRATE &nbsp;&nbsp; TAP A PLATE TO DROP THE STYLUS</div>

  <div class="foot">
    <div class="now">
      <div class="idx" id="fIdx">&nbsp;</div>
      <div class="title" id="fTitle">&nbsp;</div>
    </div>
    <dl class="specs" id="fSpecs"></dl>
  </div>
</div>

<div id="index">
  <div class="ixhead">
    <span id="ixTitle">INDEX</span>
    <button id="ixClose">CLOSE ✕</button>
  </div>
  <div class="ixgrid" id="ixGrid"></div>
</div>

<script>
(function(){
'use strict';

const TAU = Math.PI * 2;
const clamp = (v,a,b)=> v<a?a:(v>b?b:v);
const lerp  = (a,b,t)=> a+(b-a)*t;
const norm  = (v,a,b)=> clamp((v-a)/(b-a),0,1);
const ease  = t => 1-Math.pow(1-t,3);
const smooth= (e0,e1,x)=>{ const t=clamp((x-e0)/(e1-e0),0,1); return t*t*(3-2*t); };
const mmss  = s => { s=Math.max(0,Math.floor(s||0)); return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); };
const pad   = (n,w)=> String(n).padStart(w,'0');
function rng(seed){ let s = (seed>>>0) || 1; return ()=>{ s^=s<<13;s>>>=0;s^=s>>>17;s^=s<<5;s>>>=0; return s/4294967296; }; }

const stage = document.getElementById('stage');
const ctx = stage.getContext('2d');
let TRACKS = [], N = 0;

// ---------------------------------------------------------------- data ---

function decode(b64){
  const bin = atob(b64), out = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) out[i] = bin.charCodeAt(i);
  return out;
}
// Percentile stretch, per track per channel. The raw arrays are top-heavy —
// 48.7% of every peak sample in the catalogue sits at 255 — so without this
// the loud half of the record collection would all cut the same groove.
function stretch(u8){
  const s = Array.prototype.slice.call(u8).sort((a,b)=>a-b);
  const lo = s[Math.floor(s.length*0.05)], hi = s[Math.floor(s.length*0.95)];
  const d = Math.max(6, hi-lo);
  const out = new Float32Array(u8.length);
  for(let i=0;i<u8.length;i++) out[i] = clamp((u8[i]-lo)/d, 0, 1);
  return out;
}
function samp(a,u){
  const x = clamp(u,0,1)*(a.length-1), i = x|0, f = x-i, j = Math.min(a.length-1, i+1);
  return a[i] + (a[j]-a[i])*f;
}

async function load(){
  const [marks, cfg] = await Promise.all([
    fetch('/data/marks.json').then(r=>r.json()),
    fetch('/config.json').then(r=>r.json())
  ]);

  const bmin = [1e9,1e9,1e9,1e9,1e9,1e9], bmax = [-1e9,-1e9,-1e9,-1e9,-1e9,-1e9];
  for(const k in marks.tracks){
    const b = marks.tracks[k].balance;
    for(let i=0;i<6;i++){ if(b[i]<bmin[i]) bmin[i]=b[i]; if(b[i]>bmax[i]) bmax[i]=b[i]; }
  }

  TRACKS = cfg.tracks.filter(t=>marks.tracks[t.file]).map((t,i)=>{
    const m = marks.tracks[t.file];
    const B = m.bands.map(b=>stretch(decode(b)));
    const bal = m.balance.map((v,j)=>norm(v,bmin[j],bmax[j]));
    const crestN = norm(m.crest, 7.2, 19.3);
    return {
      i, file:t.file,
      title: m.title || t.title,
      date: t.date || m.date || '',
      duration:m.duration, bpm:m.bpm, rmsDb:m.rmsDb, crest:m.crest, onsetRate:m.onsetRate,
      matrix: 'KM-'+pad(i+1,4)+'-A1',
      lo:B[0], lo2:B[1], mid:B[2], mid2:B[3], hi:B[4], hi2:B[5],
      pk: stretch(decode(m.peaks)),
      cent: stretch(decode(m.cent)),
      loud: norm(m.rmsDb, -20.4, -4.2),
      bassness: (bal[0]+bal[1])/2,
      // a squashed cut carries a uniformly fat groove; a punchy sparse one swings
      // from hairline to fat. crest factor is literally the measure of that.
      shape: 0.70 + crestN*1.85,
      turnMix: norm(Math.log(m.duration), Math.log(22.8), Math.log(642)),
      serp: 2 + norm(m.bpm,60,167)*7.5,      // lateral swing, cycles per revolution
      chat: 22 + norm(m.onsetRate,1,4.6)*70  // fine chatter, cycles per revolution
    };
  });
  N = TRACKS.length;
}

// ------------------------------------------------------------ geometry ---

function geom(R){
  return { R, edge:R*0.988, leadA:R*0.958, leadB:R*0.932,
           start:R*0.926, end:R*0.420, lock:R*0.402,
           waxOut:R*0.400, waxIn:R*0.344, label:R*0.336, hole:R*0.030 };
}

// ---------------------------------------------------------- lacquer grain --

let noiseCv = null;
function noise(){
  if(noiseCv) return noiseCv;
  const s = 128, c = document.createElement('canvas'); c.width=c.height=s;
  const x = c.getContext('2d'), img = x.createImageData(s,s), d = img.data, r = rng(7);
  for(let i=0;i<s*s;i++){
    const v = 116 + ((r()*78)|0);
    d[i*4]=v; d[i*4+1]=v; d[i*4+2]=v-3; d[i*4+3]=255;
  }
  x.putImageData(img,0,0);
  noiseCv = c;
  return c;
}
function grainFor(x){
  if(!x.__grain) x.__grain = x.createPattern(noise(),'repeat');
  return x.__grain;
}

// ------------------------------------------------------- groove bitmap ---

const INK_LO = [102, 96, 82], INK_HI = [243, 239, 228];
const WB = 12, IB = 6;

function buildGroove(t, size, turns){
  const cv = document.createElement('canvas'); cv.width = cv.height = size;
  const x = cv.getContext('2d');
  const R = size/2, g = geom(R);
  x.translate(R,R);
  x.lineCap = 'round'; x.lineJoin = 'round';

  const pitch = (g.start-g.end)/turns;
  const wMin = Math.max(0.5, pitch*0.075), wMax = pitch*0.42;

  const paths = new Array(WB*IB);
  for(let i=0;i<paths.length;i++) paths[i] = new Path2D();
  const last = new Array(WB*IB).fill(-9);

  const spt = clamp(Math.round(180 + t.chat*3.2), 220, 500);
  const steps = Math.min(turns*spt, 26000);
  const dTheta = TAU*turns/steps;
  const rnd = rng(t.i*2654435761 + 11);
  const ph1 = rnd()*TAU, ph2 = rnd()*TAU;

  let px=0, py=0;
  for(let s=0; s<=steps; s++){
    const u = s/steps, th = s*dTheta;

    const lo = samp(t.lo,u)*0.62 + samp(t.lo2,u)*0.38;
    const md = samp(t.mid,u)*0.55 + samp(t.mid2,u)*0.45;
    const hi = samp(t.hi,u)*0.55 + samp(t.hi2,u)*0.45;
    const pk = samp(t.pk,u);

    const exc = Math.pow(clamp(0.46*lo + 0.30*pk + 0.24*md, 0, 1), t.shape);
    const lvl = exc*(0.55 + 0.45*t.loud);

    // Bass swings the cutter head wide and slow; highs chatter it. Exaggerated
    // far past physical scale, and capped just under one groove pitch so loud
    // passages crowd their neighbours without crossing into mush.
    const swing = Math.sin(th*t.serp + ph1) * pitch * (0.08 + 0.40*lvl) * (0.40 + 0.60*lo);
    const chat  = Math.sin(th*t.chat + ph2) * pitch * 0.20 * hi * (0.25 + 0.75*exc);

    const rr = g.start + (g.end-g.start)*u + swing + chat;
    const cx = Math.cos(th)*rr, cy = Math.sin(th)*rr;

    if(s>0){
      const w  = wMin + (wMax-wMin)*lvl;
      const br = clamp(samp(t.cent,u)*0.62 + lvl*0.46, 0, 1);
      const wi = clamp((((w-wMin)/(wMax-wMin))*WB)|0, 0, WB-1);
      const ii = clamp((br*IB)|0, 0, IB-1);
      const k  = wi*IB + ii;
      if(last[k] !== s-1) paths[k].moveTo(px,py);
      paths[k].lineTo(cx,cy);
      last[k] = s;
    }
    px = cx; py = cy;
  }

  for(let wi=0; wi<WB; wi++){
    x.lineWidth = wMin + (wMax-wMin)*((wi+0.5)/WB);
    for(let ii=0; ii<IB; ii++){
      const f = (ii+0.5)/IB;
      x.strokeStyle = 'rgb('+Math.round(lerp(INK_LO[0],INK_HI[0],f))+','+
                             Math.round(lerp(INK_LO[1],INK_HI[1],f))+','+
                             Math.round(lerp(INK_LO[2],INK_HI[2],f))+')';
      x.stroke(paths[wi*IB+ii]);
    }
  }

  // lead-in spiral: cut before the signal starts, so it carries none
  x.lineWidth = Math.max(0.6, pitch*0.16);
  x.strokeStyle = 'rgba(198,192,176,.5)';
  x.beginPath();
  for(let s=0;s<=900;s++){
    const u=s/900, th=u*TAU*3.4, rr=g.leadA+(g.leadB-g.leadA)*u;
    const cx=Math.cos(th)*rr, cy=Math.sin(th)*rr;
    if(s) x.lineTo(cx,cy); else x.moveTo(cx,cy);
  }
  x.stroke();

  // locked run-out groove
  x.lineWidth = Math.max(0.8, pitch*0.30);
  x.strokeStyle = 'rgba(214,208,192,.58)';
  x.beginPath(); x.arc(0,0,g.lock,0,TAU); x.stroke();

  // dead wax: lathe marks, then the matrix scratched in by hand
  const dw = rng(t.i*40503 + 5);
  x.lineWidth = Math.max(0.5, R*0.0016);
  for(let i=0;i<5;i++){
    const rr = lerp(g.waxIn+R*0.006, g.waxOut-R*0.008, dw());
    const a0 = dw()*TAU, a1 = a0 + 0.6 + dw()*3.2;
    x.strokeStyle = 'rgba(214,208,192,'+(0.05+dw()*0.09).toFixed(3)+')';
    x.beginPath(); x.arc(0,0,rr,a0,a1); x.stroke();
  }
  const rWax = g.waxIn + (g.waxOut-g.waxIn)*0.52;
  arcText(x, t.matrix, rWax, Math.PI/2, R*0.030, 'rgba(236,230,214,.44)', -1);
  arcText(x, '33⅓',    rWax, -Math.PI/2, R*0.030, 'rgba(236,230,214,.30)', 1);

  return cv;
}

function arcText(x, text, radius, mid, size, color, dir){
  x.save();
  x.fillStyle = color;
  x.font = '400 '+size.toFixed(1)+'px "DM Mono", ui-monospace, monospace';
  x.textAlign = 'center'; x.textBaseline = 'middle';
  const w = []; let total = 0;
  for(let i=0;i<text.length;i++){
    const m = x.measureText(text[i]).width + size*0.10;
    w.push(m); total += m;
  }
  let a = mid - (total/radius)/2*dir;
  for(let i=0;i<text.length;i++){
    a += (w[i]/2/radius)*dir;
    x.save();
    x.translate(Math.cos(a)*radius, Math.sin(a)*radius);
    x.rotate(a + (dir>0 ? Math.PI/2 : -Math.PI/2));
    x.fillText(text[i], 0, 0);
    x.restore();
    a += (w[i]/2/radius)*dir;
  }
  x.restore();
}

// -------------------------------------------------------- label bitmap ---

function buildLabel(t, size){
  const L = Math.round(size*0.38);
  const cv = document.createElement('canvas'); cv.width = cv.height = L;
  const x = cv.getContext('2d');
  const rl = size*0.336/2;
  x.translate(L/2, L/2);

  const pg = x.createRadialGradient(-rl*0.32,-rl*0.36,rl*0.05, 0,0,rl*1.05);
  pg.addColorStop(0,'#e7dfcb'); pg.addColorStop(0.60,'#d9d0bb'); pg.addColorStop(1,'#bbb29c');
  x.beginPath(); x.arc(0,0,rl,0,TAU); x.fillStyle = pg; x.fill();

  x.save(); x.clip();
  x.globalAlpha = .06; x.globalCompositeOperation = 'multiply';
  x.fillStyle = grainFor(x); x.fillRect(-rl,-rl,rl*2,rl*2);
  x.restore();

  x.strokeStyle = 'rgba(28,24,18,.30)'; x.lineWidth = Math.max(.7, rl*0.008);
  x.beginPath(); x.arc(0,0,rl*0.925,0,TAU); x.stroke();
  x.strokeStyle = 'rgba(28,24,18,.13)'; x.lineWidth = Math.max(.5, rl*0.005);
  x.beginPath(); x.arc(0,0,rl*0.884,0,TAU); x.stroke();

  const serif = s => '400 '+s.toFixed(1)+'px "Instrument Serif", Georgia, serif';
  const maxW = rl*1.34;
  let lines = [t.title], fs = rl*0.29;
  for(const f of [0.290,0.256,0.224,0.196,0.172,0.152]){
    fs = rl*f; x.font = serif(fs);
    lines = wrap(x, t.title, maxW);
    if(lines.length<=3) break;
  }
  x.font = serif(fs);
  let widest = 0;
  for(const l of lines) widest = Math.max(widest, x.measureText(l).width);
  if(widest > maxW){ fs *= maxW/widest; x.font = serif(fs); }

  if('letterSpacing' in x) x.letterSpacing = (-fs*0.014).toFixed(2)+'px';
  x.fillStyle = '#191512'; x.textAlign = 'center'; x.textBaseline = 'alphabetic';
  const lh = fs*0.90;
  const top = -rl*0.34 - (lines.length-1)*lh/2;
  for(let i=0;i<lines.length;i++) x.fillText(lines[i], 0, top + i*lh + fs*0.33);
  if('letterSpacing' in x) x.letterSpacing = '0px';

  x.strokeStyle = 'rgba(28,24,18,.26)'; x.lineWidth = Math.max(.6, rl*0.006);
  x.beginPath(); x.moveTo(-rl*0.19,-rl*0.14); x.lineTo(rl*0.19,-rl*0.14); x.stroke();

  const mono = s => '400 '+(rl*s).toFixed(1)+'px "DM Mono", ui-monospace, monospace';
  x.textAlign = 'center';
  x.fillStyle = 'rgba(25,21,18,.80)'; x.font = mono(0.090);
  x.fillText(t.date || 'UNDATED', 0, rl*0.345);
  x.fillStyle = 'rgba(25,21,18,.52)'; x.font = mono(0.076);
  x.fillText(t.matrix, 0, rl*0.515);
  x.fillText(t.bpm+' BPM   '+mmss(t.duration), 0, rl*0.655);

  arcText(x, 'KANI    LACQUER MASTER    33⅓ RPM', rl*0.79, Math.PI/2,
          rl*0.062, 'rgba(25,21,18,.36)', -1);

  return {cv, L};
}

function wrap(x, text, maxW){
  const words = String(text).split(/\s+/), out = [];
  let cur = '';
  for(const w of words){
    const test = cur ? cur+' '+w : w;
    if(cur && x.measureText(test).width > maxW){ out.push(cur); cur = w; }
    else cur = test;
  }
  if(cur) out.push(cur);
  return out;
}

// --------------------------------------------------------- plate cache ---

const cache = new Map();
let bmpSize = 1000, turnCap = 46;

function turnsFor(t){
  const hi = turnCap, lo = Math.round(turnCap*0.56);
  return Math.max(8, Math.round(lerp(lo, hi, t.turnMix)));
}
function key(t){ return t.file+'@'+bmpSize+'x'+turnCap; }
function cached(t){ return cache.has(key(t)); }
function plate(t){
  const k = key(t);
  let e = cache.get(k);
  if(e){ cache.delete(k); cache.set(k,e); return e; }
  e = { groove: buildGroove(t, bmpSize, turnsFor(t)), label: buildLabel(t, bmpSize) };
  cache.set(k, e);
  while(cache.size > 6) cache.delete(cache.keys().next().value);
  return e;
}

// ---------------------------------------------------------- playback ----

const audio = new Audio();
audio.crossOrigin = 'anonymous';
audio.preload = 'auto';
let playingIdx = -1, arm = 0, armTarget = 0, landAt = -1;
let ac = null, an = null, freq = null, live = 0;

function initAnalyser(){
  if(ac) return;
  try{
    const C = window.AudioContext || window.webkitAudioContext;
    if(!C) return;
    ac = new C();
    const src = ac.createMediaElementSource(audio);
    an = ac.createAnalyser(); an.fftSize = 256; an.smoothingTimeConstant = 0.72;
    src.connect(an); an.connect(ac.destination);
    freq = new Uint8Array(an.frequencyBinCount);
  }catch(e){ ac = null; an = null; }
}

function play(i){
  const t = TRACKS[i]; if(!t) return;
  initAnalyser();
  if(ac && ac.state === 'suspended') ac.resume();
  if(playingIdx === i){
    if(audio.paused) audio.play().catch(()=>{}); else audio.pause();
    syncUI(); return;
  }
  playingIdx = i;
  audio.src = '/audio-mp3/' + encodeURIComponent(t.file);
  arm = 0; armTarget = 1; landAt = -1;
  audio.play().catch(()=>{});
  syncUI();
}
function stopAll(){
  audio.pause(); try{ audio.currentTime = 0; }catch(e){}
  armTarget = 0; playingIdx = -1; syncUI();
}
audio.addEventListener('play', ()=>{ armTarget = 1; syncUI(); });
audio.addEventListener('pause', syncUI);
audio.addEventListener('ended', ()=>{ armTarget = 0; syncUI(); });
audio.addEventListener('timeupdate', tick);

const elPlay = document.getElementById('bPlay');
const elStop = document.getElementById('bStop');
const icPlay = document.getElementById('icPlay');
const icPause = document.getElementById('icPause');
const elNow = document.getElementById('tNow');
const elLen = document.getElementById('tLen');

function syncUI(){
  const on = playingIdx >= 0 && !audio.paused;
  icPlay.style.display  = on ? 'none'  : 'block';
  icPause.style.display = on ? 'block' : 'none';
  elPlay.classList.toggle('on', playingIdx >= 0);
  elStop.disabled = playingIdx < 0;
  tick();
}
function tick(){
  const t = TRACKS[playingIdx] || TRACKS[centre()];
  elNow.textContent = mmss(playingIdx >= 0 ? audio.currentTime : 0);
  elLen.textContent = mmss(t ? t.duration : 0);
}

// ------------------------------------------------------------- layout ---

let W=0, H=0, DPR=1, R=0, CX=0, CY=0, SPACING=0, MOBILE=false;

function layout(){
  W = window.innerWidth; H = window.innerHeight;
  DPR = Math.min(window.devicePixelRatio || 1, 2.5);
  stage.width = Math.round(W*DPR); stage.height = Math.round(H*DPR);
  stage.style.width = W+'px'; stage.style.height = H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.__grain = null;

  MOBILE = W < 820;
  const top = MOBILE ? 72 : 90;
  const bot = MOBILE ? 178 : 164;
  const band = Math.max(120, H - top - bot);
  R = Math.min(W*(MOBILE ? 0.405 : 0.315), (band-20)/2);
  CX = W/2;
  CY = clamp(top + band/2, top + R + 6, H - bot - R - 6);

  const peek = Math.max(38, W*0.075);
  SPACING = Math.max(R*1.42, Math.min(R*2.05, W/2 - peek + R*0.82));

  // Groove pitch must never fall under ~3 CSS px or every plate turns into the
  // same grey band — measured, not guessed.
  const prevCap = turnCap;
  turnCap = clamp(Math.round(R*0.168), 14, 60);

  const want = clamp(Math.round(R*2*Math.min(DPR,2)*1.04), 620, 1380);
  if(Math.abs(want-bmpSize)/bmpSize > 0.10 || turnCap !== prevCap){
    bmpSize = want; cache.clear();
    if(N) plate(TRACKS[centre()]);      // recut the hero now, don't flash bare lacquer
  }
  if(N) paintChrome(centre());
}

// -------------------------------------------------------- crate physics --

let pos = 0, vel = 0, target = null, dragging = false, ptrId = null;
let dragX=0, dragY=0, dragT=0, moved=0, lastDX=0, lastT=0;

// the crate has no ends — slot index wraps onto the 72 plates
const mod = (a,n)=> ((a % n) + n) % n;
const centre = ()=> N ? mod(Math.round(pos), N) : 0;
const hint = document.getElementById('hint');
const dismissHint = ()=> hint.classList.add('gone');

stage.addEventListener('pointerdown', e=>{
  if(ptrId !== null) return;
  ptrId = e.pointerId;
  try{ stage.setPointerCapture(ptrId); }catch(err){}
  dragging = true; stage.classList.add('drag');
  dragX = e.clientX; dragY = e.clientY; dragT = performance.now();
  moved = 0; lastDX = 0; lastT = dragT; vel = 0; target = null;
  dismissHint();
});
stage.addEventListener('pointermove', e=>{
  if(!dragging || e.pointerId !== ptrId) return;
  const dx = e.clientX - dragX, dy = e.clientY - dragY;
  moved = Math.max(moved, Math.hypot(dx,dy));
  const now = performance.now(), dt = Math.max(8, now-lastT);
  pos -= (dx-lastDX)/SPACING;
  vel = -(dx-lastDX)/SPACING * (16/dt);
  lastDX = dx; lastT = now;
});
function endDrag(e){
  if(!dragging || (e && e.pointerId !== ptrId)) return;
  dragging = false; stage.classList.remove('drag');
  if(ptrId !== null){ try{ stage.releasePointerCapture(ptrId); }catch(err){} ptrId = null; }
  if(moved < 9 && performance.now()-dragT < 500) hit(dragX+lastDX, dragY);
  else vel = clamp(vel, -0.34, 0.34);
}
stage.addEventListener('pointerup', endDrag);
stage.addEventListener('pointercancel', endDrag);

// plates overlap on narrow screens, so test them in draw order — nearest to the
// front of the crate first — not by distance to their centres.
function hit(x, y){
  const slots = [];
  for(let s=Math.floor(pos)-2; s<=Math.ceil(pos)+2; s++) slots.push(s);
  slots.sort((a,b)=> Math.abs(a-pos) - Math.abs(b-pos));
  for(const s of slots){
    const sx = CX + (s-pos)*SPACING;
    const sc = clamp(1 - Math.abs(s-pos)*0.18, 0.62, 1);
    if(Math.hypot(x-sx, y-CY) < R*sc){
      if(s === Math.round(pos)) play(mod(s,N));
      else { vel = 0; target = s; }
      return;
    }
  }
}
function goTo(i){
  const cur = Math.round(pos);
  let d = i - mod(cur, N);
  if(d >  N/2) d -= N;
  if(d < -N/2) d += N;
  vel = 0; target = cur + d;
}

stage.addEventListener('wheel', e=>{
  e.preventDefault();
  const d = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
  vel = clamp(vel + d*0.0022, -0.30, 0.30); target = null;
  dismissHint();
}, {passive:false});

window.addEventListener('keydown', e=>{
  if(e.key === 'Escape'){ closeIndex(); return; }
  if(e.key === 'ArrowRight' || e.key === 'ArrowDown'){ e.preventDefault(); goTo(centre()+1); }
  else if(e.key === 'ArrowLeft' || e.key === 'ArrowUp'){ e.preventDefault(); goTo(centre()-1); }
  else if(e.key === ' '){ e.preventDefault(); play(playingIdx >= 0 ? playingIdx : centre()); }
  else if(e.key === 'Home'){ goTo(0); }
  else if(e.key === 'End'){ goTo(N-1); }
  else if(e.key === 'Enter'){ e.preventDefault(); play(centre()); }
  else if(e.key.toLowerCase() === 'i'){ toggleIndex(); }
  dismissHint();
});

// ----------------------------------------------------------- plate draw --

let cutP = 0;
let angles = null;

function drawPlate(i, sx, scale, f){
  const t = TRACKS[i]; if(!t) return;
  const rr = R*scale;
  const g  = geom(rr);
  const e  = cached(t) ? plate(t) : null;

  ctx.save();
  ctx.translate(sx, CY);

  const bg = ctx.createRadialGradient(-rr*0.34,-rr*0.40, rr*0.02, 0,0, rr*1.02);
  bg.addColorStop(0,'#17150f'); bg.addColorStop(0.55,'#0c0b09'); bg.addColorStop(1,'#050403');
  ctx.beginPath(); ctx.arc(0,0,rr,0,TAU); ctx.fillStyle = bg; ctx.fill();

  ctx.save(); ctx.clip();
  ctx.globalAlpha = 0.05; ctx.globalCompositeOperation = 'overlay';
  ctx.fillStyle = grainFor(ctx); ctx.fillRect(-rr,-rr,rr*2,rr*2);
  ctx.restore();

  let rPlay = g.start;
  const isPlaying = (i === playingIdx);
  const prog = (isPlaying && t.duration) ? clamp(audio.currentTime/t.duration, 0, 1) : 0;

  if(e){
    const k = (rr*2)/bmpSize;
    rPlay = g.start + (g.end-g.start)*prog;

    ctx.save();
    ctx.rotate(angles[i]);
    ctx.scale(k,k);

    ctx.globalAlpha = lerp(0.26, isPlaying ? 0.34 : 0.60, f);
    if(cutP < 1 && f > 0.5){
      const rCut = lerp(g.start, g.label, ease(cutP))/k;
      ctx.save(); ctx.beginPath();
      ctx.arc(0,0,g.edge/k,0,TAU); ctx.arc(0,0,rCut,0,TAU,true); ctx.clip();
      ctx.drawImage(e.groove, -bmpSize/2, -bmpSize/2);
      ctx.restore();
    } else {
      ctx.drawImage(e.groove, -bmpSize/2, -bmpSize/2);
    }

    // everything the stylus has already passed over, inked hot
    if(isPlaying && prog > 0.0002){
      ctx.save();
      ctx.beginPath();
      ctx.arc(0,0,g.edge/k,0,TAU); ctx.arc(0,0,rPlay/k,0,TAU,true); ctx.clip();
      ctx.globalAlpha = 1;
      ctx.drawImage(e.groove, -bmpSize/2, -bmpSize/2);
      ctx.globalAlpha = 0.14 + live*0.20;
      ctx.globalCompositeOperation = 'lighter';
      ctx.drawImage(e.groove, -bmpSize/2, -bmpSize/2);
      ctx.restore();
    }

    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = lerp(0.55, (f > 0.5 ? smooth(0.32,0.85,cutP) : 1), f);
    ctx.drawImage(e.label.cv, -e.label.L/2, -e.label.L/2);
    ctx.restore();
  } else {
    ctx.beginPath(); ctx.arc(0,0,g.label,0,TAU);
    ctx.fillStyle = 'rgba(120,113,98,.20)'; ctx.fill();
  }

  // spindle hole — aluminium substrate showing through the lacquer
  ctx.beginPath(); ctx.arc(0,0,g.hole,0,TAU);
  ctx.fillStyle = '#080706'; ctx.fill();
  ctx.beginPath(); ctx.arc(0,0,g.hole,Math.PI*0.88,Math.PI*1.96);
  ctx.strokeStyle = 'rgba(198,204,196,.55)';
  ctx.lineWidth = Math.max(1, rr*0.004); ctx.stroke();

  // light raking across the surface
  ctx.save();
  ctx.beginPath(); ctx.arc(0,0,rr,0,TAU); ctx.clip();
  const sh = ctx.createLinearGradient(-rr*0.85,-rr*1.05, rr*0.75, rr*0.95);
  sh.addColorStop(0,'rgba(255,251,238,.125)');
  sh.addColorStop(0.28,'rgba(255,251,238,.030)');
  sh.addColorStop(0.56,'rgba(0,0,0,0)');
  sh.addColorStop(1,'rgba(0,0,0,.46)');
  ctx.fillStyle = sh; ctx.fillRect(-rr,-rr,rr*2,rr*2);
  ctx.globalCompositeOperation = 'lighter';
  const hot = ctx.createRadialGradient(-rr*0.46,-rr*0.52, 0, -rr*0.46,-rr*0.52, rr*0.98);
  hot.addColorStop(0,'rgba(255,250,236,.085)'); hot.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle = hot; ctx.fillRect(-rr,-rr,rr*2,rr*2);
  ctx.restore();

  // fresh cut trailing the stylus — the only part driven by live audio
  if(isPlaying && !audio.paused && f > 0.5){
    const a = (0.26 + live*0.6) * f;
    ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.lineCap = 'round';
    for(let s=0;s<3;s++){
      ctx.strokeStyle = 'rgba(214,224,222,'+(a*(1-s*0.3)*0.5).toFixed(3)+')';
      ctx.lineWidth = Math.max(1, rr*(0.003 + s*0.0034));
      ctx.beginPath(); ctx.arc(0,0,rPlay, 0.014, 0.26 + live*0.5); ctx.stroke();
    }
    ctx.restore();
  }

  // rim chamfer
  const rg = ctx.createLinearGradient(-rr,-rr, rr, rr);
  rg.addColorStop(0,'rgba(198,204,196,.60)');
  rg.addColorStop(0.34,'rgba(120,124,118,.18)');
  rg.addColorStop(0.72,'rgba(10,9,8,.9)');
  rg.addColorStop(1,'rgba(150,156,148,.26)');
  ctx.beginPath(); ctx.arc(0,0,rr*0.996,0,TAU);
  ctx.strokeStyle = rg; ctx.lineWidth = Math.max(1.2, rr*0.007); ctx.stroke();

  if(f < 1){
    ctx.beginPath(); ctx.arc(0,0,rr,0,TAU);
    ctx.fillStyle = 'rgba(7,6,5,'+((1-f)*0.46).toFixed(3)+')'; ctx.fill();
  }
  ctx.restore();
}

// -------------------------------------------------------------- stylus --

function drawArm(){
  if(arm <= 0.002) return;
  const t = TRACKS[playingIdx];
  const g = geom(R);
  const prog = (t && t.duration) ? clamp(audio.currentTime/t.duration, 0, 1) : 0;
  const rPlay = lerp(g.start, g.end, prog);

  const lift = 1-arm;
  const px = CX + R*1.03, py = CY - R*0.92;
  const tipR = lerp(g.start*1.12, rPlay, arm);
  const tx = CX + tipR, ty = CY - lift*R*0.11;
  const ox = lift*15 + 5, oy = lift*21 + 9;

  ctx.save();
  ctx.lineCap = 'round';

  ctx.globalAlpha = 0.34*arm;
  ctx.strokeStyle = '#000';
  ctx.lineWidth = Math.max(3, R*0.017);
  ctx.beginPath(); ctx.moveTo(px+ox, py+oy); ctx.lineTo(tx+ox, ty+oy); ctx.stroke();
  ctx.globalAlpha = 1;

  const ag = ctx.createLinearGradient(px,py,tx,ty);
  ag.addColorStop(0,'rgba(216,222,214,.95)');
  ag.addColorStop(0.5,'rgba(146,152,144,.92)');
  ag.addColorStop(1,'rgba(206,212,204,.96)');
  ctx.strokeStyle = ag; ctx.lineWidth = Math.max(2.4, R*0.0135);
  ctx.beginPath(); ctx.moveTo(px,py); ctx.lineTo(tx,ty); ctx.stroke();

  const bx = px + (px-tx)*0.14, by = py + (py-ty)*0.14;
  ctx.strokeStyle = 'rgba(188,194,186,.92)'; ctx.lineWidth = Math.max(5, R*0.030);
  ctx.beginPath(); ctx.moveTo(px,py); ctx.lineTo(bx,by); ctx.stroke();

  ctx.beginPath(); ctx.arc(px,py,Math.max(4,R*0.024),0,TAU);
  ctx.fillStyle = '#1a1916'; ctx.fill();
  ctx.strokeStyle = 'rgba(198,204,196,.75)'; ctx.lineWidth = Math.max(1,R*0.0035); ctx.stroke();

  const ang = Math.atan2(ty-py, tx-px);
  ctx.save();
  ctx.translate(tx,ty); ctx.rotate(ang);
  ctx.fillStyle = '#141310';
  ctx.fillRect(-R*0.056,-R*0.017, R*0.058, R*0.034);
  ctx.strokeStyle = 'rgba(198,204,196,.8)'; ctx.lineWidth = Math.max(1,R*0.0032);
  ctx.strokeRect(-R*0.056,-R*0.017, R*0.058, R*0.034);
  ctx.restore();

  ctx.beginPath(); ctx.arc(tx,ty,Math.max(1.6,R*0.0075),0,TAU);
  ctx.fillStyle = 'rgba(240,246,242,'+(0.65+0.35*arm).toFixed(2)+')'; ctx.fill();
  ctx.restore();

  if(landAt > 0){
    const el = (performance.now()-landAt)/700;
    if(el < 1){
      ctx.save(); ctx.globalCompositeOperation = 'lighter';
      ctx.strokeStyle = 'rgba(206,216,212,'+(0.45*(1-el)).toFixed(3)+')';
      ctx.lineWidth = Math.max(1, R*0.006*(1-el)+0.5);
      ctx.beginPath(); ctx.arc(CX,CY, tipR + ease(el)*R*0.13, 0, TAU); ctx.stroke();
      ctx.restore();
    } else landAt = -1;
  }
}

// --------------------------------------------------------------- frame ---

let lastFrame = performance.now();
let lastCentre = -1;

function frame(now){
  requestAnimationFrame(frame);
  const dt = Math.min(64, now-lastFrame); lastFrame = now;

  if(!dragging){
    if(target !== null){
      const d = target - pos;
      vel = vel*0.60 + d*0.17;
      pos += vel;
      if(Math.abs(d) < 0.0015 && Math.abs(vel) < 0.0015){
        pos = mod(target, N); vel = 0; target = null;
      }
    } else {
      pos += vel; vel *= 0.905;
      if(Math.abs(vel) < 0.016 && Math.abs(pos-Math.round(pos)) > 0.0006) target = Math.round(pos);
      else if(Math.abs(vel) < 0.016) vel = 0;
    }
  }

  const prevArm = arm;
  arm += (armTarget-arm) * (armTarget > arm ? 0.055 : 0.12);
  if(prevArm < 0.985 && arm >= 0.985 && armTarget === 1 && landAt < 0) landAt = now;
  if(armTarget === 0 && arm < 0.02) arm = 0;

  if(cutP < 1){
    cutP = Math.min(1, cutP + dt/1450);
    if(cutP >= 1) angles[centre()] = 0;   // settle upright, not mid-turn
  }

  if(an && playingIdx >= 0 && !audio.paused){
    an.getByteFrequencyData(freq);
    let s = 0; for(let i=1;i<10;i++) s += freq[i];
    live = live*0.74 + clamp(s/(9*255)*1.35, 0, 1)*0.26;
  } else live *= 0.90;

  // platter speed is real: 33 1/3 rpm off audio.currentTime, so it stalls when
  // the audio stalls and holds position when paused.
  const c = centre();
  if(playingIdx >= 0) angles[playingIdx] = audio.currentTime * (100/3) / 60 * TAU;
  if(cutP < 1 && c !== playingIdx) angles[c] = ease(cutP)*TAU*3;   // whole turns, so it settles upright

  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.clearRect(0,0,W,H);

  const order = [];
  for(let s=Math.floor(pos)-2; s<=Math.ceil(pos)+2; s++){
    const d = s-pos, sx = CX + d*SPACING;
    if(sx < -R*1.5 || sx > W+R*1.5) continue;
    order.push({i: mod(s,N), d:Math.abs(d), sx, scale: clamp(1-Math.abs(d)*0.18, 0.62, 1),
                f: clamp(1-Math.abs(d)*1.7, 0, 1)});
  }
  order.sort((a,b)=> b.d - a.d);

  if(Math.abs(vel) < 0.10){
    const near = order.slice().sort((a,b)=> a.d - b.d);
    for(const o of near){ if(!cached(TRACKS[o.i])){ plate(TRACKS[o.i]); break; } }
  }

  for(const o of order) drawPlate(o.i, o.sx, o.scale, o.f);
  if(playingIdx === c && arm > 0) drawArm();

  if(c !== lastCentre){ lastCentre = c; paintChrome(c); }
  if(playingIdx >= 0 && !audio.paused) tick();
}

// -------------------------------------------------------------- chrome ---

const fIdx = document.getElementById('fIdx');
const fTitle = document.getElementById('fTitle');
const fSpecs = document.getElementById('fSpecs');

function paintChrome(i){
  const t = TRACKS[i]; if(!t) return;
  fIdx.textContent = pad(i+1,2)+' / '+N;
  fTitle.textContent = t.title;
  const rows = MOBILE ? [
    ['CUT', t.date || '—'],
    ['LENGTH', mmss(t.duration)],
    ['TEMPO', t.bpm+' BPM'],
    ['MATRIX', t.matrix]
  ] : [
    ['CUT', t.date || '—'],
    ['LENGTH', mmss(t.duration)],
    ['TEMPO', t.bpm+' BPM'],
    ['LEVEL', t.rmsDb.toFixed(1)+' dB RMS'],
    ['CREST', t.crest.toFixed(1)+' dB'],
    ['MATRIX', t.matrix]
  ];
  let html = '';
  for(const r of rows) html += '<dt>'+r[0]+'</dt><dd>'+r[1]+'</dd>';
  fSpecs.innerHTML = html;
  if(playingIdx < 0) tick();
  const el = ixGrid.children;
  for(let k=0;k<el.length;k++) el[k].classList.toggle('cur', k===i);
}

// --------------------------------------------------------------- index ---

const ixEl = document.getElementById('index');
const ixGrid = document.getElementById('ixGrid');

function buildIndex(){
  ixGrid.innerHTML = '';
  TRACKS.forEach((t,i)=>{
    const b = document.createElement('button');
    b.className = 'ixrow';
    b.innerHTML = '<span class="n"></span><span class="t"></span><span class="d"></span>';
    b.children[0].textContent = pad(i+1,2);
    b.children[1].textContent = t.title;
    b.children[2].textContent = t.date ? t.date.slice(0,7) : '—';
    b.addEventListener('click', ()=>{ goTo(i); closeIndex(); });
    ixGrid.appendChild(b);
  });
  document.getElementById('ixTitle').textContent = 'INDEX / '+N+' SIDES';
}
function toggleIndex(){ ixEl.classList.contains('open') ? closeIndex() : openIndex(); }
function openIndex(){ ixEl.classList.add('open'); paintChrome(centre()); }
function closeIndex(){ ixEl.classList.remove('open'); }

document.getElementById('bIndex').addEventListener('click', toggleIndex);
document.getElementById('ixClose').addEventListener('click', closeIndex);
elPlay.addEventListener('click', ()=> play(playingIdx >= 0 ? playingIdx : centre()));
elStop.addEventListener('click', stopAll);

// ---------------------------------------------------------------- boot ---

let resizeT = 0;
window.addEventListener('resize', ()=>{
  clearTimeout(resizeT); resizeT = setTimeout(layout, 90);
});
window.addEventListener('orientationchange', ()=> setTimeout(layout, 250));

(async function boot(){
  layout();
  await load();
  angles = new Float32Array(N);
  document.getElementById('mCount').textContent = N;
  const ds = TRACKS.map(t=>t.date).filter(Boolean).sort();
  document.getElementById('mYears').textContent =
    ds.length ? ds[0].slice(0,4)+'–'+ds[ds.length-1].slice(0,4) : '';
  try{
    await document.fonts.load('400 60px "Instrument Serif"');
    await document.fonts.load('400 20px "DM Mono"');
    await document.fonts.ready;
  }catch(e){}
  buildIndex();
  paintChrome(0);
  lastCentre = 0;
  // cut the three plates that are on screen before the first frame, so the
  // lathe animation doesn't stutter against a build
  plate(TRACKS[0]); plate(TRACKS[1 % N]); plate(TRACKS[mod(-1,N)]);
  syncUI();
  requestAnimationFrame(frame);
})();

})();
</script>
</body>
</html>
