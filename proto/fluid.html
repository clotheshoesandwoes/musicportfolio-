<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Kani — Fluid</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@200..900&display=block" rel="stylesheet">
<style>
:root{
  --bone:#F2EFE9;
  --deep:#040507;
  --pad: max(18px, env(safe-area-inset-left));
  --top: max(16px, env(safe-area-inset-top));
  --bot: max(16px, env(safe-area-inset-bottom));
  --rail: 46px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;background:var(--deep);overflow:hidden;-webkit-text-size-adjust:100%;}
body{
  font-family:'Inter Tight',system-ui,-apple-system,sans-serif;
  font-variant-numeric:tabular-nums lining-nums;
  color:var(--bone);
  overscroll-behavior:none;
  touch-action:none;
  user-select:none;-webkit-user-select:none;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;display:block;}

#gl{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0;}

/* ---------- chrome ---------- */
#hud{position:fixed;inset:0;z-index:2;pointer-events:none;}
#hud .hit{pointer-events:auto;}

#mark{
  position:absolute;left:var(--pad);top:var(--top);
  font-size:13px;font-weight:600;letter-spacing:.14em;
  opacity:.9;
}
#count{
  position:absolute;right:calc(var(--pad) + var(--rail) - 12px);top:var(--top);
  font-size:13px;font-weight:500;letter-spacing:.06em;opacity:.45;
}

/* ---------- the column of titles ---------- */
#column{
  position:absolute;
  left:var(--pad); right:calc(var(--pad) + var(--rail));
  top:0; bottom:0;
  will-change:transform;
}
.card{
  position:absolute;left:0;right:0;
  display:flex;flex-direction:column;justify-content:center;
  will-change:transform,opacity;
  pointer-events:auto;
}
.card h2{
  font-weight:800;
  line-height:.88;
  letter-spacing:-.035em;
  text-transform:uppercase;
  text-wrap:balance;
  overflow-wrap:break-word;
  margin:0;
  text-shadow:0 2px 18px rgba(0,0,0,.55);
}
.card .meta{
  margin-top:14px;
  font-size:12.5px;font-weight:500;letter-spacing:.05em;
  display:flex;gap:14px;flex-wrap:wrap;
  opacity:.62;
}
.card .meta b{font-weight:500;opacity:.55;}
.card.far{opacity:.16;}

/* ---------- rail: 72 tracks, drag to travel ---------- */
#railhit{
  position:absolute;right:0;top:0;bottom:0;width:calc(var(--rail) + var(--pad));
}
#railcv{
  position:absolute;right:var(--pad);top:0;
  width:calc(var(--rail) - 12px);height:100%;
  display:block;
}

/* ---------- transport ---------- */
#bar{
  position:absolute;left:var(--pad);right:var(--pad);
  bottom:var(--bot);
  display:flex;align-items:center;gap:14px;
}
#pp{
  width:52px;height:52px;flex:0 0 52px;border-radius:50%;
  border:1px solid rgba(242,239,233,.28);
  display:flex;align-items:center;justify-content:center;
  background:rgba(4,5,7,.42);
}
#pp i{display:block;}
#pp.paused i{
  width:0;height:0;margin-left:4px;
  border-left:13px solid var(--bone);
  border-top:9px solid transparent;
  border-bottom:9px solid transparent;
}
#pp.playing i{
  width:13px;height:16px;
  border-left:4.5px solid var(--bone);
  border-right:4.5px solid var(--bone);
}
#seek{position:relative;flex:1 1 auto;height:52px;}
#wave{position:absolute;inset:0;width:100%;height:100%;display:block;}
#clock{
  flex:0 0 auto;font-size:12px;font-weight:500;letter-spacing:.04em;opacity:.5;
  min-width:76px;text-align:right;
}
@media (min-width:760px){
  :root{--pad:34px;--rail:56px;}
  #mark{font-size:14px;}
  #bar{left:auto;right:calc(var(--pad) + var(--rail));width:min(560px,52vw);}
}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="hud">
  <div id="mark">KANI</div>
  <div id="count">—</div>
  <div id="column"></div>
  <div id="railhit" class="hit"><canvas id="railcv"></canvas></div>
  <div id="bar">
    <button id="pp" class="paused hit" aria-label="play"><i></i></button>
    <div id="seek" class="hit"><canvas id="wave"></canvas></div>
    <div id="clock">0:00</div>
  </div>
</div>

<script id="vs" type="x-shader/x-vertex">
attribute vec2 a;
void main(){ gl_Position = vec4(a, 0.0, 1.0); }
</script>

<script id="fs" type="x-shader/x-fragment">
#ifdef GL_FRAGMENT_PRECISION_HIGH
precision highp float;
#else
precision mediump float;
#endif

uniform vec2  uRes;
uniform float uTime;
uniform sampler2D uEnv;
uniform float uTempo;      // wave speed, from bpm
uniform vec3  uTint;       // accent from band balance
uniform float uW[6];       // per-band weight from balance
uniform float uPlateX;     // plate centre x, height-normalised, 0 = screen centre
uniform float uPlateY;     // plate centre, 0 bottom .. 1 top (screen)
uniform float uPlateH;     // plate half-height (screen units, y-normalised)
uniform float uPlateW;     // plate half-width
uniform float uSink;       // 0..1 how hard the plate presses
uniform float uRing;       // expanding ring distance, <0 = off
uniform float uRingAmp;
uniform float uLive[6];    // live analyser band levels, 0..1, .5 = neutral
uniform float uLiveMix;    // 0 = precomputed only, 1 = fully live
uniform float uImpact;     // travel turbulence
uniform float uProg;       // playhead 0..1
uniform float uPlaying;

const float HOR = 1.34;    // horizon just above the top edge
const float NEARD = 1.0 / HOR;
const float FARD  = 1.0 / (HOR - 1.0);

// ridges run across the column and recede: the long axis of the wave is depth
float ky(int i){
  if(i==0) return  2.35;
  if(i==1) return  4.10;
  if(i==2) return  6.90;
  if(i==3) return 11.6;
  if(i==4) return 19.4;
  return 32.0;
}
float kx(int i){
  if(i==0) return  0.85;
  if(i==1) return -1.45;
  if(i==2) return  2.30;
  if(i==3) return -3.40;
  if(i==4) return  5.10;
  return -7.40;
}
float ph0(int i){
  if(i==0) return 0.00;
  if(i==1) return 1.94;
  if(i==2) return 4.11;
  if(i==3) return 2.37;
  if(i==4) return 5.62;
  return 3.28;
}

// screen position (0..1 both axes) for a world point on the plane
vec2 toScreen(vec2 w, float ax){
  float d = max(w.y, 0.05);
  return vec2(w.x / (ax * d) + 0.5, HOR - 1.0 / d);
}

float roundBox(vec2 p, vec2 b, float r){
  vec2 q = abs(p) - b + r;
  return min(max(q.x, q.y), 0.0) + length(max(q, 0.0)) - r;
}

// the plate: a solid slab resting in the liquid. flattens it, raises a meniscus.
float plateSD(vec2 w, float ax){
  vec2 sp = toScreen(w, ax);
  vec2 q = vec2((sp.x - 0.5) * ax - uPlateX, sp.y - uPlateY);
  return roundBox(q, vec2(uPlateW, uPlateH), 0.045);
}
float plateH(float sd){
  float inside = smoothstep(0.055, -0.010, sd);
  float well = -0.048 * uSink * inside;
  float lip  =  0.046 * uSink * exp(-max(sd, 0.0) / 0.022) * step(0.0, sd);
  float ring = 0.0;
  if(uRingAmp > 0.001){
    float d = sd - uRing;
    ring = uRingAmp * exp(-d * d * 260.0) * cos(d * 34.0);
  }
  return well + lip + ring;
}
float plateDamp(float sd){
  return mix(0.05, 1.0, smoothstep(-0.012, 0.085, sd));
}

void main(){
  vec2 sp = gl_FragCoord.xy / uRes;
  float ax = uRes.x / uRes.y;

  // ---- ground-plane perspective: top of screen recedes ----
  float dist = 1.0 / max(HOR - sp.y, 0.05);
  vec2  w = vec2((sp.x - 0.5) * ax * dist * 0.62, dist);

  // song time along depth: near = start, far = end
  float s = clamp((dist - NEARD) / (FARD - NEARD), 0.0, 1.0);
  float dsdy = 1.0 / (FARD - NEARD);

  vec4 A0 = texture2D(uEnv, vec2(s, 0.25));
  vec4 B0 = texture2D(uEnv, vec2(s, 0.75));
  float e = 0.0045;
  vec4 A1 = texture2D(uEnv, vec2(min(s + e, 1.0), 0.25));
  vec4 B1 = texture2D(uEnv, vec2(min(s + e, 1.0), 0.75));

  float amp[6];
  float dAmp[6];
  amp[0]=A0.r; amp[1]=A0.g; amp[2]=A0.b; amp[3]=A0.a; amp[4]=B0.r; amp[5]=B0.g;
  dAmp[0]=A1.r-A0.r; dAmp[1]=A1.g-A0.g; dAmp[2]=A1.b-A0.b;
  dAmp[3]=A1.a-A0.a; dAmp[4]=B1.r-B0.r; dAmp[5]=B1.g-B0.g;

  // the ridge lines bow across the channel instead of running dead straight
  float warp  = 0.055 * sin(w.x * 3.30 + uTime * 0.121) + 0.034 * sin(w.x * 6.10 - uTime * 0.083);
  float dwarp = 0.055 * 3.30 * cos(w.x * 3.30 + uTime * 0.121) - 0.034 * 6.10 * cos(w.x * 6.10 - uTime * 0.083);

  // one pixel in world units at this depth -> fade what would alias in the distance
  float foot = dist * dist / uRes.y;

  float h = 0.0, hx = 0.0, hy = 0.0;
  for(int i = 0; i < 6; i++){
    float k = ky(i);
    float aa = exp(-k * foot * 3.4);
    float live = 1.0 + uLiveMix * (uLive[i] - 0.5) * 1.9;
    float sc = 0.118 / (1.0 + 2.30 * float(i));
    float g  = (0.13 + 0.87 * amp[i]) * uW[i] * aa * live * sc;
    float dg = dAmp[i] / e * dsdy * uW[i] * aa * live * sc * 0.30;
    float om = uTempo * (0.26 + 0.40 * float(i)) + uImpact * 2.2;
    float p = k * (w.y + warp) + kx(i) * w.x + om * uTime + ph0(i);
    float sn = sin(p), cs = cos(p);
    h  += g * sn;
    hx += g * cs * (k * dwarp + kx(i));
    hy += dg * sn + g * cs * k;
  }

  // playhead: a single travelling ridge
  float pd = (s - uProg) / 0.010;
  float ph = exp(-pd * pd) * uPlaying;
  h  += ph * 0.016;
  hy += ph * (-2.0 * pd / 0.010) * 0.016 * dsdy;

  // plate, differenced in world space so it shares the wave's frame
  float sd = plateSD(w, ax);
  float dw = max(dist * 0.0022, 0.0006);
  float p0 = plateH(sd);
  float px = plateH(plateSD(w + vec2(dw, 0.0), ax));
  float py = plateH(plateSD(w + vec2(0.0, dw), ax));
  float dmp = plateDamp(sd);
  float dmpx = plateDamp(plateSD(w + vec2(dw, 0.0), ax));
  float dmpy = plateDamp(plateSD(w + vec2(0.0, dw), ax));

  float hh  = h * dmp + p0;
  float hhx = hx * dmp + h * (dmpx - dmp) / dw + (px - p0) / dw;
  float hhy = hy * dmp + h * (dmpy - dmp) / dw + (py - p0) / dw;

  vec3 N = normalize(vec3(-hhx, -hhy, 1.0));

  // ---- material ----
  vec3 pos = vec3(w.x, w.y, min(hh, 0.20));   // never let a crest reach the camera
  vec3 cam = vec3(0.0, -0.05, 0.30);
  vec3 V = normalize(cam - pos);
  vec3 L = normalize(vec3(-0.16, 0.44, 0.88));

  float ndv = clamp(dot(N, V), 0.0, 1.0);
  vec3 Hv = normalize(L + V);
  float ndh = max(dot(N, Hv), 0.0);
  // tighten the highlight only where a pixel covers little surface, so it never aliases
  float gloss = mix(34.0, 240.0, exp(-foot * 240.0));
  float spec = pow(ndh, gloss) * 1.90 + pow(ndh, 10.0) * 0.055;

  vec3 R = reflect(-V, N);
  // one softbox overhead and a dim fill: everything else is a black room
  float bz = (R.z - 0.38) / 0.150;
  float box = exp(-bz * bz);
  float fz = (R.z - 0.78) / 0.22;
  float fillr = exp(-fz * fz);
  float sky = smoothstep(-0.05, 0.80, R.z);
  vec3 env = uTint * (0.030 + 1.60 * box + 0.42 * fillr) + vec3(0.018, 0.021, 0.028) * sky;

  float F = 0.022 + 0.978 * pow(1.0 - ndv, 5.0);

  vec3 base = vec3(0.0105, 0.0120, 0.0158) + uTint * 0.011 * smoothstep(-0.02, 0.05, hh);
  vec3 col = base + env * F + spec * mix(vec3(1.0), uTint, 0.5);

  // playhead lifts the tint a touch
  col += uTint * ph * 0.055;

  // reading well: liquid held flat and dark under the plate
  float inside = smoothstep(0.075, -0.055, sd);
  col *= mix(1.0, 0.30, inside * uSink);
  float ed = sd / 0.0070;
  col += vec3(0.95, 0.95, 1.0) * exp(-ed * ed) * 0.30 * uSink;

  // distance haze so the far end reads as depth, not noise
  float fog = smoothstep(0.56, 1.0, sp.y);
  col = mix(col, vec3(0.0180, 0.0200, 0.0265), fog * 0.72);

  // vignette
  vec2 vv = sp - 0.5;
  col *= 1.0 - dot(vv, vv) * 0.55;

  // dither: kills banding on phone panels
  float dth = fract(sin(dot(gl_FragCoord.xy, vec2(12.9898, 78.233))) * 43758.5453);
  col += (dth - 0.5) / 255.0;

  gl_FragColor = vec4(max(col, 0.0), 1.0);
}
</script>

<script>
(function(){
'use strict';

const COLS = 256;
const b64 = s => { const bin = atob(s); const a = new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) a[i]=bin.charCodeAt(i); return a; };
const clamp = (v,a,b) => v<a?a:(v>b?b:v);
const mix = (a,b,t) => a+(b-a)*t;
const mmss = s => { if(!isFinite(s)||s<0) s=0; const m=Math.floor(s/60); return m+':'+String(Math.floor(s%60)).padStart(2,'0'); };

// ---------------------------------------------------------------- GL
const cv = document.getElementById('gl');
const gl = cv.getContext('webgl', {alpha:false, antialias:false, depth:false, stencil:false, powerPreference:'high-performance', preserveDrawingBuffer:false});
if(!gl){ document.body.style.background='#040507'; throw new Error('no webgl'); }

function sh(type, src){
  const s = gl.createShader(type);
  gl.shaderSource(s, src); gl.compileShader(s);
  if(!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
  return s;
}
const prog = gl.createProgram();
gl.attachShader(prog, sh(gl.VERTEX_SHADER, document.getElementById('vs').textContent));
gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, document.getElementById('fs').textContent));
gl.linkProgram(prog);
if(!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
gl.useProgram(prog);

const buf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
const loc_a = gl.getAttribLocation(prog, 'a');
gl.enableVertexAttribArray(loc_a);
gl.vertexAttribPointer(loc_a, 2, gl.FLOAT, false, 0, 0);

const U = {};
['uRes','uTime','uEnv','uTempo','uTint','uPlateX','uPlateY','uPlateH','uPlateW','uSink','uRing','uRingAmp','uLiveMix','uImpact','uProg','uPlaying']
  .forEach(n => U[n] = gl.getUniformLocation(prog, n));
U.uW    = gl.getUniformLocation(prog, 'uW[0]');
U.uLive = gl.getUniformLocation(prog, 'uLive[0]');

const tex = gl.createTexture();
gl.activeTexture(gl.TEXTURE0);
gl.bindTexture(gl.TEXTURE_2D, tex);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
const texBytes = new Uint8Array(COLS * 2 * 4);
gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, COLS, 2, 0, gl.RGBA, gl.UNSIGNED_BYTE, texBytes);
gl.uniform1i(U.uEnv, 0);

let DPR = Math.min(window.devicePixelRatio || 1, 1.5);
let W = 0, H = 0;
function resize(){
  const w = cv.clientWidth || window.innerWidth;
  const h = cv.clientHeight || window.innerHeight;
  W = Math.max(1, Math.round(w * DPR));
  H = Math.max(1, Math.round(h * DPR));
  cv.width = W; cv.height = H;
  gl.viewport(0, 0, W, H);
  gl.uniform2f(U.uRes, W, H);
  layout();
}
window.addEventListener('resize', resize);

// ---------------------------------------------------------------- data
let TR = [];          // joined track records
let idx = 0;          // focused track (integer)
let pos = 0;          // continuous travel position
let vel = 0;

const target  = new Float32Array(COLS * 8);   // 8 channels x 256
const curv    = new Float32Array(COLS * 8);
const velv    = new Float32Array(COLS * 8);
const splash  = new Float32Array(COLS);       // live disturbance riding on top
const splash2 = new Float32Array(COLS);

function tintFor(t){
  // spectral tilt -> one accent. bass-led = copper, treble-led = cold steel.
  let num = 0, den = 0;
  for(let b=0;b<6;b++){ const n = t.nb[b]; num += n * b; den += n; }
  const tilt = clamp((den > 0 ? num/den : 2.5) / 5, 0, 1);
  // the corpus only spans tilt 0.40..0.58, so stretch that to the whole ramp
  const k = clamp((tilt - 0.398) / 0.178, 0, 1);
  const warm = [1.00, 0.545, 0.255];
  const midc = [0.78, 0.760, 0.720];
  const cold = [0.470, 0.680, 1.00];
  const A = k < 0.5 ? warm : midc, B = k < 0.5 ? midc : cold;
  const f = k < 0.5 ? k*2 : (k-0.5)*2;
  return [mix(A[0],B[0],f), mix(A[1],B[1],f), mix(A[2],B[2],f)];
}

// a wave envelope has to vary smoothly in space or the surface gets cliffs.
// a 5-tap blur keeps the structure and kills the per-column steps.
function smooth5(src, out){
  const n = src.length;
  for(let i=0;i<n;i++){
    const a = src[Math.max(i-2,0)], b = src[Math.max(i-1,0)], c = src[i],
          d = src[Math.min(i+1,n-1)], e = src[Math.min(i+2,n-1)];
    out[i] = (a + 2*b + 3*c + 2*d + e) / 9 / 255;
  }
  return out;
}
const tmpB = [0,1,2,3,4,5].map(()=>new Float32Array(COLS));
const tmpC = new Float32Array(COLS);
function buildTargets(t){
  for(let b=0;b<6;b++) smooth5(t.bands[b], tmpB[b]);
  smooth5(t.cent, tmpC);
  const pk = t.peaks;
  for(let c=0;c<COLS;c++){
    target[c*8+0] = tmpB[0][c]; target[c*8+1] = tmpB[1][c];
    target[c*8+2] = tmpB[2][c]; target[c*8+3] = tmpB[3][c];
    target[c*8+4] = tmpB[4][c]; target[c*8+5] = tmpB[5][c];
    target[c*8+6] = tmpC[c];
    target[c*8+7] = (pk[c*2] + pk[c*2+1]) / 510;
  }
}

async function boot(){
  const [marks, cfg] = await Promise.all([
    fetch('/data/marks.json').then(r=>r.json()),
    fetch('/config.json').then(r=>r.json())
  ]);
  // corpus range per band so the balance weighting is meaningful
  const lo = [1e9,1e9,1e9,1e9,1e9,1e9], hi = [-1e9,-1e9,-1e9,-1e9,-1e9,-1e9];
  for(const k in marks.tracks){ const b = marks.tracks[k].balance;
    for(let i=0;i<6;i++){ if(b[i]<lo[i]) lo[i]=b[i]; if(b[i]>hi[i]) hi[i]=b[i]; } }

  TR = cfg.tracks.filter(t => marks.tracks[t.file]).map(t => {
    const m = marks.tracks[t.file];
    const nb = m.balance.map((v,i) => clamp((v-lo[i])/Math.max(hi[i]-lo[i],1e-6), 0, 1));
    const rec = {
      file: t.file,
      title: (t.title || m.title || t.file.replace(/\.mp3$/i,'')).trim(),
      date: t.date || m.date || '',
      dur: m.duration, bpm: m.bpm, crest: m.crest, onset: m.onsetRate, rms: m.rmsDb,
      nb,
      w: nb.map(n => 0.42 + 1.22*n),
      bands: m.bands.map(b64),
      cent: b64(m.cent),
      peaks: b64(m.peaks),
      tempo: clamp(m.bpm/100, 0.55, 1.75)
    };
    rec.tint = tintFor(rec);
    return rec;
  });
  if(!TR.length) throw new Error('no tracks');

  const hash = parseInt((location.hash || '').replace('#',''), 10);
  idx = (isFinite(hash) && hash >= 1 && hash <= TR.length) ? hash - 1 : 0;
  pos = idx;
  buildTargets(TR[idx]);
  curv.set(target);
  buildCards();
  resize();
  drawRail();
  drawWave();
  updateMeta();
  // type metrics come from the fallback face until Inter Tight actually lands,
  // and fonts.ready can resolve before the face is even requested. force it, then re-fit.
  if(document.fonts && document.fonts.load){
    Promise.all([
      document.fonts.load('800 60px "Inter Tight"'),
      document.fonts.load('500 13px "Inter Tight"')
    ]).then(layout, ()=>{});
    if(document.fonts.ready) document.fonts.ready.then(layout, ()=>{});
  }
  setTimeout(layout, 1000);
  requestAnimationFrame(frame);
}

// ---------------------------------------------------------------- cards
const colEl = document.getElementById('column');
const CARDN = 7;
const cards = [];
let STEP = 170, focusY = 0, colW = 300, colCx = 0, cardH = 180, H_css = 844, sizeCache = {};

function buildCards(){
  for(let i=0;i<CARDN;i++){
    const d = document.createElement('div');
    d.className = 'card';
    d.innerHTML = '<h2></h2><div class="meta"></div>';
    d.dataset.n = '-999';
    colEl.appendChild(d);
    cards.push({el:d, h2:d.querySelector('h2'), meta:d.querySelector('.meta'), n:-999});
  }
}

// scrollWidth reports clientWidth for overflow:visible blocks, so the widest word
// is measured by a probe living inside the heading, inheriting its exact metrics.
const probe = document.createElement('span');
probe.style.cssText = 'position:absolute;left:-99999px;top:0;white-space:pre;';

function fitTitle(h2, text){
  if(sizeCache[text]){ h2.style.fontSize = sizeCache[text]+'px'; return; }
  const maxH = Math.min(window.innerHeight * 0.235, 168);
  const maxW = h2.clientWidth || colW;
  const words = text.split(/\s+/).filter(Boolean);
  let s = Math.round(clamp(colW / 4.6, 24, 60));
  h2.style.fontSize = s + 'px';
  h2.appendChild(probe);
  for(let i=0;i<28 && s>15;i++){
    let wide = 0;
    for(let k=0;k<words.length;k++){
      probe.textContent = words[k];
      if(probe.offsetWidth > wide) wide = probe.offsetWidth;
    }
    if(wide <= maxW && h2.offsetHeight <= maxH) break;
    s -= 2; h2.style.fontSize = s + 'px';
  }
  h2.removeChild(probe);
  sizeCache[text] = s;
}

function fill(card, n){
  const t = TR[n];
  card.n = n; card.el.dataset.n = String(n);
  if(!t){ card.el.style.display = 'none'; return; }
  card.el.style.display = '';
  card.h2.textContent = t.title;
  const bits = [];
  if(t.date) bits.push(t.date);
  bits.push(mmss(t.dur));
  bits.push(t.bpm + ' BPM');
  card.meta.textContent = '';
  bits.forEach(b => { const s = document.createElement('span'); s.textContent = b; card.meta.appendChild(s); });
  const cr = document.createElement('b'); cr.textContent = t.crest.toFixed(1) + ' CREST';
  card.meta.appendChild(cr);
  fitTitle(card.h2, t.title);
}

function layout(){
  const w = window.innerWidth, h = window.innerHeight;
  H_css = h;
  STEP = clamp(h * 0.215, 132, 210);
  focusY = h * (h > 700 ? 0.545 : 0.52);
  const r = colEl.getBoundingClientRect();
  colW = r.width || (w - 90);
  colCx = (r.left + r.width / 2) - w / 2;
  sizeCache = {};
  cards.forEach(c => { c.n = -999; c.el.dataset.n = '-999'; });
}

function placeCards(){
  const base = Math.round(pos) - ((CARDN - 1) >> 1);
  for(let k=0;k<CARDN;k++){
    const n = base + k, c = cards[k];
    if(n < 0 || n >= TR.length){ c.el.style.display='none'; c.n = -999; continue; }
    if(c.n !== n) fill(c, n);
    const d = n - pos, ad = Math.abs(d);
    if(n === idx) cardH = c.el.offsetHeight || cardH;
    const off = Math.sign(d) * STEP * Math.pow(ad, 0.82);
    const sc = 1 / (1 + 0.88 * ad);
    const y = focusY + off;
    // titles fade before they can collide with the mark or the transport
    const edge = clamp((y - 34) / 56, 0, 1) * clamp((H_css - 104 - y) / 66, 0, 1);
    const op = (ad <= 1 ? (1 - 0.88 * ad) : Math.max(0, 0.12 - 0.05 * (ad - 1))) * edge;
    c.el.style.transform = 'translate3d(0,' + y.toFixed(1) + 'px,0) translateY(-50%) scale(' + sc.toFixed(3) + ')';
    c.el.style.transformOrigin = '0% 50%';
    c.el.style.opacity = op.toFixed(3);
    c.el.style.visibility = op < 0.012 ? 'hidden' : 'visible';
  }
}

// ---------------------------------------------------------------- rail
const railHit = document.getElementById('railhit');
const railCv = document.getElementById('railcv');
const rctx = railCv.getContext('2d');
let railY0 = 0, railY1 = 0, railH = 0, railW = 0;

function drawRail(){
  const w = railCv.clientWidth, h = railCv.clientHeight;
  if(!w || !h) return;
  const d = Math.min(window.devicePixelRatio || 1, 2);
  const pw = Math.round(w*d), phh = Math.round(h*d);
  if(railCv.width !== pw || railCv.height !== phh){ railCv.width = pw; railCv.height = phh; }
  railW = w; railH = h;
  rctx.setTransform(d,0,0,d,0,0);
  rctx.clearRect(0,0,w,h);
  railY0 = h * 0.155; railY1 = h * 0.80;
  const span = railY1 - railY0, n = TR.length;
  let dmin = 1e9, dmax = 0;
  for(const t of TR){ const L = Math.log(t.dur); if(L<dmin) dmin=L; if(L>dmax) dmax=L; }
  for(let i=0;i<n;i++){
    const y = railY0 + (i + 0.5) * span / n;
    const nz = (Math.log(TR[i].dur) - dmin) / Math.max(dmax - dmin, 1e-6);
    const len = 5 + 17 * nz;
    const dd = Math.abs(i - pos);
    const near = Math.max(0, 1 - dd / 5);
    rctx.strokeStyle = 'rgba(242,239,233,' + (0.13 + 0.30 * near * near).toFixed(3) + ')';
    rctx.lineWidth = 1;
    rctx.beginPath(); rctx.moveTo(w - len, y + 0.5); rctx.lineTo(w, y + 0.5); rctx.stroke();
  }
  const cy = railY0 + (pos + 0.5) * span / n;
  rctx.strokeStyle = 'rgba(242,239,233,.95)';
  rctx.lineWidth = 2;
  rctx.beginPath(); rctx.moveTo(0, cy); rctx.lineTo(w, cy); rctx.stroke();
}

// ---------------------------------------------------------------- transport
const waveCv = document.getElementById('wave');
const wctx = waveCv.getContext('2d');
const ppBtn = document.getElementById('pp');
const clockEl = document.getElementById('clock');
const countEl = document.getElementById('count');
let lastWaveKey = '';

function drawWave(){
  const w = waveCv.clientWidth, h = waveCv.clientHeight;
  if(!w || !h) return;
  const d = Math.min(window.devicePixelRatio || 1, 2);
  if(waveCv.width !== Math.round(w*d)){ waveCv.width = Math.round(w*d); waveCv.height = Math.round(h*d); }
  wctx.setTransform(d,0,0,d,0,0);
  wctx.clearRect(0,0,w,h);
  const t = TR[idx]; if(!t) return;
  const pk = t.peaks, N = pk.length, mid = h/2, amp = h * 0.33;
  const prog = (playing && audio.duration) ? clamp(audio.currentTime / audio.duration, 0, 1) : 0;
  const step = Math.max(1, Math.floor(N / Math.max(1, Math.round(w / 3))));
  for(let i=0;i<N;i+=step){
    let m = 0;
    for(let j=i;j<Math.min(i+step,N);j++) if(pk[j] > m) m = pk[j];
    const x = (i / N) * w;
    const v = Math.max(1, (m / 255) * amp);
    wctx.fillStyle = (i / N) <= prog ? 'rgba(242,239,233,.85)' : 'rgba(242,239,233,.17)';
    wctx.fillRect(x, mid - v, Math.max(1, (step / N) * w - 0.6), v * 2);
  }
}

function updateMeta(){
  countEl.textContent = String(idx + 1).padStart(2,'0') + ' / ' + TR.length;
}

// ---------------------------------------------------------------- audio
const audio = new Audio();
audio.crossOrigin = 'anonymous';
audio.preload = 'none';
let actx = null, analyser = null, freq = null, srcNode = null;
let playing = false, loadedFor = -1;
const lv = [0,0,0,0,0,0], ref = [0,0,0,0,0,0];
const liveArr = new Float32Array([0.5,0.5,0.5,0.5,0.5,0.5]);
let liveMix = 0, playAmt = 0;

function ensureCtx(){
  if(actx) return;
  const AC = window.AudioContext || window.webkitAudioContext;
  if(!AC) return;
  try{
    actx = new AC();
    analyser = actx.createAnalyser();
    analyser.fftSize = 1024;
    analyser.smoothingTimeConstant = 0.55;
    freq = new Uint8Array(analyser.frequencyBinCount);
    srcNode = actx.createMediaElementSource(audio);
    srcNode.connect(analyser);
    analyser.connect(actx.destination);
  }catch(e){ actx = null; analyser = null; }
}

function loadTrack(i){
  if(loadedFor === i) return;
  loadedFor = i;
  audio.src = '/audio-mp3/' + encodeURIComponent(TR[i].file);
  audio.load();
}

function play(){
  ensureCtx();
  if(actx && actx.state === 'suspended') actx.resume();
  loadTrack(idx);
  const p = audio.play();
  if(p && p.catch) p.catch(()=>{ playing = false; syncBtn(); });
  playing = true; syncBtn();
}
function pause(){ audio.pause(); playing = false; syncBtn(); }
function toggle(){ playing ? pause() : play(); }
function syncBtn(){
  ppBtn.className = (playing ? 'playing' : 'paused') + ' hit';
  ppBtn.setAttribute('aria-label', playing ? 'pause' : 'play');
}
ppBtn.addEventListener('click', e => { e.stopPropagation(); toggle(); });
audio.addEventListener('ended', () => { if(idx < TR.length-1){ goTo(idx+1, true); } else { playing=false; syncBtn(); } });

const seekEl = document.getElementById('seek');
function seekAt(clientX){
  const r = seekEl.getBoundingClientRect();
  const f = clamp((clientX - r.left) / r.width, 0, 1);
  if(audio.duration) audio.currentTime = f * audio.duration;
  drawWave();
}
let seeking = false;
seekEl.addEventListener('pointerdown', e => { e.stopPropagation(); seeking = true; seekEl.setPointerCapture(e.pointerId); seekAt(e.clientX); });
seekEl.addEventListener('pointermove', e => { if(seeking) seekAt(e.clientX); });
seekEl.addEventListener('pointerup', e => { seeking = false; });
seekEl.addEventListener('pointercancel', () => { seeking = false; });

// ---------------------------------------------------------------- travel
let ringT = 99, ringOn = false;

function goTo(n, autoplay){
  n = clamp(Math.round(n), 0, TR.length - 1);
  pos = n; vel = 0;
  if(n !== idx) focusOn(n);
  if(autoplay && !playing) play();
}

// the surface reforms immediately; the audio waits until travel has actually stopped,
// otherwise a flick through twenty tracks fires twenty loads
function focusOn(n){
  idx = n;
  buildTargets(TR[n]);
  ringT = 0; ringOn = true;
  splash.fill(0);
  updateMeta();
  drawWave();
  if(loadedFor !== n){ audio.pause(); loadedFor = -1; }
}

let drag = null;
function isChrome(el){ return !!(el && el.closest && el.closest('.hit')); }

window.addEventListener('pointerdown', e => {
  if(isChrome(e.target)) return;
  drag = {y:e.clientY, x:e.clientX, y0:e.clientY, x0:e.clientX, moved:0, rail:false};
}, {passive:true});

railHit.addEventListener('pointerdown', e => {
  e.stopPropagation();
  railHit.setPointerCapture(e.pointerId);
  drag = {rail:true, moved:99};
  railSeek(e.clientY);
}, {passive:true});
railHit.addEventListener('pointermove', e => { if(drag && drag.rail) railSeek(e.clientY); });
railHit.addEventListener('pointerup', () => { if(drag && drag.rail){ settle(); drag = null; } });
railHit.addEventListener('pointercancel', () => { if(drag && drag.rail){ settle(); drag = null; } });

function railSeek(clientY){
  const r = railCv.getBoundingClientRect();
  const y = clientY - r.top;
  const f = clamp((y - railY0) / Math.max(railY1 - railY0, 1), 0, 1);
  const np = clamp(f * TR.length - 0.5, 0, TR.length - 1);
  vel = (np - pos) * 0.35;
  pos = np;
}

window.addEventListener('pointermove', e => {
  if(!drag || drag.rail) return;
  const dy = e.clientY - drag.y;
  drag.moved += Math.abs(dy) + Math.abs(e.clientX - drag.x);
  drag.y = e.clientY; drag.x = e.clientX;
  const np = clamp(pos - dy / STEP, -0.35, TR.length - 0.65);
  vel = (np - pos) * 0.5 + vel * 0.5;
  pos = np;
}, {passive:true});

function endDrag(e){
  if(!drag || drag.rail){ drag = null; return; }
  const d = drag; drag = null;
  if(d.moved < 9){
    // tap: a distant title pulls you to it, the surface itself starts the track
    const el = document.elementFromPoint(d.x0, d.y0);
    const card = el && el.closest ? el.closest('.card') : null;
    const n = card ? parseInt(card.dataset.n, 10) : NaN;
    if(!isNaN(n) && n >= 0 && Math.abs(n - pos) > 0.5) goTo(n, false);
    else toggle();
    return;
  }
  settle();
}
window.addEventListener('pointerup', endDrag);
window.addEventListener('pointercancel', () => { if(drag && !drag.rail) settle(); drag = null; });
function settle(){ vel = clamp(vel, -2.6, 2.6); }

window.addEventListener('keydown', e => {
  if(e.key === 'ArrowDown'){ goTo(pos + 1, false); e.preventDefault(); }
  else if(e.key === 'ArrowUp'){ goTo(pos - 1, false); e.preventDefault(); }
  else if(e.key === ' '){ toggle(); e.preventDefault(); }
});
window.addEventListener('wheel', e => {
  if(isChrome(e.target)) return;
  vel += clamp(e.deltaY, -60, 60) / 320;
  e.preventDefault();
}, {passive:false});

// ---------------------------------------------------------------- loop
const bytes = texBytes;
const wArr = new Float32Array(6);
const tintArr = new Float32Array(3);
let prev = performance.now(), tsec = 0, impact = 0, sink = 1, frames = 0, acc = 0, checked = false;

function readLive(){
  if(!analyser || !playing){ liveMix += (0 - liveMix) * 0.05; return; }
  analyser.getByteFrequencyData(freq);
  const binHz = actx.sampleRate / analyser.fftSize;
  const E = [40,100,250,600,1500,4000,10000];
  for(let b=0;b<6;b++){
    const i0 = Math.max(1, Math.floor(E[b]/binHz)), i1 = Math.min(freq.length-1, Math.ceil(E[b+1]/binHz));
    let s = 0, c = 0;
    for(let i=i0;i<=i1;i++){ s += freq[i]; c++; }
    const v = c ? s/(c*255) : 0;
    lv[b] += (v - lv[b]) * 0.30;
    ref[b] += (lv[b] - ref[b]) * 0.012;
    liveArr[b] = clamp(0.5 + (lv[b] - ref[b]) * 1.7, 0, 1);
  }
  liveMix += (1 - liveMix) * 0.03;
  // the playhead writes a disturbance into the surface that then spreads
  if(audio.duration){
    const c = clamp(Math.floor((audio.currentTime / audio.duration) * COLS), 0, COLS-1);
    const hit = Math.max(0, lv[4] + lv[5] - ref[4] - ref[5]) * 1.4 + Math.max(0, lv[0] - ref[0]) * 0.9;
    splash[c] += clamp(hit, 0, 0.5);
  }
}

function diffuse(){
  for(let i=1;i<COLS-1;i++) splash2[i] = splash[i] + 0.20 * (splash[i-1] + splash[i+1] - 2*splash[i]);
  splash2[0] = splash[0] * 0.9; splash2[COLS-1] = splash[COLS-1] * 0.9;
  for(let i=0;i<COLS;i++) splash[i] = splash2[i] * 0.962;
}

function frame(now){
  requestAnimationFrame(frame);
  let dt = (now - prev) / 1000; prev = now;
  if(!(dt > 0) || dt > 0.1) dt = 1/60;
  tsec += dt;

  // ---- travel physics: real mass, then a snap that settles
  if(!drag){
    const tgt = Math.round(pos);
    vel += (tgt - pos) * 13.5 * dt;
    vel *= Math.pow(0.0022, dt);
    pos += vel * dt * 8.0;
    pos = clamp(pos, 0, TR.length - 1);
    if(Math.abs(pos - tgt) < 0.0012 && Math.abs(vel) < 0.004){ pos = tgt; vel = 0; }
  }
  const near = Math.round(pos);
  if(near !== idx && Math.abs(near - pos) < 0.5) focusOn(near);
  const settled = !drag && pos === near && vel === 0;
  if(settled && playing && loadedFor !== idx){
    loadTrack(idx);
    const pr = audio.play();
    if(pr && pr.catch) pr.catch(()=>{ playing = false; syncBtn(); });
  }

  const speed = Math.abs(vel);
  impact = Math.max(impact * Math.pow(0.10, dt), clamp(speed * 0.55, 0, 1.5));
  sink += (clamp(1 - speed * 0.30, 0.42, 1) - sink) * clamp(dt * 9, 0, 1);

  // ---- surface springs toward the new track's structure, near end first
  readLive();
  diffuse();
  let moving = 0;
  for(let c=0;c<COLS;c++){
    const k = 88 * (1.10 - 0.55 * (c / COLS));
    const dmp = Math.pow(0.0009, dt);
    for(let ch=0;ch<8;ch++){
      const i = c*8+ch;
      velv[i] = (velv[i] + (target[i] - curv[i]) * k * dt) * dmp;
      curv[i] += velv[i] * dt;
      moving += Math.abs(velv[i]);
    }
    const sp = splash[c];
    const o = c*4;
    bytes[o]   = clamp((curv[c*8+0] + sp*0.55) * 255, 0, 255);
    bytes[o+1] = clamp((curv[c*8+1] + sp*0.50) * 255, 0, 255);
    bytes[o+2] = clamp((curv[c*8+2] + sp*0.42) * 255, 0, 255);
    bytes[o+3] = clamp((curv[c*8+3] + sp*0.36) * 255, 0, 255);
    const o2 = (COLS + c) * 4;
    bytes[o2]   = clamp((curv[c*8+4] + sp*0.34) * 255, 0, 255);
    bytes[o2+1] = clamp((curv[c*8+5] + sp*0.30) * 255, 0, 255);
    bytes[o2+2] = clamp(curv[c*8+6] * 255, 0, 255);
    bytes[o2+3] = clamp(curv[c*8+7] * 255, 0, 255);
  }
  gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, 0, COLS, 2, gl.RGBA, gl.UNSIGNED_BYTE, bytes);

  // ---- uniforms
  const t = TR[idx];
  for(let b=0;b<6;b++) wArr[b] = t.w[b];
  tintArr[0]=t.tint[0]; tintArr[1]=t.tint[1]; tintArr[2]=t.tint[2];
  playAmt += ((playing ? 1 : 0) - playAmt) * clamp(dt * 4, 0, 1);

  if(ringOn){ ringT += dt; if(ringT > 2.2) ringOn = false; }
  const ringAmp = ringOn ? 0.030 * Math.exp(-ringT * 2.3) : 0;

  const h = window.innerHeight || 1;
  const plateHalfH = clamp(cardH * 0.5 + 34, 82, h * 0.235);
  gl.uniform1f(U.uTime, tsec);
  gl.uniform1f(U.uTempo, t.tempo);
  gl.uniform3fv(U.uTint, tintArr);
  gl.uniform1fv(U.uW, wArr);
  gl.uniform1fv(U.uLive, liveArr);
  gl.uniform1f(U.uLiveMix, liveMix);
  gl.uniform1f(U.uPlateX, colCx / h);
  gl.uniform1f(U.uPlateY, 1 - focusY / h);
  gl.uniform1f(U.uPlateH, plateHalfH / h);
  gl.uniform1f(U.uPlateW, 1.0);   // the bar spans the whole channel
  gl.uniform1f(U.uSink, sink);
  gl.uniform1f(U.uRing, ringOn ? ringT * 0.42 : -1);
  gl.uniform1f(U.uRingAmp, ringAmp);
  gl.uniform1f(U.uImpact, impact);
  gl.uniform1f(U.uPlaying, playAmt);
  gl.uniform1f(U.uProg, (playing && audio.duration) ? clamp(audio.currentTime / audio.duration, 0, 1) : 0);
  gl.drawArrays(gl.TRIANGLES, 0, 3);

  placeCards();
  drawRail();
  if(playing || playAmt > 0.01){
    const k = Math.floor((audio.currentTime || 0) * 4);
    if(k !== lastWaveKey){ lastWaveKey = k; drawWave(); clockEl.textContent = mmss(audio.currentTime) + ' / ' + mmss(audio.duration || t.dur); }
  } else if(lastWaveKey !== 'off'){
    lastWaveKey = 'off'; drawWave(); clockEl.textContent = mmss(t.dur);
  }

  // ---- one-shot perf check: drop resolution rather than drop frames
  if(!checked){
    frames++; acc += dt;
    if(frames > 90){
      if(acc / frames > 0.026 && DPR > 1.0){ DPR = 1.0; resize(); }
      checked = true;
    }
  }
}

document.addEventListener('visibilitychange', () => { if(document.hidden && playing) pause(); });
boot().catch(err => { console.error(err); });
})();
</script>
</body>
</html>
