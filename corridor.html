<style>
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%;background:#040406;color:#f2f2f2;font-family:'Inter',system-ui,sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased;}
  #app{position:fixed;inset:0;}
  .sc-canvas{display:block;width:100%;height:100%;touch-action:none;}

  .sc-hud{position:fixed;inset:0;pointer-events:none;font-family:'Inter',system-ui,sans-serif;}
  .sc-hud > *{pointer-events:auto}
  .sc-tl,.sc-tr,.sc-bl,.sc-br{position:absolute;color:#cfcfd4;font-size:11px;letter-spacing:.02em;}
  .sc-tl{top:18px;left:22px}
  .sc-tr{top:18px;right:22px;text-align:right;display:flex;gap:14px;align-items:center;flex-direction:row-reverse}
  .sc-bl{bottom:22px;left:22px;color:#8a8a8a}
  .sc-br{bottom:22px;right:22px;text-align:right;color:#bdbdbd}
  .sc-brand{font-family:'Space Grotesk',system-ui,sans-serif;font-weight:700;font-size:13px;letter-spacing:.02em;color:#f2f2f2;margin-bottom:4px}
  .sc-meta{color:#7a7a7a;font-size:10px;letter-spacing:.04em;font-family:'JetBrains Mono',ui-monospace,monospace}
  .sc-nav{margin-top:10px;display:flex;gap:14px}
  .sc-nav a{color:#9a9aa3;text-decoration:none;font-size:11px;border-bottom:1px solid transparent;padding-bottom:2px;transition:color .15s,border-color .15s}
  .sc-nav a:hover{color:#fff;border-color:#fff}
  .sc-mark{font-family:'Space Grotesk',system-ui,sans-serif;font-size:11px;color:#9a9aa3;letter-spacing:.06em}
  .sc-list-btn{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.10);color:#dcdce0;font:500 11px/1 'Inter',system-ui,sans-serif;padding:8px 12px;border-radius:6px;cursor:pointer;letter-spacing:.04em;transition:background .15s,border-color .15s,color .15s}
  .sc-list-btn:hover{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.20);color:#fff}
  .sc-hint{color:#6a6a72;font-size:11px;letter-spacing:.05em}
  .sc-hover{font-family:'Space Grotesk',system-ui,sans-serif;font-weight:600;font-size:13px;color:#e8e8ee;letter-spacing:.02em;min-height:18px}

  /* Speedometer-ish depth readout */
  .sc-depth{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);display:flex;gap:10px;align-items:center;color:#9a9aa3;font:500 10px/1 'JetBrains Mono',ui-monospace,monospace;letter-spacing:.18em;text-transform:uppercase;pointer-events:none}
  .sc-depth-bar{width:160px;height:2px;background:rgba(255,255,255,.08);position:relative;overflow:hidden}
  .sc-depth-fill{position:absolute;left:0;top:0;height:100%;background:#ff3a8c;box-shadow:0 0 8px #ff3a8c;width:0%}

  .sc-focus{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:auto;background:radial-gradient(ellipse at center, rgba(0,0,0,.55), rgba(0,0,0,.85));opacity:0;transition:opacity .25s ease}
  .sc-focus.on{opacity:1}
  .sc-focus-inner{padding:36px 44px;max-width:88vw;text-align:center}
  .sc-focus-kicker{font-size:10px;letter-spacing:.32em;color:#9a9aa3;text-transform:uppercase;margin-bottom:12px;font-family:'JetBrains Mono',ui-monospace,monospace}
  .sc-focus-title{font-family:'Space Grotesk',system-ui,sans-serif;font-weight:700;font-size:clamp(38px, 8vw, 96px);line-height:1.02;margin:0 0 14px;letter-spacing:-.02em;color:#fff}
  .sc-focus-meta{color:#9a9aa3;font-size:12px;letter-spacing:.06em;margin-bottom:22px;text-transform:lowercase;font-family:'JetBrains Mono',ui-monospace,monospace}
  .sc-focus-actions{display:flex;gap:10px;justify-content:center}
  .sc-act{background:#fff;color:#0a0a0a;border:none;padding:11px 22px;font:600 12px/1 'Inter',system-ui,sans-serif;letter-spacing:.04em;border-radius:6px;cursor:pointer}
  .sc-act-dim{background:transparent;color:#bdbdbd;border:1px solid rgba(255,255,255,.18)}
  .sc-act-dim:hover{color:#fff;border-color:rgba(255,255,255,.4)}

  .sc-jump{position:fixed;inset:0;background:rgba(2,2,4,.78);backdrop-filter:blur(14px);display:flex;align-items:flex-start;justify-content:center;padding:80px 24px 24px;opacity:0;pointer-events:none;transition:opacity .2s ease;z-index:20}
  .sc-jump.on{opacity:1;pointer-events:auto}
  .sc-jump-inner{width:min(640px, 96vw);max-height:80vh;display:flex;flex-direction:column;background:#0a0a0c;border:1px solid #242428;border-radius:10px;overflow:hidden}
  .sc-jump-head{display:flex;align-items:center;border-bottom:1px solid #1a1a1e;padding:8px 8px 8px 14px;gap:8px}
  .sc-jump-search{flex:1;background:transparent;border:none;color:#fff;font:500 14px/1 'Inter',system-ui,sans-serif;padding:10px 0;outline:none}
  .sc-jump-search::placeholder{color:#5c5c66}
  .sc-jump-close{background:transparent;border:none;color:#9a9aa3;font-size:22px;line-height:1;cursor:pointer;padding:6px 10px;border-radius:6px}
  .sc-jump-close:hover{color:#fff;background:rgba(255,255,255,.05)}
  .sc-jump-list{overflow-y:auto;padding:6px 0}
  .sc-jump-item{display:flex;align-items:center;gap:12px;width:100%;background:transparent;border:none;color:#dcdce0;text-align:left;padding:10px 16px;cursor:pointer;font:500 13px/1 'Inter',system-ui,sans-serif}
  .sc-jump-item:hover{background:rgba(255,255,255,.05);color:#fff}
  .sc-jump-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;box-shadow:0 0 8px currentColor}
  .sc-jump-title{flex:1;letter-spacing:.01em}
  .sc-jump-meta{color:#6a6a72;font-size:10px;letter-spacing:.06em;text-transform:uppercase;font-family:'JetBrains Mono',ui-monospace,monospace}
  .sc-jump-empty{color:#6a6a72;text-align:center;padding:30px;font-size:12px}

  /* Mobile joystick + boost */
  .sc-joy{position:fixed;width:120px;height:120px;border-radius:50%;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.03);transform:translate(-50%,-50%);display:none;pointer-events:none;}
  .sc-joy.on{display:block}
  .sc-joy-knob{position:absolute;top:50%;left:50%;width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);transform:translate(-50%,-50%);will-change:transform}
  .sc-boost{position:fixed;bottom:34px;right:24px;display:none;width:74px;height:74px;border-radius:50%;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.05);color:#dcdce0;font:600 11px/74px 'Inter',system-ui,sans-serif;text-align:center;letter-spacing:.08em;-webkit-user-select:none;user-select:none;touch-action:none}
  .sc-boost.on{background:rgba(255,255,255,.18);color:#fff}
  @media (pointer:coarse){
    .sc-boost{display:block}
    .sc-tr .sc-list-btn{padding:10px 14px;font-size:12px}
  }
</style>
</head>
<body>
  <div id="app"></div>
  <audio id="player" preload="metadata" crossorigin="anonymous"></audio>

<script type="module">
import './js/corridor.js';

const audio = document.getElementById('player');
let cfg = null;
let tracks = [];
let audioBase = '';

const slugify = (s) => (s || '').toLowerCase().replace(/[^\w\s-]/g, '').trim().replace(/\s+/g, '-');

async function loadConfig(){
  const res = await fetch('/config.json', { cache: 'no-store' });
  const data = await res.json();
  cfg = data;
  audioBase = (data.audioBase || '').replace(/\/?$/, '/');
  const featuredSet = new Set((data.featured || []).map(slugify));
  const newSet = new Set((data.newReleases || []).map(i => typeof i === 'number' ? slugify((data.tracks[i] || {}).title || '') : slugify(i)));
  tracks = (data.tracks || []).map((t) => ({
    ...t,
    isFeatured: featuredSet.has(slugify(t.title)),
    isNew: newSet.has(slugify(t.title)),
  }));
}

function loadTrack(i){
  const t = tracks[i];
  if (!t || !t.file) return;
  const url = audioBase + t.file;
  if (audio.src !== url) audio.src = url;
}

function playIndex(i){
  loadTrack(i);
  const p = audio.play();
  if (p && p.catch) p.catch(err => console.warn('[corridor] play blocked', err));
}

async function boot(){
  await loadConfig();
  const app = document.getElementById('app');
  const tryInit = () => {
    if (!window.SignalCorridor) { setTimeout(tryInit, 30); return; }
    window.SignalCorridor.init(app, {
      tracks,
      audio,
      slugify,
      onPlay: playIndex,
      buildNumber: 'b155',
    });
  };
  tryInit();
}

boot().catch(err => {
  console.error('[corridor] boot failed', err);
  document.body.innerHTML = '<div style="padding:40px;color:#f2f2f2;font-family:Inter,system-ui,sans-serif"><h1>could not load</h1><pre style="color:#9a9aa3">'+ (err && err.stack || err) +'</pre></div>';
});
</script>
</body>
</html>
