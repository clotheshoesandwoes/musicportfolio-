      background:rgba(8,10,14,.36); backdrop-filter:blur(10px) saturate(125%);
    }
  }

  /* =========================================================
     DAW (t8 — FL Studio 2026 reskin)
     Deep navy base, soft outer glows (no chunky bevels),
     vivid jewel-toned channels, glass master pane,
     smooth glowing meters. Layout unchanged.
     ========================================================= */
  body.tv-on{ background:#06080c; }
  main.tv{ max-width:none; padding:0; margin:0; }
  .daw-root{
    /* Deep navy base — near-black with a hint of blue */
    --daw-bg:        #0c1018;   /* base canvas */
    --daw-panel:     #141923;   /* panels (transport, lane heads) */
    --daw-panel-2:   #11151d;   /* recessed bands (statusbar, bandbar) */
    --daw-cell:      #161b25;   /* clip wells */
    --daw-cell-hi:   #1d2330;
    --daw-line:      rgba(255,255,255,0.06);  /* hairline separators */
    --daw-line-2:    rgba(255,255,255,0.03);
    --daw-line-hi:   rgba(255,255,255,0.10);
    --daw-text:      #e8eaf0;
    --daw-text-mid:  #a4a9b6;
    --daw-text-low:  #6c7282;
    --daw-text-faint:#3e4452;
    --daw-accent:    #ff8a3d;          /* warm orange — jewel tone */
    --daw-accent-2:  #6ee7ff;          /* electric cyan secondary */
    --daw-record:    #ff4d6d;
    --daw-arm:       #ffd23d;
    --daw-cyan:      #6ee7ff;
    --daw-pink:      #ff7ec3;
    --daw-green:     #54e09a;
    /* meter palette — modern FL */
    --daw-led-green: #54e09a;
    --daw-led-amber: #ffd23d;
    --daw-led-red:   #ff4d6d;
    --daw-lcd-bg:    #050a14;
    --daw-lcd-text:  #6ee7ff;          /* cyan LCD, less aggressive than green */
    /* glow tokens (replace bevels) */
    --daw-glow-soft: 0 0 0 1px rgba(255,255,255,0.04), 0 8px 24px rgba(0,0,0,0.40);
    --daw-glow-orange: 0 0 0 1px rgba(255,138,61,0.55), 0 0 24px rgba(255,138,61,0.30);
    --daw-glow-cyan:   0 0 0 1px rgba(110,231,255,0.55), 0 0 24px rgba(110,231,255,0.30);
    position:fixed; top:0; left:0; width:100vw; height:100vh; z-index:1;
    display:grid;
    grid-template-rows: 36px 56px 32px 1fr;
    background:var(--daw-bg);
    color:var(--daw-text);
    font-family:'Inter','SF Pro Text',system-ui,-apple-system,sans-serif;
    font-size:11.5px; letter-spacing:.005em;
    overflow:hidden;
    user-select:none; -webkit-user-select:none;
  }

  /* TOP BAR — brand · tabs · search · count */
  .daw-topbar{
    display:flex; align-items:stretch; gap:0;
    background:linear-gradient(180deg, rgba(20,25,35,0.92) 0%, rgba(12,16,24,0.92) 100%);
    backdrop-filter:blur(18px) saturate(140%);
    -webkit-backdrop-filter:blur(18px) saturate(140%);
    border-bottom:1px solid var(--daw-line);
  }
  .daw-brand{
    display:flex; align-items:center; gap:8px;
    padding:0 14px; min-width:240px;
    border-right:1px solid var(--daw-line);
    font-family:'JetBrains Mono','SF Mono',ui-monospace,monospace;
    font-size:10.5px; letter-spacing:.12em;
  }
  .daw-brand-led{
    width:8px; height:8px; border-radius:50%;
    background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.12);
    transition:background .18s, border-color .18s, box-shadow .18s;
  }
  .daw-brand-led.is-on{
    background:var(--daw-green);
    border-color:var(--daw-green);
    box-shadow:0 0 10px var(--daw-green), 0 0 22px rgba(84,224,154,0.45);
  }
  .daw-brand-name{ color:#fff; font-weight:700; letter-spacing:.18em; }
  .daw-brand-sub{ color:var(--daw-text-low); }

  .daw-tabs{ display:flex; }
  .daw-tab{
    background:transparent; border:none; color:var(--daw-text-mid);
    font-family:'JetBrains Mono','SF Mono',monospace;
    font-size:10.5px; letter-spacing:.18em; cursor:pointer;
    padding:0 18px; height:100%; border-right:1px solid var(--daw-line);
    position:relative;
    transition:color .15s, background .15s;
  }
  .daw-tab:hover{ color:#fff; background:rgba(255,255,255,.03); }
  .daw-tab.on{
    color:#fff;
    background:linear-gradient(180deg, rgba(255,138,61,0.06) 0%, transparent 60%);
  }
  .daw-tab.on::after{
    content:''; position:absolute; left:0; right:0; bottom:0; height:2px;
    background:var(--daw-accent);
    box-shadow:0 0 12px var(--daw-accent), 0 0 20px rgba(255,138,61,0.55);
  }

  .daw-search{
    flex:1; min-width:0;
    display:flex; align-items:center; gap:10px;
    padding:0 16px;
    border-right:1px solid var(--daw-line);
  }
  .daw-search-prefix{
    color:var(--daw-text-low); font-size:14px;
  }
  .daw-search input{
    flex:1; background:transparent; border:none; outline:none;
    color:var(--daw-text); font-family:inherit; font-size:12px;
    letter-spacing:.02em;
  }
  .daw-search input::placeholder{ color:var(--daw-text-faint); }

  .daw-tx-right{
    display:flex; align-items:center; gap:14px; padding:0 14px;
    font-family:'JetBrains Mono',monospace; font-size:10.5px; letter-spacing:.16em;
    color:var(--daw-text-low);
  }
  .daw-tx-count{ color:var(--daw-text-mid); }
  .daw-tx-link{ color:var(--daw-text-low); text-decoration:none; transition:color .12s; }
  .daw-tx-link:hover{ color:#fff; }

  /* TRANSPORT BAR — flat dark glass with subtle separators */
  .daw-transport{
    display:flex; align-items:stretch; gap:0;
    background:linear-gradient(180deg, rgba(20,25,35,0.82) 0%, rgba(12,16,24,0.82) 100%);
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
    border-bottom:1px solid var(--daw-line);
  }
  .daw-tx-group{
    display:flex; align-items:center; gap:6px;
    padding:0 12px; border-right:1px solid var(--daw-line);
  }
  .daw-tx-btn{
    display:inline-flex; align-items:center; justify-content:center;
    width:32px; height:32px; flex-shrink:0;
    background:rgba(255,255,255,0.04);
    border:1px solid rgba(255,255,255,0.08);
    color:var(--daw-text); font-family:'JetBrains Mono',monospace; font-size:13px;
    cursor:pointer; padding:0; border-radius:6px;
    transition:color .15s, border-color .15s, background .15s, box-shadow .15s, transform .08s;
    text-decoration:none;
  }
  .daw-tx-btn:hover{
    color:#fff;
    background:rgba(255,255,255,0.08);
    border-color:rgba(255,255,255,0.14);
  }
  .daw-tx-btn:active{ transform:scale(0.96); }
  .daw-tx-btn.is-play{
    width:44px; color:#0a0a0a;
    background:linear-gradient(180deg, #6efeb1 0%, #36c878 100%);
    border-color:rgba(108,252,177,0.5);
    box-shadow:0 0 24px rgba(84,224,154,0.30), inset 0 1px 0 rgba(255,255,255,0.30);
  }
  .daw-tx-btn.is-play:hover{
    background:linear-gradient(180deg, #88ffc1 0%, #4ad689 100%);
    box-shadow:0 0 32px rgba(84,224,154,0.55), inset 0 1px 0 rgba(255,255,255,0.40);
  }
  .daw-tx-btn.is-play.is-armed{
    color:#fff;
    background:linear-gradient(180deg, #ff7a99 0%, #ff3d6d 100%);
    border-color:rgba(255,77,109,0.5);
    box-shadow:0 0 28px rgba(255,77,109,0.55), inset 0 1px 0 rgba(255,255,255,0.30);
  }
  .daw-tx-btn.is-sc{ color:var(--daw-accent); }
  .daw-tx-btn.is-sc:hover{ color:#ffa766; border-color:var(--daw-accent); }
  .daw-sc-glyph{ width:16px; height:11px; }

  .daw-tx-now{
    display:flex; flex-direction:column; justify-content:center;
    padding:0 16px; min-width:240px; max-width:300px;
    border-right:1px solid var(--daw-line);
    overflow:hidden;
  }
  .daw-tx-num{
    font-family:'JetBrains Mono',monospace; font-size:9.5px;
    letter-spacing:.18em; color:var(--daw-accent);
    text-transform:uppercase;
  }
  .daw-tx-title{
    font-family:'Space Grotesk',Inter,sans-serif; font-weight:700;
    font-size:14px; letter-spacing:-.005em;
    color:#fff; text-transform:lowercase;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    margin-top:1px;
  }
  .daw-tx-meta{
    font-family:'JetBrains Mono',monospace; font-size:9.5px;
    color:var(--daw-text-low); letter-spacing:.10em;
    text-transform:uppercase; margin-top:1px;
  }

  .daw-tx-progress{
    flex:1; min-width:0; position:relative; cursor:pointer;
    border-right:1px solid var(--daw-line);
    background:#101013;
    overflow:hidden;
  }
  .daw-tx-progress:hover{ background:#15151a; }
  .daw-tx-wave{ position:absolute; inset:0; width:100%; height:100%; opacity:.45; pointer-events:none; }
  .daw-tx-fill{
    position:absolute; left:0; top:0; bottom:0; width:0%;
    background:linear-gradient(180deg, rgba(255,122,61,0.35) 0%, rgba(255,122,61,0.18) 100%);
    box-shadow:inset 0 0 30px rgba(255,122,61,0.20);
    pointer-events:none;
  }
  .daw-tx-playhead{
    position:absolute; top:0; bottom:0; left:0%; width:1px;
    background:#fff; box-shadow:0 0 8px #fff;
    pointer-events:none;
  }

  /* Cyan-glowing LCD time readout — soft, modern, no harsh scanlines */
  .daw-tx-time{
    display:flex; align-items:center; justify-content:center;
    padding:0 12px;
    margin:7px 8px;
    min-width:130px;
    border-radius:6px;
    background:linear-gradient(180deg, #030610 0%, var(--daw-lcd-bg) 100%);
    border:1px solid rgba(110,231,255,0.18);
    box-shadow:inset 0 0 20px rgba(110,231,255,0.10),
               inset 0 1px 2px rgba(0,0,0,0.6),
               0 0 14px rgba(110,231,255,0.08);
    font-family:'JetBrains Mono',monospace; font-size:12px; font-weight:600;
    color:var(--daw-lcd-text);
    text-shadow:0 0 8px rgba(110,231,255,0.65);
    letter-spacing:.08em;
  }

  .daw-tx-vol{
    display:flex; align-items:center; gap:8px;
    padding:0 12px; border-right:1px solid var(--daw-line);
  }
  .daw-tx-vol-label{
    font-family:'JetBrains Mono',monospace; font-size:9px;
    letter-spacing:.18em; color:var(--daw-text-low);
  }
  .daw-tx-vol input[type="range"]{
    -webkit-appearance:none; appearance:none;
    width:100px; height:3px;
    background:var(--daw-line); border:none; outline:none;
    cursor:pointer;
  }
  .daw-tx-vol input[type="range"]::-webkit-slider-thumb{
    -webkit-appearance:none; appearance:none;
    width:14px; height:18px;
    background:linear-gradient(180deg, #6a6d74 0%, #46494f 50%, #2a2c30 100%);
    border:1px solid #000; border-radius:2px; cursor:pointer;
    box-shadow:inset 0 1px 0 rgba(255,255,255,0.20), inset 0 -1px 0 rgba(0,0,0,0.40),
               0 1px 2px rgba(0,0,0,0.60);
  }
  .daw-tx-vol input[type="range"]::-moz-range-thumb{
    width:14px; height:18px;
    background:linear-gradient(180deg, #6a6d74 0%, #46494f 50%, #2a2c30 100%);
    border:1px solid #000; border-radius:2px; cursor:pointer;
    box-shadow:inset 0 1px 0 rgba(255,255,255,0.20), inset 0 -1px 0 rgba(0,0,0,0.40),
               0 1px 2px rgba(0,0,0,0.60);
  }
  .daw-tx-vol input[type="range"]{
    background:linear-gradient(180deg, #14161a 0%, #1c1e22 100%);
    box-shadow:inset 0 1px 2px rgba(0,0,0,0.7);
    height:5px; border-radius:2px;
  }

  .daw-tx-meters{
    display:flex; gap:3px; padding:7px 12px;
    border-right:1px solid var(--daw-line);
  }
  .daw-tx-meter{
    width:6px; height:34px;
    background:linear-gradient(180deg, #04060c 0%, #080d18 100%);
    border:1px solid rgba(255,255,255,0.06);
    border-radius:3px;
    position:relative; overflow:hidden;
    box-shadow:inset 0 1px 2px rgba(0,0,0,0.7);
  }
  .daw-tx-meter-fill{
    position:absolute; left:0; right:0; bottom:0;
    height:0%;
    background:linear-gradient(0deg,
      var(--daw-led-green) 0%,
      var(--daw-led-green) 60%,
      var(--daw-led-amber) 78%,
      var(--daw-led-red) 100%);
    box-shadow:0 0 8px currentColor;
    transition:height .04s linear;
  }

  /* FILTERS BAND */
  .daw-bandbar{
    display:flex; align-items:center; gap:6px;
    padding:0 16px;
    background:linear-gradient(180deg, rgba(17,21,29,0.85) 0%, rgba(12,16,24,0.85) 100%);
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
    border-bottom:1px solid var(--daw-line);
    overflow:hidden; white-space:nowrap;
  }
  .daw-bb-label{
    font-family:'JetBrains Mono',monospace; font-size:9.5px;
    letter-spacing:.18em; color:var(--daw-text-faint);
  }
  .daw-bb-chip{
    background:rgba(255,255,255,0.03);
    border:1px solid rgba(255,255,255,0.08);
    border-radius:5px;
    color:var(--daw-text-mid); font-family:'JetBrains Mono',monospace;
    font-size:10px; letter-spacing:.12em; text-transform:uppercase;
    padding:4px 11px; cursor:pointer;
    transition:color .15s, background .15s, border-color .15s, box-shadow .15s;
  }
  .daw-bb-chip:hover{
    background:rgba(255,255,255,0.06);
    color:#fff;
    border-color:rgba(255,255,255,0.16);
  }
  .daw-bb-chip.on{
    color:#fff;
    background:linear-gradient(180deg, rgba(255,138,61,0.18) 0%, rgba(255,138,61,0.06) 100%);
    border-color:rgba(255,138,61,0.55);
    box-shadow:0 0 14px rgba(255,138,61,0.28), inset 0 1px 0 rgba(255,255,255,0.08);
  }
  .daw-bb-spacer{ flex:1; }
  .daw-bb-hint{
    font-family:'JetBrains Mono',monospace; font-size:9.5px;
    color:var(--daw-text-faint); letter-spacing:.10em;
  }
  .daw-bb-hint kbd{
    display:inline-block; padding:1px 5px; margin:0 1px;
    border:1px solid var(--daw-line); color:var(--daw-text-mid);
    font-family:inherit; font-size:9px; background:#0c0c0e;
  }

  /* MAIN GRID */
  .daw-grid{
    background:var(--daw-bg);
    position:relative;
    overflow:hidden;
  }
  .daw-grid.is-session{
    display:flex; flex-direction:row; gap:0;
    align-items:stretch;
  }
  .daw-grid.is-arrange{ overflow-x:auto; overflow-y:auto; }
  .daw-scroll{
    flex:1 1 auto; min-width:0;
    overflow-x:auto; overflow-y:auto;
    display:flex; flex-direction:row; align-items:stretch;
  }
  .daw-scroll::-webkit-scrollbar,
  .daw-grid::-webkit-scrollbar,
  .daw-stack::-webkit-scrollbar{ width:10px; height:10px; }
  .daw-scroll::-webkit-scrollbar-track,
  .daw-grid::-webkit-scrollbar-track,
  .daw-stack::-webkit-scrollbar-track{ background:#0a0a0c; }
  .daw-scroll::-webkit-scrollbar-thumb,
  .daw-grid::-webkit-scrollbar-thumb,
  .daw-stack::-webkit-scrollbar-thumb{ background:#2a2a2e; border:2px solid #0a0a0c; }
  .daw-scroll::-webkit-scrollbar-thumb:hover,
  .daw-grid::-webkit-scrollbar-thumb:hover,
  .daw-stack::-webkit-scrollbar-thumb:hover{ background:#3a3a40; }

  .daw-lane{
    width:226px; flex-shrink:0;
    border-right:1px solid var(--daw-line);
    background:linear-gradient(180deg, #0e1320 0%, #0a0e16 100%);
    display:flex; flex-direction:column;
  }
  .daw-lane.is-master{
    width:400px; min-width:400px;
    background:
      radial-gradient(120% 60% at 0% 0%, rgba(255,138,61,0.08) 0%, transparent 50%),
      linear-gradient(180deg, rgba(20,25,35,0.92) 0%, rgba(12,16,24,0.92) 100%);
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
    border-left:1px solid rgba(255,138,61,0.40);
    box-shadow:-24px 0 60px rgba(0,0,0,0.65),
               -1px 0 0 rgba(255,138,61,0.20),
               inset 0 0 80px rgba(110,231,255,0.02);
    z-index:2;
  }

  .daw-lane-head{
    position:sticky; top:0; z-index:3;
    display:grid;
    grid-template-columns: 4px 1fr auto auto;
    grid-template-rows: auto auto;
    gap:0 10px; align-items:center;
    padding:6px 10px 6px 0;
    background:linear-gradient(180deg, rgba(20,25,35,0.95) 0%, rgba(15,19,28,0.95) 100%);
    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);
    border-bottom:1px solid var(--daw-line);
    min-height:40px;
  }
  .daw-lane-stripe{
    grid-row:1 / span 2; width:4px; height:26px; align-self:center;
    background:hsl(var(--head-h, 30), 60%, 56%);
    box-shadow:0 0 8px hsla(var(--head-h, 30), 60%, 56%, .55);
  }
  .daw-lane-title{
    grid-column:2; grid-row:1;
    font-family:'JetBrains Mono',monospace; font-size:11.5px;
    letter-spacing:.10em; color:#fff; font-weight:700;
  }
  .daw-lane-sub{
    grid-column:2; grid-row:2;
    font-family:'JetBrains Mono',monospace; font-size:8.5px;
    letter-spacing:.14em; color:var(--daw-text-low); text-transform:uppercase;
    margin-top:1px;
  }
  .daw-lane-buttons{
    grid-column:3 / span 2; grid-row:1 / span 2;
    display:flex; gap:3px; align-self:center;
    opacity:0.45; transition:opacity .15s;
  }
  .daw-lane:hover .daw-lane-buttons{ opacity:1; }
  /* M/S — soft glowing pills, FL 2026 style */
  .daw-tinybtn{
    width:20px; height:18px; padding:0; cursor:pointer;
    background:rgba(255,255,255,0.04);
    border:1px solid rgba(255,255,255,0.10);
    border-radius:5px;
    color:var(--daw-text-low);
    font-family:'JetBrains Mono',monospace; font-size:9px; font-weight:700;
    transition:color .15s, background .15s, border-color .15s, box-shadow .15s;
  }
  .daw-tinybtn:hover{ color:#fff; background:rgba(255,255,255,0.08); }
  .daw-tinybtn[data-toggle="m"].is-on{
    background:linear-gradient(180deg, #ff7a99 0%, #ff3d6d 100%);
    color:#fff;
    border-color:rgba(255,77,109,0.50);
    box-shadow:0 0 12px rgba(255,77,109,0.55), inset 0 1px 0 rgba(255,255,255,0.25);
  }
  .daw-tinybtn[data-toggle="s"].is-on{
    background:linear-gradient(180deg, #6efeb1 0%, #36c878 100%);
    color:#0a0a0a;
    border-color:rgba(108,252,177,0.50);
    box-shadow:0 0 12px rgba(84,224,154,0.55), inset 0 1px 0 rgba(255,255,255,0.30);
  }
  .daw-tinybtn[disabled]{ opacity:.30; cursor:default; }

  .daw-stack{
    flex:1; min-height:0;
    display:flex; flex-direction:column; gap:2px;
    padding:6px;
    overflow-y:auto;
  }

  /* CLIP */
  .daw-clip{
    --clip-h:30; --clip-s:60%; --clip-l:55%;
    position:relative;
    flex-shrink:0;
    border-radius:6px;
    background:
      linear-gradient(180deg,
        hsla(var(--clip-h), calc(var(--clip-s) + 10%), 24%, 0.92) 0%,
        hsla(var(--clip-h), var(--clip-s), 14%, 0.92) 100%);
    border:1px solid hsla(var(--clip-h), var(--clip-s), 55%, 0.30);
    cursor:pointer;
    overflow:hidden;
    transition:transform .12s, background .15s, border-color .15s, box-shadow .15s;
  }
  .daw-clip[data-tier="featured"]{
    background:linear-gradient(135deg,
      hsla(var(--clip-h), var(--clip-s), 30%, 1) 0%,
      hsla(var(--clip-h), var(--clip-s), 16%, 1) 100%);
    border-color:hsla(var(--clip-h), var(--clip-s), 60%, 0.85);
    box-shadow:0 0 0 1px hsla(var(--clip-h), 95%, 72%, 0.18),
               0 6px 22px hsla(var(--clip-h), var(--clip-s), 30%, 0.40);
  }
  .daw-clip[data-tier="new"]{
    border-color:hsla(var(--clip-h), var(--clip-s), 55%, 0.75);
  }
  .daw-clip[data-tier="archive"]{
    background:linear-gradient(135deg,
      hsla(var(--clip-h), var(--clip-s), 17%, 1) 0%,
      hsla(var(--clip-h), var(--clip-s), 11%, 1) 100%);
    border-color:hsla(var(--clip-h), var(--clip-s), 25%, 0.45);
  }
  .daw-clip:hover{
    border-color:hsla(var(--clip-h), var(--clip-s), 65%, 0.95);
    background:linear-gradient(135deg,
      hsla(var(--clip-h), var(--clip-s), 28%, 1) 0%,
      hsla(var(--clip-h), var(--clip-s), 18%, 1) 100%);
  }
  .daw-clip.is-selected{
    border-color:#fff; box-shadow:0 0 0 1px #fff inset;
  }
  .daw-clip.is-armed{
    border-color:var(--daw-record);
    box-shadow:0 0 22px rgba(238,66,66,0.45), 0 0 0 1px var(--daw-record) inset;
    background:linear-gradient(135deg,
      hsla(var(--clip-h), var(--clip-s), 30%, 1) 0%,
      hsla(var(--clip-h), var(--clip-s), 18%, 1) 60%,
      rgba(238,66,66,0.18) 100%);
    animation:daw-armed-pulse 2s ease-in-out infinite;
  }
  @keyframes daw-armed-pulse{
    0%,100%{ box-shadow:0 0 22px rgba(238,66,66,0.40), 0 0 0 1px var(--daw-record) inset; }
    50%    { box-shadow:0 0 30px rgba(238,66,66,0.65), 0 0 0 1px var(--daw-record) inset; }
  }
  .daw-clip.is-hidden{ display:none; }

  .daw-clip-stripe{
    height:5px;
    background:linear-gradient(90deg,
      hsl(var(--clip-h), calc(var(--clip-s) + 0%), calc(var(--clip-l) + 8%)) 0%,
      hsl(var(--clip-h), calc(var(--clip-s) + 0%), calc(var(--clip-l) - 6%)) 100%);
    border-bottom:1px solid hsla(var(--clip-h), var(--clip-s), 70%, 0.50);
  }
  .daw-clip-row{
    display:flex; align-items:center; gap:8px;
    padding:7px 8px 6px;
  }
  .daw-clip-btn{
    width:24px; height:24px; flex-shrink:0;
    border-radius:5px;
    background:hsla(var(--clip-h), var(--clip-s), 50%, 0.18);
    border:1px solid hsla(var(--clip-h), var(--clip-s), 65%, 0.40);
    color:hsl(var(--clip-h), 95%, 88%);
    font-family:'JetBrains Mono',monospace; font-size:11px;
    cursor:pointer; padding:0; line-height:1;
    transition:color .15s, background .15s, box-shadow .15s, transform .08s;
  }
  .daw-clip-btn:hover{
    background:hsla(var(--clip-h), var(--clip-s), 60%, 0.28);
    color:#fff;
    box-shadow:0 0 12px hsla(var(--clip-h), var(--clip-s), 70%, 0.35);
  }
  .daw-clip-btn:hover{
    background:hsla(var(--clip-h), var(--clip-s), 60%, 0.32);
    border-color:hsl(var(--clip-h), 90%, 75%);
    color:#fff;
  }
  .daw-clip-btn.is-armed{
    background:var(--daw-record); border-color:var(--daw-record);
    color:#fff;
    box-shadow:0 0 10px var(--daw-record);
  }
  .daw-clip-text{ flex:1; min-width:0; }
  .daw-clip-title{
    font-family:'Space Grotesk',Inter,sans-serif; font-weight:700;
    font-size:13px; letter-spacing:-.005em; line-height:1.1;
    color:#fff; text-transform:lowercase;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .daw-clip-meta{
    margin-top:2px;
    font-family:'JetBrains Mono',monospace; font-size:9px;
    letter-spacing:.10em; color:var(--daw-text-low);
    text-transform:uppercase;
    display:flex; gap:5px; align-items:center;
  }
  .daw-clip-num{ color:hsl(var(--clip-h), 70%, 75%); }
  .daw-clip-dot{ color:var(--daw-text-faint); }

  .daw-clip-wave{
    width:100%; height:40px; display:block;
    background:rgba(0,0,0,0.22);
    border-top:1px solid rgba(255,255,255,0.04);
  }
  .daw-clip-bar{
    height:2px; width:0%;
    background:linear-gradient(90deg, var(--daw-record) 0%, #fff 100%);
    box-shadow:0 0 6px var(--daw-record);
    opacity:0; transition:opacity .12s;
  }

  .daw-clip-empty{
    height:8px; border:1px dashed var(--daw-line-2);
    background:transparent;
  }

  /* MASTER LANE BODY */
  .daw-master-body{
    flex:1; min-height:0;
    display:flex; flex-direction:column; gap:0;
    padding:0;
    overflow-y:auto;
  }
  .daw-master-card{
    --mc-h:30; --mc-s:60%; --mc-l:55%;
    padding:20px 18px 18px;
    border-bottom:1px solid var(--daw-line);
    background:
      radial-gradient(140% 80% at 0% 0%, hsla(var(--mc-h), var(--mc-s), var(--mc-l), 0.16) 0%, transparent 60%),
      linear-gradient(180deg, rgba(255,122,61,0.04) 0%, transparent 100%);
    position:relative;
    transition:background .35s;
  }
  .daw-master-card::after{
    content:''; position:absolute; left:0; top:0; bottom:0; width:2px;
    background:hsl(var(--mc-h), var(--mc-s), var(--mc-l));
    box-shadow:0 0 14px hsla(var(--mc-h), var(--mc-s), var(--mc-l), 0.55);
    opacity:.8;
  }
  .daw-mc-label{
    font-family:'JetBrains Mono',monospace; font-size:9.5px;
    letter-spacing:.20em; color:var(--daw-accent);
    text-transform:uppercase;
  }
  .daw-mc-num{
    margin-top:6px;
    font-family:'JetBrains Mono',monospace; font-size:10px;
    letter-spacing:.12em; color:var(--daw-text-low);
  }
  .daw-mc-title{
    margin-top:8px;
    font-family:'Space Grotesk',Inter,sans-serif; font-weight:700;
    font-size:26px; line-height:1.02; color:#fff;
    text-transform:lowercase; letter-spacing:-.015em;
  }
  .daw-mc-meta{
    margin-top:10px;
    font-family:'JetBrains Mono',monospace; font-size:9.5px;
    letter-spacing:.12em; color:var(--daw-text-low);
    text-transform:uppercase;
  }
  .daw-spectrum{
    height:170px; padding:14px 14px 10px; border-bottom:1px solid var(--daw-line);
    background:radial-gradient(120% 80% at 50% 100%, rgba(110,231,255,0.04) 0%, transparent 60%),
               linear-gradient(180deg, #060912 0%, #050810 100%);
    position:relative;
  }
  .daw-spectrum canvas{ display:block; width:100%; height:100%; }
  .daw-master-grid{
    display:flex; flex-direction:column;
    padding:8px 14px; gap:0;
    border-bottom:1px solid var(--daw-line);
  }
  .daw-mg-row{
    display:flex; justify-content:space-between; gap:12px;
    padding:5px 0; border-bottom:1px dashed var(--daw-line-2);
    font-family:'JetBrains Mono',monospace; font-size:10px;
  }
  .daw-mg-row:last-child{ border-bottom:none; }
  .daw-mg-k{ color:var(--daw-text-low); letter-spacing:.14em; text-transform:uppercase; }
  .daw-mg-v{ color:var(--daw-text); letter-spacing:.04em; }
  .daw-master-actions{
    padding:10px 14px;
    display:flex; flex-direction:column; gap:4px;
  }
  .daw-ma{
    background:transparent; border:none; padding:6px 0;
    text-align:left; cursor:pointer; text-decoration:none;
    color:var(--daw-text); font-family:'JetBrains Mono',monospace;
    font-size:11px; letter-spacing:.10em; text-transform:lowercase;
    transition:color .12s;
  }
  .daw-ma:hover{ color:#fff; }
  .daw-ma-sc{ color:var(--daw-accent); }
  .daw-ma-sc:hover{ color:#ffa766; }

  /* Inline ▾ details panel — replaces the old /t/<slug> page nav. */
  .daw-ma-panel{
    margin:0 -14px 6px;
    padding:10px 14px 12px;
    background:#0a0a0c;
    border-top:1px solid var(--daw-line);
    border-bottom:1px solid var(--daw-line);
    display:flex; flex-direction:column; gap:10px;
    animation:daw-ma-panel-in .18s ease both;
  }
  @keyframes daw-ma-panel-in{
    from{ opacity:0; transform:translateY(-2px); }
    to  { opacity:1; transform:translateY(0); }
  }
  .daw-ma-panel-row{
    display:flex; flex-direction:column; gap:4px;
  }
  .daw-ma-panel-k{
    font-family:'JetBrains Mono',monospace; font-size:9px;
    letter-spacing:.22em; text-transform:uppercase;
    color:var(--daw-accent);
  }
  .daw-ma-panel-v{
    font-family:'Inter','SF Pro Text',system-ui,sans-serif;
    font-size:11.5px; line-height:1.55; color:var(--daw-text);
  }
  .daw-ma-panel-v.daw-ma-mono{
    font-family:'JetBrains Mono',monospace;
    font-size:10px; color:var(--daw-text-mid); letter-spacing:.04em;
    word-break:break-all;
  }
  .daw-ma-link{
    background:transparent;
    border:1px solid var(--daw-line);
    border-left:2px solid var(--daw-accent);
    padding:6px 8px; cursor:pointer;
    color:var(--daw-text-mid);
    font-family:'JetBrains Mono',monospace; font-size:9.5px;
    letter-spacing:.04em; text-align:left;
    word-break:break-all; line-height:1.4;
    transition:color .12s, background .12s, border-color .12s;
  }
  .daw-ma-link:hover{
    color:#fff; background:rgba(255,122,61,0.08);
    border-color:var(--daw-accent);
  }

  /* STATUS BAR */
  .daw-statusbar{
    display:flex; align-items:center; gap:10px;
    padding:0 14px;
    background:rgba(12,16,24,0.85);
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
    border-top:1px solid var(--daw-line);
    font-family:'JetBrains Mono',monospace; font-size:10px;
    letter-spacing:.12em; color:var(--daw-text-low); text-transform:uppercase;
  }
  .daw-st-led{
    width:8px; height:8px; border-radius:50%;
    background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.10);
  }
  .daw-st-led.is-on{
    background:var(--daw-green);
    border-color:var(--daw-green);
    box-shadow:0 0 10px var(--daw-green), 0 0 18px rgba(84,224,154,0.40);
  }
  .daw-st-spacer{ flex:1; }
  .daw-st-mini{ color:var(--daw-text-mid); }

  /* ARRANGEMENT VIEW — t7 "Discography Tape"
     Single horizontal row of large waveform blocks, oldest → newest,
     time-positioned with sqrt-scaled gaps so cadence is legible. */
  .daw-grid.is-arrange{
    display:block; padding:0;
    background:
      repeating-linear-gradient(90deg,
        transparent 0px, transparent 49px,
        rgba(255,255,255,0.018) 50px, rgba(255,255,255,0.018) 51px),
      var(--daw-bg);
  }
  .daw-arr{
    position:relative;
    min-height:100%;
  }
  .daw-arr-ruler{
    position:sticky; top:0; left:0;
    height:38px; min-width:100%;
    background:linear-gradient(180deg, var(--daw-panel) 0%, #131316 100%);
    border-bottom:1px solid var(--daw-line);
    z-index:5;
  }
  .daw-arr-range{
    position:sticky; right:14px; float:right;
    margin:11px 14px 0 0;
    font-family:'JetBrains Mono',monospace; font-size:10px;
    letter-spacing:.18em; color:var(--daw-text-low);
    text-transform:uppercase;
  }
  .daw-arr-tick{
    position:absolute; width:1px;
    background:rgba(255,255,255,0.10);
    pointer-events:none; z-index:1;
  }
  .daw-arr-tick.is-major{
    background:linear-gradient(180deg,
      rgba(255,122,61,0.65) 0%,
      rgba(255,122,61,0.10) 100%);
    width:1px;
  }
  .daw-arr-year{
    position:absolute; top:9px;
    font-family:'JetBrains Mono',monospace; font-size:13px; font-weight:700;
    color:var(--daw-accent); letter-spacing:.16em;
    text-shadow:0 0 8px rgba(255,122,61,0.35);
    z-index:6;
  }

  .daw-arr-block{
    --clip-h:30; --clip-s:60%; --clip-l:55%;
    position:absolute;
    background:linear-gradient(180deg,
      hsla(var(--clip-h), var(--clip-s), 24%, 1) 0%,
      hsla(var(--clip-h), var(--clip-s), 12%, 1) 100%);
    border:1px solid hsla(var(--clip-h), var(--clip-s), 50%, 0.55);
    cursor:pointer;
    overflow:hidden;
    transition:border-color .12s, transform .10s, box-shadow .12s;
    display:grid;
    grid-template-rows:5px 18px 22px 1fr 18px;
    z-index:2;
  }
  .daw-arr-block[data-tier="featured"]{
    border-color:hsla(var(--clip-h), var(--clip-s), 70%, 0.85);
    box-shadow:0 0 0 1px hsla(var(--clip-h), 95%, 72%, 0.18),
               0 8px 24px hsla(var(--clip-h), var(--clip-s), 30%, 0.40);
  }
  .daw-arr-block[data-tier="archive"]{
    background:linear-gradient(180deg,
      hsla(var(--clip-h), var(--clip-s), 18%, 1) 0%,
      hsla(var(--clip-h), var(--clip-s), 9%, 1) 100%);
    border-color:hsla(var(--clip-h), var(--clip-s), 28%, 0.45);
  }
  .daw-arr-block:hover{
    border-color:#fff;
    transform:translateY(-2px);
    z-index:3;
  }
  .daw-arr-block.is-armed{
    border-color:var(--daw-record);
    box-shadow:0 0 24px rgba(238,66,66,0.55), 0 0 0 1px var(--daw-record) inset;
    z-index:4;
  }
  .daw-arr-block-stripe{
    background:linear-gradient(90deg,
      hsl(var(--clip-h), var(--clip-s), calc(var(--clip-l) + 10%)) 0%,
      hsl(var(--clip-h), var(--clip-s), calc(var(--clip-l) - 6%)) 100%);
  }
  .daw-arr-block-head{
    display:flex; justify-content:space-between; align-items:center;
    padding:0 8px;
    font-family:'JetBrains Mono',monospace; font-size:9px;
    letter-spacing:.16em; text-transform:uppercase;
  }
  .daw-arr-block-slot{ color:hsl(var(--clip-h), 75%, 72%); font-weight:700; }
  .daw-arr-block-tier{ color:var(--daw-text-low); }
  .daw-arr-block-title{
    padding:0 8px;
    font-family:'Space Grotesk','Inter',sans-serif; font-weight:700;
    font-size:14px; line-height:1.1; color:#fff;
    text-transform:lowercase; letter-spacing:-.01em;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .daw-arr-block-wave{
    width:100%; height:100%; display:block;
    background:rgba(0,0,0,0.18);
    border-top:1px solid rgba(255,255,255,0.04);
    border-bottom:1px solid rgba(255,255,255,0.04);
  }
  .daw-arr-block-date{
    padding:0 8px;
    display:flex; align-items:center;
    font-family:'JetBrains Mono',monospace; font-size:9.5px;
    letter-spacing:.12em; color:var(--daw-text-low);
    font-variant-numeric:tabular-nums;
  }
  .daw-arr-block-bar{
    position:absolute; left:0; bottom:0; height:2px; width:0%;
    background:linear-gradient(90deg, var(--daw-record) 0%, #fff 100%);
    box-shadow:0 0 6px var(--daw-record);
    opacity:0; transition:opacity .12s;
    z-index:5;
  }
  .daw-arr-block.is-armed .daw-arr-block-bar{ opacity:1; }

  .daw-arr-head{
    position:absolute; left:0; width:1px;
    background:#fff; box-shadow:0 0 8px #fff;
    opacity:0; pointer-events:none;
    transition:opacity .12s;
    z-index:6;
  }

  /* RESPONSIVE */
  @media (max-width: 1100px){
    .daw-lane.is-master{ width:340px; min-width:340px; }
    .daw-mc-title{ font-size:22px; }
    .daw-spectrum{ height:150px; }
  }
  @media (max-width: 900px){
    .daw-root{ grid-template-rows: 36px 56px 32px 1fr; font-size:11px; }
    .daw-brand{ min-width:170px; padding:0 10px; }
    .daw-brand-sub{ display:none; }
    .daw-tabs .daw-tab{ padding:0 10px; }
    .daw-search{ padding:0 10px; }
    .daw-tx-now{ min-width:160px; max-width:200px; }
    .daw-tx-time{ min-width:104px; padding:0 8px; font-size:10px; }
    .daw-tx-vol{ display:none; }
    .daw-lane{ width:208px; }
    .daw-lane.is-master{ width:300px; min-width:300px; }
    .daw-mc-title{ font-size:20px; }
    .daw-spectrum{ height:130px; }
  }
  @media (max-width: 640px){
    .daw-root{ grid-template-rows: 32px 50px auto 1fr; }
    .daw-bandbar{ overflow-x:auto; padding:6px 10px; gap:6px; }
    .daw-bb-hint{ display:none; }
    .daw-tx-meters, .daw-tx-time{ display:none; }
    .daw-tx-now{ min-width:120px; max-width:160px; }
    .daw-lane{ width:180px; }
    .daw-lane.is-master{ width:260px; min-width:260px; }
    .daw-mc-title{ font-size:18px; }
    .daw-spectrum{ height:110px; }
  }


  main.mw{ max-width:none; padding:0; margin:0; }
  html:has(body.mw-on){ overflow:hidden; height:100%; }
  body.mw-on{
    overflow:hidden; padding-bottom:0; height:100%;
    overscroll-behavior:none;
    -webkit-user-select:none; user-select:none;
    -webkit-touch-callout:none;
    position:fixed; inset:0;          /* prevent iOS rubber-band scroll behind canvas */
  }
  body.mw-on header.topbar, body.mw-on .miniplayer{ display:none; }
  .mw-canvas{
    position:fixed; inset:0; width:100vw; height:100vh; display:block; z-index:1; background:#040406;
    touch-action:none;                /* let JS handle all touch — no browser pan/zoom */
    -webkit-tap-highlight-color:transparent;
  }
  .mw-hud{
    position:fixed; inset:0; z-index:2; pointer-events:none;
    font-family:'Space Mono','SF Mono',ui-monospace,Menlo,monospace;
    font-size:12px; letter-spacing:.04em; line-height:1.5; color:#9aa0aa;
  }
  .mw-hud a, .mw-hud button{ pointer-events:auto; }

  .tg-tl, .tg-tr, .tg-bl, .tg-br{ position:absolute; padding:24px 28px; }
  .tg-tl{ top:0; left:0; }
  .tg-tr{ top:0; right:0; text-align:right; }
  .tg-bl{ bottom:0; left:0; }
  .tg-br{ bottom:0; right:0; text-align:right; }
  .tg-brand{
    font-family:'Space Grotesk',Inter,system-ui,sans-serif;
    font-weight:700; font-size:18px; letter-spacing:-.01em; color:#fff;
    margin-bottom:6px;
  }
  .tg-meta{ color:#5e636e; font-size:11px; }
  /* Top-left media player */
  .tg-player{ margin-top:14px; max-width:300px; }
  .tg-player-controls{ display:flex; gap:8px; align-items:center; margin-bottom:10px; }
  .tg-pp-btn{
    background:rgba(0,0,0,.30); border:1px solid #3a3f48; padding:8px 11px;
    color:#cfd5e0; cursor:pointer; line-height:0;
    border-radius:3px;
    transition:color .15s, border-color .15s, background .15s;
  }
  .tg-pp-btn:hover{ color:#fff; border-color:#fff; background:rgba(255,255,255,.08); }
  .tg-pp-btn:active{ transform:translateY(1px); }
  .tg-pp-btn.tg-pp-main{ padding:8px 13px; border-color:#fff; color:#fff; }
  .tg-pp-btn.tg-pp-main svg{ width:13px; height:13px; }
  .tg-pp-btn svg{ width:13px; height:13px; }
  .tg-player-row{
    display:flex; gap:10px; align-items:baseline;
    font-family:'Space Mono',ui-monospace,monospace; font-size:10px;
    margin-bottom:6px;
  }
  .tg-player-title{
    flex:1; color:#fff; font-family:'Space Grotesk',Inter,sans-serif;
    font-weight:600; font-size:13px; letter-spacing:0;
    text-transform:lowercase;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .tg-player-time{ color:#8a93a3; white-space:nowrap; font-size:11px; }
  .tg-player-progress{
    width:100%; height:3px; background:#1a1d22; cursor:pointer;
    pointer-events:auto; transition:height .15s;
    border-radius:2px;
  }
  .tg-player-progress:hover{ height:5px; }
  .tg-player-fill{
    height:100%; background:#c8c8c0; width:0%;
    transition:width .12s linear;
    border-radius:2px;
  }
  /* [ admin ] button — styled to look like the rest of the nav links but
     uses a real <button> so href navigation never interferes. */
  .tg-nav button.tg-admin-link{
    background:none; border:none;
    padding:0 0 2px 0;
    font:inherit;
    cursor:pointer;
    color:#ff7ec3;
    letter-spacing:.05em;
    border-bottom:1px solid transparent;
    transition:color .15s, border-color .15s;
  }
  .tg-nav button.tg-admin-link:hover{
    color:#fff;
    border-bottom-color:#ff7ec3;
  }

  .tg-nav{ margin-top:14px; display:flex; gap:14px; flex-wrap:wrap; }
  .tg-nav a{
    color:#9aa0aa; text-decoration:none; font-size:11px;
    padding-bottom:2px; border-bottom:1px solid transparent;
    transition:color .15s, border-color .15s;
  }
  .tg-nav a:hover{ color:#fff; border-color:#fff; }
  .tg-mark{
    font-family:'Space Grotesk',Inter,system-ui,sans-serif;
    font-weight:700; font-size:14px; color:#fff;
  }
  .tg-socials{
    margin-top:10px; display:flex; gap:14px; flex-wrap:wrap; justify-content:flex-end;
  }
  .tg-socials a{
    color:#9aa0aa; text-decoration:none; font-size:11px;
    padding-bottom:2px; border-bottom:1px solid transparent;
    transition:color .15s, border-color .15s;
  }
  .tg-socials a:hover{ color:#fff; border-color:#fff; }
  .tg-hint{ color:#5e636e; font-size:11px; }
  .tg-hover{
    font-family:'Space Grotesk',Inter,system-ui,sans-serif;
    font-weight:600; font-size:18px; color:#fff;
    text-transform:lowercase;
    transition:opacity .2s;
  }

  /* Focus card — text-only, no brackets, no frames */
  .tg-focus{
    position:absolute; inset:0;
    display:flex; align-items:flex-end; justify-content:flex-start;
    padding:0 0 14vh 8vw;
    pointer-events:none;
    opacity:0; transition:opacity .35s ease;

<script>
// ====================================================================
// State
// ====================================================================
const state = {
  tracks: [],
  current: -1,
  playing: false,
  query: '',
  view: localStorage.getItem('kani.view') || 'grid',
  filter: 'all',                                       // b099 editorial filter (all/featured/new/hard/chill/grunge/vibe)
  playlistDraft: [],
  playlists: JSON.parse(localStorage.getItem('kani.playlists') || '{}'),
};

// In-memory cache of which cover files exist (so we don't re-check on every render)
const coverCache = new Map(); // slug -> 'covers/rolla.jpg' or null

// ====================================================================
// Utils
// ====================================================================
function slugify(s){return s.toLowerCase().replace(/[^\w\s-]/g,'').trim().replace(/\s+/g,'-');}
function findTrackBySlug(slug){return state.tracks.findIndex(t => slugify(t.title) === slug);}
function fmtDate(iso){if(!iso)return'';const d=new Date(iso);return d.toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'});}
function hash(s){let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))>>>0;return h;}
function scUrl(title){return `https://soundcloud.com/kanisongs/${slugify(title)}`;}
function toast(msg){
  const el=document.getElementById('toast');
  el.textContent=msg;el.classList.add('show');
  clearTimeout(toast._t);toast._t=setTimeout(()=>el.classList.remove('show'),1800);
}

// Procedural artwork — rich, painterly gradient unique per title
function artStyle(title){
  const h = hash(title);
  const hue1 = h % 360;
  const hue2 = (h >> 7) % 360;
  const hue3 = (h >> 13) % 360;
  const px1 = 20 + (h % 50);
  const py1 = 15 + ((h>>2) % 50);
  const px2 = 55 + ((h>>4) % 35);
  const py2 = 60 + ((h>>6) % 30);
  return `background:
    radial-gradient(ellipse 70% 60% at ${px1}% ${py1}%, hsl(${hue1} 45% 42% / .6), transparent 55%),
    radial-gradient(ellipse 60% 50% at ${px2}% ${py2}%, hsl(${hue2} 40% 35% / .55), transparent 55%),
    radial-gradient(ellipse 40% 35% at 80% 20%, hsl(${hue3} 35% 30% / .5), transparent 60%),
    linear-gradient(145deg, hsl(${hue1} 20% 9%), hsl(${hue2} 18% 6%));`;
}

// Try to load cover art for a slug: check jpg/jpeg/png/webp in order.
// Resolves to a URL string, or null if none found. Cached.
function findCover(slug){
  if(coverCache.has(slug)) return Promise.resolve(coverCache.get(slug));
  // Only try .jpg to minimize 404 noise. Drop your covers as .jpg
  // in /covers/ using the slugified track title (e.g. covers/rolla.jpg).
  return new Promise(resolve=>{
    const url = `/covers/${slug}.jpg`;
    const img = new Image();
    img.onload  = () => { coverCache.set(slug,url);  resolve(url);  };
    img.onerror = () => { coverCache.set(slug,null); resolve(null); };
    img.src = url;
  });
}
// Fire cover lookup for a just-rendered element. Sets the <img> src if found.
function hydrateCover(el, slug){
  findCover(slug).then(url=>{
    if(!url || !el.isConnected) return;
    const img = el.querySelector('.art-img');
    if(!img) return;
    img.src = url;
    img.addEventListener('load', ()=>img.classList.add('loaded'), {once:true});
  });
}

// ====================================================================
// Bento sizing — deterministic from hash so layout is stable across renders
// ====================================================================
function sizeClass(t, i, isHero=false){ return isHero ? 'hero' : ''; }

// ====================================================================
// Routing (path-based via History API; rewrites in _redirects)
// ====================================================================
function currentRoute(){
  const p = location.pathname.replace(/\/+$/, '') || '/';
  if(p==='/' || p==='/index.html' || p==='/tracks.html') return {name:'home'};  // Featured landing
  if(p==='/world') return {name:'world'};                          // b101 — Marathon WebGL flag route
  if(p==='/tracks') return {name:'all'};                           // All tracks
  if(p==='/tracks/new') return {name:'new'};
  if(p==='/tracks/featured') return {name:'home'};                 // alias
  if(p==='/tracks/playlists') return {name:'playlists'};
  let m;
  if(m = p.match(/^\/t\/(.+)$/))  return {name:'track', slug:decodeURIComponent(m[1])};
  if(m = p.match(/^\/p\/(.+)$/))  return {name:'playlist', slug:decodeURIComponent(m[1])};
  if(m = p.match(/^\/a\/(.+)$/))  return {name:'album', slug:decodeURIComponent(m[1])};
  if(m = p.match(/^\/ep\/(.+)$/)) return {name:'ep', slug:decodeURIComponent(m[1])};
  return {name:'home'};
}
function go(path){
  // Preserve search for playlist ?t=...&n=... payloads
  if(path.startsWith('/')){
    history.pushState({}, '', path);
    render();
  } else {
    location.href = path; // external
  }
}
// Only intercept anchor clicks whose target is a tracks.html-handled route.
// Everything else (e.g. /scenes) falls through so the browser navigates
// normally and Cloudflare's _redirects serve the right file.
const TRACKS_ROUTES = /^\/(?:$|world$|tracks(?:\/|$)|t\/|p\/|a\/|ep\/)/;
document.addEventListener('click', e=>{
  const a = e.target.closest('a[href]');
  if(!a) return;
  const href = a.getAttribute('href');
  if(!href || href.startsWith('http') || a.target==='_blank' || a.hasAttribute('download')) return;
  if(!href.startsWith('/')) return;
  if(!TRACKS_ROUTES.test(href)) return; // let browser handle /scenes, /admin, etc.
  e.preventDefault();
  go(href);
});

// ====================================================================
// Playback — real audio via HTMLAudioElement, source = audioBase + track.file
// ====================================================================
const audio = new Audio();
audio.preload = 'none';
audio.volume = 0.8;
// crossOrigin must be set BEFORE src — required for R2 audio to work with
// future Web Audio API hookups, and some R2 CORS configurations require it
// even for plain <audio> playback.
audio.crossOrigin = 'anonymous';
audio.addEventListener('ended', ()=>playNext());
audio.addEventListener('play',  ()=>{state.playing=true; renderMiniplayer(); renderPlayingState();});
audio.addEventListener('pause', ()=>{state.playing=false; renderMiniplayer(); renderPlayingState();});
// b144 — track which indices already retried via local fallback so we don't
// loop if the file is genuinely missing from both R2 and /audio-mp3/.
const audioFallbackTried = new Set();
audio.addEventListener('error', ()=>{
  const err = audio.error;
  const codeMap = {1:'aborted',2:'network',3:'decode',4:'not-supported'};
  const kind = err ? (codeMap[err.code]||'unknown') : 'unknown';
  console.error('[audio] error:', kind, 'src:', audio.src, err);
  // b144 — if R2 dropped this file, retry once against /audio-mp3/ so localhost
  // (and any deploy that ships the local audio folder) keeps playing. Logs the
  // R2-missing filename so we can re-upload.
  const i = state.current;
  const t = (i >= 0) ? state.tracks[i] : null;
  const base = state.audioBase || '';
  if (t && t.file && base && audio.src.indexOf(base) === 0 && !audioFallbackTried.has(i)) {
    audioFallbackTried.add(i);
    const local = '/audio-mp3/' + encodeURIComponent(t.file);
    console.warn('[audio] R2 miss for', JSON.stringify(t.file), '— falling back to', local);
    audio.src = local;
    audio.play().catch(e=>console.error('[audio] local fallback also failed:', e));
    return;
  }
  toast(`Playback failed (${kind})`);
});

function trackAudioUrl(t){
  // audioBase like 'https://pub-....r2.dev/'; filenames may have spaces
  const base = state.audioBase || '/audio-mp3/';
  return base + encodeURIComponent(t.file || '');
}
function playIndex(i){
  if(i<0||i>=state.tracks.length)return;
  const t = state.tracks[i];
  if(state.current !== i){
    state.current = i;
    const url = trackAudioUrl(t);
    console.log('[audio] loading:', url);
    audio.src = url;
    updateEdHeroTitle();
    if (window.TracksDaw?.onTrackChange) window.TracksDaw.onTrackChange();
  }
  // Galaxy view's marathon-world `_hookAudio` calls createMediaElementSource(audio)
  // which routes all output through a Web Audio graph. The AudioContext starts in
  // 'suspended' state — without an explicit resume(), audio.play() silently
  // produces no sound (currentTime even stays at 0 in some Chromium versions).
  // We're inside a user-gesture (click→focus→onPlay), so resume is allowed.
  const ctx = audio.__floorAnalyser?.ctx;
  if (ctx && ctx.state === 'suspended') {
    ctx.resume().catch(err => console.warn('[audio] ctx.resume rejected:', err));
  }
  audio.play().catch(err=>{
    console.error('[audio] play() rejected:', err.name, err.message, 'src:', audio.src);
    toast(`Playback failed: ${err.name}`);
  });
}
function togglePlay(){
  if(state.current < 0){ playIndex(0); return; }
  if(audio.paused) {
    const ctx = audio.__floorAnalyser?.ctx;
    if (ctx && ctx.state === 'suspended') ctx.resume().catch(()=>{});
    audio.play().catch(err=>console.error('[audio] toggle play failed:', err));
  } else audio.pause();
}
function playNext(){playIndex((state.current+1)%state.tracks.length);}
function playPrev(){playIndex((state.current-1+state.tracks.length)%state.tracks.length);}
function fmtTime(sec){
  if(!isFinite(sec)) return '0:00';
  const m = Math.floor(sec/60), s = Math.floor(sec%60);
  return `${m}:${s<10?'0':''}${s}`;
}
function renderMiniplayer(){

// Audio-reactive hero ring — canvas analyzer
let edAudioCtx=null, edAnalyser=null, edFreqArr=null;
function ensureEdAnalyser(){
  if(audio.__floorAnalyser){
    edAudioCtx = audio.__floorAnalyser.ctx;
    edAnalyser = audio.__floorAnalyser.analyser;
    edFreqArr  = audio.__floorAnalyser.freqArr;
    return;
  }
  try{
    const AC = window.AudioContext || window.webkitAudioContext;
    edAudioCtx = new AC();
    const src = edAudioCtx.createMediaElementSource(audio);
    edAnalyser = edAudioCtx.createAnalyser();
    edAnalyser.fftSize = 256;
    edAnalyser.smoothingTimeConstant = 0.85;
    src.connect(edAnalyser);
    edAnalyser.connect(edAudioCtx.destination);
    edFreqArr = new Uint8Array(edAnalyser.frequencyBinCount);
    audio.__floorAnalyser = { ctx: edAudioCtx, source: src, analyser: edAnalyser, freqArr: edFreqArr };
  }catch(e){ console.warn('[ed] analyser failed', e); }
}

let edRingRAF = 0;
let edParticles = [];

function initEdParticles(W, H){
  edParticles = [];
  const N = 320;       // forest density
  for(let i = 0; i < N; i++){
    const depth = Math.random();   // 0=far, 1=close
    // Tinting: 70% cyan-green, 20% white, 10% amber accent
    const roll = Math.random();
    let hue;
    if(roll < 0.10) hue = 30 + Math.random() * 20;       // amber
    else if(roll < 0.30) hue = 0;                        // white (sat=0)
    else hue = 160 + Math.random() * 40;                 // cyan-green
    const sat = (roll < 0.30 && roll >= 0.10) ? 0 : 60 + Math.random() * 25;
    edParticles.push({
      x: Math.random() * W,
      y: Math.random() * H,
      vx: (Math.random() - 0.5) * 0.15,
      vy: -0.05 - Math.random() * 0.35,            // drift up gently
      size: 1 + depth * 7,
      alpha: 0.18 + (1 - depth) * 0.55,
      hue, sat,
      seed: Math.random() * 1000,
      depth,
    });
  }
}

function startEdRingAnim(){
  cancelAnimationFrame(edRingRAF);

  // Hero photo backdrop — fades in if /covers/hero.jpg exists, otherwise stays hidden
  const photoEl = document.getElementById('ed-hero-photo');
  if(photoEl){
    const img = new Image();
    img.onload = () => photoEl.classList.add('loaded');
    img.onerror = () => { /* no hero image — gradient backdrop is fine */ };
    img.src = '/covers/hero.jpg';
  }

  const ringCanvas = document.getElementById('ed-ring');
  const partCanvas = document.getElementById('ed-particles');
  if(!ringCanvas || !partCanvas) return;
  ensureEdAnalyser();

  const rctx = ringCanvas.getContext('2d');
  const pctx = partCanvas.getContext('2d');
  let dpr = Math.min(window.devicePixelRatio || 1, 1.75);

  function resize(){
    dpr = Math.min(window.devicePixelRatio || 1, 1.75);
    ringCanvas.width = ringCanvas.offsetWidth * dpr;
    ringCanvas.height = ringCanvas.offsetHeight * dpr;
    partCanvas.width = partCanvas.offsetWidth * dpr;
    partCanvas.height = partCanvas.offsetHeight * dpr;
    initEdParticles(partCanvas.width, partCanvas.height);
  }
  resize();
  const ro = new ResizeObserver(resize); ro.observe(partCanvas);

  let phase = 0, t = 0;
  function frame(){
    edRingRAF = requestAnimationFrame(frame);
    if(!ringCanvas.isConnected){ ro.disconnect(); return; }
    t += 16;

    if(edAnalyser && edFreqArr){
      if(edAudioCtx && edAudioCtx.state === 'suspended') edAudioCtx.resume().catch(()=>{});
      edAnalyser.getByteFrequencyData(edFreqArr);
    }

    // Compute energies once per frame
    let bass = 0, energy = 0;
    if(edFreqArr){
      for(let i = 0; i < 8; i++) bass += edFreqArr[i] || 0;
      bass /= 8 * 255;
      let s = 0;
      for(let i = 0; i < edFreqArr.length; i++) s += edFreqArr[i] || 0;
      energy = s / (edFreqArr.length * 255);
    }

    drawEdParticles(pctx, partCanvas.width, partCanvas.height, t, bass, energy);
    drawEdRing(rctx, ringCanvas.width, ringCanvas.height, edFreqArr, phase);
    phase += 0.004 + bass * 0.006;
  }
  frame();
}

function drawEdParticles(ctx, W, H, t, bass, energy){
  // Clear + soft cyan fill across the whole canvas (audio-driven)
  ctx.clearRect(0, 0, W, H);

  // Big radial atmospheric glow at center, bass-pulsed
  const glow = ctx.createRadialGradient(W/2, H * 0.42, 0, W/2, H * 0.42, Math.min(W, H) * 0.7);
  glow.addColorStop(0, `rgba(74, 222, 255, ${0.10 + bass * 0.10})`);
  glow.addColorStop(0.4, `rgba(74, 222, 255, ${0.04 + bass * 0.04})`);
  glow.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = glow;
  ctx.fillRect(0, 0, W, H);

  // Particle pass — additive blending for natural light buildup
  ctx.globalCompositeOperation = 'lighter';
  for(const p of edParticles){
    p.x += p.vx + Math.sin(t * 0.0008 + p.seed) * 0.12 * p.depth;
    p.y += p.vy * (1 + energy * 0.6);
    if(p.y < -20){ p.y = H + 20; p.x = Math.random() * W; }
    if(p.x < -20) p.x = W + 20;
    if(p.x > W + 20) p.x = -20;

    const r = p.size * (window.devicePixelRatio || 1);
    const a = p.alpha * (0.7 + Math.sin(t * 0.001 + p.seed) * 0.3);

    // Glow via shadowBlur (very performant, no extra canvas needed)
    const colorH = p.hue, colorS = p.sat;
    ctx.shadowBlur = r * 8;
    ctx.shadowColor = `hsla(${colorH}, ${colorS}%, 70%, ${a})`;
    ctx.fillStyle = `hsla(${colorH}, ${colorS}%, 80%, ${a})`;
    ctx.beginPath();
    ctx.arc(p.x, p.y, Math.max(0.5, r * 0.35), 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.shadowBlur = 0;
  ctx.globalCompositeOperation = 'source-over';
}

function drawEdRing(ctx, W, H, freq, phase){
  ctx.clearRect(0, 0, W, H);
  const cx = W/2, cy = H/2;
  const baseR = Math.min(W, H) * 0.32;

  let bass = 0, energy = 0;
  if(freq){
    for(let i = 0; i < 8; i++) bass += freq[i] || 0;
    bass /= 8 * 255;
    let s = 0; for(let i = 0; i < freq.length; i++) s += freq[i] || 0;
    energy = s / (freq.length * 255);
  }

  // 1) Outer audio-reactive jagged waveform ring
  ctx.lineWidth = 2 * (window.devicePixelRatio || 1);
  ctx.strokeStyle = 'rgba(74,222,255,0.55)';
  ctx.shadowBlur = 24;
  ctx.shadowColor = 'rgba(74,222,255,0.6)';
  ctx.beginPath();
  const N = 180;
  for(let i = 0; i <= N; i++){
    const a = (i / N) * Math.PI * 2 + phase;
    const binIdx = freq ? Math.floor((i / N) * (freq.length - 1)) : 0;
    const v = freq ? (freq[binIdx] || 0) / 255 : 0;
    const r = baseR + v * baseR * 0.5 + bass * baseR * 0.18;
    const x = cx + Math.cos(a) * r;
    const y = cy + Math.sin(a) * r;
    if(i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.closePath();
  ctx.stroke();

  // 2) Inner softer ring
  ctx.shadowBlur = 0;
  ctx.lineWidth = 1 * (window.devicePixelRatio || 1);
  ctx.strokeStyle = `rgba(255,255,255,${0.10 + energy * 0.15})`;
  ctx.beginPath();
  ctx.arc(cx, cy, baseR * 0.78, 0, Math.PI * 2);
  ctx.stroke();

  // 3) Soft inner glow disk
  const grd = ctx.createRadialGradient(cx, cy, 0, cx, cy, baseR * 1.1);
  grd.addColorStop(0, `rgba(74,222,255,${0.12 + bass * 0.20})`);
  grd.addColorStop(0.5, `rgba(74,222,255,${0.04 + bass * 0.08})`);
  grd.addColorStop(1, 'rgba(74,222,255,0)');
  ctx.fillStyle = grd;
  ctx.fillRect(0, 0, W, H);

  // 4) Faint orbiting glints — 5 dots, rotated by phase
  ctx.fillStyle = 'rgba(255,255,255,0.7)';
  for(let i = 0; i < 5; i++){
    const a = phase * 1.4 + (i / 5) * Math.PI * 2;
    const r = baseR * (1.05 + (i % 2) * 0.05);
    const x = cx + Math.cos(a) * r;
    const y = cy + Math.sin(a) * r;
    ctx.beginPath();
    ctx.arc(x, y, 2 + bass * 3, 0, Math.PI * 2);
    ctx.fill();
  }
}

function viewTrack(slug){
  const i = findTrackBySlug(slug);
  if(i<0) return `<div class="center">No track called "${slug}".<br><br><a class="back-link" href="/">← back</a></div>`;
  const t = state.tracks[i];
  const shareUrl = `${location.origin}/t/${slug}`;
  const sc = scUrl(t.title);

  const related = [];
  for(let k=1;k<=6 && related.length<6;k++){
    const idx = (i+k)%state.tracks.length;
    related.push({t:state.tracks[idx], i:idx});
  }

  const slotNum = String(i+1).padStart(3,'0');
  const tier = t.isFeatured ? 'featured' : (t.isNew ? 'new' : 'archive');
  return `
    <div class="detail-wrap">
      <a class="back-link" href="/tracks">← back to session</a>
      <div class="detail-hero">
        <div class="detail-art" data-slug="${slug}" style="${artStyle(t.title)}">
          <img class="art-img" alt="" />
        </div>
        <div class="detail-meta-col">
          <div class="detail-kicker">CLIP INSPECTOR · TRK.${slotNum}</div>
          <h1 class="detail-title">${t.title}</h1>
          <div class="detail-meta">
            ${pillsFor(t)}
            <span>${fmtDate(t.date)}</span>
          </div>
          <div class="detail-actions">
            <button class="btn primary" data-play="${i}">▶ launch</button>
            <a class="btn sc" href="${sc}" target="_blank" rel="noopener">↗ soundcloud</a>
            <button class="btn" data-add="${i}">＋ folder</button>
            <button class="btn" data-copy="${shareUrl}">↗ copy link</button>
          </div>
        </div>
      </div>

      <div class="detail-grid">
        <div class="detail-body">
          <h3>// notes</h3>
          ${t.description ? `<p>${t.description}</p>` : '<p class="empty">no notes on file. (edit <code>config.json</code> → <code>tracks[].description</code>.)</p>'}
          ${t.credits ? `<h3>// credits</h3><p>${t.credits}</p>` : ''}
          ${(t.tags&&t.tags.length) ? `<h3>// tags</h3><div class="tag-row">${t.tags.map(x=>`<span class="tag">${x}</span>`).join('')}</div>` : ''}
          <h3>// share</h3>
          <p>permalink:<br><code>${shareUrl}</code></p>
        </div>
        <aside class="detail-side">
          <div class="panel">
            <h4>// clip info</h4>
            <div class="stat"><span>slot</span><span class="v">${slotNum} / ${String(state.tracks.length).padStart(3,'0')}</span></div>
            <div class="stat"><span>tier</span><span class="v">${tier}</span></div>
            <div class="stat"><span>released</span><span class="v">${fmtDate(t.date) || '—'}</span></div>
            <div class="stat"><span>file</span><span class="v" style="font-size:10px;color:var(--d-text-low);overflow:hidden;text-overflow:ellipsis;max-width:180px;white-space:nowrap">${t.file||'—'}</span></div>
          </div>
          <div class="panel">
            <h4>// external</h4>
            <a class="btn sc" href="${sc}" target="_blank" rel="noopener" style="width:100%;justify-content:center;margin-top:4px">soundcloud →</a>
          </div>
        </aside>
      </div>

      <section class="related">
        <h3>// more clips</h3>
        <div class="row">
          ${related.map(({t,i})=>cardHtml(t,i,{size:''})).join('')}
        </div>
      </section>
    </div>`;
}

function viewPlaylists(){
  const keys = Object.keys(state.playlists);
  if(!keys.length){
    return `
      <div class="page-head"><div><div class="kicker">— mission folders —</div><h1>playlists</h1></div></div>
      <div class="center">no playlists on file yet.<br><br>tap <b>＋</b> on any track in the catalog to start a draft.</div>`;
  }
  const cards = keys.map(k=>{
    const p = state.playlists[k];
    const firstSlug = p.trackSlugs[0]||'';
    const firstIdx = findTrackBySlug(firstSlug);
    const firstTitle = firstIdx>=0 ? state.tracks[firstIdx].title : p.name;
    return `
      <div class="card" data-slug="__pl__${k}" onclick="go('/p/${k}')">
        <div class="art-wrap">
          <div class="art" style="${artStyle(firstTitle)}"></div>
          <img class="art-img" alt="" data-cover-for="${firstSlug}" />
        </div>
        <div class="scrim"></div>
        <div class="top"><span class="pill">PLAYLIST</span></div>
        <div class="bottom">
          <h3>${p.name}</h3>
          <div class="sub"><span>${p.trackSlugs.length} tracks</span></div>
        </div>
      </div>`;
  }).join('');
  return `
    <div class="page-head">
      <div>
        <div class="kicker">— mission folders —</div>
        <h1>playlists</h1>
      </div>
      <div class="count">${keys.length} on file</div>
    </div>
    <div class="grid">${cards}</div>`;
}

function viewPlaylist(slug){
  const q = new URLSearchParams(location.search||'');
  let p = state.playlists[slug];
  let isShared = false;
  if(!p && q.get('t')){
    const slugs = (q.get('t')||'').split(',').filter(Boolean);
    const name = q.get('n') || slug;
    p = {name, trackSlugs:slugs};
    isShared = true;
  }
  if(!p) return `<div class="center">playlist "${slug}" not on file.<br><br><a class="back-link" href="/tracks/playlists">← back to folders</a></div>`;
  const indices = p.trackSlugs.map(findTrackBySlug).filter(i=>i>=0);
  const shareUrl = buildShareUrl(p.name, indices);
  const body = (state.view==='grid')
    ? `<div class="grid">${indices.map(i=>cardHtml(state.tracks[i],i)).join('')}</div>`
    : `<div class="list"><div class="list-head"><div></div><div>Track</div><div>Date</div><div class="align-r">Actions</div></div>${indices.map(i=>listRow(state.tracks[i],i)).join('')}</div>`;
  return `
    <a class="back-link" href="/tracks/playlists">← back to folders</a>
    <div class="page-head" style="margin-top:18px">
      <div>
        <div class="kicker">— mission folder ${isShared?'· shared transmission':''} —</div>
        <h1>${p.name}</h1>
        <div class="mono" style="margin-top:14px;letter-spacing:.10em">${indices.length} signals · curated by kani</div>
      </div>
      ${viewToggleHtml()}
    </div>
    <div class="share-box">
      <span>SHARE</span>
      <code>${shareUrl}</code>
      <button class="btn" data-copy="${shareUrl}" style="padding:8px 14px">copy</button>
      ${isShared ? `<button class="btn primary" id="js-save-shared" data-slug="${slug}" data-name="${p.name}" style="padding:8px 14px">save</button>`:''}
    </div>
    ${body}`;
}

function viewComingSoon(kind, slug){
  return `
    <a class="back-link" href="/">← back to galaxy</a>
    <div class="page-head" style="margin-top:20px">
      <div>
        <div class="kicker">— release pending · ${kind.toLowerCase()} —</div>
        <h1>${slug}</h1>
        <div class="mono" style="margin-top:14px;max-width:520px;line-height:1.7;text-transform:none;letter-spacing:.04em">
          ${kind.toLowerCase()} pages are coming soon. once ${kind.toLowerCase()} data is added to <code>config.json</code>, this transmission will render its track manifest.
        </div>
      </div>
    </div>`;
}

function buildShareUrl(name, indices){
  const slugs = indices.map(i=>slugify(state.tracks[i].title)).join(',');
  const nameSlug = slugify(name);
  return `${location.origin}/p/${nameSlug}?t=${slugs}&n=${encodeURIComponent(name)}`;
}

// ====================================================================
// Playlist draft
// ====================================================================
function addToDraft(i){
  if(!state.playlistDraft.includes(i)) state.playlistDraft.push(i);
  toast(`Added "${state.tracks[i].title}"`);
  render();
}
function clearDraft(){state.playlistDraft=[];render();}
function saveDraft(){
  const name = prompt('Playlist name?','Untitled');
  if(!name) return;
  const slug = slugify(name);
  state.playlists[slug] = {name, trackSlugs: state.playlistDraft.map(i=>slugify(state.tracks[i].title))};
  localStorage.setItem('kani.playlists',JSON.stringify(state.playlists));
  state.playlistDraft=[];
  toast('Playlist saved');
  go('/p/'+slug);
}
function copyText(s){
  (navigator.clipboard?.writeText(s)||Promise.reject()).then(()=>toast('Copied')).catch(()=>{
    const ta=document.createElement('textarea');ta.value=s;document.body.appendChild(ta);ta.select();
    try{document.execCommand('copy');toast('Copied');}catch(e){}ta.remove();
  });
}

// ====================================================================
// Hover parallax — shift art within card on mouse move
// ====================================================================
function attachParallax(el){
  const wrap = el.querySelector('.art-wrap');
  if(!wrap) return;
  el.addEventListener('mousemove', e=>{
    const r = el.getBoundingClientRect();
    const x = (e.clientX - r.left) / r.width - .5;
    const y = (e.clientY - r.top) / r.height - .5;
    wrap.style.transform = `scale(1.04) translate(${x*-8}px, ${y*-8}px)`;
  });
  el.addEventListener('mouseleave', ()=>{ wrap.style.transform=''; });
}

// ====================================================================
// Dispatch / wire
// ====================================================================
function render(){
  const r = currentRoute();
  document.querySelectorAll('.nav-link').forEach(a=>a.classList.toggle('active', a.dataset.route===r.name));
  const app = document.getElementById('app');

  // b103 — `/` is now the WebGL world. `/world` kept as alias for backward compat.
  // b146 — `/tracks` and `/tracks/new` are now the WebGL Tracks Vault.
  const wasWorld = app.classList.contains('mw');
  const wasVault = app.classList.contains('tv');
  const isWorld = (r.name === 'home' || r.name === 'world');
  const isVault = (r.name === 'all' || r.name === 'new');
  if (isWorld) {
    if (wasVault && window.TracksDaw?.destroy) window.TracksDaw.destroy();
    if (wasVault) document.body.classList.remove('tv-on');
    if (!wasWorld) {
      if (window.MarathonWorld?.destroy) window.MarathonWorld.destroy();
      app.className = 'mw';
      app.innerHTML = '';
      document.body.classList.add('mw-on');
    }
    bootMarathonWorld();
    return;
  } else if (wasWorld) {
    if (window.MarathonWorld?.destroy) window.MarathonWorld.destroy();
    document.body.classList.remove('mw-on');
    app.className = '';
  }
  if (isVault) {
    state.filter = (r.name === 'new') ? 'new' : 'all';
    if (!wasVault) {
      app.className = 'tv';
      app.innerHTML = '';
      document.body.classList.add('tv-on');
    }
    bootTracksDaw(state.filter);
    return;
  } else if (wasVault) {
    if (window.TracksDaw?.destroy) window.TracksDaw.destroy();
    document.body.classList.remove('tv-on');
    app.className = '';
  }

  let html='';
  if(r.name==='playlists') html = viewPlaylists();
  else if(r.name==='playlist')  html = viewPlaylist(r.slug);
  else if(r.name==='track')     html = viewTrack(r.slug);
  else if(r.name==='album')     html = viewComingSoon('Album', r.slug);
  else if(r.name==='ep')        html = viewComingSoon('EP', r.slug);
  else                          html = viewPlaylists();   // fallback
  // restart main animation
  app.style.animation='none'; app.offsetHeight; app.style.animation='';
  app.className = '';
  app.innerHTML = html;
  wire();
  hydrateAllCovers();
}

// b101 — wait for the marathon-world ESM module to register itself, then init.
function bootMarathonWorld(){
  const app = document.getElementById('app');
  const tryInit = () => {
    if (!window.MarathonWorld) { setTimeout(tryInit, 40); return; }
    const p = location.pathname.replace(/\/+$/, '') || '/';
    if (p !== '/' && p !== '/world') return;
    // b199 — render() can fire multiple times while staying on /; without
    // this guard each call would re-run init() and append a fresh HUD on
    // top of the previous one, leaving N stacked HUDs whose buttons each
    // hold their own click listener. One user click on "next" then fired
    // N onNext handlers, cascading through N tracks and aborting the play.
    if (window.MarathonWorld.scene) return;
    window.MarathonWorld.init(app, {
      tracks: state.tracks,
      audio,
      slugify,
      findCover,
      onPlay: playIndex,
      onTogglePlay: togglePlay,
      onNext: playNext,
      onPrev: playPrev,
      onSeek: (pct) => { if (audio.duration) audio.currentTime = pct * audio.duration; },
      getCurrent: () => state.current,
      buildNumber: window.BUILD_GALAXY || '',
      socials: (state.config && state.config.socials) || {},
    });
  };
  tryInit();
}

// b202 — Tracks DAW boot. Replaces the b146 WebGL Tracks Vault with an
// Ableton-faithful Session view. Same wakeup pattern as bootMarathonWorld.
function bootTracksDaw(filter){
  const app = document.getElementById('app');
  const tryInit = () => {
    if (!window.TracksDaw) { setTimeout(tryInit, 40); return; }
    const p = location.pathname.replace(/\/+$/, '') || '/';
    if (!/^\/tracks(?:\/new)?$/.test(p)) return;
    if (window.TracksDaw.root) {
      window.TracksDaw.setFilter(filter);
      return;
    }
    window.TracksDaw.init(app, {
      tracks: state.tracks,
      audio,
      onPlay: playIndex,
      onTogglePlay: togglePlay,
      onNext: playNext,
      onPrev: playPrev,
      onSeek: (pct) => { if (audio.duration) audio.currentTime = pct * audio.duration; },
      onCopy: (txt) => { copyText(txt); },
      onToast: (msg) => { try { toast(msg); } catch(e) {} },
      scUrl,
      getCurrent: () => state.current,
      buildNumber: window.BUILD_TRACKS || '',
      socials: (state.config && state.config.socials) || {},
      filter,
      query: state.query || '',
    });
  };
  tryInit();
}

function hydrateAllCovers(){
  document.querySelectorAll('[data-slug]').forEach(el=>{
    const slug = el.dataset.slug;
    if(!slug || slug.startsWith('__pl__')) return;
    hydrateCover(el, slug);
  });
  // playlist cards referring to a first-track slug
  document.querySelectorAll('img[data-cover-for]').forEach(img=>{
    const slug = img.dataset.coverFor;
    if(!slug) return;
    findCover(slug).then(url=>{
      if(!url) return;
      img.src = url;
      img.addEventListener('load',()=>img.classList.add('loaded'),{once:true});
    });
  });
}

function wire(){
  document.querySelectorAll('[data-slug]').forEach(el=>{
    el.addEventListener('click', e=>{
      if(e.target.closest('button,a')) return;
      const slug = el.dataset.slug;
      if(slug && !slug.startsWith('__pl__')) go('/t/'+slug);
    });
    if(el.classList.contains('card')) attachParallax(el);
  });
  document.querySelectorAll('[data-play]').forEach(b=>b.addEventListener('click', e=>{
    e.stopPropagation(); playIndex(Number(b.dataset.play));
  }));
  document.querySelectorAll('[data-add]').forEach(b=>b.addEventListener('click', e=>{
    e.stopPropagation(); addToDraft(Number(b.dataset.add));
  }));
  document.querySelectorAll('[data-copy]').forEach(b=>b.addEventListener('click', e=>{
    e.stopPropagation(); copyText(b.dataset.copy);
  }));
  document.querySelectorAll('[data-share]').forEach(b=>b.addEventListener('click', e=>{
    e.stopPropagation();
    copyText(`${location.origin}/t/${b.dataset.share}`);
  }));
  document.querySelectorAll('[data-setview]').forEach(b=>b.addEventListener('click', ()=>{
    state.view = b.dataset.setview;
    localStorage.setItem('kani.view',state.view);
    render();
  }));
  const c=document.getElementById('js-clear-draft'); if(c) c.onclick=clearDraft;
  const s=document.getElementById('js-save-draft'); if(s) s.onclick=saveDraft;
  // editorial wire — filter pills, track row hover/click, art preview
  document.querySelectorAll('[data-filter]').forEach(b=>b.addEventListener('click', e=>{
    state.filter = b.dataset.filter;
    if(state.filter === 'new') go('/tracks/new');
    else if(state.filter === 'all') go('/tracks');
    else { render(); }   // tag filters stay on current URL
  }));
  // hover preview — single shared element follows cursor
  const previewEl = document.getElementById('ed-art-preview');
  const previewImg = previewEl ? previewEl.querySelector('img') : null;
  let previewSlug = null;
  document.querySelectorAll('.ed-track').forEach(row=>{
    row.addEventListener('mouseenter', ()=>{
      if(!previewEl) return;
      const slug = row.dataset.slug;
      previewSlug = slug;
      previewEl.classList.add('show');
      // Background gradient as fallback while the image loads
      previewEl.style.background = procArt(state.tracks[Number(row.dataset.i)].title);
      previewImg.src = '';
      previewImg.classList.remove('loaded');
      findCover(slug).then(url=>{
        if(previewSlug !== slug || !url) return;
        previewImg.src = url;
        previewImg.onload = ()=>previewImg.classList.add('loaded');
      });
    });
    row.addEventListener('mouseleave', ()=>{
      if(previewEl) previewEl.classList.remove('show');
      previewSlug = null;
    });
  });
  document.addEventListener('mousemove', e=>{
    if(!previewEl || !previewEl.classList.contains('show')) return;
    const x = Math.min(window.innerWidth - 248, e.clientX + 28);
    const y = Math.max(20, e.clientY - 110);
    previewEl.style.left = x + 'px';
    previewEl.style.top  = y + 'px';
  });
  const ss=document.getElementById('js-save-shared');
  if(ss) ss.onclick=()=>{
    const slug=ss.dataset.slug, name=ss.dataset.name;
    const q=new URLSearchParams(location.search||'');
    state.playlists[slug]={name,trackSlugs:(q.get('t')||'').split(',').filter(Boolean)};
    localStorage.setItem('kani.playlists',JSON.stringify(state.playlists));
    toast('Saved to your playlists');
  };
}

// ====================================================================
// Boot
// ====================================================================
document.getElementById('mp-play').onclick = togglePlay;
document.getElementById('mp-next').onclick = playNext;
document.getElementById('mp-prev').onclick = playPrev;

document.getElementById('search').addEventListener('input', e=>{
  state.query = e.target.value.toLowerCase().trim();
  // Search filters the editorial track list in place — no need to navigate
  render();
});

window.addEventListener('popstate', render);

fetch('/config.json')
  .then(r=>r.json())
  .then(cfg=>{
    state.tracks = cfg.tracks || [];
    state.audioBase = cfg.audioBase || '/audio-mp3/';
    // b193: on localhost the R2 CDN tends to stall silently (CORS preflight
    // doesn't whitelist localhost:8000, so the audio element loads metadata
    // but never streams data — no `error` event fires, fallback never triggers).
    // Skip R2 entirely when developing locally and serve from /audio-mp3/.
    if (location.hostname === 'localhost' || location.hostname === '127.0.0.1') {
      state.audioBase = '/audio-mp3/';
      console.log('[audio] localhost detected — forcing audioBase to /audio-mp3/');
    }
    state.socials = cfg.socials || {};
    state.config = cfg;
    // Accept either numeric indices OR slug/title strings in featured / newReleases
    const resolveRef = (ref)=>{
      if(typeof ref === 'number') return state.tracks[ref] || null;
      if(typeof ref === 'string'){
        const s = slugify(ref);
        const idx = state.tracks.findIndex(t => slugify(t.title) === s);
        return idx >= 0 ? state.tracks[idx] : null;
      }
      return null;
    };
    (cfg.featured||[]).forEach(ref=>{const t=resolveRef(ref); if(t) t.isFeatured=true;});
    (cfg.newReleases||[]).forEach(ref=>{const t=resolveRef(ref); if(t) t.isNew=true;});
    // Also respect per-track flags already in config.json
    state.tracks.forEach(t=>{ if(t.isNew===true) t.isNew = true; });
    render();
  })
  .catch(err=>{
    document.getElementById('app').innerHTML =
      `<div class="center">Couldn't load <code>config.json</code> — open via <code>http://localhost:8000/</code>, not <code>file://</code>.</div>`;
    console.error(err);
  });
</script>
<!-- Per-scene build constants. galaxy.js sets window.BUILD_GALAXY (used by
     bootMarathonWorld), tracks.js sets window.BUILD_TRACKS (used by
     bootTracksDaw). Split so parallel chats can't race the build number. -->
<script src="/js/builds/galaxy.js"></script>
<script src="/js/builds/tracks.js"></script>
<script type="module" src="/js/marathon-world.js"></script>
<!-- b221 cache-bust: Vivaldi/Chrome cache plain <script src> aggressively;
     dynamic loader with timestamp guarantees fresh fetch every page load.
     Async load is fine — bootTracksDaw's tryInit polls window.TracksDaw. -->
<script>
  (function(){
    var s = document.createElement('script');
    s.src = '/js/tracks-daw.js?v=' + Date.now();
    document.head.appendChild(s);
  })();
</script>
